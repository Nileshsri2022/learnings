"<code>use</code> iska exception hai: baaki hooks se alag, <code>use</code> ko conditionally aur loops me call kiya ja sakta hai — lekin use <code>try/catch</code> me wrap nahi kar sakte, aur use component ya hook ke andar hi call karna hoga.",
"Standard fix ka pattern hamesha ek hi hai: condition ko hook ke <b>andar</b> le jao, hook ko condition ke andar kabhi nahi. Conditional data fetching ke liye <code>useEffect</code> ko conditionally call mat karo — bina shart call karo aur shart andar check karo. Conditional initial state ke liye bhi <code>useState</code> ko branches me mat bulao; ek baar call karo aur initial value conditional rakho: <code>useState(userType === 'admin' ? adminPerms : userPerms)</code>.",
"Shared setting <code>settings.react-hooks.additionalEffectHooks</code> (6.1.1+) custom hooks ko effects ki tarah maanta hai, jisse <code>useEffectEvent</code> jaise event functions unse call ho sakte hain — ye setting <code>exhaustive-deps</code> ke saath share hoti hai taaki behaviour consistent rahe."],
c:"// ❌ Hook condition me\nif (isLoggedIn) { const [user, setUser] = useState(null); }\n\n// ❌ Hook early return ke baad\nif (!data) return <Loading />;\nconst [processed, setProcessed] = useState(data);\n\n// ❌ Hook module level par\nconst globalState = useState(0); // Component ke bahar\n\n// ✅ Hooks top level par; condition hook ke ANDAR\nuseEffect(() => {\n  if (isLoggedIn) { fetchUserData(); }\n}, [isLoggedIn]);\n\n// ✅ `use` conditional / loop me chal sakta hai\nif (shouldFetch) { const data = use(fetchPromise); }",
k:"React hooks ko order se pehchanta hai — ek hook skip hua to uske baad ke saare hooks ki state slots shift ho jate hain. Shart hamesha hook ke andar, hook kabhi shart ke andar nahi."},
{n:130,g:18,t:"component-hook-factories",u:"https://react.dev/reference/eslint-plugin-react-hooks/lints/component-hook-factories",
p:["Ye lint un higher-order functions ke khilaf jaanchta hai jo nested components ya hooks define karte hain. Components aur hooks <b>module level</b> par define hone chahiye.",
"Kisi doosre function ke andar component ya hook define karne se har call par ek <b>naya component type</b> banta hai. React har naye type ko bilkul alag component maanta hai — poora subtree destroy karke dobara banata hai, saari state kho jati hai aur performance kharab hoti hai.",
"'Mujhe dynamic component behaviour chahiye' wali soch hi jaal hai: <code>makeButton('red')</code> se <code>RedButton</code> aur <code>makeButton('blue')</code> se <code>BlueButton</code> banane ke bajaye configuration ko props ke roop me do, ya JSX ko children ke roop me pass karo — ek hi <code>Button</code> component, alag-alag <code>color</code> prop.",
"Ye wahi mashhoor bug hai: 'mera child component har keystroke par state kyun kho deta hai?' — kyunki wo parent ke andar define hai, har render par naya type banta hai, aur React use unmount/remount kar deta hai. Ilaaj hamesha ek hi aakar ka hai: definition ko module level par uthao aur badalti hui cheezein props/arguments se do.",
"Ek baat aur: factory agar module level par sirf <b>ek baar</b> bhi call ho, tab bhi rule flag karta hai — rule pattern ke baare me hai, sirf per-render recreation ke baare me nahi. (Isse juda <code>static-components</code> lint per-render recreation wale case ko seedha pakadta hai.)"],
c:"// ❌ Components banane wali factory\nfunction createComponent(defaultValue) {\n  return function Component() { /* ... */ };\n}\n\n// ❌ Component ke andar component\nfunction Parent() {\n  function Child() { /* ... */ }\n  return <Child />;\n}\n\n// ❌ Hook factory\nfunction createCustomHook(endpoint) {\n  return function useData() { /* ... */ };\n}\n\n// ✅ Module level par, props/args se configure karo\nfunction Component({ defaultValue }) { /* ... */ }\nfunction useData(endpoint) { /* ... */ }",
k:"Component ki pehchaan uski definition ki jagah se hai. Andar define kiya to har baar naya type, har baar state gayab — definition bahar, farq props me."},
{n:131,g:18,t:"config",u:"https://react.dev/reference/eslint-plugin-react-hooks/lints/config",
p:["Ye lint tumhari <b>React Compiler configuration ko hi</b> validate karta hai — option ke sahi naam aur value types — taaki typos aur galat values chup chaap kuch na karne ke bajaye zor se fail hon.",
"Ye <code>babel-plugin-react-compiler</code> ko diye gaye options object ko known option set ke khilaf check karta hai. Is page ke hisaab se valid values: <code>compilationMode</code> ke liye <code>'all'</code> ya <code>'infer'</code> (aur <code>'annotation'</code>, jo Configuration/Directives pages par documented hai); <code>panicThreshold</code> ke liye <code>'none'</code>, <code>'critical_errors'</code> ya <code>'all_errors'</code>.",
"Aam galtiyan jo ye pakadta hai: naam ki typo (<code>compileMode</code> ya <code>compilationMod</code> — sahi hai <code>compilationMode</code>), galat value (<code>compilationMode: 'everything'</code>), galat value type (<code>panicThreshold: true</code>), aur banaya hua unknown option (<code>optimizationLevel: 'max'</code>). Sirf documented options hi valid hain.",
"'Configuration kaam nahi kar rahi' ka matlab lagbhag hamesha yahi hota hai: option ke naam me typo ya value ka type galat — compiler unknown options ko chup chaap ignore kar deta hai, aur ye lint bilkul isi chuppi ko todne ke liye bana hai.",
"Interview me ye lint is sawal ka jawab hai: 'Maine <code>compilationMode</code> set kiya lekin kuch badla nahi' — sabse pehle spelling check karo. Saath me <code>panicThreshold</code> ki teeno valid values aur unka build behaviour par asar bhi yaad rakho."],
c:"// ❌ Unknown option naam (typo)\n['babel-plugin-react-compiler', {\n  compileMode: 'all' // Galti: compilationMode hona chahiye\n}]\n\n// ❌ Galat value\n['babel-plugin-react-compiler', {\n  compilationMode: 'everything' // Galat: 'all' ya 'infer' use karo\n}]\n\n// ❌ Aam galtiyon ka sangrah\n['babel-plugin-react-compiler', {\n  compilationMod: 'all',\n  panicThreshold: true,        // Galat value type\n  optimizationLevel: 'max'     // Unknown option\n}]\n\n// ✅ Valid compiler configuration\n['babel-plugin-react-compiler', {\n  compilationMode: 'infer',\n  panicThreshold: 'critical_errors'\n}]",
k:"Compiler galat config ko ignore karta hai, shikayat nahi. Isiliye config lint zaroori hai — typo ko build-time par hi pakdo, production me nahi."},
{n:132,g:18,t:"error-boundaries",u:"https://react.dev/reference/eslint-plugin-react-hooks/lints/error-boundaries",
p:["Ye lint child components ki errors ke liye <code>try/catch</code> ke bajaye <b>Error Boundaries</b> ke istemal ko validate karta hai.",
"<code>try/catch</code> React ki rendering process ke dauraan throw hone wali errors ko pakad hi nahi sakta. Render methods ya hooks me throw hui errors component tree me upar bubble hoti hain; unhe sirf Error Boundaries pakad sakte hain. To JSX ko <code>try/catch</code> me lapetna suraksha ka jhootha ehsaas deta hai.",
"<code>use</code> wala case khaas hai: <code>use</code> paramparik tareeke se throw nahi karta — wo <b>suspend</b> karta hai. Jab <code>use</code> kisi pending promise se takrata hai, component suspend ho jata hai aur React fallback dikhata hai; is sthiti ko sirf Suspense aur Error Boundaries sambhalte hain. <code>use</code> ke aas-paas <code>catch</code> kabhi chalega hi nahi, isiliye linter uske khilaf chetaavni deta hai.",
"Sahi aakar: Error Boundary errors pakadta hai, Suspense pending state sambhalta hai — dono ki parat (Error Boundary ke andar Suspense) React 19 ke data-loading error handling ki canonical shape hai.",
"Render errors <code>try/catch</code> se kyun nahi pakde jate? Kyunki wo React ki reconciliation ke dauraan hote hain — boundary mechanism (<code>getDerivedStateFromError</code> / <code>componentDidCatch</code>) hi iske liye design kiya gaya hook hai."],
c:"// ❌ Try/catch render errors nahi pakdega\nfunction Parent() {\n  try {\n    return <ChildComponent />; // Ye throw kare to catch kaam nahi karega\n  } catch (error) {\n    return <div>Error occurred</div>;\n  }\n}\n\n// ✅ Error Boundary + Suspense ki parat\nfunction App() {\n  return (\n    <ErrorBoundary fallback={<div>Failed to load</div>}>\n      <Suspense fallback={<div>Loading...</div>}>\n        <DataComponent promise={fetchData()} />\n      </Suspense>\n    </ErrorBoundary>\n  );\n}",
k:"JSX ke aas-paas try/catch suraksha nahi, bhram hai. Render ki errors ke liye Error Boundary, aur use ke pending state ke liye uske saath Suspense."},
{n:133,g:18,t:"gating",u:"https://react.dev/reference/eslint-plugin-react-hooks/lints/gating",
p:["Ye lint <b>gating mode</b> ki configuration validate karta hai — compiler ki wo suvidha jisse tum React Compiler ko dheere-dheere apna sakte ho: khaas components ko runtime feature flag ke peeche optimization ke liye chuna jata hai.",
"<code>gating</code> ek object hona chahiye jisme do zaroori fields hon: <code>source</code> (flag function export karne wale module ka naam) aur <code>importSpecifierName</code> (export hue function ka naam). Dono hi lazmi hain.",
"Aam galtiyan: flag function ka naam bare string ke roop me dena (<code>gating: '__experimental_useCompiler'</code>) — value hamesha object honi chahiye; <code>source</code> bhool jana — compiler ko pata hi nahi chalega ki flag kis module se import kare; aur gating ko <code>compilationMode: 'annotation'</code> se confuse karna.",
"Farq yaad rakho: gating ek <b>runtime</b> flag hai (compiled code runtime par use check karta hai), jabki annotation ek <b>build-time</b> selection hai. 'Compiler ko pehle 5% users par kaise rollout karoon?' — is sawal ka jawab gating hai: A/B tests aur gradual rollouts ke liye.",
"Gating field bilkul na do to compiler sab kuch compile karta hai — ye bhi ek valid configuration hai, bas koi runtime flag nahi lagta."],
c:"// ❌ Zaroori field gayab\n['babel-plugin-react-compiler', {\n  gating: {\n    importSpecifierName: '__experimental_useCompiler'\n    // 'source' field missing\n  }\n}]\n\n// ❌ Galat gating type — object hona chahiye, string nahi\n['babel-plugin-react-compiler', {\n  gating: '__experimental_useCompiler'\n}]\n\n// ✅ Poori gating configuration\n['babel-plugin-react-compiler', {\n  gating: {\n    importSpecifierName: 'isCompilerEnabled', // Export hue function ka naam\n    source: 'featureFlags' // Module ka naam\n  }\n}]\n\n// featureFlags.js\nexport function isCompilerEnabled() { /* ... */ }",
k:"Gating matlab runtime wala switch, annotation matlab build-time wala chunaav. Dono fields (source + importSpecifierName) lazmi hain aur value hamesha object."},
{n:134,g:18,t:"globals",u:"https://react.dev/reference/eslint-plugin-react-hooks/lints/globals",
p:["Ye lint render ke dauraan <b>globals ko assign/mutate</b> karne ke khilaf validate karta hai — ye sunishchit karne ka hissa hai ki side effects render ke bahar chalein.",
"Global variables React ke control ke bahar rehte hain. Render ke dauraan unhe badalna React ki is dhaarana ko todta hai ki rendering pure hai — isse components dev aur production me alag behave karte hain, Fast Refresh kharab hota hai, aur app ko React Compiler se optimize karna namumkin ho jata hai.",
"Pakde jaane wale pattern: render me global counter badhana (<code>renderCount++</code>), <code>window</code> ki properties badalna (<code>window.currentUser = userId</code>), render ke dauraan global array me <code>push</code> karna, aur sabse chaalaak wala — haath se bana render-time cache (<code>if (!cache[id]) cache[id] = fetchData(id)</code>) jo memoization jaisa dikhta hai lekin render me global mutate karta hai.",
"'Ye to bas debugging ke liye counter hai' — module-level <code>renderCount++</code> render me ho to bhi global mutation hai aur flag hoga. Counter ke liye state use karo, global values ke liye context, aur bahari cheezon ko synchronize karne ke liye effect.",
"Ek asamanata (asymmetry) dhyaan do: <code>document.title = title</code> <code>useEffect</code> ke <b>andar</b> bilkul theek hai, lekin render ke dauraan mana hai. Fix ka pattern hamesha teen me se ek hota hai: state, context, ya effect. Ye rule asal me 'render pure hona chahiye' siddhant ko lagu karne yogya (enforceable) banata hai — StrictMode ke double-render aur compiler ki purity zaroorat se seedha juda hua."],
c:"// ❌ Global counter\nlet renderCount = 0;\nfunction Component() {\n  renderCount++; // Global mutation\n  return <div>Count: {renderCount}</div>;\n}\n\n// ❌ window ki property badalna\nfunction Component({ userId }) {\n  window.currentUser = userId; // Global mutation\n  return <div>User: {userId}</div>;\n}\n\n// ❌ Render ke dauraan global array me push\nconst events = [];\nfunction Component({ event }) {\n  events.push(event); // Global array mutate ho raha hai\n  return <div>Events: {events.length}</div>;\n}\n\n// ✅ Counter ke liye state\nconst [clickCount, setClickCount] = useState(0);\n\n// ✅ Bahari sync effect me — theek hai\nfunction Component({ title }) {\n  useEffect(() => {\n    document.title = title; // Effect me OK hai\n  }, [title]);\n  return <div>Page: {title}</div>;\n}",
k:"Render ke dauraan global badla to purity gayi. Jo cheez UI ko chahiye wo state me, jo sabko chahiye wo context me, jo bahar sync karni hai wo effect me."},
{n:135,g:18,t:"immutability",u:"https://react.dev/reference/eslint-plugin-react-hooks/lints/immutability",
p:["Ye lint <b>props, state aur doosre immutable values ko mutate</b> karne ke khilaf validate karta hai. Props aur state immutable snapshots hain — unhe seedha kabhi mat badlo; naye props neeche pass karo aur state ke liye <code>useState</code> ka setter use karo.",
"Kaaran samjho: state ko usi jagah mutate karne se object ka <b>reference wahi</b> rehta hai, to React ki <code>Object.is</code> tulna ko koi badlaav dikhta hi nahi aur re-render skip ho jata hai — UI chup chaap purani (stale) reh jati hai. Same-reference <code>setState</code> dikhne me no-op hai.",
"Mutate karne wale array methods se bacho: <code>push</code>, <code>pop</code>, <code>sort</code>, <code>splice</code>, <code>reverse</code> — sab original array ko badalte hain. Inke bajaye nayi array banao: <code>setItems([...items, 4])</code>, sort ke liye pehle copy phir sort — <code>setItems([...items].sort())</code>. Jo methods nayi array lautate hain (<code>map</code>, <code>filter</code>, <code>slice</code>, <code>concat</code>) wo surakshit hain.",
"Nested updates me har level par spread karo jo badal raha hai: sirf upari level spread karke (<code>{...user}</code>) andar ka <code>settings</code> object waisa ka waisa mutate ho jayega — sahi tareeka: <code>{ ...user, settings: { ...user.settings, theme: 'dark' } }</code>.",
"Jab nayi value purani par nirbhar ho, updater form sabse surakshit hai: <code>setTodos(todos =&gt; [...todos, { id: Date.now(), text }])</code>. Interview ka classic sawal — 'setState ke baad component re-render kyun nahi hua?' — iska #1 jawab yahi same-reference mutation hai, aur ye rule use likhne ke samay hi pakad leta hai."],
c:"// ❌ Array push mutation — reference wahi, re-render nahi\nconst [items, setItems] = useState([1, 2, 3]);\nitems.push(4);\nsetItems(items);\n\n// ❌ Object property assignment\nconst [user, setUser] = useState({ name: 'Alice' });\nuser.name = 'Bob';\nsetUser(user); // Reference wahi hai\n\n// ❌ Bina copy kiye sort — sort() jagah par mutate karta hai\nsetItems(items.sort());\n\n// ✅ Nayi array / object banao\nsetItems([...items, 4]);\nsetUser({ ...user, name: 'Bob' });\nsetItems([...items].sort()); // Pehle copy, phir sort\n\n// ✅ Nested updates: HAR level par spread\nsetUser({\n  ...user,\n  settings: { ...user.settings, theme: 'dark' }\n});",
k:"State badalna hai to naya reference banao. Mutation se reference wahi rehta hai, React ko badlaav dikhta hi nahi, aur UI purani reh jati hai."},
{n:136,g:18,t:"incompatible-library",u:"https://react.dev/reference/eslint-plugin-react-hooks/lints/incompatible-library",
p:["Ye lint un libraries ke khilaf validate karta hai jinke APIs <b>memoization se asangat (incompatible)</b> hain — manual <code>useMemo</code> ho ya React Compiler ki automatic memoization. Linter kisi known-listed API ko pehchanta hai to use flag karta hai, aur React Compiler un APIs ko use karne wale components ko app tootne se bachane ke liye automatic skip kar deta hai.",
"Mool incompatible pattern hai <b>interior mutability</b>: koi object/function apne andar chhupa state rakhta hai jo samay ke saath badalta rehta hai, lekin uska reference wahi rehta hai — 'ek dabba jo bahar se waisa hi dikhta hai lekin andar apni cheezein chup chaap badal deta hai.' React sirf ye check karta hai ki tumne alag dabba diya ya nahi, andar kya hai ye nahi — isiliye memoization stale ho jati hai. Jo cheez manual <code>useMemo</code> se tootegi, wahi compiler ki automatic optimization se bhi tootegi.",
"Page ke known incompatible APIs: <b>react-hook-form ka <code>watch</code></b> — interior mutability; ilaaj hai <code>useWatch({ control, name: 'field' })</code> use karna, jo sahi reactive value lautata hai. <b>TanStack Table ka <code>useReactTable</code></b> — table instance interior mutability use karta hai, invalid ke roop me flag hota hai. <b>MobX ka <code>observer</code></b> — ye bhi memoization ki dhaaranaen todta hai, lekin linter use <b>abhi detect nahi karta</b>; MobX app compiler ke saath gadbad kare to <code>\"use no memo\"</code> directive use karo.",
"Library authors ke liye page ka siddhant: kisi call ko memoize karna hamesha surakshit hona chahiye — <code>useMemo(() =&gt; someFunction(), [someFunction])</code> stale nahi hona chahiye. Aise APIs design karo jo <b>immutable state</b> lautayein aur explicit update functions dein.",
"Koi library ka compatible alternative na ho aur linter tumhare component ko automatic skip na kare, to page kehta hai ki issue file karo taaki use known list me joda ja sake. Linter sab kuch pakadta hai — ye maan lena galti hai; MobX wala gap iska saboot hai."],
c:"// ❌ Interior-mutable value ko memoize karne se UI jam (freeze) ho jati hai\nfunction Form() {\n  const { watch } = useForm();\n  const name = useMemo(() => watch('name'), [watch]);\n  return <div>Name: {name}</div>; // UI 'frozen' dikhti hai\n}\n\n// ✅ react-hook-form me watch ki jagah useWatch\nconst name = useWatch({ control, name: 'name' });\n\n// ✅ Sahi design: immutable state + explicit updater — memo karna hamesha safe\nconst { field, updateField } = useLibrary();\nconst greeting = useMemo(() => `Hello, ${field.name}!`, [field.name]);",
k:"Interior mutability memoization ka dushman hai: reference wahi, andar sab badla hua. watch ki jagah useWatch — aur har API ko is sawal se parkho: kya iska result bina reference badle badal sakta hai?"},
{n:137,g:18,t:"preserve-manual-memoization",u:"https://react.dev/reference/eslint-plugin-react-hooks/lints/preserve-manual-memoization",
p:["Ye lint validate karta hai ki maujooda manual memoization compiler dwara <b>preserve</b> ho. React Compiler kisi component/hook ko tabhi compile karta hai jab uska inference maujooda manual memoization ke <b>barabar ya usse behtar</b> ho.",
"Compiler tumhare <code>useMemo</code>, <code>useCallback</code> aur <code>React.memo</code> calls ko sambhal kar rakhta hai — wo maanta hai ki tumne kisi wajah se lagaye honge aur unhe hatayega nahi. Lekin <b>adhoori dependencies</b> compiler ko data flow samajhne aur aage ki optimizations lagane se rokti hain, isiliye wo flag hoti hain.",
"'Kya mujhe apni manual memoization hata deni chahiye?' — page kehta hai: React Compiler use karte samay tum use <b>surakshit roop se hata sakte ho</b>; compiler tumhare liye memoization kar dega. Plain code likho, compiler optimize karega.",
"Compiler additive hai, destructive nahi: wo tumhari manual memoization kabhi nahi hatata, sirf wahan optimization jodta hai jahan uska inference kam se kam utna hi achha ho. Migration ki kahani yahi hai — compiler on ho to <code>useMemo</code>/<code>useCallback</code>/<code>React.memo</code> vaikalpik (optional) ho jate hain; compiler na ho to yehi manual upaay hain.",
"Adhoori deps dono duniyaon me nuksaan karti hain: bina compiler ke stale values, compiler ke saath ruki hui analysis. To ya to deps poori rakho, ya manual memoization hata kar compiler par chhod do."],
c:"// ❌ useMemo / useCallback me dependencies adhoori\nconst filtered = useMemo(() => data.filter(filter), [data]); // 'filter' missing\nconst handleClick = useCallback(() => { onUpdate(value); }, [onUpdate]); // 'value' missing\n\n// ✅ Dependencies poori\nconst filtered = useMemo(() => data.filter(filter), [data, filter]);\n\n// ✅ Ya compiler ko sambhalne do — manual memoization nahi chahiye\nconst filtered = data.filter(filter);\n\n// ✅ React Compiler ke saath behtar: saada code, compiler optimize karega\nfunction Component({ items, sortBy }) {\n  const sorted = [...items].sort((a, b) => a[sortBy] - b[sortBy]);\n  return <List items={sorted} />;\n}",
k:"Compiler tumhari manual memoization ko izzat deta hai — hatata nahi, sirf jodta hai. Lekin adhoori deps uski samajh band kar deti hain: deps poori rakho ya memoization compiler ko saunp do."},
{n:138,g:18,t:"purity",u:"https://react.dev/reference/eslint-plugin-react-hooks/lints/purity",
p:["Ye lint validate karta hai ki components/hooks <b>pure</b> hon — ye check karke ki wo render ke dauraan jaane-maane impure functions call nahi karte.",
"Ek component ek pure function hona chahiye: wahi props → wahi JSX. <code>Math.random()</code> ya <code>Date.now()</code> jaise functions ek hi inputs par har baar alag value lautate hain, to component har render par alag output dega — ye React ki dhaaranaen todta hai aur hydration mismatches, galat memoization aur unpredictable behaviour deta hai.",
"Flag hone wale APIs: <code>Math.random()</code>, <code>Date.now()</code> / <code>new Date()</code>, <code>crypto.randomUUID()</code>, <code>performance.now()</code> — aam taur par koi bhi API jo ek hi inputs par alag value lautaaye.",
"Sahi pattern: stable random ID ke liye impure call ko lazy initializer me rakho — <code>const [id] = useState(() =&gt; crypto.randomUUID())</code> — ye ek baar chalta hai, render ki purity ke dayre se bahar. Ghadi (clock) ke liye impure call ko state + effect me le jao: state ko <code>Date.now()</code> se initialize karo (ek baar) aur interval wale effect se update karo.",
"Sabse tez nateeja hydration mismatch hai: server ek random value render karta hai, client doosri — dono ka JSX mail nahi khata. Aur <code>Math.random()</code> ko <code>key</code> banana doहरी galti hai: key har render badlegi to React element ko har baar remount karega."],
c:"// ❌ Render me Math.random() — har render alag\nfunction Component() {\n  const id = Math.random();\n  return <div key={id}>Content</div>;\n}\n\n// ❌ Values ke liye Date.now() — har render badalta hai\nfunction Component() {\n  const timestamp = Date.now();\n  return <div>Created at: {timestamp}</div>;\n}\n\n// ✅ Initial state se stable ID — sirf EK baar banta hai\nfunction Component() {\n  const [id] = useState(() => crypto.randomUUID());\n  return <div key={id}>Content</div>;\n}\n\n// ✅ Clock: impure call state + effect me gaya\nfunction Clock() {\n  const [time, setTime] = useState(() => Date.now());\n  useEffect(() => {\n    const interval = setInterval(() => setTime(Date.now()), 1000);\n    return () => clearInterval(interval);\n  }, []);\n  return <div>Current time: {time}</div>;\n}",
k:"Render pure matlab: wahi props, wahi JSX. Random ya time chahiye to use state ke lazy initializer ya effect me rakho — render ke beech me kabhi nahi."},
{n:139,g:18,t:"refs",u:"https://react.dev/reference/eslint-plugin-react-hooks/lints/refs",
p:["Ye lint refs ke sahi istemal ko validate karta hai: <b>render ke dauraan <code>ref.current</code> ko mat padho, mat likho</b>. (Yehi baat <code>useRef</code> docs ke pitfalls section me bhi hai.)",
"Refs un values ko rakhte hain jo rendering ke liye istemal nahi hoti; ref badalne se re-render trigger nahi hota. Render ke dauraan <code>ref.current</code> padhna/likhna React ki ummeedon ko todta hai — refs abhi initialized na bhi hue hon, aur values stale ya inconsistent ho sakti hain.",
"Lint refs ko pehchanta kaise hai? Koi value tab ref mani jati hai jab: (1) wo <code>useRef()</code> ya <code>React.createRef()</code> se aayi ho; (2) identifier ka naam <code>ref</code> ho ya <code>Ref</code> par khatm hota ho aur wo <code>.current</code> padhta/likhta ho; (3) wo JSX ke <code>ref</code> prop se guzri ho. Ek baar mark hone ke baad inference us value ko assignments, destructuring aur helper calls ke paar tak follow karta hai — to ullanghan tab bhi saamne aata hai jab <code>ref.current</code> kisi doosre function ke andar access ho jise ref argument ke roop me mila tha.",
"Ek chaalaak pitfall: kisi saada object ke paas <code>.current</code> property ho to naam wale heuristic se wo bhi flag ho sakta hai — <code>ref.current</code> aur <code>fooRef.current</code> asli refs maane jate hain. Ilaaj: container ka naam badlo (jaise <code>box</code>) ya mutable value ko state me le jao.",
"Ekmatra render-time likhne ki chhoot hai <b>lazy initialization</b>: <code>if (ref.current === null) { ref.current = expensiveComputation(); }</code> — null check se guard kiya hua ek-baar ka initialization allowed hai. Refs ko effects aur event handlers me aaram se padho/likho; aur jo value UI me dikhti hai wo state me honi chahiye, ref me nahi — warna UI stale reh jayegi kyunki ref badalne se re-render nahi hota."],
c:"// ❌ Render ke dauraan ref padhna\nfunction Component() {\n  const ref = useRef(0);\n  const value = ref.current; // Render me mat padho\n  return <div>{value}</div>;\n}\n\n// ❌ Render ke dauraan ref badalna\nfunction Component({ value }) {\n  const ref = useRef(null);\n  ref.current = value; // Render me mat badlo\n  return <div />;\n}\n\n// ✅ Ref ko effects/handlers me padho\nuseEffect(() => {\n  if (ref.current) { console.log(ref.current.offsetWidth); } // Effect me OK\n});\n\n// ✅ UI wali values ke liye state\nconst [count, setCount] = useState(0);\n\n// ✅ Lazy initialization — render-time likhne ki EK chhoot\nfunction Component() {\n  const ref = useRef(null);\n  if (ref.current === null) {\n    ref.current = expensiveComputation(); // OK — lazy initialization\n  }\n}",
k:"Ref render ke liye nahi hai: use event handlers aur effects me padho-likho. Render me ref.current likhne ki ek hi chhoot hai — null-guarded lazy initialization."},
{n:140,g:18,t:"set-state-in-effect",u:"https://react.dev/reference/eslint-plugin-react-hooks/lints/set-state-in-effect",
p:["Ye lint effect ke andar <b>synchronously <code>setState</code></b> call karne ke khilaf validate karta hai — ye ek extra render cycle zabardasti chalata hai aur performance kharab karta hai.",
"Effect ke andar turant state set karne se React ko poora render cycle dobara shuru karna padta hai: re-render, DOM changes apply karna, effects phir chalana. Synchronous <code>setState</code> effects me browser ke paint karne se <b>pehle</b> hi immediate re-renders trigger karta hai — performance issues aur visual jank aata hai. Wahi nateeja aam taur par ek hi render me mil sakta hai: data ko component ke top level par transform karke.",
"Pakde jaane wale pattern: loading state ko synchronously set karna (<code>setLoading(true)</code> fetch se pehle), props se state derive karna effect me (<code>useEffect(() =&gt; setSelected(...), [selectedId, items])</code>), aur data ko render ke bajaye effect me transform karna (<code>setProcessed(rawData.map(transform))</code>).",
"Page ka headline rule: <b>'Jab koi cheez maujooda props ya state se calculate ho sakti hai, to use state me mat rakho.'</b> Render ke dauraan calculate karo — tez, saral, kam galtiyon wala. Jaise selected item state me rakhne ke bajaye render me <code>items.find(...)</code> se nikaalo.",
"Ek vaidh (legitimate) exception hai: DOM measurement. Jo values layout ke baad hi milti hain (jaise ref se <code>getBoundingClientRect()</code>) unke liye effect sach me chahiye — tooltip ki height naapkar state me rakhna is lint me theek mana gaya hai. Aur farq samjho: effect me <b>sync</b> setState (extra render, flag hota hai) banam fetch resolve hone ke baad <b>async</b> setState (aam baat, flag nahi hota)."],
c:"// ❌ Effect me synchronous setState — extra render\nfunction Component({ data }) {\n  const [items, setItems] = useState([]);\n  useEffect(() => { setItems(data); }, [data]); // Initial state hi use karo\n}\n\n// ❌ Loading state synchronously set karna\nuseEffect(() => {\n  setLoading(true); // Synchronous — extra render\n  fetchData().then(() => setLoading(false));\n}, []);\n\n// ❌ Data ko effect me transform karna — render me derive hona chahiye\nuseEffect(() => { setProcessed(rawData.map(transform)); }, [rawData]);\n\n// ✅ setState effect me TAB theek hai jab value ref se aaye (DOM measurement)\nfunction Tooltip() {\n  const ref = useRef(null);\n  const [tooltipHeight, setTooltipHeight] = useState(0);\n  useLayoutEffect(() => {\n    const { height } = ref.current.getBoundingClientRect();\n    setTooltipHeight(height);\n  }, []);\n}\n\n// ✅ Render ke dauraan calculate karo\nfunction Component({ selectedId, items }) {\n  const selected = items.find(i => i.id === selectedId);\n  return <div>{selected?.name}</div>;\n}",
k:"Effect me sync setState matlab ek render bekaar. Jo props/state se calculate ho sakta hai use state me rakho hi mat — render me derive karo. Exception sirf DOM measurement hai."},
{n:141,g:18,t:"set-state-in-render",u:"https://react.dev/reference/eslint-plugin-react-hooks/lints/set-state-in-render",
p:["Ye lint render ke dauraan <b>bina shart (unconditionally)</b> state set karne ke khilaf validate karta hai — ye maujooda render ke khatm hone se pehle hi doosra render trigger kar deta hai, ek infinite loop banata hai aur app crash ho jati hai.",
"Khaas shabd hai <i>unconditionally</i>: bina kisi guard ke render me <code>setState</code> render ko hamesha ke liye dobara trigger karta rahega. Rule <b>conditional</b> roop ko allowed karta hai — state tabhi set karo jab naye props/state pichhle render ki values se alag hon.",
"Wo durlabh vaidh case hai 'pichhle renders se state adjust karna': pichhli value ko state me rakho (<code>prevItems</code>), render me tulna karo (<code>if (items !== prevItems)</code>), aur alag ho tabhi setter chalao aur selection reset karo. Yahi condition use loop se bachati hai — React ek baar re-render karke converge ho jata hai.",
"Aam galti: state ko render ke baad 'theek' karne ki koshish — jaise counter ko render ke dauraan <code>max</code> prop tak clamp karna. Jaise hi <code>count</code> <code>max</code> se upar gaya, infinite loop shuru. Page ka ilaaj: maximum ko <b>state set karne ke pal</b> par lagu karo (event handler me), taaki setter sirf click ke jawab me chale aur <code>count</code> kabhi <code>max</code> paar hi na kare.",
"Note: is page ke crawled text me counter/<code>max</code> wala example prose me varnit tha lekin uske code blocks maujood nahi the — isiliye yahan uska code nahi diya gaya, kuch banaya nahi gaya. Padosi lint se farq: <code>set-state-in-effect</code> bekaar ke extra renders ke baare me hai; <code>set-state-in-render</code> infinite loops ke baare me. Alag nakami, alag ilaaj."],
c:"// ✅ Render me derive karo — derive ho sakne wali values state me mat rakho\nfunction Component({ items }) {\n  const sorted = [...items].sort(); // Render me hi calculate karo\n  return <ul>{sorted.map(/*...*/)}</ul>;\n}\n\n// ✅ State event handler me set karo, render me nahi\nfunction Component() {\n  const [count, setCount] = useState(0);\n  return <button onClick={() => setCount(count + 1)}>{count}</button>;\n}\n\n// ✅ Props se derive karo, state set karne ke bajaye\nfunction Component({ user }) {\n  const name = user?.name || '';\n  const email = user?.email || '';\n  return <div>{name}</div>;\n}\n\n// ✅ Pichhle renders se state CONDITIONALLY adjust karna — guard hi ise valid banata hai\nfunction Component({ items }) {\n  const [selection, setSelection] = useState(null);\n  const [prevItems, setPrevItems] = useState(items);\n  if (items !== prevItems) { // Yahi condition ise valid banati hai\n    setPrevItems(items);\n    setSelection(null);\n  }\n}",
k:"Render me bina shart setState = infinite loop. Shart ke saath, pichhli value se tulna karke adjust karna hi ekmatra vaidh roop hai — aur derive ho sakne wali cheez to state me rakho hi mat."},
{n:142,g:18,t:"static-components",u:"https://react.dev/reference/eslint-plugin-react-hooks/lints/static-components",
p:["Ye lint validate karta hai ki components <b>static</b> hon, har render par dobara na banein. Dynamically dobara bane components state reset karte hain aur bekaar ke re-renders karwate hain.",
"Kisi component ko doosre component ke andar define karne se wo har render par dobara banta hai. React har naye version ko ek bilkul naya component type maanta hai, purane ko unmount karke naye ko mount karta hai — is prakriya me saari state aur DOM nodes nasht ho jate hain. (Tantra wahi hai jo <code>component-hook-factories</code> ka hai, lekin ye rule khaas taur par per-render recreation wale case ko nishana banata hai.)",
"Pehchanne yogya lakshan: input har keystroke par focus kho deta hai / counter har baar 0 par reset ho jata hai — kyunki child har render remount ho raha hai, uski type identity har baar badal rahi hai.",
"'Local state access karne ke liye' andar component define karna (jaise <code>ThemedButton</code> ka <code>theme</code> par close over karna) page ke hisaab se is baat ka sanket hai ki tumhe props pass karne chahiye the. Props se data dena components ko zyada reusable aur testable bhi banata hai.",
"Ilaaj sanrachnaatmak (structural) hai, memo nahi: component ko bahar uthao aur data props se do. Ternary se component chunna ho to inline naye arrow functions banane ke bajaye pehle se bane module-level components ko reference karo."],
c:"// ❌ Component ke andar component — har render naya type, state reset\nfunction Parent() {\n  const ChildComponent = () => { // Har render naya component!\n    const [count, setCount] = useState(0);\n    return <button onClick={() => setCount(count + 1)}>{count}</button>;\n  };\n  return <ChildComponent />; // State har render reset hoti hai\n}\n\n// ❌ Dynamic component banana\nfunction Parent({ type }) {\n  const Component = type === 'button'\n    ? () => <button>Click</button>\n    : () => <div>Text</div>;\n  return <Component />;\n}\n\n// ✅ Components module level par; maujooda me se chuno\nconst ButtonComponent = () => <button>Click</button>;\nconst TextComponent = () => <div>Text</div>;\nfunction Parent({ type }) {\n  const Component = type === 'button' ? ButtonComponent : TextComponent;\n  return <Component />;\n}\n\n// ✅ Data props se do, parent state par close over karne ke bajaye\nfunction ThemedButton({ theme }) {\n  return <button className={theme}>Click me</button>;\n}",
k:"Child har render remount ho raha hai to wajah uski badalti type identity hai. Component ko module level par le jao, farq props se bhejo — memo se ye theek nahi hoga."},
{n:143,g:18,t:"unsupported-syntax",u:"https://react.dev/reference/eslint-plugin-react-hooks/lints/unsupported-syntax",
p:["Ye lint us syntax ke khilaf validate karta hai jise React Compiler <b>support nahi karta</b> — aisa code jise compiler statically analyze nahi kar sakta. Wahi syntax React ke bahar bilkul theek hai, jaise kisi standalone utility function me.",
"Compiler ko optimize karne ke liye code ka static analysis karna padta hai. <code>eval</code> aur <code>with</code> compile time par ye jaanna namumkin bana dete hain ki code asal me karega kya — scope dynamic ho jata hai — isiliye compiler unhe use karne wale components ko optimize nahi kar sakta.",
"Dynamic property access ke liye bhi <code>eval</code> mat use karo (<code>eval(`props.${propName}`)</code>) — aam property access hi analyzable hai: <code>props[propName]</code>. Aur <code>with (Math)</code> ki jagah seedha <code>Math.sin(Math.PI / 2)</code> likho.",
"User ke diye code ko <code>eval</code> se chalana (jaise calculator) asurakshit bhi hai aur unoptimizable bhi. Page ka pattern: ek safe expression parser use karo — example me <code>mathjs</code> ka <code>evaluate()</code> event handler ke andar try/catch ke saath chalaya gaya aur nateeja state me rakha gaya.",
"Page ki security chetaavni saaf hai: user input ke saath <code>eval</code> kabhi mat use karo — ye security risk hai. Khaas maamlon (math expressions, JSON parsing, template evaluation) ke liye dedicated parsing libraries use karo."],
c:"// ❌ Component me eval — analyze nahi ho sakta\nfunction Component({ code }) {\n  const result = eval(code);\n  return <div>{result}</div>;\n}\n\n// ❌ with — scope dynamically badalta hai\nfunction Component() {\n  with (Math) { // Scope dynamically badal deta hai\n    return <div>{sin(PI / 2)}</div>;\n  }\n}\n\n// ❌ eval se dynamic property access\nfunction Component({ propName }) {\n  const value = eval(`props.${propName}`);\n  return <div>{value}</div>;\n}\n\n// ✅ Aam property access — analyzable hai\nfunction Component({ propName, props }) {\n  const value = props[propName];\n  return <div>{value}</div>;\n}\n\n// ✅ Standard Math methods\nfunction Component() {\n  return <div>{Math.sin(Math.PI / 2)}</div>;\n}",
k:"Compiler ko compile time par bindings jaanne hote hain; eval aur with scope ko dynamic bana dete hain. User input evaluate karna ho to safe parser, event handler me, try/catch ke saath."},
{n:144,g:18,t:"use-memo",u:"https://react.dev/reference/eslint-plugin-react-hooks/lints/use-memo",
p:["Ye lint validate karta hai ki <code>useMemo</code> hook ka istemal <b>return value ke saath</b> ho. (<code>useMemo</code> docs me iski aur detail hai.)",
"<code>useMemo</code> mehenge (expensive) values ko compute karke cache karne ke liye hai, side effects ke liye nahi. Bina return value ke wo <code>undefined</code> lautata hai — uska maksad hi khatm ho jata hai, aur iska matlab aam taur par ye hai ki tum galat hook use kar rahe ho.",
"Dependencies badalne par side effects ke liye <code>useMemo</code> use karna classic galat istemal hai — side effect ka result 'return' kar dena bhi galat hai. Ilaaj iraade par nirbhar karta hai: side effect <b>user interaction</b> ke jawab me hai to use event handler ke saath rakho (<code>onClick</code> → <code>analytics.track(...)</code>); side effect <b>React state ko bahari state se synchronize</b> karta hai to <code>useEffect</code> use karo (jaise <code>theme</code> par <code>localStorage.setItem(...)</code> aur <code>document.body.className</code> effect me).",
"Ek pankti me farq yaad rakho: <code>useMemo</code> ek <b>value</b> compute karta hai, <code>useEffect</code> ek <b>side effect</b> karta hai, event handlers <b>interactions</b> ka jawab dete hain. Bina return wala <code>useMemo</code> lagbhag hamesha ek galat jagah rakha effect hota hai.",
"Ye rule <code>preserve-manual-memoization</code> ke saath joda banta hai: manual memoization ko sahi rakho (poori deps + ek return value) ya use hata kar compiler ko sambhalne do."],
c:"// ❌ Return value nahi — processed hamesha undefined\nfunction Component({ data }) {\n  const processed = useMemo(() => {\n    data.forEach(item => console.log(item));\n    // Return gayab hai!\n  }, [data]);\n  return <div>{processed}</div>; // Hamesha undefined\n}\n\n// ✅ Computed value return karta hai\nfunction Component({ data }) {\n  const processed = useMemo(() => {\n    return data.map(item => item * 2);\n  }, [data]);\n  return <div>{processed}</div>;\n}\n\n// ❌ Galat: useMemo me side effects (dono roop galat)\nuseMemo(() => { analytics.track('UserViewed', { userId: user.id }); }, [user.id]);",
k:"useMemo value ke liye hai, side effect ke liye nahi. Return nahi hai to samjho effect galat jagah ghus gaya hai — interaction hai to handler me, sync hai to useEffect me le jao."}
];
/* ================= FAQS — 30 interview sawal ================= */
var FAQS=[
["Props aur state me kya farak hai?","Props parent se milne wale arguments hain — read-only, component unhe badal nahi sakta. State component ki apni memory hai jo interaction par badalti hai aur setter call karne par re-render karwati hai. Aam pattern: parent state rakhta hai aur value + handler props se neeche bhejta hai."],
["State ko 'lift up' karna matlab kya hai?","Jab do sibling components ko wahi data dikhana aur saath update karna ho, to state unke sabse kareebi common parent me rakho aur value aur onChange dono props se neeche bhejo. Isse ek hi source of truth rehta hai — jaise Tic-Tac-Toe me saare squares ki state Board/Game me rehti hai."],
["Teen baar setNumber(number + 1) karne se sirf 1 kyun badhta hai?","Kyunki state ek snapshot hai: ek render ke dauraan number ki value fixed rehti hai. Teenon calls wahi purani value padh kar number + 1 hi queue karti hain — replace hota hai, judta nahi. Har baar latest value par kaam karna ho to updater function use karo: setNumber(n =&gt; n + 1) teen baar queue hokar +3 dega."],
["Keys kyun zaroori hain? Index ko key banana kab galat hai?","Key React ko har item ki pehchan batati hai taaki re-renders ke beech state sahi item ke saath rahe. List reorder, insert ya delete hoti ho to index key state ko galat item se jod deti hai (input ka text doosre item par chala jata hai). Stable database ID hi sahi key hai; index sirf static, kabhi-na-badalne wali lists me chal sakta hai."],
["State ko mutate kyun nahi kar sakte? setItems(items) ke baad re-render kyun nahi hua?","Mutation se object ka reference wahi rehta hai, aur React Object.is se tulna karke badlaav 'nahi hua' maan leta hai — re-render skip. Hamesha naya reference banao: setItems([...items, 4]), nested ke liye har level par spread. push/sort/splice jaise methods jagah par mutate karte hain — pehle copy banao."],
["Controlled aur uncontrolled inputs me kya farak hai?","Controlled input ki value React state se aati hai aur har keystroke onChange se state update hota hai — value ka malik React hai. Uncontrolled input apni value DOM me rakhta hai; tum use ref se padhte ho ya form submit par lete ho. Validation ya turant UI feedback chahiye to controlled; saada form ho to uncontrolled bhi chal sakta hai."],
["Component pure hona matlab kya hai? StrictMode isme kaise madad karta hai?","Pure component: wahi props/state/context → hamesha wahi JSX, aur render ke dauraan bahar ki koi cheez nahi badalta. StrictMode development me har component function ko do baar call karta hai — impure code (jaise global counter badhata Cup) doosri baar alag output dekar pakda jata hai. Production par iska koi asar nahi."],
["Render tree aur dependency tree (module tree) me kya farak hai?","Render tree components ka tree hai — kon kise render karta hai, UI ki sanrachna. Dependency/module tree imports ka tree hai — kon si file kise import karti hai; isme non-component modules bhi hote hain aur ek hi component kai jagah aa sakta hai. Bundle size aur code splitting module tree se samajh aata hai, UI ka behaviour render tree se."],
["Default export aur named export me kab kya use karun?","Ek file me default export sirf ek ho sakta hai, named exports kai ho sakte hain. Default export ko import karte samay naam badal sakte ho; named ko braces ke saath exact naam (ya as se alias) se import karna padta hai. Badi files me kai components hon to named exports saaf rehte hain."],
["Ek hi jagah par component badalne se state kab reset hoti hai, kab preserve?","Wahi position + wahi component type → state preserve. Alag type → purana unmount, naye ke saath fresh state. Aur jaanboojh kar reset karna ho to key badal do — jaise &lt;Chat key={contact.id}&gt; har contact ke liye alag state deta hai. Component ko doosre component ke andar define karna har render naya type banata hai — state har keystroke gayab; definitions hamesha top level par."],
["Ref aur state me kab kya use karun?","Jo value screen par dikhti hai ya render ko asar karti hai — state. Jo value render ke liye nahi hai (DOM node, timer ID, pichhli value yaad rakhna) — ref. Ref badalne se re-render nahi hota, aur ref.current ko render ke dauraan padhna/likhna mana hai (lazy initialization ekmatra chhoot hai); use handlers aur effects me access karo."],
["useReducer useState se behtar kab hai?","Jab state updates ka logic uljha hua ho — kai sub-values, agla state pichhle par kai tareekon se nirbhar — ya jab kai handlers ek hi state ko badalte hon. Reducer saare transitions ko ek pure function me ikattha karta hai: dispatch({ type: 'added', ... }) aur reducer tay karta hai kya hoga. Testing aur debugging asaan ho jata hai. Saada ek-value state ke liye useState hi kaafi hai."],
["Reducer + Context, Redux ki jagah le sakta hai kya?","Chhote-mote global state (theme, current user, cart) ke liye haan — useReducer logic deta hai, Context use poore tree me uplabdh karwata hai. Lekin bade apps me Redux jaise tools devtools, middleware, aur fine-grained subscriptions dete hain; Context ka value badalne par saare consumers re-render hote hain. Pehle built-in se shuru karo, zaroorat pade tab library lo."],
["Effect aur event handler me kaam kahan rakhoon?","Jo kaam user ke khaas interaction (click, submit, type) ke jawab me ho — event handler me. Jo kaam render ho jaane ke baad bahari system se synchronization ke liye ho (server se judna, subscription, non-React widget) — Effect me. Galat jagah rakhna hi 'You Might Not Need an Effect' ki jad hai: props se state copy karna, data transform karna — ye sab render ya handler me hona chahiye."],
["Fetch race condition kya hoti hai? ignore flag kaise bachata hai?","User tezi se page/id badle to purani request der se resolve hokar nayi data ko overwrite kar sakti hai. Effect ke cleanup me let ignore = false rakho, cleanup me ignore = true karo, aur response aane par if (!ignore) tabhi setState karo. Cleanup har naye effect se pehle chalta hai, isiliye purane responses apne aap radd ho jate hain."],
["Effect ki dependencies me object rakhne se baar-baar kyun chalta hai?","Har render par naya object banta hai — Object.is tulna me wo pichhle se alag hai, to React effect dobara chala deta hai, chahe andar ke values wahi hon. Ilaaj: object ko component ke bahar rakho, ya primitive values ko alag-alag dependencies banao, ya sach me zaroori ho to useMemo se stable banao. Dependencies hamesha effect ke andar use hue har reactive value ko shamil karti hain — exhaustive-deps lint yahi jaanchta hai."],
["Custom Hooks state share karte hain ya logic?","Sirf logic. Do components ek hi custom Hook call karein to har ek ko apni alag state milti hai — Hook ek recipe hai, state har component instance ki apni. State share karni ho to use upar uthakar props ya Context se baanto. Custom Hook ka naam use se shuru hona chahiye taaki lint rules uske andar ke Hooks ko jaanch saken."],
["useMount jaisa hook kyun nahi hota? 'Sirf mount par chalao' sahi tareeka kya hai?","React jaanboojh kar useMount nahi deta, kyunki 'mount par chalao' aksar galat model hota hai — StrictMode me mount, unmount, phir mount hota hai, aur sahi code ko cleanup ke saath idempotent hona chahiye. Synchronization ho to useEffect sahi dependencies aur cleanup ke saath likho. Sach me ek-baar-wala kaam (jaise analytics) ho to ref guard use karo — ye exhaustive-deps page ki bhi salah hai."],
["useSyncExternalStore kab chahiye? Apna store subscribe karne me kya khatra hai?","Jab state React ke bahar rehti ho — browser APIs (online status, window size) ya third-party store. useSyncExternalStore subscribe function aur getSnapshot leta hai; getSnapshot ko cached value lautani chahiye, warna har render naya snapshot dekh kar React infinite loop ki chetaavni dega. Server ke liye getServerSnapshot bhi do taaki hydration match kare."],
["exhaustive-deps ki warning ko ignore karna kyun khatarnaak hai?","Dependency chhootna matlab stale closure: effect purani values pakde baitha rehta hai aur naye props/state par react nahi karta — bug kabhi-kabhi dikhta hai, hamesha nahi. Agar warning aaye to sahi jawab dependencies jhoothi banana nahi hai: ya dep shamil karo, ya logic ko effect ke andar le jao, ya kaam ko handler/render me shift karke effect hi hata do."],
["use aur useContext me kya farak hai?","useContext sirf Context padhta hai aur top level par call hota hai. use usse zyada lachila hai: Context bhi padh sakta hai aur Promise bhi, aur use conditionally ya loop me call kar sakte ho — lekin try/catch me wrap nahi kar sakte. use(promise) par component tab tak suspend rehta hai jab tak promise resolve na ho; uske liye upar Suspense boundary chahiye."],
["Suspense kab 'activate' hota hai? Fallback baar-baar kyun dikhta hai?","Jab koi child suspend kare (data load ho raha ho) to sabse kareebi Suspense boundary apna fallback dikhati hai. Baar-baar fallback ka matlab aam taur par ye hai ki suspend karne wala resource har render par naya bann raha hai (nayi promise, naya lazy) — resource ko stable rakho, cache karo, ya data upar se pass karo. Boundary ko wahan rakho jahan loading UI arth rakhta hai."],
["createRoot aur hydrateRoot me kab kya?","Naya client app ho to createRoot(container).render(&lt;App /&gt;) — poora tree client par banta hai. Server se aaya HTML pehle se maujood ho (SSR/SSG) to hydrateRoot — React maujooda DOM ko apna kar use interactive banata hai, dobara nahi banata. Hydration mismatch (server aur client ka alag output) par React chetaavni deta hai aur kabhi-kabhi client render par gir jata hai."],
["renderToString aur renderToStaticMarkup me kya farak hai?","Dono server par HTML string dete hain. renderToString hydration ke liye bana hai — HTML me React ke extra attributes rehte hain jinse client hydrate karta hai. renderToStaticMarkup bilkul saaf static HTML deta hai — email ya static pages ke liye jahan hydration kabhi nahi hogi; isiliye uska output chhota hota hai. Streaming chahiye to renderToReadableStream/renderToPipeableStream dekho."],
["preload, preinit, preloadModule, preinitModule — 2x2 grid samjhao.","Do jode hain: preload sirf resource ko jaldi download karwana shuru karta hai (fetch), preinit usse aage badh kar use execute/insert bhi karta hai (script chala deta hai, stylesheet laga deta hai). Aur Module wala joda ES modules ke liye hai, aam script/style ke liye bina-Module wala. Matlab: preload = sirf laao, preinit = laakar lagu bhi karo."],
["Interior mutability kya hai aur memoization ko kyun todti hai?","Jab koi object/function apna andar ka state badalta rahe lekin uska reference wahi rahe — dabba bahar se waisa hi, andar sab badla hua. React sirf reference check karta hai, isiliye memoized value stale ho jati hai. Iska canonical example hai: react-hook-form ka watch — useMemo me lapeto to form field 'frozen' dikhta hai; ilaaj hai useWatch. Aise APIs jinpar ye shaq ho, wahan 'use no memo' directive kaam aata hai."],
["React Compiler ke baad useMemo/useCallback ka kya hoga?","Compiler components ko automatic memoize karta hai jab wo Rules of React ka paalan karte hon. Manual memoization compiler preserve karta hai — hatata nahi — lekin adhoori deps uski analysis rok deti hain (preserve-manual-memoization lint). Compiler wale setup me tum saada code likh sakte ho aur memoization compiler par chhod sakte ho; bina compiler ke useMemo/useCallback/React.memo hi upaay hain."],
["'use memo' aur 'use no memo' directives kya karte hain?","Ye React Compiler ke per-function opt-in/opt-out hain. 'use memo' function ko compilation me shamil karta hai (annotation mode me yahi lazmi hai), 'use no memo' use bahar rakhta hai — jaise koi library interior mutability use karti ho. Directive function body ka pehla statement hona chahiye. Opt-out asthayi rakho: wajah TODO ke saath likho aur hatane ka plan banao."],
["Error Boundary aur try/catch me kya farak hai? Render errors try/catch kyun nahi pakadta?","Render ke dauraan throw hui errors React ki reconciliation ke andar hoti hain — tumhara try/catch unhe pakad nahi sakta, wo component tree me upar bubble hoti hain. Error Boundary (getDerivedStateFromError/componentDidCatch wala class component, ya library wrapper) unhe pakad kar fallback UI dikhata hai. Event handlers aur async code ki errors ke liye try/catch hi sahi hai — boundaries wahan kaam nahi karti."],
["Ek render me setState karna kab allowed hai, kab infinite loop?","Bina shart render me setState har render ko dobara trigger karke infinite loop banata hai. Allowed roop sirf ek hai: pichhle render ki value se tulna karke conditionally adjust karna — if (items !== prevItems) { setPrevItems(items); setSelection(null); } — React ek baar re-render karke ruk jata hai. Lekin pehla sawal hamesha ye: kya ye value props/state se derive ho sakti hai? Ho sakti hai to state rakho hi mat."]

var l3={history:[Array(9).fill(null)],move:0};
function l3winner(sq){ var lines=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]]; for(var i=0;i<lines.length;i++){ var a=lines[i][0],b=lines[i][1],c=lines[i][2]; if(sq[a]&&sq[a]===sq[b]&&sq[a]===sq[c]) return {who:sq[a],line:lines[i]}; } return null; }
function l3render(){
  var sq=l3.history[l3.move], w=l3winner(sq), grid=document.getElementById("l3grid"); grid.innerHTML="";
  sq.forEach(function(v,i){ var btn=document.createElement("button"); btn.textContent=v||""; btn.setAttribute("aria-label","Square "+(i+1)); if(w&&w.line.indexOf(i)>-1) btn.className="win"; btn.addEventListener("click",function(){ l3play(i); }); grid.appendChild(btn); });
  var full=sq.every(function(v){ return v; });
  setOut("l3status", w?("Jeetne wala: "+w.who+" — badhai ho!"):(full?"Draw — board bhar gaya.":("Agli chaal: "+(l3.move%2===0?"X":"O"))));
  var mv=document.getElementById("l3moves"); mv.innerHTML="";

}
function l3play(i){ var sq=l3.history[l3.move]; if(l3winner(sq)||sq[i]) return; var next=sq.slice(); next[i]=l3.move%2===0?"X":"O"; l3.history=l3.history.slice(0,l3.move+1); l3.history.push(next); l3.move++; l3render(); }
