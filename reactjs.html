"Aam galtiyan: dependency array bhoolna (har render calculation); dependency hi har render naya object/function ho (memoization kabhi hold nahi hoti); arrow function se object return karte waqt parentheses bhoolna — <code>useMemo(() =&gt; { ... })</code> function body ban jata hai aur <code>undefined</code> return hota hai, sahi hai <code>() =&gt; ({ ... })</code>; calculation ke andar prop mutate karna (Strict Mode ki double-call pakad legi — calculation ke <i>andar bane</i> objects ko mutate karna theek hai, maujood props/state ko nahi). Function memoize karna ho to <code>useMemo(() =&gt; (args) =&gt; {...}, deps)</code> ki jagah <code>useCallback</code> use karo — dono bilkul equivalent hain. Aur haan — <b>React Compiler</b> values/functions ko automatically memoize karta hai, to manual <code>useMemo</code> ki zaroorat kam hoti ja rahi hai."],
c:"import { useMemo } from 'react';\n\nfunction TodoList({ todos, tab }) {\n  const visibleTodos = useMemo(\n    () => filterTodos(todos, tab),\n    [todos, tab]\n  );\n  // ...\n}\n\n// memo wale child ko stable value dena\nconst visibleTodos = useMemo(() => filterTodos(todos, tab), [todos, tab]);\n// <List items={visibleTodos} />\n\n// Effect ke liye stable options object (ya behtar: object Effect ke andar banao)\nconst options = useMemo(() => ({\n  serverUrl: 'https://localhost:1234',\n  roomId: roomId\n}), [roomId]);",
k:"useMemo value cache karta hai, useCallback function. Ye optimization hai, guarantee nahi — sirf slow calculation, memo-child prop, ya Hook dependency ke liye."},
{n:46,g:5,t:"useCallback",u:"https://react.dev/reference/react/useCallback",
p:["<code>useCallback</code> ek <b>function definition</b> ko re-renders ke beech cache karta hai — functions ke liye specialized <code>useMemo</code>. Signature: <code>const cachedFn = useCallback(fn, dependencies)</code>. Pehle render par React tumhara <code>fn</code> return karta hai (<b>call nahi karta</b>); baad me dependencies na badli hon to wahi purana function milta hai, warna is render wala function store ho jata hai.",
"<b>useMemo vs useCallback:</b> <code>useMemo</code> tumhare function ko <i>call karke</i> uska result cache karta hai; <code>useCallback</code> function ko <i>khud</i> cache karta hai — code tabhi chalta hai jab tum use call karo. Simplified implementation: <code>function useCallback(fn, deps) { return useMemo(() =&gt; fn, deps); }</code>. Dhyaan do: <code>useCallback</code> function <i>banne</i> se nahi rokta — har render ek naya function banta hi hai, React bas use ignore karke cached wala de deta hai jab deps same hon.",
"<b>Fayda sirf do cases me:</b> (1) function <code>memo</code> me lapete component ko prop ke roop me ja raha hai — <code>() =&gt; {}</code> har render naya hota hai (jaise <code>{}</code> naya object hota hai), to bina cache ke <code>memo</code> ka optimization fail ho jata hai; (2) function kisi aur Hook (<code>useCallback</code>/<code>useEffect</code>) ki dependency hai. Inke alawa har function ko lapetna sirf readability ka nuksan hai — aur ek bhi 'hamesha naya' value poori memoization chain tod deta hai.",
"<b>Updater se dependency hatao:</b> callback state ko sirf next state calculate karne ke liye padhta ho to updater form use karo — <code>setTodos(todos =&gt; [...todos, newTodo])</code> — phir callback ko <code>todos</code> dependency nahi chahiye aur deps <code>[]</code> ho sakti hain. Custom Hooks ke liye bhi: Hook jo functions return karta hai unhe <code>useCallback</code> me lapeto, taaki consumers apna code optimize kar saken.",
"Galtiyan: dependency array bhoolna (har render naya function); dependency hi har render badalne wali ho; loop ke andar list item ke liye <code>useCallback</code> call karna (allowed nahi — per-item component nikalo ya item ko <code>memo</code> karo); aur jahan function ko Effect ke <i>andar</i> le jana hi dependency khatm kar deta, wahan lapetna. <code>useMemo</code> ki tarah ye bhi sirf optimization hai — React specific karanon se cache phenk sakta hai. <b>React Compiler</b> functions ko automatically memoize karta hai, manual <code>useCallback</code> ki zaroorat kam hoti ja rahi hai."],
c:"import { useCallback } from 'react';\n\nexport default function ProductPage({ productId, referrer, theme }) {\n  const handleSubmit = useCallback((orderDetails) => {\n    post('/product/' + productId + '/buy', {\n      referrer,\n      orderDetails,\n    });\n  }, [productId, referrer]);\n\n  return (\n    <div className={theme}>\n      <ShippingForm onSubmit={handleSubmit} />\n    </div>\n  );\n}\n\n// Updater form state dependency hata deta hai\nconst handleAddTodo = useCallback((text) => {\n  const newTodo = { id: nextId++, text };\n  setTodos(todos => [...todos, newTodo]);\n}, []); // ✅ todos dependency ki zaroorat nahi",
k:"useCallback function ki identity stable rakhta hai — matlab sirf tab hai jab function memo wale child ko jaye ya kisi Hook ki dependency bane."},
{n:47,g:5,t:"useTransition",u:"https://react.dev/reference/react/useTransition",
p:["<code>useTransition</code> UI ke ek hisse ko <b>background me render</b> karne deta hai — state updates ko Transitions mark karke, taaki wo UI ko block na karein. Signature: <code>const [isPending, startTransition] = useTransition()</code> — koi parameter nahi. Return: <code>isPending</code> flag (koi Transition pending hai ya nahi) aur <code>startTransition</code> function.",
"<code>startTransition(action)</code>: <code>action</code> ek function hai jo ek ya zyada <code>set</code> functions call karke state update karta hai. React <code>action</code> ko <b>turant</b> call karta hai aur uske dauraan synchronously schedule hue saare updates ko Transitions mark karta hai. <code>action</code> ke andar awaited async kaam bhi Transition me shamil hota hai, lekin <code>await</code> ke <i>baad</i> wale <code>set</code> calls ko ek aur <code>startTransition</code> me lapetna padta hai (maujooda limitation). <code>startTransition</code> ki identity stable hai. Iske andar call hone wale functions ko <b>Actions</b> kehte hain — convention: callback props ka naam <code>action</code> ya 'Action' suffix wala rakho.",
"<b>Urgent vs Transition updates:</b> typing/clicking jaise urgent updates turant render hote hain; Transition updates <b>interruptible</b> hain — chart ka Transition render chalte hue input me type karo to React chart render beech me chhod kar pehle input sambhalta hai, phir chart dobara shuru karta hai. <code>isPending</code> pehle <code>startTransition</code> call par <code>true</code> hota hai aur saare Actions complete hokar final state dikhne tak <code>true</code> rehta hai — pending style/feedback ke liye yahi use karo.",
"<b>Suspense ke saath:</b> bina Transition ke, suspending tab par click karne se sabse kareebi <code>&lt;Suspense&gt;</code> fallback poora container badal deta hai — jarring. Transition ke saath current tab visible rehta hai aur pending state button me dikhta hai. Dhyaan do: Transitions sirf <i>pehle se revealed</i> content ko chhupane se bachati hain — naye tab ke andar nested <code>&lt;Suspense&gt;</code> boundary ka fallback phir bhi turant dikhega. Yahi wajah hai ki Suspense-enabled routers navigations ko default roop se Transitions me lapet-te hain: interruptible, koi jarring loading indicator nahi, aur saare pending actions complete hone ka intezaar.",
"<b>Controlled inputs par Transition nahi chalega</b> — input updates synchronous hone chahiye. Tareeke: (1) do state variables — ek input ke liye synchronous, doosra Transition me update hone wala jo 'peeche rehta' hai; (2) ek state + <code>useDeferredValue</code>. Aur agar update kisi prop ya custom Hook value ke jawab me hai (setter tumhare paas nahi), to bhi <code>useDeferredValue</code> hi sahi tool hai.",
"Aur kuch seemayein: <code>setTimeout</code> ke andar ke updates Transition nahi bante — <code>startTransition</code> ko timeout ke <i>andar</i> rakho. Raw Transitions ke saath <code>await</code> karne par out-of-order completion handle nahi hota (purani request baad me khatm hokar stale value set kar sakti hai) — aam cases ke liye <code>useActionState</code>, form actions ya Server Functions use karo jo ordering sambhalte hain. Kai ongoing Transitions ko React abhi batch kar deta hai. <code>action</code> throw kare ya Promise reject ho to calling component ko Error Boundary me lapeto. Component ke bahar Transition chahiye to standalone <code>startTransition</code> hai — lekin usme <code>isPending</code> nahi milta."],
c:"import { useState, useTransition } from 'react';\n\nfunction TabContainer() {\n  const [isPending, startTransition] = useTransition();\n  const [tab, setTab] = useState('about');\n\n  function selectTab(nextTab) {\n    startTransition(() => {\n      setTab(nextTab);\n    });\n  }\n  // ...\n}\n\n// Async Action — await ke baad wale set calls ko phir lapeto\nfunction onSubmit(newQuantity) {\n  startTransition(async function () {\n    const savedQuantity = await updateQuantity(newQuantity);\n    startTransition(() => {\n      setQuantity(savedQuantity);\n    });\n  });\n}",
k:"Transition = bina UI roke chalne wala, beech me roka ja sakne wala background update + isPending wala feedback. Setter tumhare paas na ho to useDeferredValue; ordering chahiye to useActionState."},
{n:48,g:5,t:"useDeferredValue",u:"https://react.dev/reference/react/useDeferredValue",
p:["<code>useDeferredValue</code> UI ke ek hisse ka update <b>defer</b> karne deta hai — deferred value taaza value se 'peeche rehti' hai, taaki urgent updates (typing) responsive rahein jabki slow hisse (list, chart, search results) background me catch up karein. Signature: <code>const deferredValue = useDeferredValue(value, initialValue?)</code>. <code>initialValue</code> optional hai — sirf initial render ke liye; na do to pehle render par defer nahi hota (koi purana version hai hi nahi jise dikhaya ja sake).",
"<b>Do-step render:</b> value badalne par React pehle <i>purani</i> deferred value ke saath re-render karta hai (urgent hissa turant update), phir background me nayi value ke saath re-render ki koshish karta hai. Background render <b>interruptible</b> hai — user chart ke render se tez type kare to React background render chhod deta hai aur sirf typing rukne ke baad chart render hota hai. Koi <b>fixed delay nahi</b> hai — urgent render khatm hote hi background render shuru ho jata hai; lag device ki speed ke hisaab se adapt hota hai.",
"<b>Suspense ke saath integration:</b> background update suspend kare to user ko fallback <b>nahi</b> dikhta — purani deferred value tab tak dikhti hai jab tak data load na ho. Stale content ko signal karne ka pattern: <code>const isStale = query !== deferredQuery</code> aur list ko halka dim karo (<code>opacity: isStale ? 0.5 : 1</code>). Dhyaan do: har keystroke par network request phir bhi jati hai — defer sirf <i>results dikhana</i> hota hai, requests nahi; kam requests chahiye hon to debounce/throttle alag se lagega.",
"<b>Performance pattern ke liye memo zaroori hai:</b> slow component ko <code>memo</code> me lapeto, phir use <code>text</code> ki jagah <code>deferredText</code> do. Jab <code>text</code> badalta hai, parent jaldi re-render hota hai lekin <code>deferredText</code> abhi purana hai, to <code>memo</code> wala child re-render skip kar deta hai. Bina <code>memo</code> ke child waise bhi re-render hoga aur optimization bekaar. Ye slow render ko fast nahi karta — bas use deprioritize karta hai taaki keystrokes block na hon.",
"<b>useTransition se farq:</b> dono kaam defer karte hain, lekin <code>useTransition</code> us state update ko lapet-ta hai jiska setter tumhare paas hai; <code>useDeferredValue</code> us <i>value</i> ko defer karta hai jo tumhe mili hai (prop ya custom Hook se) — setter par tumhara control nahi. Update pehle se Transition ke andar ho to <code>useDeferredValue</code> hamesha nayi value return karta hai (update pehle hi deferred hai). Values primitives hon ya rendering ke bahar bane objects — render ke dauraan bana naya object har baar alag hoga aur bekaar background re-renders karega. Background render ke Effects tab tak fire nahi hote jab tak wo screen par commit na ho jaye."],
c:"import { useState, useDeferredValue, Suspense } from 'react';\n\nexport default function App() {\n  const [query, setQuery] = useState('');\n  const deferredQuery = useDeferredValue(query);\n  const isStale = query !== deferredQuery;\n\n  return (\n    <>\n      <label>\n        Search albums:\n        <input value={query} onChange={e => setQuery(e.target.value)} />\n      </label>\n      <Suspense fallback={<h2>Loading...</h2>}>\n        <div style={{ opacity: isStale ? 0.5 : 1 }}>\n          <SearchResults query={deferredQuery} />\n        </div>\n      </Suspense>\n    </>\n  );\n}",
k:"Deferred value peeche rehti hai taaki typing na ruke — slow hisse ko memo me lapetna mat bhoolna, warna defer ka koi fayda nahi."},
{n:49,g:5,t:"useDebugValue",u:"https://react.dev/reference/react/useDebugValue",
p:["<code>useDebugValue</code> ek custom Hook ko <b>React DevTools me label</b> dene deta hai — taaki component inspect karte waqt Hook ki internal state padhi ja sake, sirf raw underlying data na dikhe. Signature: <code>useDebugValue(value, format?)</code>. Kuch return nahi karta, aur app ke runtime behavior par iska <b>koi asar nahi</b> — ye sirf developer experience ke liye hai.",
"Custom Hook ke top level par call karo: <code>useOnlineStatus</code> ke andar <code>useDebugValue(isOnline ? 'Online' : 'Offline')</code> likhne se us Hook ko call karne wale components DevTools me <code>OnlineStatus: \"Online\"</code> jaisa label dikhate hain. Bina iske sirf underlying data (<code>true</code>) dikhega.",
"<b>Deferred formatting:</b> doosra argument ek formatting function hai — <code>useDebugValue(date, date =&gt; date.toDateString())</code>. DevTools ise tabhi call karta hai jab component sach me inspect ho. Isse mehenga formatting logic (jaise <code>date.toDateString()</code> inline likhna) har render par chalne se bachta hai — inline value har render par calculate hoti hai, formatter sirf inspection par.",
"<b>Har custom Hook me mat lagao:</b> docs kehte hain ye sabse zyada un custom Hooks ke liye valuable hai jo shared libraries ka hissa hain aur jinki internal data structure complex hai aur inspect karna mushkil hai. Har jagah lagane se DevTools me sirf shor badhega."],
c:"import { useSyncExternalStore, useDebugValue } from 'react';\n\nexport function useOnlineStatus() {\n  const isOnline = useSyncExternalStore(subscribe, () => navigator.onLine, () => true);\n\n  useDebugValue(isOnline ? 'Online' : 'Offline');\n\n  return isOnline;\n}\n\n// Deferred formatting — sirf inspection par chalta hai\nuseDebugValue(date, date => date.toDateString());",
k:"Sirf DevTools ke liye label hai — runtime par zero asar. Mehengi formatting ho to formatter function do, taaki wo sirf inspect karne par chale."},
{n:50,g:5,t:"useId",u:"https://react.dev/reference/react/useId",
p:["<code>useId</code> <b>unique IDs</b> generate karta hai jo accessibility attributes ko pass ho sakti hain — taaki ek hi component page par kai baar render ho to bhi IDs clash na karein. Signature: <code>const id = useId()</code> — koi parameter nahi. Return: us particular call aur component se judi ek unique ID string.",
"<b>Problem:</b> <code>aria-describedby</code> jaise attributes do elements ko jodte hain (input aur use describe karne wala paragraph). ID hardcode karna (<code>aria-describedby=\"password-hint\"</code>) React me bad practice hai kyunki component ek se zyada baar render ho sakta hai aur HTML IDs unique hone chahiye. Pattern: <code>const passwordHintId = useId()</code>, phir input par <code>aria-describedby={passwordHintId}</code> aur paragraph par <code>id={passwordHintId}</code>. Kai related elements ke liye har ek par <code>useId</code> call karne ke bajaye ek call se shared prefix banao.",
"<b>Global counter se behtar kyun:</b> <code>nextId++</code> wala tareeka server rendering ke saath fail hota hai. SSR me server HTML banata hai, phir client par hydration handlers jodta hai — client output ko server HTML se match karna padta hai, lekin Client Components ki hydration ka order server ke emission order se alag ho sakta hai. <code>useId</code> ID ko calling component ke <b>'parent path'</b> se banata hai — server aur client ke trees same hon to rendering order kuch bhi ho, ID match karegi. Ulta matlab: server/client trees exactly same na hon to generated IDs match nahi karengi.",
"<b>Kis ke liye bilkul nahi:</b> list ki <code>key</code> ke liye nahi (keys tumhare data se aani chahiye) aur <code>use()</code> ke cache keys ke liye nahi (wo bhi data se banein) — ID component mounted rehne par stable hai lekin rendering ke dauraan badal sakti hai. Async Server Components me <code>useId</code> abhi use nahi ho sakta.",
"Ek page par kai independent React apps hon to <code>createRoot</code>/<code>hydrateRoot</code> ko <code>identifierPrefix</code> option do — har generated ID usi distinct prefix se shuru hogi aur apps ki IDs kabhi clash nahi karengi. Server-rendered apps ke liye wahi prefix server APIs (jaise <code>renderToPipeableStream</code>) ko bhi do — client aur server par prefix same hona chahiye. Ek hi React app ho to prefix ki zaroorat nahi."],
c:"import { useId } from 'react';\n\nfunction PasswordField() {\n  const passwordHintId = useId();\n\n  return (\n    <>\n      <label>\n        Password:\n        <input type=\"password\" aria-describedby={passwordHintId} />\n      </label>\n      <p id={passwordHintId}>\n        The password should contain at least 18 characters\n      </p>\n    </>\n  );\n}\n\n// Kai apps, ek page — dono taraf same prefix\n// Server: renderToPipeableStream(<App />, { identifierPrefix: 'react-app1' })\n// Client: hydrateRoot(domNode, reactNode, { identifierPrefix: 'react-app1' })",
k:"useId accessibility IDs ke liye hai — parent path se banta hai isliye SSR/hydration me match karta hai. Keys aur cache keys ke liye kabhi nahi."},
{n:51,g:5,t:"useSyncExternalStore",u:"https://react.dev/reference/react/useSyncExternalStore",
p:["<code>useSyncExternalStore</code> ek <b>external store</b> ko subscribe karne deta hai — third-party state libraries jo state React ke bahar rakhti hain, ya browser APIs jo mutable value + events deti hain. Concurrent rendering me external mutable data ko seedha padhne se <i>tearing</i> ho sakta hai (alag components ko data ke alag versions dikhna); ye Hook consistent snapshot ki guarantee deta hai. Signature: <code>const snapshot = useSyncExternalStore(subscribe, getSnapshot, getServerSnapshot?)</code>.",
"<b>Teen functions, teen contracts:</b> <code>subscribe(callback)</code> store ko subscribe karta hai; store badalne par <code>callback</code> invoke kare, aur cleanup ke liye unsubscribe function return kare. <code>getSnapshot()</code> store ke data ka snapshot return karta hai — store na badla ho to baar-baar calls par <b>wahi value</b> return honi chahiye; value <code>Object.is</code> se alag mili to React re-render karta hai. <code>getServerSnapshot()</code> (optional) sirf server rendering aur hydration ke dauraan chalta hai — server aur client par bilkul same data return kare; ye na do aur component server par render ho to error throw hoga.",
"<b>getSnapshot ka caching rule sabse badi gotcha hai:</b> snapshot <b>immutable</b> hona chahiye. <code>getSnapshot</code> har baar naya object return kare to error aata hai — 'The result of getSnapshot should be cached' — aur infinite re-render loop ban jata hai. Store ka data mutable hai to data badle tabhi naya immutable snapshot banao, warna cached last snapshot hi return karo. Isi tarah <code>subscribe</code> ko component ke <b>bahar</b> declare karo — component ke andar bana function har render naya hoga aur React har render resubscribe karega (ya <code>useCallback</code> me lapeto).",
"<b>Browser API example:</b> <code>navigator.onLine</code> React ko bina bataye badalta hai. <code>getSnapshot</code> me <code>navigator.onLine</code> return karo, <code>subscribe</code> me window ke <code>online</code>/<code>offline</code> events par callback lagao aur cleanup me hatao, <code>getServerSnapshot</code> me server HTML ke liye <code>true</code>. Aam taur par tum ise seedha component me nahi likhoge — <code>useOnlineStatus</code> jaise custom Hook me lapetoge taaki kai components share kar saken.",
"Kuch aur seemayein: Transition update ke dauraan store mutate ho jaye to React us update ko <b>blocking</b> bana deta hai (DOM par changes lagane se pehle <code>getSnapshot</code> dobara call karke check karta hai; value alag mili to update scratch se blocking roop me restart). Store value ke basis par render ko <b>suspend karna discouraged</b> hai — external store ki mutations non-blocking mark nahi ho sakti, to kareebi <code>&lt;Suspense&gt;</code> fallback pehle se dikh raha content hata dega (bura UX). Aur pehla usool: jab mumkin ho built-in React state (<code>useState</code>/<code>useReducer</code>) hi use karo — ye Hook maujood non-React code ke integration ke liye hai."],
c:"import { useSyncExternalStore } from 'react';\nimport { todosStore } from './todoStore.js';\n\nfunction TodosApp() {\n  const todos = useSyncExternalStore(todosStore.subscribe, todosStore.getSnapshot);\n  return (\n    <>\n      <button onClick={() => todosStore.addTodo()}>Add todo</button>\n      <ul>\n        {todos.map(todo => (\n          <li key={todo.id}>{todo.text}</li>\n        ))}\n      </ul>\n    </>\n  );\n}\n\n// Browser API: online status\nfunction getSnapshot() {\n  return navigator.onLine;\n}\nfunction getServerSnapshot() {\n  return true; // Server-generated HTML ke liye hamesha \"Online\"\n}\nfunction subscribe(callback) {\n  window.addEventListener('online', callback);\n  window.addEventListener('offline', callback);\n  return () => {\n    window.removeEventListener('online', callback);\n    window.removeEventListener('offline', callback);\n  };\n}\nexport function useOnlineStatus() {\n  return useSyncExternalStore(subscribe, getSnapshot, getServerSnapshot);\n}",
k:"External store ke liye tearing-proof subscription: subscribe bahar rakho, getSnapshot cached immutable snapshot de, aur SSR ho to getServerSnapshot zaroor do."},
{n:52,g:5,t:"useActionState",u:"https://react.dev/reference/react/useActionState",
p:["<code>useActionState</code> Actions ka istemal karke side effects ke saath state update karne deta hai — soch me ye <b>Actions ke liye useReducer</b> hai: 'reducer' async ho sakta hai aur side effects (data post karna) kar sakta hai, aur React dispatched Actions ko <b>sequentially queue</b> karta hai taaki har call ko pichli ka result mile. Signature: <code>const [state, dispatchAction, isPending] = useActionState(reducerAction, initialState, permalink?)</code>.",
"<code>reducerAction(previousState, actionPayload)</code> naya state return karta hai — sync ya async. Isi liye naam 'reducerAction' hai: ye previous state ko naye state me <i>reduce</i> karta hai (jaise <code>useReducer</code>) aur ye ek <i>Action</i> hai kyunki ye Transition ke andar call hota hai aur side effects kar sakta hai. Side effects allowed hone ki wajah se ye <code>&lt;StrictMode&gt;</code> me do baar invoke <b>nahi</b> hota. <code>dispatchAction</code> ki identity stable hai, aur use <b>Action ke andar</b> hi call karna hai — <code>startTransition</code> me lapeto ya kisi Action prop ko pass karo; render ke dauraan call karna error hai.",
"<b>Sequential queuing ka matlab:</b> 'Add Ticket' 4 baar click karo aur har Action me 1 second ki delay ho, to kul ~4 second lagenge — jaan-boojh kar, kyunki har call ko pichli ka result <code>prevCount</code> ke roop me chahiye. Yahi raw <code>useTransition</code> + <code>await</code> ki out-of-order problem ko fix karta hai. Turant feedback ke liye standard saathi hai <code>useOptimistic</code> — optimistic count turant badhao jabki <code>dispatchAction</code> server update queue kare. Parallel Actions chahiye hon to ye sahi tool nahi — <code>useState</code> + <code>useTransition</code> seedha use karo. Queued Actions ko cancel karna ho to <code>AbortController</code> ko ref me rakhkar har dispatch par pichla abort karo — lekin dhyaan: mutating Action (jaise database write) ka network request abort karna server-side change ko undo nahi karta; isiliye <code>useActionState</code> default me abort nahi karta.",
"<b>Form integration:</b> <code>dispatchAction</code> ko form ke <code>action</code> prop me do — React submission ko khud Transition me lapet deta hai, <code>startTransition</code> nahi chahiye. Tab <code>reducerAction</code> ko <code>(previousState, FormData)</code> milta hai — <b>FormData doosra argument hai, pehla nahi</b> (sabse aam galti). Validation errors ko state ke hisse ke roop me return karo (<code>{ error, submitted }</code>) aur input me <code>defaultValue={state.submitted?.get('name') ?? ''}</code> do — React ka automatic form reset error par submitted value banaye rakhta hai aur success par field saaf kar deta hai. Built-in reset nahi hai — ya to <code>reducerAction</code> me reset signal handle karo (<code>dispatchAction(null)</code> par <code>initialState</code> return), ya <code>key</code> se remount karo.",
"<b>Error model:</b> jaane hue errors (jaise 'quantity not available') state me return karke inline dikhao. Ajnabi errors throw karo — React saare queued Actions cancel karke sabse kareebi Error Boundary dikhata hai (error Hook se rethrow hota hai). Ek galti aur: koi queued call throw kar de to uske baad ki saari queued calls skip ho jati hain — jahan ho sake errors ko <code>reducerAction</code> ke andar pakad kar error state return karo. Teesra argument <code>permalink</code> (optional) progressive enhancement ke liye hai: Server Function wala form JavaScript load hone se pehle submit ho to browser usi URL par navigate karta hai. Server Functions ke saath <code>initialState</code> aur payload dono serializable hone chahiye."],
c:"import { useActionState, startTransition } from 'react';\nimport { addToCart } from './api';\n\nexport default function Checkout() {\n  const [count, dispatchAction, isPending] = useActionState(\n    async (prevCount) => await addToCart(prevCount),\n    0\n  );\n\n  function handleClick() {\n    startTransition(() => {\n      dispatchAction();\n    });\n  }\n\n  return (\n    <button onClick={handleClick}>\n      Add Ticket{isPending ? ' 🌀' : ''}\n    </button>\n  );\n}\n\n// Kai action types\nconst [count2, dispatch2, isPending2] = useActionState(\n  async (prevCount, actionPayload) => {\n    switch (actionPayload.type) {\n      case 'ADD': return await addToCart(prevCount);\n      case 'REMOVE': return await removeFromCart(prevCount);\n      default: return prevCount;\n    }\n  },\n  0\n);\n\n// Form action — startTransition nahi chahiye\n// <form action={dispatchAction}>...</form>",
k:"useActionState = useReducer + side effects + sequential (ek ke baad ek) queue + isPending. Jaane hue errors state me return karo, ajnabi throw karo, feedback ke liye useOptimistic jodo."},
{n:53,g:6,t:"<Fragment> (<>...</>)",u:"https://react.dev/reference/react/Fragment",
p:["<code>&lt;Fragment&gt;</code> — aam taur par <code>&lt;&gt;...&lt;/&gt;</code> shorthand me — elements ko <b>bina wrapper node ke</b> group karta hai. Grouping ka resulting DOM par koi asar nahi hota, jaise elements group hi na hue hon. Ek component sirf ek element return kar sakta hai; Fragment kai elements (<code>&lt;PostTitle /&gt;</code> + <code>&lt;PostBody /&gt;</code>) ko bina extra <code>&lt;div&gt;</code> ke jodne deta hai — wrapper div ke ulta, Fragment ka layout ya styles par koi side effect nahi.",
"<b>key aur ref ke liye explicit syntax zaroori hai:</b> shorthand <code>&lt;&gt;...&lt;/&gt;</code> na <code>key</code> leta hai na <code>ref</code>. List me har item ke liye Fragment chahiye to <code>Fragment</code> ko <code>'react'</code> se import karke <code>&lt;Fragment key={post.id}&gt;</code> likho — DOM me phir bhi koi wrapper nahi aayega. Fragments ko variables me assign karke props ke roop me bhi pass kar sakte ho, aur text ke saath bhi group kar sakte ho.",
"<b>Fragment refs (FragmentInstance):</b> explicit <code>&lt;Fragment ref={yourRef}&gt;</code> par React ref value ke roop me ek <code>FragmentInstance</code> deta hai — bina wrapper element jode, lapete hue DOM nodes ke saath interact karne ke methods: <code>addEventListener</code>/<code>removeEventListener</code>, <code>dispatchEvent</code>, <code>focus</code>/<code>focusLast</code>/<code>blur</code>, <code>observeUsing</code>/<code>unobserveUsing</code> (IntersectionObserver/ResizeObserver), <code>getClientRects</code>, <code>getRootNode</code>, <code>compareDocumentPosition</code>, <code>scrollIntoView</code>.",
"FragmentInstance ki seema samjho: event/observer/rect wale methods sirf <b>first-level host (DOM) children</b> ko target karte hain — kisi DOM element ke <i>andar</i> nested children ko nahi. Sirf <code>focus</code>/<code>focusLast</code> iske exception hain — wo saare nested children me depth-first search karte hain (isiliye <code>focus()</code> fieldset/label ke andar ghuse input ko bhi focus kar deta hai). <code>scrollIntoView</code> ko options object mat do — wo throw karta hai; sirf <code>alignToTop</code> boolean chalta hai (<code>true</code> = pehla child upar, <code>false</code> = aakhri child neeche). Text-only Fragment par <code>observeUsing</code> kaam nahi karta (dev warning milti hai).",
"State wali ek bareek baat: <code>&lt;&gt;&lt;Child /&gt;&lt;/&gt;</code> se <code>[&lt;Child /&gt;]</code> ya <code>&lt;Child /&gt;</code> par jaane-aane par React state reset <b>nahi</b> karta — lekin ye sirf ek level deep tak hai; <code>&lt;&gt;&lt;&gt;&lt;Child /&gt;&lt;/&gt;&lt;/&gt;</code> se <code>&lt;Child /&gt;</code> par jaane se state reset ho jati hai. Ek aur pattern: har first-level DOM child ko ek <code>reactFragments</code> property milti hai (use own karne wale saare <code>FragmentInstance</code>s ka Set) — isse kai groups ek hi global <code>IntersectionObserver</code> share kar sakte hain."],
c:"// Wrapper node ke bina grouping\nfunction Post() {\n  return (\n    <>\n      <PostTitle />\n      <PostBody />\n    </>\n  );\n}\n\n// Explicit Fragment — key ya ref ke liye zaroori\nimport { Fragment } from 'react';\nfunction Blog() {\n  return posts.map(post =>\n    <Fragment key={post.id}>\n      <PostTitle title={post.title} />\n      <PostBody body={post.body} />\n    </Fragment>\n  );\n}\n\n// Fragment ref — bina wrapper ke group se interact karo\nconst fragmentRef = useRef(null);\n// <Fragment ref={fragmentRef}>...</Fragment>\nfragmentRef.current.addEventListener('click', handleClick);\nfragmentRef.current.focus();\nfragmentRef.current.scrollIntoView();",
k:"Fragment = bina DOM node ke grouping. key/ref chahiye to shorthand chhodo, explicit &lt;Fragment&gt; import karo — ref par poora FragmentInstance milta hai."},
{n:54,g:6,t:"<Profiler>",u:"https://react.dev/reference/react/Profiler",
p:["<code>&lt;Profiler&gt;</code> ek React tree ki <b>rendering performance ko programmatically</b> napne deta hai — subtree ko lapeto aur har commit ka timing data <code>onRender</code> callback se lo. Props sirf do: <code>id</code> (string — tree ke kis hisse ko nap rahe ho, iski pehchan) aur <code>onRender</code> (function — profiled tree ke andar koi component update ho tab React ise call karta hai).",
"<code>onRender(id, phase, actualDuration, baseDuration, startTime, commitTime)</code> ke parameters: <code>phase</code> — <code>\"mount\"</code> (pehli baar laga), <code>\"update\"</code> (props/state/Hooks badalne se re-render), ya <code>\"nested-update\"</code>. <code>startTime</code> — React ne update render karna kab shuru kiya; <code>commitTime</code> — kab commit hua (ek commit ke saare profilers me same hota hai, isliye unhe group kar sakte ho).",
"<b>actualDuration vs baseDuration — yahi asal jaankari hai:</b> <code>actualDuration</code> (ms) is update me <code>&lt;Profiler&gt;</code> aur uske descendants ko render karne me laga asal samay — ye batata hai ki subtree memoization (<code>memo</code>, <code>useMemo</code>) kitni achhi tarah use kar raha hai; initial mount ke baad ye kaafi girna chahiye. <code>baseDuration</code> (ms) wo anumaan hai ki bina kisi optimization ke poora subtree re-render karne me kitna lagega — har component ke sabse recent render durations ka jod, ek worst-case estimate. Dono ka antar hi memoization ke fayde ka saboot hai.",
"Kai aur nested Profilers use kar sakte ho — alag hisson (<code>Sidebar</code>, <code>Content</code>, uske andar <code>Editor</code>) ko alag napne ke liye. Lekin <code>&lt;Profiler&gt;</code> halka hote hue bhi har istemal CPU aur memory overhead jodta hai — sirf jahan zaroorat ho wahan lagao.",
"<b>Production me default band:</b> profiling kuch overhead jodta hai, isliye aam production build me ye <b>disabled</b> hota hai — production me profiling chahiye to profiling-enabled special production build lagega. Interactive kaam ke liye React DevTools ka Profiler tab hai (browser extension); <code>&lt;Profiler&gt;</code> usi ka programmatic roop hai. Profiler me lapete components React Performance tracks ke Component tracks me bhi mark hote hain."],
c:"function onRender(id, phase, actualDuration, baseDuration, startTime, commitTime) {\n  console.log(`${id} (${phase}): actual ${actualDuration}ms, base ${baseDuration}ms`);\n}\n\n// Kai aur nested profilers\n// <App>\n//   <Profiler id=\"Sidebar\" onRender={onRender}>\n//     <Sidebar />\n//   </Profiler>\n//   <Profiler id=\"Content\" onRender={onRender}>\n//     <Content>\n//       <Profiler id=\"Editor\" onRender={onRender}>\n//         <Editor />\n//       </Profiler>\n//       <Preview />\n//     </Content>\n//   </Profiler>\n// </App>",
k:"actualDuration = asal cost, baseDuration = bina optimization ki worst-case cost — dono ka gap hi batata hai ki memoization kaam kar rahi hai ya nahi."},
{n:55,g:6,t:"<Suspense>",u:"https://react.dev/reference/react/Suspense",
p:["<code>&lt;Suspense&gt;</code> children ke load hone tak ek <b>fallback</b> dikhata hai — React ki declarative loading boundary, jo code-splitting, data fetching, streaming SSR aur selective hydration ko coordinate karti hai. Props: <code>children</code> (asal UI) aur <code>fallback</code> (loading ke dauraan dikhne wala alternate UI — koi bhi React node, aam taur par halka spinner ya skeleton). Ek experimental <code>defer</code> prop bhi hai (default <code>false</code>): <code>true</code> ho to kuch suspend na kare tab bhi React pehle fallback dikhakar children baad me render/stream kar sakta hai — mehenga render hone wale content ke liye.",
"<b>Kya cheez boundary ko activate karti hai:</b> (1) <code>lazy</code> se component code lazy-load hona; (2) <code>use</code> se Promise padhna — Server Components se stream hua data ya Suspense-enabled framework ka data samet; (3) <code>precedence</code> prop ke saath render hui stylesheet <code>&lt;link rel=\"stylesheet\"&gt;</code> — boundary stylesheet load hone tak (ek timeout tak) rukti hai; (4) streaming server rendering me bade boundary ki HTML ka aana; (5) fonts aur (6) images — lekin ye dono <b>sirf tab</b> jab reveal ko <code>&lt;ViewTransition&gt;</code> animate kare, aur zyada se zyada 500 ms tak (<code>loading=\"lazy\"</code> ya <code>onLoad</code> handler kisi image ko opt out kar deta hai). <b>Effect ya event handler me fetch kiya data Suspense ko activate nahi karta</b> — ye sabse aam galatfehmi hai.",
"<b>Reveal model:</b> ek boundary ke andar ka poora tree ek unit hai — ek bhi component suspend kare to sab fallback se badal jate hain, aur ready hone par sab <b>ek saath</b> dikhte hain. Progressive sequence ke liye boundaries nest karo: bahar <code>BigSpinner</code>, andar <code>AlbumsGlimmer</code> — pehle biography, phir albums. Boundary har component ke aas-paas mat lagao — utni hi granularity rakho jitna loading sequence user ko <i>experience</i> karna chahiye; designer se poochho loading states kahan belong karte hain. React suspended content ko har <b>300 ms me zyada se zyada ek baar</b> reveal karta hai — us window me ready hue boundaries ek saath dikhte hain.",
"<b>Pehle se dikh raha content chhupane se bachao:</b> boundary phir se suspend kare to fallback phir dikhta hai — <b>siwaye</b> jab update <code>startTransition</code> ya <code>useDeferredValue</code> se aaya ho; tab purana content visible rehta hai (navigation ke liye router <code>startTransition(() =&gt; setPage(url))</code> use karte hain, saath me <code>useTransition</code> ka <code>isPending</code> indicator ke liye). Lekin <i>alag</i> content par navigate karte waqt (doosre user ki profile) purana content nahi, fallback dikhna chahiye — iske liye <code>key</code> badlo: <code>&lt;ProfilePage key={queryParams.id} /&gt;</code> boundary ko reset kar deta hai.",
"Aur zaroori baatein: jo render pehli baar mount hone se pehle suspend ho jaye, uske liye React <b>koi state preserve nahi</b> karta — load hone par tree scratch se dobara render hota hai. Pehle se visible content ko dobara chhupana pade to React us tree ke layout Effects cleanup karta hai, aur content wapas aane par layout Effects phir fire hote hain (taaki chhupe hue content par layout na naapa jaye). Streaming SSR me server par component throw kare to React render abort nahi karta — sabse kareebi <code>&lt;Suspense&gt;</code> ka fallback server HTML me jata hai, client par retry hota hai. Isi ka istemal client-only opt-out ke liye hota hai: server environment me throw karo ya <code>use(browser())</code> lagao — server HTML me fallback, hydration ke baad asal component."],
c:"// Basic fallback\n// <Suspense fallback={<Loading />}>\n//   <Albums />\n// </Suspense>\n\n// Nested boundaries — progressive reveal\n// <Suspense fallback={<BigSpinner />}>\n//   <Biography />\n//   <Suspense fallback={<AlbumsGlimmer />}>\n//     <Panel>\n//       <Albums />\n//     </Panel>\n//   </Suspense>\n// </Suspense>\n\n// Deferred value ke saath stale content\nconst deferredQuery = useDeferredValue(query);\n// <Suspense fallback={<h2>Loading...</h2>}>\n//   <SearchResults query={deferredQuery} />\n// </Suspense>\n\n// Navigation par boundary reset\n// <Suspense key={user.id} fallback={<p>⌛ Loading profile...</p>}>\n//   <Bio bioPromise={user.bioPromise} />\n// </Suspense>",
k:"Suspense sirf lazy/use/stylesheets/streaming se activate hota hai — Effect wale fetch se nahi. Reveal atomic hota hai; purana content bachana ho to Transition, naya content dikhana ho to key badlo."},
{n:56,g:6,t:"<StrictMode>",u:"https://react.dev/reference/react/StrictMode",
p:["<code>&lt;StrictMode&gt;</code> components ke aam bugs ko <b>development ke dauraan hi</b> jaldi pakadne deta hai. Ye apne andar ke tree ke liye extra dev-only checks on karta hai — koi UI render nahi karta, koi prop nahi leta, aur production build par iska <b>koi asar nahi</b>. Poore app ke liye root component ko lapeto (<code>createRoot</code> wali jagah); framework <code>createRoot</code> call karta ho to uske docs me dekho. Kisi hisse par bhi laga sakte ho — checks andar ke saare components par, kitni bhi gehraai tak, chalte hain.",
"<b>Check 1 — components ek extra baar re-render hote hain</b> (impure rendering ke bugs ke liye). React maanta hai ki har component ek pure function hai: same inputs (props, state, context) → same JSX. Dev me wo functions jo pure hone chahiye <b>do baar</b> call hote hain: component function body (sirf top-level logic, event handlers nahi), <code>useState</code>/<code>useMemo</code>/<code>useReducer</code> ko diye gaye functions aur set functions, aur kuch class methods (<code>constructor</code>, <code>render</code>, <code>shouldComponentUpdate</code>). Classic example: <code>StoryTray</code> props array ko mutate karta hai — <code>const items = stories; items.push(...)</code> — har re-render par 'Create Story' phir jud jata hai. Fix: pehle copy banao — <code>stories.slice()</code>. Strict Mode me render hamesha do baar chalta hai, to bug turant dikhta hai. DevTools me doosre render ke <code>console.log</code> halke dimmed dikhte hain.",
"<b>Check 2 — Effects ek extra baar re-run hote hain</b> (missing cleanup ke bugs ke liye). Har Effect ke liye dev me ek extra setup → cleanup → setup cycle chalta hai. Bina cleanup wala chat-connection Effect connections badhata rehta hai; Strict Mode me active connections ki ginti turant 2 ho jati hai — ishara ki cleanup gayab hai. Fix wahi: <code>return () =&gt; connection.disconnect()</code>.",
"<b>Check 3 — ref callbacks ek extra baar re-run hote hain</b> (missing ref cleanup ke liye). Callback ref ke liye bhi ek extra setup+cleanup cycle. Example: <code>CatFriends</code> ka ref callback <code>itemsRef.current</code> me items push karta hai lekin cleanup kuch nahi karta — 'Cats'/'Dogs' switch karne par list badhti rehti hai aur 'Scroll to' buttons toot jate hain. Fix: cleanup me item hatao (<code>list.splice(list.indexOf(item), 1)</code>). Fix ke baad initial mount par setup (10) → cleanup (0) → setup (10) log hona <b>expected</b> hai — ginti kabhi expected se upar nahi jati, koi leak nahi.",
"<b>Check 4 — deprecated APIs ka istemal check hota hai:</b> tree ke andar koi component deprecated API (jaise <code>UNSAFE_</code> class lifecycles — <code>UNSAFE_componentWillMount</code> wagera) use kare to React warning deta hai; ye zyadaatar purane class components me milte hain. Ek baat aur: <code>&lt;StrictMode&gt;</code> ke andar se opt out karne ka <b>koi tareeka nahi</b> hai — team me asahmati ho to ya consensus banao ya boundary ko tree me neeche le jao. Aur jab Strict Mode root par nahi hota, to React sirf wahi behaviors on karta hai jo production me mumkin hain — jaise initial mount par Effects ka extra cycle nahi chalega (warna parent ke bina child effects double-fire hote, jo production me ho hi nahi sakta). Double-invocation ko bug samajh kar StrictMode hatana sabse badi galti hai — wo intentional stress test hai; fix code ko pure banana aur cleanup jodna hai."],
c:"import { StrictMode } from 'react';\nimport { createRoot } from 'react-dom/client';\n\nconst root = createRoot(document.getElementById('root'));\nroot.render(\n  <StrictMode>\n    <App />\n  </StrictMode>\n);\n\n// Impure render — StrictMode jis bug ko pakadta hai\nconst items = stories; // 🚩 props ko mutate kar raha hai\nitems.push({ id: 'create', label: 'Create Story' });\n// Fixed:\nconst itemsFixed = stories.slice(); // ✅ pehle clone, phir push\n\n// Missing Effect cleanup — sahi roop\nuseEffect(() => {\n  const connection = createConnection(serverUrl, roomId);\n  connection.connect();\n  return () => connection.disconnect(); // ✅ cleanup setup ka mirror hai\n}, [roomId]);",
k:"StrictMode ke chaar dev-only checks — double render, double Effects, double ref callbacks, deprecated API warnings — bugs chhupate nahi, turant dikhate hain. Ise hatana fix nahi hai."},
{n:57,g:6,t:"<Activity>",u:"https://react.dev/reference/react/Activity",
p:["<code>&lt;Activity&gt;</code> apne children ki UI aur internal state ko <b>chhupane aur restore</b> karne deta hai — 'background activity' render karne ka mechanism. Jo content jald phir visible hone wala hai, use unmount karne ke bajaye ye uski UI aur state surakshit rakhta hai, jabki chhupe hue content ke unwanted side effects band rehte hain. Sirf ek prop: <code>mode</code> — <code>'visible'</code> ya <code>'hidden'</code> (default <code>'visible'</code>).",
"<b>Hidden hone par kya hota hai:</b> React children ko <code>display: \"none\"</code> se visually chhupata hai aur unke <b>Effects destroy</b> kar deta hai (saari active subscriptions cleanup ho jati hain). Chhupe hue children naye props par lower priority par re-render hote rehte hain. Phir se visible hone par React children ko unki <b>purani state ke saath</b> reveal karta hai aur Effects dobara create karta hai. Soch me: 'hidden ≈ unmounted, lekin state saved'.",
"<b>Use case 1 — state restore:</b> conditional rendering (<code>{isShowingSidebar &amp;&amp; &lt;Sidebar /&gt;}</code>) component ko unmount karke uski internal state khatm kar deta hai — sidebar ka expanded section har baar collapsed milega. <code>&lt;Activity mode={isShowingSidebar ? \"visible\" : \"hidden\"}&gt;</code> me lapetne se state 'save' ho jati hai — sidebar ki implementation me koi badlav nahi. <b>Use case 2 — DOM state:</b> DOM bhi preserve hota hai, to Contact tab ke <code>&lt;textarea&gt;</code> ka draft tab switch karne par nahi udta — har tab ko apni Activity boundary me rakho.",
"<b>Use case 3 — pre-rendering:</b> initial render me hidden boundary apne children ko phir bhi render karti hai — visible content se lower priority par, aur bina Effects mount kiye — taaki code/data pehle se load ho aur reveal turant ho. Dhyaan do: pre-rendering ke dauraan sirf wahi data fetch hota hai jo Suspense boundary activate karta hai (jaise <code>use</code> se padha Promise); Effect me fetch kiya data detect nahi hota. <b>Use case 4 — Selective Hydration:</b> Activity boundaries tree ko independent units me baant-ti hain aur Suspense ki tarah Selective Hydration me hissa leti hain — lekin initial HTML <b>badle bina</b> (Suspense ka fallback dikhta, Activity ka nahi). Isliye jo page kabhi kuch chhupata hi nahi, wo bhi sirf hydration performance ke liye always-visible boundaries laga sakta hai.",
"<b>Sabse badi gotcha — DOM side effects jeete rehte hain:</b> chhupana unmount karna nahi hai; DOM destroy nahi hota. Ek <code>&lt;video&gt;</code> hidden hone ke baad bhi bajta rehta hai (audio samet), kyunki element abhi bhi DOM me hai — unmount karne par wo ruk jata. Fix: cleanup wala Effect jodo jo video ko pause kare — aur <code>useEffect</code> ki jagah <code>useLayoutEffect</code> prefer karo, kyunki cleanup ka UI ke visually chhupne se seedha sambandh hai (regular effect re-suspending Suspense boundary ya View Transition ki wajah se delay ho sakta hai). Fayda: timecode preserve rehta hai, wapas aane par video ko re-initialize/download nahi karna padta. Yahi <code>&lt;audio&gt;</code> aur <code>&lt;iframe&gt;</code> par bhi lagu hai. Jo components theek se cleanup karte hain, wo Activity ke liye pehle se robust hain — aur cleanup ki kamiyan eager roop se pakadne ke liye <code>&lt;StrictMode&gt;</code> hai. Ek aur edge: hidden Activity jo sirf text render karti hai, wo <b>kuch bhi</b> render nahi karti (chhupane ke liye koi DOM element hi nahi hai). <code>ViewTransition</code> ke andar visibility badalne par <code>enter</code>/<code>exit</code> animations trigger hote hain."],
c:"import { Activity, useState } from 'react';\n\n// Unmount karne ke bajaye state bachao\n// <Activity mode={isShowingSidebar ? 'visible' : 'hidden'}>\n//   <Sidebar />\n// </Activity>\n\n// Tabs ke beech DOM state (draft) preserve karo\n// <Activity mode={activeTab === 'home' ? 'visible' : 'hidden'}>\n//   <Home />\n// </Activity>\n// <Activity mode={activeTab === 'contact' ? 'visible' : 'hidden'}>\n//   <Contact />\n// </Activity>\n\n// Jo content jald dikhne wala hai, use pre-render karo\n// <Activity mode=\"hidden\">\n//   <SlowComponent />\n// </Activity>\n\n// Hamesha-visible boundary — sirf hydration performance ke liye\n// <Post />\n// <Activity>\n//   <Comments />\n// </Activity>",
k:"Activity = chhupao lekin state aur DOM bachao, Effects destroy karo. Video/audio jaise DOM side effects cleanup se roko — chhupana unmount nahi hota."},
{n:58,g:6,t:"<ViewTransition>",u:"https://react.dev/reference/react/ViewTransition",
p:["<code>&lt;ViewTransition&gt;</code> ek component tree ko Transitions aur Suspense ke saath <b>animate</b> karne deta hai — browser ki View Transitions API ke upar React ka built-in wrapper, taaki enter/exit/update/shared-element animations ko React khud coordinate kare. Props: optional <code>name</code>, View Transition Class props (<code>enter</code>, <code>exit</code>, <code>update</code>, <code>share</code>, <code>default</code>) aur View Transition Event props (<code>onEnter</code>, <code>onExit</code>, <code>onShare</code>, <code>onUpdate</code>).",
"<b>Sirf kuch updates hi ise activate karte hain:</b> default me <code>setState</code> updates turant hote hain aur <code>&lt;ViewTransition&gt;</code> activate <b>nahi</b> karte — sirf Transition, <code>&lt;Suspense&gt;</code> ya <code>useDeferredValue</code> me lapete updates karte hain. React khud peeche se <code>startViewTransition</code> call karta hai — <b>khud kabhi mat call karo</b>; page par doosra ViewTransition chal raha ho to React use interrupt kar deta hai. Ek ke chalte hue kai updates aayein to wo <b>ek me batch</b> ho jate hain: A→B chal raha hai, beech me C aur D updates — A→B khatm hote hi agli animation seedha B→D jati hai. Boundary asal me ek <b>image (snapshot)</b> banati hai jise move/scale/cross-fade kiya jata hai — layout animations ki tarah har andar ka element apni position animate nahi karta; behtar performance milti hai, lekin jo element khud hilna chahiye uske liye alag boundary lagani pad sakti hai. Abhi ye sirf DOM me kaam karta hai (React Native support pragati par hai).",
"<b>Chaar triggers</b> — React khud tay karta hai kaunsa lagega: <code>enter</code> (is Transition me boundary pehli baar insert hui), <code>exit</code> (pehli baar delete hui), <code>update</code> (boundary ke andar DOM mutations hue, ya immediate sibling ki wajah se boundary ka size/position badla; nested boundaries me mutation unpar lagta hai, parent par nahi), <code>share</code> (ek named boundary delete hue subtree me hai aur same naam wali doosri inserted subtree me — Shared Element Transition; <code>share</code> ko <code>enter</code>/<code>exit</code> par precedence milti hai). Default animation browser ka smooth cross-fade hai.",
"<b>Placement ka niyam:</b> enter/exit ke liye <code>&lt;ViewTransition&gt;</code> kisi bhi DOM node se <b>pehle</b> aana chahiye — upar ek <code>&lt;div&gt;</code> bhi ho to enter/exit animations toot jate hain. <code>name</code> sirf shared element transitions ke liye do; baaki sab ke liye React khud unique naam banata hai taaki unexpected animations na hon. Ek samay par pure app me ek hi naam mounted ho sakta hai — har list item ko <code>name=\"item\"</code> dena dev me error hai; naam unique rakho (jaise <code>name={`item-${id}`}</code>). List reorder ke liye <code>name</code> mat use karo — sahi <code>key</code>s ke saath <code>update</code> trigger hi kaam karega, aur boundary wrapper element ke andar ghusi ho to item alag se animate nahi hoga (parent cross-fade karega).",
"<b>Customization ke do layer:</b> (1) View Transition Classes — har trigger ke liye <code>\"auto\"</code> (default browser animation), <code>\"none\"</code> (band), ya ek custom CSS class naam; object value <code>{[type]: value}</code> Transition Type ke hisaab se class chunti hai aur <code>{default: value}</code> fallback hai. Dhyaan: <code>default=\"none\"</code> ho to baaki saare triggers band rehte hain jab tak explicitly na diye jayein. Classes ko <code>view-transition-name</code> selectors se nahi, pseudo-selectors se style karo: <code>::view-transition-group(.slide-in)</code>, <code>::view-transition-old(.slide-in)</code>, <code>::view-transition-new(.slide-in)</code>. (2) View Transition Events — Web Animations API se JS control: har event ko <code>instance</code> (pseudo-elements: <code>old</code>, <code>new</code>, <code>name</code>, <code>group</code>, <code>imagePair</code>) aur <code>types</code> (Transition Types ki array) milte hain, aur har event ko ek <b>cleanup function return karna chahiye</b> taaki interrupt hone par animation cancel ho sake. Per Transition per boundary sirf ek event fire hota hai.",
"<b>Suspense aur baaki baatein:</b> kisi bhi Transition ki tarah React animation se pehle data aur nayi CSS ka intezaar karta hai; <code>&lt;ViewTransition&gt;</code> naye fonts aur visible images ke liye bhi 500 ms tak rukta hai taaki wo animation shuru hone ke baad flicker na karein. Placement se farq padta hai: boundary <code>&lt;Suspense&gt;</code> ke <i>bahar</i> ho to fallback→content badlav ek 'update' (cross-fade) hai; fallback aur content <i>dono ke andar</i> alag boundaries hon to ek ka 'exit' aur doosre ka 'enter' banta hai. <code>addTransitionType</code> API se navigation direction ke hisaab se alag class de sakte ho (router <code>startTransition</code> ke andar <code>addTransitionType('navigation-' + type)</code> call karta hai). Do chetaavniyaan: <code>prefers-reduced-motion</code> hamesha check karo — React animations ko khud disable nahi karta; aur <code>popstate</code> (back button) se shuru hue transitions animations skip kar dete hain — fix ke liye router ko Navigation API par upgrade karo."],
c:"import { ViewTransition, useState, startTransition } from 'react';\n\n// Enter/exit — ViewTransition kisi bhi DOM node se pehle hona chahiye\nfunction Item() {\n  return (\n    <ViewTransition enter=\"auto\" exit=\"auto\" default=\"none\">\n      <Video video={videos[0]} />\n    </ViewTransition>\n  );\n}\n\n// Shared element — name sirf iske liye\n// <ViewTransition name={MY_NAME}>\n//   <Child />\n// </ViewTransition>\n\n// Type ke hisaab se alag animation\n// <ViewTransition\n//   default={{\n//     'navigation-back': 'slide-right',\n//     'navigation-forward': 'slide-left',\n//   }}>\n//   <div>...</div>\n// </ViewTransition>\n// Router me:\n// startTransition(() => {\n//   addTransitionType('navigation-' + navigationType);\n// });",
k:"ViewTransition React ke coordination me browser animations chalata hai — sirf Transition/Suspense/deferred updates par. name sirf shared elements ke liye, aur events me cleanup hamesha return karo."},
{n:59,g:7,t:"createContext",u:"https://react.dev/reference/react/createContext",
p:["<code>createContext</code> ek <b>context object</b> banata hai jise components upar se provide aur neeche se read kar sakte hain — prop drilling ke bina jaankari ko tree me gehraai tak bhejna. Signature: <code>const SomeContext = createContext(defaultValue)</code>.",
"<code>defaultValue</code> wo value hai jo tab milti hai jab padhne wale component ke upar koi matching provider na ho. Koi meaningful default na ho to <code>null</code> do. Ye default ek 'last resort' fallback hai — <b>static hai, kabhi nahi badalta</b>. Isi liye default badalne ki koshish karna (<code>createContext('light')</code> se kaam chalane ki soch) galat hai — context ko samay ke saath badalna ho to state jodo aur components ko provider me lapeto.",
"Return hua context object <b>khud koi jaankari nahi rakhta</b> — wo sirf represent karta hai ki <i>kaunsi</i> context doosre components read/provide karte hain; asal me ye ek identity hai. Iske teen roop: <code>SomeContext</code> khud — React 19+ me ise seedha provider ki tarah render karo (<code>&lt;SomeContext value={...}&gt;</code>); <code>SomeContext.Provider</code> — React 19 se pehle ka legacy tareeka; aur <code>SomeContext.Consumer</code> — render-prop function se value padhne ka purana, ab kam istemal hone wala tareeka (naye code me <code>useContext()</code> use karo).",
"<b>Pattern:</b> <code>createContext</code> ko kisi component ke <b>bahar</b> call karo — aam taur par ek alag file me, export karke taaki doosri files import kar saken. Component ke andar call karne par har render ek naya context banta hai. Dynamic value ke liye state ke saath provider do: <code>&lt;ThemeContext value={theme}&gt;</code>; neeche <code>useContext(SomeContext)</code> (ya <code>use(SomeContext)</code>) se padho. Provided value badalne par React us context ko padhne wale saare components re-render karta hai, aur reader ke upar sabse andar (sabse kareebi) wala provider jeet-ta hai."],
c:"import { createContext, useContext, useState } from 'react';\n\nconst ThemeContext = createContext('light');\nconst AuthContext = createContext(null);\n\nfunction Button() {\n  const theme = useContext(ThemeContext);\n  return <button className={theme} />;\n}\n\nfunction App() {\n  const [theme, setTheme] = useState('dark');\n  return (\n    <ThemeContext value={theme}>\n      <Page />\n    </ThemeContext>\n  );\n}\n\n// Contexts.js — shared file pattern\n// export const ThemeContext = createContext('light');\n// export const AuthContext = createContext(null);",
k:"Context object sirf ek identity hai — value provider deta hai, default sirf fallback hai. createContext hamesha component ke bahar, alag file me banao."},
{n:60,g:7,t:"lazy",u:"https://react.dev/reference/react/lazy",
p:["<code>lazy</code> ek component ke code ko tab tak load hone se <b>rokta</b> hai jab tak wo pehli baar render na ho — yahi React ki code splitting hai. Signature: <code>const SomeComponent = lazy(load)</code>.",
"<code>load</code> ek function hai jo ek Promise (ya koi thenable) return karta hai. React <code>load</code> ko tab tak call nahi karta jab tak returned component ka pehla render attempt na ho. Uske baad React resolution ka intezaar karta hai aur resolved value ke <code>.default</code> ko React component ki tarah render karta hai — isliye lazy module ko <b>default export</b> chahiye (valid component type: function, <code>memo</code>, ya <code>forwardRef</code> component). Promise aur resolved value dono <b>cached</b> hote hain, to React <code>load</code> ko kabhi ek se zyada baar call nahi karta — ek baar load hone ke baad component ko off/on toggle karne par koi loading state nahi dikhti. Promise reject ho to React rejection reason ko throw karta hai taaki sabse kareebi Error Boundary use handle kare.",
"Return hota hai ek React component jo tum tree me render kar sakte ho. Jab tak uska code load ho raha hai, use render karna <b>suspend</b> karta hai — isliye use <code>&lt;Suspense&gt;</code> me lapeto taaki loading indicator dikhe. Static import ko <code>lazy(() =&gt; import('./MarkdownPreview.js'))</code> se badalna hi poora pattern hai; dynamic <code>import()</code> ke liye bundler/framework ka support chahiye.",
"Sabse aam galti: <code>lazy</code> component ko doosre component ke <b>andar</b> declare karna — har render par wo dobara banta hai aur uski saari state reset ho jati hai. Hamesha module ke <b>top level</b> par declare karo. Doosri galtiyan: <code>&lt;Suspense&gt;</code> bhoolna (component bina fallback ke suspend hoga) aur lazy module me default ki jagah named export use karna."],
c:"import { lazy, Suspense } from 'react';\n\nconst MarkdownPreview = lazy(() => import('./MarkdownPreview.js'));\n\n// Render karte waqt:\n// <Suspense fallback={<Loading />}>\n//   <h2>Preview</h2>\n//   <MarkdownPreview />\n// </Suspense>",
k:"lazy + Suspense = code splitting. lazy hamesha module ke top level par, module me default export, aur render hamesha Suspense ke andar."},
{n:61,g:7,t:"memo",u:"https://react.dev/reference/react/memo",
p:["<code>memo</code> ek component ko is tarah lapet-ta hai ki props na badle hon to uska re-render <b>skip</b> ho jaye. Signature: <code>const MemoizedComponent = memo(SomeComponent, arePropsEqual?)</code>. <code>memo</code> original component ko modify nahi karta — ek naya memoized component return karta hai. Koi bhi valid React component chalega, functions aur <code>forwardRef</code> components samet. Ye <b>sirf performance optimization hai, guarantee nahi</b> — React phir bhi re-render kar sakta hai; code bina <code>memo</code> ke kaam nahi karta to pehle asal problem fix karo.",
"<b>Default comparison:</b> React har prop ko <code>Object.is</code> se compare karta hai (shallow comparison). Optional <code>arePropsEqual(oldProps, newProps)</code> custom comparison deta hai — <code>true</code> matlab props barabar (same output), <code>false</code> matlab alag. Aam taur par ise omit karte hain. Memoized component apni <b>khud ki state</b> badalne par, aur jis context ko wo use karta hai uske badalne par, phir bhi re-render hota hai — <code>memo</code> inhe nahi rok sakta. <code>memo</code> maanta hai ki rendering logic pure hai: same props/state/context → same output.",
"<b>Memoization kab bekaar hai:</b> hamesha-naye objects/arrays/functions props ke roop me dena — <code>Object.is({}, {})</code> <code>false</code> hai, to comparison fail aur re-render pakka; ek bhi 'hamesha naya' value poore component ki memoization tod deta hai. Isi liye <code>memo</code> ka saathi pattern hai: object props ko <code>useMemo</code> aur function props ko <code>useCallback</code> se stable rakho. Re-renders saste hon ya interactions coarse hon to har jagah <code>memo</code> lagana sirf readability ka nuksan hai.",
"Custom <code>arePropsEqual</code> ki gotchas: har prop (functions samet) compare na karo to component handlers ke andar stale props/state dekhta reh sakta hai; aur uske andar deep equality checks behad slow hokar app ko freeze kar sakte hain. Function-component duniya me <code>memo</code> wahi hai jo class duniya me <code>PureComponent</code> tha. Aur aage ki disha: <b>React Compiler</b> <code>memo</code> ke equivalent ko saare components par automatically apply karta hai — Compiler ke saath aam taur par manual <code>React.memo</code> ki zaroorat nahi rehti, aur uski optimization zyada comprehensive hai (wo intermediate values aur mehngi computations ko bhi memoize karta hai — <code>memo</code> + <code>useMemo</code> mila kar). Memoization ko bekaar banane wale usool wahi hain: children ko JSX ke roop me lo, state local rakho, render pure rakho, Effects kam karo."],
c:"import { memo } from 'react';\n\nconst Greeting = memo(function Greeting({ name }) {\n  return <h1>Hello, {name}!</h1>;\n});\nexport default Greeting;\n\n// useMemo/useCallback se prop changes kam karo\nfunction Page() {\n  const [name, setName] = useState('Taylor');\n  const [age, setAge] = useState(42);\n  const person = useMemo(() => ({ name, age }), [name, age]);\n  return <Profile person={person} />;\n}\nconst Profile = memo(function Profile({ person }) { /* ... */ });",
k:"memo props ki shallow (Object.is) comparison par re-render skip karta hai — lekin state/context changes ko nahi rokta, aur hamesha-naya prop is optimization ko tod deta hai."},
{n:62,g:7,t:"startTransition",u:"https://react.dev/reference/react/startTransition",
p:["<code>startTransition</code> (standalone function) ek state update ko <b>Transition</b> mark karta hai, taaki React UI ke ek hisse ko background me render kare aur slow devices par bhi UI responsive rahe. Signature: <code>startTransition(action)</code> — kuch return nahi karta. Ye react.dev page chhota hai aur detailed examples ke liye <code>useTransition</code> page ki taraf bhejta hai.",
"<code>action</code> turant call hota hai, aur uske execute hote waqt jo state updates hote hain wo sab Transitions mark ho jate hain. Transition updates <b>non-urgent</b> hain — doosre (urgent) updates inhe interrupt kar sakte hain: chart ko Transition me update karte hue beech me input me type karna shuru karo to React input update ko pehle sambhal kar chart rendering dobara shuru karta hai. User tab click karke, pehla re-render khatm hue bina, mann badal kar doosra tab click kar sakta hai.",
"<b>useTransition se farq:</b> standalone <code>startTransition</code> koi <code>isPending</code> flag nahi deta — Transition pending hai ya nahi, track karne ka koi tareeka nahi. Pending indicator chahiye to <code>useTransition</code> use karo. Ulta fayda: ye kisi component se juda nahi hai, to component ke bahar — jaise kisi data library se — bhi Transition shuru kar sakte ho. Isi wajah se agar isme diya function throw kare ya rejected Promise return kare to koi Error Boundary use nahi pakadti — React error ko <code>reportError</code> se report karta hai.",
"Seemayein wahi jo <code>useTransition</code> section me detail se hain: sirf tab kaam karta hai jab state ke <code>set</code> function tak tumhari pahunch ho — prop ya custom Hook value se chalne wale transitions ke liye <code>useDeferredValue</code> use karo. <code>setTimeout</code> (ya doosre async callbacks) ke andar ke updates Transitions <b>nahi</b> bante — sirf function ke execute hote waqt synchronously hue updates bante hain. Async requests ke baad ke updates ko ek aur <code>startTransition</code> me lapetna padta hai (gyaat limitation, bhavishya me fix hogi). Transition updates se text inputs control nahi ho sakte, aur kai ongoing Transitions abhi ek saath batch ho jate hain."],
c:"import { startTransition } from 'react';\n\nstartTransition(() => {\n  setTab('posts');\n});",
k:"Standalone startTransition = component ke bahar se Transition, lekin bina isPending ke. Pending indicator chahiye to useTransition, setter na ho to useDeferredValue."},
{n:63,g:7,t:"addTransitionType",u:"https://react.dev/reference/react/addTransitionType",
p:["<code>addTransitionType</code> ek Transition ka <b>kaaran (cause)</b> specify karta hai, taaki alag kaaran alag animations chala saken (View Transitions ke zariye). Signature: <code>startTransition(() =&gt; { addTransitionType('my-transition-type'); setState(newState); })</code> — <code>type</code> koi bhi string ho sakti hai; kuch return nahi hota. Ye React 19 ke daur ka naya API hai.",
"Ise <code>startTransition</code> ke <b>andar</b> call karo — React us type ko us Transition ke kaarano me se ek ke roop me jod deta hai. Bahar call karne ka koi matlab nahi, kyunki iska arth sirf ek transition ke scope me hai. Ek Transition me ek se zyada types jod sakte ho, aur kai transitions combine hon to saare Transition Types ikatthe ho jate hain.",
"<b>Types ko consume karne ke teen tareeke</b> (filhaal teeno animations ke aas-paas hain; docs kehte hain bhavishya me aur use cases aayenge): (1) browser view transition types — CSS <code>:active-view-transition-type(...)</code>; (2) <code>ViewTransition</code> class props — <code>enter</code>/<code>exit</code>/<code>update</code>/<code>share</code> objects type ke hisaab se class chunte hain, jaise <code>enter={{ 'navigation-back': 'enter-right', 'navigation-forward': 'enter-left' }}</code>; (3) <code>ViewTransition</code> events — <code>onUpdate={(inst, types) =&gt; ...}</code> me <code>types.includes('navigation-back')</code> check karke JS se animation chalao.",
"Class-props form ke niyam: kai types match hon to wo join ho jate hain; koi type match na kare to special <code>\"default\"</code> entry use hoti hai; aur kisi type ki value <code>\"none\"</code> ho to wahi jeet-ti hai aur ViewTransition disable ho jata hai (use naam assign nahi hota). Ek aur bareek baat: Transition Types har commit ke baad <b>reset</b> ho jate hain — ek <code>&lt;Suspense&gt;</code> fallback <code>startTransition</code> ke baad ke types ko associate karta hai, lekin content reveal hona unhe aage nahi le jata."],
c:"import { startTransition, addTransitionType } from 'react';\n\nfunction Submit({ action }) {\n  function handleClick() {\n    startTransition(() => {\n      addTransitionType('submit-click');\n      action();\n    });\n  }\n  return <button onClick={handleClick}>Click me</button>;\n}\n\n// ViewTransition class props — type ke hisaab se animation\n// <ViewTransition enter={{\n//   'navigation-back': 'enter-right',\n//   'navigation-forward': 'enter-left',\n// }}\n// exit={{\n//   'navigation-back': 'exit-right',\n//   'navigation-forward': 'exit-left',\n// }}>\n\n// ViewTransition events me types padhna\n// <ViewTransition onUpdate={(inst, types) => {\n//   if (types.includes('navigation-back')) { /* ... */ }\n// }}>",
k:"addTransitionType Transition ke 'kyun' ko naam deta hai — phir CSS, ViewTransition classes ya events us kaaran ke hisaab se alag animation chala sakte hain."},
{n:64,g:7,t:"act",u:"https://react.dev/reference/react/act",
p:["<code>act</code> ek <b>test helper</b> hai jo assertions karne se pehle pending React updates ko apply kar deta hai, taaki tests browser me React ke asal behavior ke zyada kareeb chalein. Naam Arrange-Act-Assert pattern se aaya hai. Signature: <code>await act(async actFn)</code> — kuch return nahi karta.",
"<code>actFn</code> ke andar trigger hue saare updates ek internal act queue me jod diye jate hain, phir ek saath flush hokar process hote hain aur DOM par apply hote hain. Async hone ki wajah se React async boundary cross karne wala code bhi chalata hai aur us dauraan schedule hue updates bhi flush kar deta hai. Rendering aur event dispatch — dono ko <code>await act(...)</code> me lapeto, taaki assertions se pehle saare updates (Effects samet) lag chuke hon.",
"<b>Hamesha async/await wala roop use karo:</b> docs yahi recommend karte hain. Sync version kai cases me kaam karta hai lekin sab me nahi, aur kab chalega ye predict karna mushkil hai — docs kehte hain sync version ko bhavishya me deprecate karke hata diya jayega.",
"Aam galtiyan: render/events ko <code>act</code> me lapete bina assert karna (updates flush hi nahi hue hote); aise container par DOM events dispatch karna jo document se attached hi nahi hai (dispatch tabhi kaam karta hai jab container document me ho); aur error 'The current testing environment is not configured to support act(…)' — fix: global test setup file me <code>global.IS_REACT_ACT_ENVIRONMENT = true</code> set karo. <code>act()</code> verbose lage to React Testing Library use karo — uske helpers pehle se <code>act()</code> me lapete hote hain."],
c:"import { act } from 'react';\nimport ReactDOMClient from 'react-dom/client';\nimport Counter from './Counter';\n\n// Rendering\nawait act(() => {\n  ReactDOMClient.createRoot(container).render(<Counter />);\n});\nexpect(label.textContent).toBe('You clicked 0 times');\nexpect(document.title).toBe('You clicked 0 times');\n\n// Events dispatch karna\nawait act(async () => {\n  button.dispatchEvent(new MouseEvent('click', { bubbles: true }));\n});\nexpect(label.textContent).toBe('You clicked 1 times');",
k:"act tests me pending updates ko flush karke browser-jaisa behavior deta hai — hamesha await act(async () => {...}) wala roop, aur setup me IS_REACT_ACT_ENVIRONMENT = true."},
{n:65,g:7,t:"cache",u:"https://react.dev/reference/react/cache",
p:["<code>cache</code> ek data fetch ya computation ke result ko <b>memoize</b> karta hai taaki ek server render ke dauraan kai components me wahi kaam dobara na ho. Signature: <code>const cachedFn = cache(fn)</code> — <code>fn</code> koi bhi arguments le sakta hai aur koi bhi value return kar sakta hai. <code>cache</code> khud <code>fn</code> ko call nahi karta; ek cached version return karta hai jiska type signature wahi hai. Call karne par pehle cache check hota hai: hit par cached result, miss par <code>fn</code> call hokar result store aur return. <code>fn</code> sirf cache miss par call hota hai. Ye <b>sirf Server Components</b> ke liye hai — Client Components me use nahi hota.",
"<b>Kaise kaam karta hai:</b> <code>cache</code> ko components ke <b>bahar</b> call karo — aadarsh roop se ek dedicated module me ek baar, aur us memoized function ko har jagah import karo. Ek server render ke dauraan, same arguments ke saath same memoized function call karne wale kai components ek hi computation/fetch share karte hain — sabko data ka <b>same snapshot</b> dikhta hai. Arguments cache keys ka kaam karte hain (shallow equality / <code>Object.is</code> se compare). Cache har <b>server request</b> par saare memoized functions ke liye invalidate ho jata hai. Async functions ke liye Promise khud cache hota hai — memoized function ko pehle (bina await kiye) call karne se kaam <b>preload</b> ho jata hai.",
"Galtiyan: <code>cache</code> ko component ke andar call karna (har render naya memoized function aur naya cache); alag-alag files me alag se <code>cache</code> call karna (har call ka apna cache — components duplicate kaam karenge; fix wahi dedicated module wala hai); memoized function ko component ke bahar call karna (function evaluate hoga lekin cache na padha jayega na update — cache access ek context se milta hai jo sirf component ke andar uplabdh hai); aur non-primitive arguments jo har render naye references hon (jaise <code>props</code> khud ya fresh <code>{x, y, z}</code> object) — <code>Object.is</code> lookup miss karega. Fix: primitives pass karo (<code>calculateNorm(props.x, props.y, props.z)</code>) ya dono components ko same object reference do. Ek aur baat: <b>errors bhi cache hote hain</b> — diye gaye arguments par <code>fn</code> throw kare to wo error cache hokar unhi arguments ki baad wali calls par phir throw hota hai.",
"<b>cache vs useMemo vs memo</b> (interview ka pakka sawal): <code>useMemo</code> ek Client Component ke andar ek computation ko renders ke beech cache karta hai (sirf last value); <code>cache</code> Server Components me kai components ke beech memoized kaam/fetches share karta hai aur har server request par invalidate hota hai; <code>memo</code> props na badle hon to component ka re-render skip karta hai. Data fetches ke liye recommended <code>cache</code> hai; <code>useMemo</code> sirf computations ke liye. In-flight kaam cancel karne ke liye <code>cacheSignal()</code> saathi API hai."],
c:"import { cache } from 'react';\nimport calculateUserMetrics from 'lib/user';\n\nconst getUserMetrics = cache(calculateUserMetrics);\n\nfunction Profile({ user }) {\n  const metrics = getUserMetrics(user);\n  // ...\n}\n\n// Data snapshot share karna\nconst getTemperature = cache(async (city) => {\n  return await fetchTemperature(city);\n});\n\nasync function AnimatedWeatherCard({ city }) {\n  const temperature = await getTemperature(city);\n  // ...\n}\n\n// Preloading — result abhi use nahi, kaam pehle shuru\nconst getUser = cache(async (id) => {\n  return await db.user.query(id);\n});\nfunction Page({ id }) {\n  getUser(id); // fetch jaldi shuru karo\n  return <><Profile id={id} /></>;\n}",
k:"cache server render ke andar fetches/computations ko components ke beech dedupe karta hai — ek dedicated module me ek baar banao, primitives ko keys banao, errors bhi cache hote hain."},
{n:66,g:7,t:"cacheSignal",u:"https://react.dev/reference/react/cacheSignal",
p:["<code>cacheSignal</code> ek <code>AbortSignal</code> return karta hai jo tab abort hota hai jab React rendering <b>khatm</b> kar chuka ho — taaki jo in-flight kaam ab zaroori nahi, use cancel kar sako. Ye tumhe batata hai ki <code>cache()</code> ki lifetime kab khatm hui. Signature: <code>const signal = cacheSignal()</code> — koi parameter nahi.",
"Return value: rendering ke dauraan call karne par ek <code>AbortSignal</code>; warna <code>null</code>. Signal ko Server Component render ke dauraan <code>fetch</code> (ya kisi abortable kaam) ko pass karo. Rendering 'finished' maani jati hai jab: React ne rendering safalta se complete kar li ho, render abort ho gaya ho, ya render fail ho gaya ho — teeno haalaat me signal abort hota hai. Khaas taur par <code>cache()</code> kiye gaye fetches (<code>cache(fetch)</code>) ke saath upyogi hai, taaki render khatm hote hi duplicate in-flight requests cancel ho jayein. Ye filhaal <b>React Server Components ke liye hi</b> hai.",
"Galtiyan: <code>cacheSignal()</code> ko rendering ke <b>bahar</b> (jaise module top level par) call karke wo signal wahan shuru hue fetch ko dena — render khatm hone par request asal me abort <b>nahi</b> hogi, kyunki signal render ke bahar mila tha; ise render ke andar hi call karo. Doosri: cancellation errors ko asli errors samajh kar log karna — pehle <code>signal.aborted</code> check karo (throw cancellation ki wajah se bhi ho sakta hai, jaise DB connection band hona). Aur Client Components me ye filhaal <code>null</code> return karta hai, lekin is par bharosa mat karo ki hamesha aisa rahega — docs kehte hain bhavishya me ye Client Components me bhi use hoga, jab client cache refresh ya invalidate hoga."],
c:"import { cacheSignal } from 'react';\n\nasync function Component() {\n  await fetch(url, { signal: cacheSignal() });\n}\n\n// Deduped fetch ke saath\nimport { cache, cacheSignal } from 'react';\n\nconst dedupedFetch = cache(fetch);\n\nasync function Component2() {\n  await dedupedFetch(url, { signal: cacheSignal() });\n}\n\n// Cancellation errors ko ignore karna\nasync function getData(id) {\n  try {\n    return await queryDatabase(id);\n  } catch (x) {\n    if (!cacheSignal()?.aborted) {\n      // Sirf tab log karo jab asli error ho, cancellation nahi\n      logError(x);\n    }\n    return null;\n  }\n}",
k:"cacheSignal render khatm hote hi abort hota hai — cache() wale fetches ko yahi signal do, aur error log karne se pehle .aborted check karo."},
{n:67,g:7,t:"captureOwnerStack",u:"https://react.dev/reference/react/captureOwnerStack",
p:["<code>captureOwnerStack</code> development me current <b>Owner Stack</b> ko padhkar string ke roop me return karta hai (ya <code>null</code>) — mukhya roop se custom error overlays aur error reporting ko behtar banane ke liye. Signature: <code>const stack = captureOwnerStack()</code> — koi parameter nahi. Ye ek <b>development-only</b> API hai.",
"<b>Owner Stack vs Component Stack:</b> Owner Stack sirf un components ko list karta hai jinhone element ko <i>create</i> kiya tha — unhe nahi jinhone use sirf <code>children</code> ke roop me forward kiya, aur DOM components ko bhi nahi. Docs ka example: <code>SubComponent</code> me throw hue error ke liye Component Stack hai <code>at SubComponent / at fieldset / at Component / at main / at React.Suspense / at App</code>, lekin Owner Stack sirf <code>at Component</code> hai — <code>App</code> aur DOM components ne node ko sirf forward kiya tha, aur <code>SubComponent</code> isliye gayab hai kyunki wo pehle se callstack ka hissa hai. Siblings (jaise <code>Navigation</code>, <code>legend</code>) dono me nahi aate.",
"Owner Stacks in jagahon par uplabdh hain: component render, Effects (jaise <code>useEffect</code>), React event handlers (jaise <code>&lt;button onClick={...} /&gt;</code>), aur React error handlers (root options <code>onCaughtError</code>, <code>onRecoverableError</code>, <code>onUncaughtError</code>). Koi Owner Stack uplabdh na ho to <code>null</code> milta hai.",
"Galtiyan: ise React ke control wale function ke <b>bahar</b> call karna — <code>setTimeout</code> callback me, <code>fetch</code> ke baad, ya custom DOM event handler me — <code>null</code> milega; stack ko pehle pakdo (jaise Effect body ke andar, wahan register hue listener ke andar nahi). Aur named import wali gotcha: dev aur production dono ke liye bundle hone wali files me named import mat use karo — <code>captureOwnerStack</code> sirf development builds me export hota hai aur production me <code>undefined</code> hai. Namespace import lo aur conditionally access karo: <code>React.captureOwnerStack()</code> ko <code>process.env.NODE_ENV !== 'production'</code> se guard karke. Development ke bahar ye hamesha <code>null</code> return karta hai."],
c:"import * as React from 'react';\n\nfunction Component() {\n  if (process.env.NODE_ENV !== 'production') {\n    const ownerStack = React.captureOwnerStack();\n    console.log(ownerStack);\n  }\n}\n\n// console.error ko patch karke custom error overlay behtar banao\nimport { captureOwnerStack } from 'react';\nimport { onConsoleError } from './errorOverlay';\n\nconst originalConsoleError = console.error;\nconsole.error = function patchedConsoleError(...args) {\n  originalConsoleError.apply(console, args);\n  const ownerStack = captureOwnerStack();\n  onConsoleError({\n    consoleMessage: args[0],\n    ownerStack,\n  });\n};",
k:"Owner Stack = sirf creator components, forwarder nahi. Dev-only API hai — namespace import + NODE_ENV guard ke saath hi use karo."},
{n:68,g:7,t:"use",u:"https://react.dev/reference/react/use",
p:["<code>use</code> ek React API hai (naam ke bawajood <b>Hook nahi</b>) jo rendering ke dauraan ek resource padhne deta hai — ek Promise, ek context, ya <code>browser()</code> ki value. Signature: <code>const value = use(resource)</code>. Teen roop: <code>use(context)</code>, <code>use(promise)</code>, <code>use(browser())</code>.",
