de>; sirf dialog ke liye <code>onCancel</code>, <code>onClose</code> (browser ke ulta React me bubble karte hain); sirf details ke liye <code>onToggle</code> (React me bubble karta hai); media/resource (<code>&lt;img&gt;</code>, <code>&lt;iframe&gt;</code>, <code>&lt;object&gt;</code>, <code>&lt;embed&gt;</code>, <code>&lt;link&gt;</code>, SVG <code>&lt;image&gt;</code>) ke liye <code>onLoad</code>, <code>onError</code> (React me bubble karte hain); aur audio/video ki lambi list (<code>onAbort</code>, <code>onCanPlay</code>, <code>onCanPlayThrough</code>, <code>onDurationChange</code>, <code>onEmptied</code>, <code>onEncrypted</code>, <code>onEnded</code>, <code>onError</code>, <code>onLoadedData</code>, <code>onLoadedMetadata</code>, <code>onLoadStart</code>, <code>onPause</code>, <code>onPlay</code>, <code>onPlaying</code>, <code>onProgress</code>, <code>onRateChange</code>, <code>onResize</code>, <code>onSeeked</code>, <code>onSeeking</code>, <code>onStalled</code>, <code>onSuspend</code>, <code>onTimeUpdate</code>, <code>onVolumeChange</code>, <code>onWaiting</code>).",
"<b>React event object (synthetic event):</b> DOM <code>Event</code> standard ke anuroop hai lekin browser ki inconsistencies ko theek karta hai. Aam (standard) properties: <code>bubbles</code>, <code>cancelable</code>, <code>currentTarget</code>, <code>defaultPrevented</code>, <code>eventPhase</code>, <code>isTrusted</code>, <code>target</code>, <code>timeStamp</code>; saath me <code>nativeEvent</code> (asal browser event) bhi milta hai. Methods (tareeqe): <code>preventDefault()</code>, <code>stopPropagation()</code>, <code>isDefaultPrevented()</code>, <code>isPropagationStopped()</code>, <code>persist()</code>/<code>isPersistent()</code> (React DOM ke saath use nahi hote — sirf React Native). Dhyaan do: <code>e.currentTarget</code> <code>e.nativeEvent.currentTarget</code> se alag ho sakta hai kyunki React handlers ko root par attach karta hai; polyfilled events ke liye <code>e.type</code> <code>e.nativeEvent.type</code> se alag ho sakta hai (jaise <code>onMouseLeave</code> native <code>mouseout</code> se map hota hai). Har event type extra properties jodta hai — <code>AnimationEvent</code>: <code>animationName</code>, <code>elapsedTime</code>, <code>pseudoElement</code>; <code>ClipboardEvent</code>: <code>clipboardData</code>; <code>CompositionEvent</code>: <code>data</code>; <code>DragEvent</code>: <code>dataTransfer</code> + saare <code>MouseEvent</code> props; <code>FocusEvent</code>: <code>relatedTarget</code>; <code>InputEvent</code>: <code>data</code>; <code>KeyboardEvent</code>: <code>altKey</code>, <code>charCode</code>, <code>code</code>, <code>ctrlKey</code>, <code>getModifierState(key)</code>, <code>key</code>, <code>keyCode</code>, <code>locale</code>, <code>metaKey</code>, <code>location</code>, <code>repeat</code>, <code>shiftKey</code>, <code>which</code>; <code>MouseEvent</code>: <code>altKey</code>, <code>button</code>, <code>buttons</code>, <code>ctrlKey</code>, <code>clientX</code>, <code>clientY</code>, <code>getModifierState(key)</code>, <code>metaKey</code>, <code>movementX</code>, <code>movementY</code>, <code>pageX</code>, <code>pageY</code>, <code>relatedTarget</code>, <code>screenX</code>, <code>screenY</code>, <code>shiftKey</code>; <code>PointerEvent</code>: <code>height</code>, <code>isPrimary</code>, <code>pointerId</code>, <code>pointerType</code>, <code>pressure</code>, <code>tangentialPressure</code>, <code>tiltX</code>, <code>tiltY</code>, <code>twist</code>, <code>width</code> + <code>MouseEvent</code> props; <code>TouchEvent</code>: <code>altKey</code>, <code>ctrlKey</code>, <code>changedTouches</code>, <code>getModifierState(key)</code>, <code>metaKey</code>, <code>shiftKey</code>, <code>touches</code>, <code>targetTouches</code>; <code>TransitionEvent</code>: <code>elapsedTime</code>, <code>propertyName</code>, <code>pseudoElement</code>; <code>UIEvent</code>: <code>detail</code>, <code>view</code>; <code>WheelEvent</code>: <code>deltaMode</code>, <code>deltaX</code>, <code>deltaY</code>, <code>deltaZ</code> + <code>MouseEvent</code> props.",
"<b>Refs yahan bhi:</b> ek ref object ya callback pass karo. React 19 me ref callbacks ek <b>cleanup function</b> return kar sakte hain, jo node hatne par call hoti hai. Har render par ek <i>alag</i> callback function dena (jaise inline arrow function) React ko har render par pichle callback ka cleanup call karne (ya use <code>null</code> ke saath call karne) aur dobara attach karne par majboor karta hai. Strict Mode me React ek extra dev-only setup+cleanup cycle chalata hai. <b>dangerouslySetInnerHTML ki savdhani:</b> <code>{__html}</code> object ko wahan ke sabse kareeb banao jahan HTML generate hoti hai; use kabhi inline mat banao. Trusted Types ke saath ek <code>TrustedHTML</code> value pass karo. Ek ched ki misaal: DB me stored <code>&lt;img src=\"\" onerror='\u0061lert(\"you were hacked\")'&gt;</code> ko raw render karna."],
c:"// <img className=\"avatar\" style={{ width: user.imageSize, height: user.imageSize }} />\n\nimport { useRef } from 'react';\nconst inputRef = useRef(null);\n// <input ref={inputRef} /> — render ke baad inputRef.current DOM node hai\n\n// React 19: ref callback cleanup return kar sakta hai\n// <div ref={(node) => {\n//   console.log('Attached', node);\n//   return () => console.log('Clean up', node);\n// }} />\n\nconst markup = { __html: '<p>some raw html</p>' };\n// <div dangerouslySetInnerHTML={markup} />\n\n// <button onClick={e => console.log(e)} /> — React event object",
k:"class ki jagah className, for ki jagah htmlFor — aur yaad rakho: React me onBlur/onFocus/onLoad bubble karte hain, browser me nahi. Synthetic event ka asal roop e.nativeEvent me milta hai."},
{n:91,g:12,t:"<form>",u:"https://react.dev/reference/react-dom/components/form",
p:["Built-in browser <code>&lt;form&gt;</code> component jaankari submit karne ke liye hai. React 19 me iske do submission models hain: classic <code>onSubmit</code> event handler, aur pasandeeda <code>action</code> prop (ek function, ya plain HTML form ke liye ek URL string) — jo submission ko ek Transition me chalata hai aur <code>useFormStatus</code>, <code>useActionState</code>, <code>useOptimistic</code>, Error Boundaries aur Server Functions ke saath integrate hota hai. Saare common element props ke alawa: <code>action</code>, <code>method</code> (string; jab <code>action</code> ek URL ho to HTTP method; default <code>get</code>), <code>onSubmit</code>. Ek <code>&lt;button&gt;</code>, <code>&lt;input type=\"submit\"&gt;</code> ya <code>&lt;input type=\"image\"&gt;</code> par <code>formAction</code> prop form ke <code>action</code> ko override karta hai.",
"<b>onSubmit handler:</b> default roop se browser form data ko current URL par bhejta hai aur page refresh karta hai; <code>e.preventDefault()</code> ise override karta hai. Data <code>new FormData(e.target)</code> se padho. Agar tum <code>action</code> ko ek function bhi pass karo, to React use <code>onSubmit</code> ke baad chalata hai jab tak <code>onSubmit</code> <code>e.preventDefault()</code> na call kare. Ye har React version me kaam karta hai; React 19 se <code>action</code> pasandeeda hai. <code>e.preventDefault()</code> bhoolna sabse aam galti hai — page reload ho jayega.",
"<b>action function:</b> React (1) use ek Transition me chalata hai, (2) pending state ko children ke liye <code>useFormStatus</code> se uplabdh karata hai, (3) errors ko sabse kareebi Error Boundary tak pahuncha deta hai, (4) success par uncontrolled fields ko reset karta hai. Function ko ek hi argument milta hai — form ka <code>FormData</code>. Inputs uncontrolled ho sakte hain — <code>value</code>/<code>onChange</code> jode nahi chahiye. Form state ke liye <code>useActionState</code> aur optimistic UI ke liye <code>useOptimistic</code> use karo. Manual submission bhi <code>requestFormReset</code> se wahi reset maang sakta hai. Ek gotcha: jab <code>action</code> ek function ho to method hamesha <code>POST</code> hota hai — <code>method=\"get\"</code> apply nahi hota.",
"<b>Server Function as action:</b> <code>'use server'</code> se mark hua function; users JS load hone se pehle ya JS disabled hone par bhi submit kar sakte hain (progressive enhancement). React form ka <code>FormData</code> pass karta hai (har wo input jiska <code>name</code> hai). Extra data teen tareekon se ja sakta hai: <b>hidden fields</b> (<code>&lt;input type=\"hidden\" name=\"productId\"&gt;</code> — value HTML me dikhti hai, hamesha string hoti hai, JS se pehle kaam karti hai), <b>bind</b> (<code>addToCart.bind(null, productId)</code> — argument apna type rakhta hai, serializable hona chahiye, JS se pehle kaam karta hai; <code>useActionState</code> ke saath Server Function ko <code>productId, previousState, formData</code> milte hain), ya <b>component ke andar ek function</b> (props/state seedha padhta hai, sirf JS load hone ke baad chalta hai, phir Server Function ko call karta hai). Hamesha server par validate karo ki logged-in user wo Action kar sakta hai — hidden/bound values client se bheji jati hain.",
"<b>Values preserve karna aur errors:</b> success par React uncontrolled fields reset karta hai — isiliye submit ke baad fields khaali dikhte hain (ye design hai, bug nahi). Values rakhni hon to unhe state me store karke har field ke <code>defaultValue</code> ko do; React reset karne se pehle updated defaults apply karta hai. <code>await</code> ke baad wala <code>setTitle</code> ek aur <code>startTransition</code> mangta hai. <code>useActionState</code> ke saath Server Function naya state (jaise <code>{ title }</code>) return karti hai aur <code>defaultValue={state.title}</code> use preserve karta hai — ye JS load hone se pehle bhi kaam karta hai. Reset control ke aur tareeke: values sirf validation failure par rakho (wahi state shape return karo; failure par submitted <code>FormData</code> state me rakho, success par <code>null</code>); reset ko skip karo <code>onSubmit</code> + <code>preventDefault</code> + <code>startTransition</code> se; kisi nishchit pal par reset karo form element ke <code>reset()</code> ya <code>requestFormReset</code> se; form + state ek saath reset karo component ki <code>key</code> badal kar. Errors ke liye form ko Error Boundary me lapeto — Action throw kare to uska fallback dikhta hai. JS load hone se <i>pehle</i> ke errors (progressive enhancement) ke liye form ek Client Component hona chahiye, <code>action</code> ek Server Function hona chahiye, aur <code>useActionState</code> sandesh dikhaye; Server Function ko <code>(previousState, formData)</code> milta hai aur wo error string return karti hai, jise React server-rendered response me shamil karta hai. <b>Kai submission types:</b> bina <code>formAction</code> wala button form ka <code>action</code> chalata hai; <code>formAction</code> wala button apna Action chalata hai (jaise Publish banam Save draft, <code>useActionState</code> se <code>{ type, data }</code> dispatch karke)."],
c:"// onSubmit handler\nexport default function Search() {\n  function handleSubmit(e) {\n    e.preventDefault();\n    const formData = new FormData(e.target);\n    \u0061lert(`You searched for '${formData.get('query')}'`);\n  }\n  return (\n    <form onSubmit={handleSubmit}>\n      <input name=\"query\" />\n      <button type=\"submit\">Search</button>\n    </form>\n  );\n}\n\n// action prop (React 19 me pasandeeda)\n// <form action={search}>\n//   <input name=\"query\" />\n//   <button type=\"submit\">Search</button>\n// </form>\n\n// Kai submit buttons — formAction per-button override\n// <form action={publish}>\n//   <textarea name=\"content\" rows={4} cols={40} defaultValue={formState?.get('content') || ''} />\n//   <button type=\"submit\" name=\"button\" value=\"submit\">Publish</button>\n//   <button formAction={save}>Save draft</button>\n// </form>",
k:"React 19 me action prop onSubmit se aage hai: Transition, pending state, Error Boundary, auto-reset aur Server Functions — sab free. Fields submit ke baad reset hona design hai; values state + defaultValue se bachao."},
{n:92,g:12,t:"<input>",u:"https://react.dev/reference/react-dom/components/input",
p:["Built-in browser <code>&lt;input&gt;</code> component har tarah ke form inputs (text, checkbox, radio, file, number, wagera) render karne ke liye hai. Ye page React me <b>controlled banam uncontrolled</b> inputs ki canonical vyakhya hai. <code>&lt;input&gt;</code> children accept nahi karta.",
"<b>Props ka bantwara:</b> Controlled-only: <code>checked</code> (boolean — checkbox/radio ke liye, selection control karta hai), <code>value</code> (string — text input ka text; radio ke liye uska form data). Inme se koi bhi pass karna input ko controlled bana deta hai, aur tumhe ek <code>onChange</code> bhi pass <b>karna hi hoga</b> jo value update kare. Uncontrolled-only: <code>defaultChecked</code> (boolean, checkbox/radio ki initial value), <code>defaultValue</code> (string, text ki initial value). Dono ke liye: <code>accept</code> (<code>type=\"file\"</code> ke liye file types), <code>alt</code> (<code>type=\"image\"</code> ke liye alt text), <code>capture</code>, <code>autoComplete</code>, <code>autoFocus</code> (mount par focus), <code>dirname</code>, <code>disabled</code>, <code>form</code> (us <code>&lt;form&gt;</code> ki id jisse ye sambandhit hai; default sabse kareebi parent form), <code>formAction</code> (string/function — submit/image ke liye parent <code>&lt;form action&gt;</code> ko override karta hai), <code>formEnctype</code>, <code>formMethod</code>, <code>formNoValidate</code>, <code>formTarget</code>, <code>height</code>/<code>width</code> (<code>type=\"image\"</code> ke liye image size), <code>list</code> (ek <code>&lt;datalist&gt;</code> ki id), <code>max</code>, <code>maxLength</code>, <code>min</code>, <code>minLength</code>, <code>multiple</code> (file/email), <code>name</code> (form ke saath submit hota hai), <code>pattern</code>, <code>placeholder</code>, <code>readOnly</code>, <code>required</code>, <code>size</code>, <code>src</code> (<code>type=\"image\"</code> ke liye image source), <code>step</code> (positive number ya <code>'any'</code>), <code>type</code>. Events: <code>onChange</code> (controlled inputs ke liye required; har keystroke par turant fire hota hai, browser ke <code>input</code> event ki tarah), <code>onChangeCapture</code>, <code>onInput</code>, <code>onInputCapture</code>, <code>onInvalid</code> (submit par validation fail hone par fire hota hai; native event ke ulta React me bubble karta hai), <code>onInvalidCapture</code>, <code>onSelect</code> (empty selection aur edits par bhi fire hone tak badhaya gaya), <code>onSelectCapture</code>.",
"<b>Controlled banam uncontrolled:</b> Uncontrolled — <code>&lt;input /&gt;</code> ya <code>&lt;input defaultValue=\"Initial text\" /&gt;</code>; JSX sirf initial value specify karti hai, uske baad current value DOM ke paas rehti hai. Controlled — <code>value</code> (ya checkbox/radio ke liye <code>checked</code>) pass karo; React input ko hamesha wahi value rakhne par majboor karta hai. Aam taur par state se chalta hai: <code>value={firstName} onChange={e =&gt; setFirstName(e.target.value)}</code>. Controlled inputs tab sahi hain jab tumhe waise bhi state chahiye (har edit par UI re-render karna) ya value ko kai tareekon se adjust karna ho (jaise ek button jo age me 10 saal jode). <code>value</code> kabhi <code>undefined</code>/<code>null</code> nahi hona chahiye — state ko <code>''</code> se initialize karo.",
"<b>Sabse aam galtiyan:</b> <code>value</code> bina <code>onChange</code> ke — type karna namumkin; React har keystroke ke baad input ko revert kar deta hai. Console: 'You provided a <code>value</code> prop to a form field without an <code>onChange</code> handler. This will render a read-only field…' (matlab: <code>value</code> diya lekin <code>onChange</code> nahi diya, to field sirf-padho (read-only) ban jayega — type karna namumkin). Checkbox ke liye <code>checked</code> bina <code>onChange</code> ke wahi problem hai; <code>defaultChecked</code> ya <code>onChange</code> se theek karo (ya <code>readOnly</code>). Checkbox ke liye <code>e.target.value</code> padhna galat hai — <code>e.target.checked</code> padho. Checkboxes ko <code>checked</code>/<code>defaultChecked</code> chahiye, <code>value</code>/<code>defaultValue</code> nahi. Aur <code>&lt;form&gt;</code> ke andar bina <code>type</code> wala <code>&lt;button&gt;</code> default roop se form submit karta hai — non-submit buttons ke liye <code>type=\"button\"</code> use karo.",
"<b>Caret har keystroke par shuru me kood jaye to</b> kaaran inme se ek hai: state ko <code>e.target.value</code> ke alawa kisi aur cheez se update karna (jaise <code>.toUpperCase()</code>), asynchronously update karna (jaise <code>setTimeout</code> ke andar), ya input ka har keystroke par DOM se hatna/phir judna (badalti hui <code>key</code>, ya nested component definitions). 'A component is changing an uncontrolled input to be controlled' (matlab: ek component uncontrolled input ko controlled me badal raha hai) warning tab aati hai jab <code>value</code> pehle <code>undefined</code>/<code>null</code> tha aur baad me string ban gaya — <code>''</code> se initialize karo ya <code>value={someValue ?? ''}</code> pass karo; <code>checked</code> ke liye bhi wahi — hamesha boolean rakho.",
"<b>Labels, submit par padhna, performance:</b> <code>&lt;input&gt;</code> ko <code>&lt;label&gt;</code> ke andar nest karo, ya <code>&lt;input id&gt;</code> ko <code>&lt;label htmlFor&gt;</code> ke saath jodo; id ko <code>useId</code> se generate karo. Label par click karna input ko focus karta hai; screen readers label announce karte hain. Submit par values padhne ke liye <code>&lt;form&gt;</code> me lapeto, <code>&lt;button type=\"submit\"&gt;</code> rakho, <code>e.preventDefault()</code> karo, <code>new FormData(e.target)</code> se padho — har input ko <code>name</code> do, wahi form data ki key banta hai. Performance: controlled inputs har keystroke par state set karte hain, jisse owning component re-render hota hai. Input state ko uske apne chhote component me le jao taaki sirf wahi re-render ho; agar baaki page asal me us value par nirbhar hai, to input ko responsive rakhne ke liye <code>useDeferredValue</code> use karo. Ek aur bareeki: React ka <code>onChange</code> browser ke <code>input</code> event ki tarah behave karta hai (har keystroke par fire), DOM <code>change</code> event ki tarah nahi."],
c:"// Controlled text input\nfunction Form() {\n  const [firstName, setFirstName] = useState('');\n  return (\n    <input\n      value={firstName}\n      onChange={e => setFirstName(e.target.value)}\n    />\n  );\n}\n\n// Controlled checkbox — e.target.checked padho, .value nahi\n// <input type=\"checkbox\" checked={something} onChange={e => setSomething(e.target.checked)} />\n\n// Uncontrolled, initial value ke saath\n// <input defaultValue={something} />\n// <input type=\"checkbox\" defaultChecked={something} />\n\n// Read-only controlled input (missing-onChange warning band)\n// <input value={something} readOnly={true} />",
k:"Controlled matlab value/checked + onChange, uncontrolled matlab defaultValue/defaultChecked. Checkbox me e.target.checked padho, aur value ko kabhi undefined mat rehne do."},
{n:93,g:12,t:"<select>",u:"https://react.dev/reference/react-dom/components/select",
p:["Built-in browser <code>&lt;select&gt;</code> component options ke saath ek select box render karne ke liye hai. React ka HTML se <b>asal farq</b>: selection <code>&lt;select&gt;</code> se hi control hoti hai (<code>value</code>/<code>defaultValue</code>), kabhi <code>&lt;option&gt;</code> par <code>selected</code> attribute se nahi.",
"Props: <code>value</code> — string (ya <code>multiple={true}</code> ke liye strings ki array); control karta hai ki kaunsa option selected hai; har value string ko kisi nested <code>&lt;option&gt;</code> ke <code>value</code> se match karna chahiye; ek <code>onChange</code> handler required hai. <code>defaultValue</code> — string (ya multiple ke liye array); uncontrolled select ke liye shuru me selected option(s). Iske alawa <code>autoComplete</code>, <code>autoFocus</code>, <code>disabled</code>, <code>form</code> (form ki id; default sabse kareebi parent), <code>multiple</code> (boolean — kai selections allow karta hai), <code>name</code>, <code>required</code>, <code>size</code> (multiple ke liye, shuru me dikhne wale items ki pasandeeda sankhya). <code>children</code> ke roop me <code>&lt;option&gt;</code>, <code>&lt;optgroup&gt;</code> aur <code>&lt;datalist&gt;</code> components accept hote hain; tumhare apne components bhi chalenge jab tak wo ant me allowed components me se ek render karein, aur unke render kiye har <code>&lt;option&gt;</code> ke paas <code>value</code> hona chahiye. Events: <code>onChange</code> (controlled ke liye required; user ke doosra option chunte hi turant fire hota hai, browser ke <code>input</code> event ki tarah), <code>onChangeCapture</code>, <code>onInput</code>, <code>onInputCapture</code>, <code>onInvalid</code> (React me bubble karta hai), <code>onInvalidCapture</code>.",
"Kaise kaam karta hai: default roop se browser pehle <code>&lt;option&gt;</code> ko select karta hai. Default roop se kisi aur ko select karne ke liye uska <code>value</code> <code>&lt;select&gt;</code> ko <code>defaultValue</code> ke roop me do. <b>Multiple:</b> <code>multiple={true}</code> ke saath <code>defaultValue</code> ek array ke roop me, jaise <code>defaultValue={['orange', 'banana']}</code>. <code>FormData</code> me har selected value ek alag name-value pair ke roop me aati hai (isiliye <code>Object.fromEntries(formData.entries())</code> ek ko chhod kar sab gira deta hai — ek noted gotcha). <b>Controlled:</b> <code>value={selectedFruit} onChange={e =&gt; setSelectedFruit(e.target.value)}</code>. Controlled multiple select ke liye <code>onChange</code> me <code>[...e.target.selectedOptions].map(o =&gt; o.value)</code> padho. Labels aur submit par padhna <code>&lt;input&gt;</code> wala hi pattern hai — <code>&lt;label&gt;</code> me nest ya <code>id</code>/<code>htmlFor</code> jodi (<code>useId</code> se id), aur form me <code>name</code> do taaki wahi form-data key bane.",
"Galtiyan: <code>&lt;option&gt;</code> par <code>selected</code> dalna — React me supported nahi; <code>&lt;select&gt;</code> par <code>defaultValue</code>/<code>value</code> use karo. <code>value</code> bina <code>onChange</code> ke — selection badalna namumkin; React use revert kar deta hai. Component ki lifetime me controlled aur uncontrolled ke beech switch karna — allowed nahi. <code>Object.fromEntries(formData.entries())</code> ke multiple values bachaye rakhne ki umeed — nahi rakhta. Aur wahi button wali baat: <code>&lt;form&gt;</code> ke andar bina <code>type</code> wala <code>&lt;button&gt;</code> form submit karta hai."],
c:"// Uncontrolled, multiple\n// <select name=\"selectedFruit\" defaultValue={['orange', 'banana']} multiple={true}>\n//   <option value=\"apple\">Apple</option>\n//   <option value=\"banana\">Banana</option>\n//   <option value=\"orange\">Orange</option>\n// </select>\n\n// Controlled single\nconst [selectedFruit, setSelectedFruit] = useState('orange');\n// <select value={selectedFruit} onChange={e => setSelectedFruit(e.target.value)}>\n//   <option value=\"apple\">Apple</option>\n//   <option value=\"banana\">Banana</option>\n//   <option value=\"orange\">Orange</option>\n// </select>\n\n// Controlled multiple\nconst [selectedVegs, setSelectedVegs] = useState(['corn', 'tomato']);\n// <select\n//   multiple={true}\n//   value={selectedVegs}\n//   onChange={e => {\n//     const options = [...e.target.selectedOptions];\n//     setSelectedVegs(options.map(option => option.value));\n//   }}\n// >\n//   <option value=\"cucumber\">Cucumber</option>\n//   <option value=\"corn\">Corn</option>\n//   <option value=\"tomato\">Tomato</option>\n// </select>",
k:"selected attribute React me nahi chalta — selection hamesha &lt;select&gt; ke value/defaultValue se. Multiple ho to value ek array hai aur wapas selectedOptions se padho."},
{n:94,g:12,t:"<textarea>",u:"https://react.dev/reference/react-dom/components/textarea",
p:["Built-in browser <code>&lt;textarea&gt;</code> component multiline text input ke liye hai. React ka HTML se <b>asal farq</b>: initial text <code>defaultValue</code> se set hoti hai, tags ke beech text rakh kar <b>nahi</b>. <code>&lt;textarea&gt;</code> children accept <b>nahi</b> karta — initial value set karne ke liye <code>defaultValue</code> use karo.",
"Props: <code>value</code> — string; text area ke andar ke text ko control karta hai; ek <code>onChange</code> handler required hai. <code>defaultValue</code> — string; uncontrolled text area ki initial value. Iske alawa <code>autoComplete</code> (<code>'on'</code>/<code>'off'</code>), <code>autoFocus</code>, <code>cols</code> (average character widths me default width; default <code>20</code>), <code>disabled</code>, <code>form</code> (form ki id; default sabse kareebi parent), <code>maxLength</code>, <code>minLength</code>, <code>name</code>, <code>placeholder</code>, <code>readOnly</code>, <code>required</code>, <code>rows</code> (average character heights me default height; default <code>2</code>), <code>wrap</code> (<code>'hard'</code>, <code>'soft'</code>, ya <code>'off'</code> — form submission par text kaise wrap ho). Events: <code>onChange</code> (controlled ke liye required; har keystroke par fire hota hai, browser ke <code>input</code> event ki tarah), <code>onChangeCapture</code>, <code>onInput</code>, <code>onInputCapture</code>, <code>onInvalid</code> (React me bubble karta hai), <code>onInvalidCapture</code>, <code>onSelect</code> (empty selection aur edits par bhi fire hone tak badhaya gaya), <code>onSelectCapture</code>.",
"Kaise kaam karta hai: <code>&lt;textarea&gt;</code> render karo; size <code>rows</code>/<code>cols</code> se do, lekin user default roop se use resize kar sakta hai (CSS <code>resize: none</code> se band karo). Controlled: <code>value={postContent} onChange={e =&gt; setPostContent(e.target.value)}</code>, aam taur par ek state variable se; har keystroke par UI re-render karne ke liye upyogi. Labels aur submit par padhna <code>&lt;input&gt;</code> wala hi pattern hai — <code>&lt;label&gt;</code> me nest ya <code>id</code>/<code>htmlFor</code> jodi (<code>useId</code> se id); form me <code>&lt;button type=\"submit\"&gt;</code>, <code>e.preventDefault()</code>, <code>new FormData(e.target)</code>; <code>name</code> do — wahi form-data key banta hai.",
"Galtiyan: <code>&lt;textarea&gt;Some content&lt;/textarea&gt;</code> — supported nahi; <code>defaultValue</code> use karo. <code>value</code> bina <code>onChange</code> ke — type karna namumkin; console error <code>defaultValue</code>, <code>onChange</code>, ya <code>readOnly</code> ka sujhav deta hai. Caret har keystroke par shuru me koodna — wahi kaaran jo <code>&lt;input&gt;</code> ke hain: state ko <code>e.target.value</code> ke alawa kisi aur cheez se update karna (jaise <code>.toUpperCase()</code>), asynchronously update karna (jaise <code>setTimeout</code> me), ya textarea ka har keystroke par DOM se hatna/phir judna (badalti <code>key</code>, ya nested component definitions). 'A component is changing an uncontrolled input to be controlled' (matlab: uncontrolled input controlled me badal raha hai) — <code>value</code> pehle <code>undefined</code>/<code>null</code> tha, phir string bana; <code>''</code> se initialize karo ya <code>value={someValue ?? ''}</code> use karo. Aur form ke andar bina <code>type</code> wala button form submit karta hai — <code>type=\"button\"</code> use karo."],
c:"// Uncontrolled, initial value ke saath\n// <textarea name=\"postContent\" defaultValue=\"I really enjoyed biking yesterday!\" rows={4} cols={40} />\n\n// Controlled\nfunction NewPost() {\n  const [postContent, setPostContent] = useState('');\n  return (\n    <textarea\n      value={postContent}\n      onChange={e => setPostContent(e.target.value)}\n    />\n  );\n}\n\n// Read-only controlled (koi onChange warning nahi)\n// <textarea value={something} readOnly={true} />",
k:"Textarea ke beech text mat likho — defaultValue do. Baaki niyam input wale hi hain: value ke saath onChange pakka, aur value kabhi undefined nahi."},
{n:95,g:12,t:"<img>",u:"https://react.dev/reference/react-dom/components/img",
p:["Built-in browser <code>&lt;img&gt;</code> component ek image embed karne ke liye hai, React-specific behavior ke saath: server rendering ke dauraan automatic preload hints, aur <code>&lt;ViewTransition&gt;</code> updates ke dauraan images ka intezaar. URL ko <code>src</code> ko do aur description ko <code>alt</code> ko; layout space reserve karne ke liye <code>width</code>/<code>height</code> jodo.",
"Props: <code>alt</code> — string; alternative text; vishuddh sajawati image ke liye <code>\"\"</code> do taaki screen readers use ignore karein. <code>crossOrigin</code> — <code>'anonymous'</code> ya <code>'use-credentials'</code> (CORS policy). <code>decoding</code> — <code>'async'</code>, <code>'sync'</code>, ya <code>'auto'</code> (default); browser doosri content pesh karne se pehle image ko decode karne ka intezaar kare ya nahi. <code>fetchPriority</code> — <code>'high'</code>, <code>'low'</code>, ya <code>'auto'</code> (default); saapeksh fetch priority; server rendering ke dauraan <code>fetchPriority=\"low\"</code> React ko image ko automatically preload karne se bhi rokta hai. <code>height</code>/<code>width</code> — number ya string; rendered dimensions; pata hon to specify karo taaki browser image load hone se pehle jagah reserve kar sake. <code>loading</code> — <code>'eager'</code> (default) ya <code>'lazy'</code>; <code>loading=\"lazy\"</code> loading ko viewport ke kareeb aane tak talta hai aur React ke automatic preload ko rokta hai. <code>onError</code> — image load fail hone par fire hota hai. <code>onLoad</code> — image load khatm hone par fire hota hai; <code>onLoad</code> pass karna React ko client-rendered View Transition update ke dauraan image ka intezaar karne se rokta hai. <code>referrerPolicy</code>, <code>sizes</code> (<code>srcSet</code> ke saath use hota hai), <code>src</code>, <code>srcSet</code> (browser ke chunne ke liye ek ya zyada candidate sources), <code>useMap</code> (client-side image map se jodta hai).",
"<b>SSR ke dauraan automatic preloading:</b> React default roop se ek preload hint generate karta hai (jo <code>&lt;link rel=\"preload\" as=\"image\" href=\"hero.jpg\" /&gt;</code> ke roop me ya ek <code>Link</code> response header ke roop me render hota hai) taaki browser <code>&lt;img&gt;</code> se takrane se pehle hi fetching shuru kar sake. Opt out: <code>loading=\"lazy\"</code> ya <code>fetchPriority=\"low\"</code>. Koi automatic preload nahi jab image <code>&lt;picture&gt;</code> ya <code>&lt;noscript&gt;</code> ke andar ho, ya jab <code>src</code>/<code>srcSet</code> ek data URL ho. React underlying <code>&lt;img&gt;</code> props se tay karta hai — ek wrapper component jo default roop se <code>loading=\"lazy\"</code> jod de, behavior badal deta hai. Ek explicit preload hint ke liye <code>preload</code> call karo.",
"<b>View Transitions:</b> ek <code>&lt;ViewTransition&gt;</code> update ke dauraan, React animation shuru karne se pehle visible images ke load hone ka <b>500 ms tak</b> intezaar karta hai (naye rendered <code>&lt;img&gt;</code> elements aur wo maujooda jinke <code>src</code>/<code>srcSet</code> badalte hain). <code>loading=\"lazy\"</code> ya ek <code>onLoad</code> handler kisi image ko opt out kar deta hai. Asar: <code>&lt;ViewTransition&gt;</code> ke saath skeleton 500 ms tak visible rehta hai taaki card apni image ke saath reveal ho; uske bina card pehle aata hai aur image baad me pop in hoti hai. Dhyaan do: <code>fetchPriority=\"low\"</code> View Transition ke intezaar se opt out <b>nahi</b> karta — uske liye <code>loading=\"lazy\"</code> ya <code>onLoad</code> hi hai.",
"Galtiyan: <code>src</code> ko empty string dena — browser current page ko phir se request kar sakta hai; React development me warning deta hai aur attribute hata deta hai. Koi image render nahi karni to <code>&lt;img&gt;</code> hi mat rakho ya <code>src</code> ko <code>null</code> do. <code>&lt;img&gt;</code> ke children ya <code>dangerouslySetInnerHTML</code> nahi ho sakte — React error throw karta hai. <code>alt</code> gayab hona accessibility failure hai; sajawati images ko <code>alt=\"\"</code> chahiye."],
c:"function ProductPage() {\n  return (\n    <>\n      <img src=\"hero.jpg\" alt=\"Featured product\" />\n      <img src=\"thumbnail.jpg\" alt=\"Related product\" loading=\"lazy\" />\n      <img src=\"secondary.jpg\" alt=\"Another product\" fetchPriority=\"low\" />\n    </>\n  );\n}\n// Sirf hero.jpg ko automatic preload hint milta hai.",
k:"React SSR me img ko khud preload karta hai — lazy ya fetchPriority=low se opt out karo. Aur src=\"\" kabhi mat do; image nahi chahiye to element hi hatao."},
{n:96,g:12,t:"<link>",u:"https://react.dev/reference/react-dom/components/link",
p:["Built-in browser <code>&lt;link&gt;</code> component external resources (stylesheets, fonts, icons) ko link karne ya document ko link metadata se annotate karne ke liye hai. React use document <code>&lt;head&gt;</code> me <b>hoist</b> karta hai, chahe wo kahin bhi render ho, aur stylesheets ko special treatment deta hai: load hote waqt suspension, aur de-duplication.",
"Props: <code>rel</code> — string, <b>lazmi (required)</b>; resource se sambandh batata hai. React <code>rel=\"stylesheet\"</code> ko doosre links se alag treat karta hai. Jab <code>rel=\"stylesheet\"</code> ho: <code>precedence</code> (string — <code>&lt;head&gt;</code> me doosre links ke saapeksh rank; zyada precedence kam ko override kar sakti hai; React pehle mili values ko 'lower' aur baad me mili ko 'higher' maanta hai; same-precedence stylesheets ek saath group hoti hain, chahe wo <code>&lt;link&gt;</code> hon, inline <code>&lt;style&gt;</code>, ya <code>preinit</code> se load hui hon), <code>media</code> (stylesheet ko ek media query tak seemit karta hai), <code>title</code> (ek alternative stylesheet ka naam). Jab <code>rel=\"stylesheet\"</code> ho lekin React ka special treatment band karna ho: <code>disabled</code> (boolean), <code>onError</code> (stylesheet load fail hone par call hota hai), <code>onLoad</code> (load khatm hone par call hota hai). Jab <code>rel=\"preload\"</code> ya <code>rel=\"modulepreload\"</code> ho: <code>as</code> (resource type: <code>audio</code>, <code>document</code>, <code>embed</code>, <code>fetch</code>, <code>font</code>, <code>image</code>, <code>object</code>, <code>script</code>, <code>style</code>, <code>track</code>, <code>video</code>, <code>worker</code>), <code>imageSrcSet</code> (sirf jab <code>as=\"image\"</code> ho), <code>imageSizes</code> (sirf jab <code>as=\"image\"</code> ho). Jab <code>rel=\"icon\"</code> ya <code>rel=\"apple-touch-icon\"</code> ho: <code>sizes</code>. Har haal me: <code>href</code>, <code>crossOrigin</code> (<code>'anonymous'</code>/<code>'use-credentials'</code>; jab <code>as=\"fetch\"</code> ho to required), <code>referrerPolicy</code> (<code>'no-referrer-when-downgrade'</code> default, <code>'no-referrer'</code>, <code>'origin'</code>, <code>'origin-when-cross-origin'</code>, <code>'unsafe-url'</code>), <code>fetchPriority</code> (<code>'auto'</code> default, <code>'high'</code>, <code>'low'</code>), <code>hrefLang</code>, <code>integrity</code> (authenticity verify karne ke liye cryptographic hash), <code>type</code> (MIME type). <b>Salah nahi di jati (not recommended):</b> <code>blocking</code> (<code>\"render\"</code> stylesheet load hone tak rendering block karta hai — React is control ke liye Suspense prefer karta hai).",
"<b>Hoisting:</b> React <code>&lt;link&gt;</code> DOM element ko hamesha document <code>&lt;head&gt;</code> me rakhta hai, is baat se bekhabar ki wo React tree me kahan render hua — taaki ek page component apne links khud render kar sake. Apvaad (koi special behavior nahi): bina <code>precedence</code> wali stylesheet <code>&lt;link&gt;</code> (order matter karta hai, isliye React ko ranking chahiye); <code>itemProp</code> wali <code>&lt;link&gt;</code> (page ke kisi nishchit hisse ke baare me metadata, document ke baare me nahi); <code>onLoad</code>/<code>onError</code> wali <code>&lt;link&gt;</code> (loading tum khud manage karte ho).",
"<b>Stylesheet ka special behavior:</b> rendering component stylesheet load hote waqt <b>suspend</b> karta hai; wahi stylesheet render karne wale kai components de-duplicate ho jate hain (same <code>href</code> = same link, DOM me sirf ek <code>&lt;link&gt;</code>). Apvaad: koi <code>precedence</code> prop na ho, ya <code>onLoad</code>/<code>onError</code>/<code>disabled</code> me se koi diya gaya ho. Is treatment ki caveats: link render ho jane ke baad React prop changes ko ignore karta hai (aisa ho to dev warning); rendering component ke unmount hone ke baad React link ko DOM me chhod sakta hai. <b>Precedence:</b> stylesheets takrati hain — browser document me baad me aane wali ko use karta hai. <code>precedence</code> values tumhare chune hue man-maane naam hain; React same-precedence stylesheets ko ek saath group karta hai. <code>preinit</code> call karna browser ko <code>&lt;link&gt;</code> render karne se pehle hi stylesheet fetch karna shuru karwa sakta hai (jaise HTTP Early Hints ke zariye). <b>Item annotation:</b> <code>itemScope</code> wale section ke andar <code>&lt;link itemProp=\"author\" href=\"http://example.com/\"&gt;</code> kisi aam component ki tarah jagah par rehta hai — wo us item ko annotate karta hai, document ko nahi.",
"Galtiyan: stylesheet <code>&lt;link&gt;</code> par <code>precedence</code> na dena — koi hoisting, suspension ya de-duplication nahi; link wahi render hota hai jahan hai. Stylesheet link par <code>onLoad</code>/<code>onError</code>/<code>disabled</code> jodna aur suspension/de-duplication ki umeed rakhna — ye props special behavior se opt out kar dete hain. Render ke baad props badalna — ignore ho jata hai (dev warning ke saath). Link ke unmount par gayab hone ki umeed — React use DOM me chhod sakta hai."],
c:"// Stylesheet with precedence — component load hote waqt suspend karta hai\n// <link rel=\"stylesheet\" href=\"first.css\" precedence=\"first\" />\n\n// Teen components, <head> me do precedence groups\nfunction FirstComponent()  { return <link rel=\"stylesheet\" href=\"first.css\" precedence=\"first\" />; }\nfunction SecondComponent() { return <link rel=\"stylesheet\" href=\"second.css\" precedence=\"second\" />; }\nfunction ThirdComponent()  { return <link rel=\"stylesheet\" href=\"third.css\" precedence=\"first\" />; }\n\n// Item annotation (jagah par rehta hai, <head> me hoist NAHI hota)\n// <section itemScope>\n//   <h3>Annotating specific items</h3>\n//   <link itemProp=\"author\" href=\"http://example.com/\" />\n//   <p>...</p>\n// </section>",
k:"Stylesheet link ko precedence do to React use head me hoist karta hai, load par suspend karta hai aur href se dedupe karta hai — precedence na ho to teeno gayab."},
{n:97,g:12,t:"<meta>",u:"https://react.dev/reference/react-dom/components/meta",
p:["Built-in browser <code>&lt;meta&gt;</code> component document me metadata jodne ke liye hai. <code>&lt;link&gt;</code> ki tarah, React use document <code>&lt;head&gt;</code> me <b>hoist</b> karta hai chahe wo kahin bhi render ho — sirf tab chhod kar jab wo <code>itemProp</code> se kisi nishchit item ko annotate kare.",
"Ise <code>name</code>, <code>httpEquiv</code>, <code>charset</code>, <code>itemProp</code> me se <b>bilkul ek</b> hona chahiye — component ka behavior is par nirbhar karta hai ki kaunsa specify kiya gaya hai: <code>name</code> — string; document se jodne wale metadata ki kism. <code>charset</code> — string; document ka character set; ekmatra valid value <code>\"utf-8\"</code> hai. <code>httpEquiv</code> — string; document ko process karne ke liye ek directive. <code>itemProp</code> — string; poore document ke bajaye document ke andar kisi particular item ke baare me metadata. <code>content</code> — string; jodna wala metadata (<code>name</code> ya <code>itemProp</code> ke saath) ya directive ka behavior (<code>httpEquiv</code> ke saath).",
"<b>Kaise kaam karta hai:</b> React <code>&lt;meta&gt;</code> DOM element ko hamesha document <code>&lt;head&gt;</code> me rakhta hai, React tree me uski jagah se bekhabar — taaki ek page component apna metadata khud render kar sake. Ekmatra apvaad: <code>itemProp</code> wala <code>&lt;meta&gt;</code> hoist <b>nahi</b> hota; wo kisi aam component ki tarah jagah par render hota hai, kyunki wo page ke kisi nishchit hisse ka varnan karta hai.",
"Galtiyan: <code>name</code>/<code>httpEquiv</code>/<code>charset</code>/<code>itemProp</code> me se ek se zyada dena — component ke paas bilkul ek hona chahiye. <code>\"utf-8\"</code> ke alawa koi <code>charset</code> use karna — invalid hai. Ek <code>itemProp</code> wale <code>&lt;meta&gt;</code> ke <code>&lt;head&gt;</code> me pahunchne ki umeed — wo design se jagah par rehta hai. <code>&lt;meta&gt;</code>/<code>&lt;link&gt;</code>/<code>&lt;title&gt;</code> ki hoisting hi React 19 ki document-metadata kahaani hai: components apne head tags khud render karte hain, React unhe sahi jagah rakhta hai — aur <code>itemProp</code> apvaad teeno me saajha hai."],
c:"// Document metadata (<head> me hoist hota hai)\n// <meta name=\"author\" content=\"John Smith\" />\n// <meta name=\"keywords\" content=\"React, JavaScript, semantic markup, html\" />\n// <meta name=\"description\" content=\"API reference for the <meta> component in React DOM\" />\n\n// Item metadata (jagah par rehta hai)\n// <section itemScope>\n//   <h3>Annotating specific items</h3>\n//   <meta itemProp=\"description\" content=\"API reference for using <meta> with itemProp\" />\n//   <p>...</p>\n// </section>",
k:"Meta head me hoist hota hai, lekin itemProp wala jagah par rehta hai. name/httpEquiv/charset/itemProp me se bilkul ek do, aur charset sirf utf-8."},
{n:98,g:12,t:"<script>",u:"https://react.dev/reference/react-dom/components/script",
p:["Built-in browser <code>&lt;script&gt;</code> component document me inline ya external scripts jodne ke liye hai. React async external scripts ko document <code>&lt;head&gt;</code> me le ja sakta hai aur identical scripts ko <b>de-duplicate</b> kar sakta hai. Iske paas ya to <code>children</code> hona chahiye ya ek <code>src</code> prop: <code>children</code> — string, ek inline script ka source code; <code>src</code> — string, ek external script ka URL.",
"Baaki props: <code>async</code> — boolean; document ke baaki hisse ke process hone tak execution ko talta hai — performance ke liye pasandeeda behavior. <code>crossOrigin</code> — <code>'anonymous'</code> ya <code>'use-credentials'</code>. <code>fetchPriority</code> — <code>\"high\"</code>, <code>\"low\"</code>, ya <code>\"auto\"</code> (default); kai scripts ek saath fetch karte waqt rank karta hai. <code>integrity</code> — string; script ki authenticity verify karne ke liye cryptographic hash. <code>noModule</code> — boolean; ES modules support karne wale browsers me script ko disable karta hai (un browsers ke liye fallback jo nahi karte). <code>nonce</code> — string; sakht Content Security Policy ke tahat resource ko allow karne ke liye cryptographic nonce. <code>referrer</code> — string; script aur uske fetch kiye resources ko fetch karte waqt kaunsa <code>Referer</code> header bhejna hai. <code>type</code> — string; script ek classic script hai, ES module, ya import map. React ke special treatment ko band karne wale props: <code>onError</code> (script load fail hone par call hota hai), <code>onLoad</code> (load khatm hone par call hota hai). <b>Salah nahi di jati (not recommended):</b> <code>blocking</code> (<code>\"render\"</code> script load hone tak rendering block karta hai — iski jagah Suspense use karo); <code>defer</code> (document load hone tak execution rokta hai — <b>streaming server-rendered components ke saath compatible nahi</b>; iski jagah <code>async</code> use karo).",
"<b>Special rendering behavior:</b> opt in karne ke liye <code>src</code> <b>aur</b> <code>async={true}</code> do. React script ko document <code>&lt;head&gt;</code> me le jata hai aur same <code>src</code> wali scripts ko de-duplicate karta hai (kai components use render karein tab bhi sirf ek insert hoti hai). Scripts ko surakshit roop se le jane ke liye <code>async</code> <code>true</code> hona hi chahiye. Caveats: script render ho jane ke baad React prop changes ko ignore karta hai (dev warning); rendering component ke unmount hone ke baad React script ko DOM me chhod sakta hai (koi nuksan nahi — scripts insert hone par ek baar execute hoti hain).",
"Doosri baatein: external scripts ke liye component script ke load khatm hone se pehle commit ho sakta hai; script ki content par sirf <code>load</code> event ke baad nirbhar raho, jaise <code>onLoad</code> prop ke zariye. Inline scripts source code ke saath children ke roop me render hoti hain; wo <b>na de-duplicate hoti hain na</b> <code>&lt;head&gt;</code> me jati hain. <code>preinit</code> call karna browser ko <code>&lt;script&gt;</code> render karne se pehle hi script fetch karna shuru karwa sakta hai (jaise HTTP Early Hints ke zariye). Galtiyan: <code>defer</code> use karna (streaming SSR se takrata hai); render ke turant baad script ke globals par nirbhar rehna; inline scripts ke de-duplicate ya hoist hone ki umeed; <code>async={true}</code> bhool jana — uske bina na hoisting hai na de-duplication."],
c:"// External script — de-duplicated, <head> me gaya\n// <script async src=\"map-api.js\" onLoad={() => console.log('script loaded')} />\n\nfunction Map({ lat, long }) {\n  return (\n    <>\n      <script async src=\"map-api.js\" onLoad={() => console.log('script loaded')} />\n      <div id=\"map\" data-lat={lat} data-long={long} />\n    </>\n  );\n}\n\n// Inline script (de-duplicated nahi, move nahi hoti)\nfunction Tracking() {\n  return (\n    <script>\n      {`ga('send', 'pageview');`}\n    <\/script>\n  );\n}",
k:"src + async={true} hi script hoisting/dedupe ka opt-in hai. defer streaming SSR todta hai — async use karo; aur script ke globals par onLoad ke baad hi bharosa karo."},
{n:99,g:12,t:"<style>",u:"https://react.dev/reference/react-dom/components/style",
p:["Built-in browser <code>&lt;style&gt;</code> component document me inline CSS stylesheets jodne ke liye hai. <code>&lt;link&gt;</code> ki tarah, React use document <code>&lt;head&gt;</code> me le ja sakta hai, identical styles ko de-duplicate kar sakta hai, aur use <code>precedence</code> ke hisaab se order kar sakta hai.",
"Props: <code>children</code> — string, <b>lazmi (required)</b>; stylesheet ki content hoti hai. <code>precedence</code> — string; document <code>&lt;head&gt;</code> me doosre <code>&lt;style&gt;</code> DOM nodes ke saapeksh rank; zyada precedence kam ko override kar sakti hai; React pehle mili values ko 'lower' aur baad me mili ko 'higher' maanta hai; same precedence wali stylesheets ek saath jati hain chahe wo <code>&lt;link&gt;</code> hon, inline <code>&lt;style&gt;</code>, ya <code>preinit</code> se load hui hon. <code>href</code> — string; React ko same <code>href</code> wali styles ko de-duplicate karne deta hai; stylesheet ko uniquely identify karna chahiye. <code>media</code> — string; stylesheet ko ek media query tak seemit karta hai. <code>nonce</code> — string; sakht CSP ke liye cryptographic nonce. <code>title</code> — string; ek alternative stylesheet ka naam. <b>Salah nahi di jati (not recommended):</b> <code>blocking</code> (<code>\"render\"</code> stylesheet load hone tak rendering block karta hai — Suspense use karo).",
"<b>Special rendering behavior:</b> opt in karne ke liye <code>href</code> <b>aur</b> <code>precedence</code> — dono do. React <code>&lt;style&gt;</code> ko document <code>&lt;head&gt;</code> me le jata hai, same <code>href</code> wali styles ko de-duplicate karta hai, aur stylesheet load hote waqt suspend kar sakta hai. Caveats: style render ho jane ke baad React prop changes ko ignore karta hai (dev warning); <code>precedence</code> use karne par React <code>href</code> aur <code>precedence</code> ke alawa saare extraneous props gira deta hai; rendering component ke unmount hone ke baad React style ko DOM me chhod sakta hai.",
"Do aur baatein: inline stylesheets load hote waqt Suspense boundaries ko trigger <b>nahi</b> karti — chahe wo fonts ya images jaise async resources hi load karein. Aur <code>precedence</code> ke saath, React inline stylesheets ko un values ke component tree me aane ke kram ke hisaab se reorder karta hai. Galtiyan: <code>href</code>/<code>precedence</code> na dena (koi hoisting, ordering ya de-duplication nahi); ek inline stylesheet ke Suspense boundary ko suspend karne ki umeed (nahi karega — ye external stylesheet links ke ulta hai); <code>precedence</code> ke saath extra props dena (wo gira diye jate hain); render ke baad props badalna (ignore, dev warning ke saath). Interview ka mudda: <code>precedence</code> <code>&lt;link&gt;</code>, <code>&lt;style&gt;</code> aur <code>preinit</code> me saajha hai — saari stylesheets ke liye ek hi ordering system."],
c:"import { useId } from 'react';\n\nfunction PieChart({ data, colors }) {\n  const id = useId();\n  const stylesheet = colors.map((color, index) =>\n    `#${id} .color-${index}: { color: \"${color}\"; }`\n  ).join();\n\n  return (\n    <>\n      <style href={\"PieChart-\" + JSON.stringify(colors)} precedence=\"medium\">\n        {stylesheet}\n      </style>\n      <svg id={id}>…</svg>\n    </>\n  );\n}\n// href generated stylesheet ko uniquely identify karta hai (colors se bana hai),\n// isliye identical color sets sirf ek <style> render karte hain.",
k:"&lt;style&gt; ko href + precedence dono chahiye tabhi hoisting/dedupe milta hai — aur inline stylesheet kabhi Suspense ko trigger nahi karti."},
{n:100,g:12,t:"<title>",u:"https://react.dev/reference/react-dom/components/title",
p:["Built-in browser <code>&lt;title&gt;</code> component document title specify karne ke liye hai. React use document <code>&lt;head&gt;</code> me <b>hoist</b> karta hai chahe wo kahin bhi render ho — taaki har page component apna title khud declare kar sake. <code>children</code> ke roop me sirf <b>text</b> ja sakta hai; wahi text document title banta hai. Tum apne components bhi pass kar sakte ho jab tak wo sirf text render karein.",
"<b>Single string niyam — yahi classic gotcha hai:</b> children ek single string of text hona chahiye (ya ek single number, ya <code>toString</code> method wala ek single object). <code>&lt;title&gt;Results page {pageNumber}&lt;/title&gt;</code> component ko children ke roop me ek <b>do-element array</b> deta hai (string <code>\"Results page\"</code> aur <code>pageNumber</code> ki value) aur error ka kaaran banta hai. Uski jagah string interpolation use karo: <code>&lt;title&gt;{`Results page ${pageNumber}`}&lt;/title&gt;</code>.",
"Hoisting ke do apvaad (koi special behavior nahi): ek <code>&lt;svg&gt;</code> ke andar ka <code>&lt;title&gt;</code> (wahan wo SVG graphic ke liye ek accessibility annotation hai, document title nahi); aur <code>itemProp</code> prop wala <code>&lt;title&gt;</code> (page ke kisi nishchit hisse ke baare me metadata).",
"Galtiyan: ek samay par ek se zyada <code>&lt;title&gt;</code> render karna — React un sab ko document head me rakhta hai; browser/search-engine behavior phir undefined hai. Children ke roop me text aur expressions ko milana — ek array banta hai, single string nahi; hamesha ek string me interpolate karo. <code>&lt;title&gt;</code> ke andar non-text children (elements) dalna — allowed nahi."],
c:"// ✅ Sahi — interpolation se single string\n// <title>{`Results page ${pageNumber}`}</title>\n\n// 🔴 Problem — children ki do-element array, error ka kaaran\n// <title>Results page {pageNumber}</title>",
k:"Title ka children hamesha ek hi string ho — text ke baad {expression} lagate hi array ban jata hai aur error aata hai. Interpolation hi fix hai."},
{n:101,g:12,t:"<option>",u:"https://react.dev/reference/react-dom/components/option",
p:["Built-in browser <code>&lt;option&gt;</code> component ek <code>&lt;select&gt;</code> box ke andar ek option render karne ke liye hai. Saare common element props ke alawa: <code>disabled</code> — boolean; <code>true</code> ho to option selectable nahi hai aur dimmed dikhta hai. <code>label</code> — string; option ka arth; specify na ho to option ke andar ka text use hota hai. <code>value</code> — wo value jo is option ke selected hone par parent <code>&lt;select&gt;</code> ko form me submit karte waqt use hoti hai.",
"Kaise kaam karta hai: ek <code>&lt;select&gt;</code> render karo jiske andar <code>&lt;option&gt;</code> components ki list ho. Har <code>&lt;option&gt;</code> ko ek <code>value</code> do jo form ke saath submit hone wale data ko represent kare. Selection parent <code>&lt;select&gt;</code> se control hoti hai (<code>defaultValue</code>/<code>value</code>), option se khud nahi.",
"<code>&lt;option&gt;</code> ke baare me jaanne layak ek hi baat hai — aur wahi sabse aam galti bhi: <code>selected</code> attribute use karna. React use support <b>nahi</b> karta. Uski jagah option ke <code>value</code> ko parent <code>&lt;select defaultValue&gt;</code> (uncontrolled) ya <code>&lt;select value&gt;</code> (controlled) ko do. Aur <code>label</code> banam andar ka text: jab text se farq ho to <code>label</code> override karta hai ki option ka matlab kya hai."],
c:"// <select>\n//   <option value=\"someOption\">Some option</option>\n//   <option value=\"otherOption\">Other option</option>\n//   <option value=\"disabledOption\" disabled>Disabled option</option>\n//   <option value=\"labelled\" label=\"Custom label\">Visible text</option>\n// </select>",
k:"Option par selected kabhi nahi — selection select ke value/defaultValue se hoti hai. label diya ho to wahi option ka arth hai, andar ka text nahi."},
{n:102,g:12,t:"<progress>",u:"https://react.dev/reference/react-dom/components/progress",
p:["Built-in browser <code>&lt;progress&gt;</code> component ek progress indicator render karne ke liye hai. Saare common element props ke alawa sirf do props: <code>max</code> — number; adhiktam <code>value</code>; default <code>1</code> hai. <code>value</code> — <code>0</code> aur <code>max</code> ke beech ka ek number, <b>ya indeterminate progress ke liye <code>null</code></b>; kitna kaam ho chuka hai.",
"Kaise kaam karta hai: <code>0</code> aur tumhare specify kiye <code>max</code> ke beech ka ek number <code>value</code> do. Agar tum <code>max</code> pass nahi karte to wo <code>1</code> default hota hai — isliye <code>value={0.5}</code> ka matlab 50% hai. Agar operation jaari nahi hai, to indicator ko indeterminate state (animated 'busy' bar) me dalne ke liye <code>value={null}</code> do.",
"Galtiyan: <code>max</code> ka default <code>1</code> hona bhool jana — bina <code>max</code> ke <code>value={50}</code> range se bahar hai (50 &gt; 1). 'Unknown' ke liye <code>value={0}</code> use karna — indeterminate ke liye <code>value={null}</code> use karo. API chhoti hai, lekin <code>value={null}</code> = indeterminate wahi detail hai jo interviewers park karte hain. Aur ek tulna: custom progress bar ke ulta, <code>&lt;progress&gt;</code> ek native, accessible element hai."],
c:"// <progress value={0.5} />            // 50% (max default 1 hai)\n// <progress value={30} max={100} />   // 30%\n// <progress value={null} />           // indeterminate — operation jaari nahi / progress ajnaat",
k:"max default 1 hota hai, aur progress ajnaat ho to value={0} nahi, value={null} do — wahi indeterminate state hai."},
{n:103,g:13,t:"createPortal",u:"https://react.dev/reference/react-dom/createPortal",
p:["<code>createPortal</code> (<code>react-dom</code> se) kuch children ko <b>DOM ke kisi doosre hisse</b> me render karta hai — jaise ek modal dialog ya tooltip jise ek <code>overflow: hidden</code> container se bhaagna hai — jabki wo usi React tree me bane rehte hain. Signature: <code>createPortal(children, domNode, key?)</code>.",
"<code>children</code> React se renderable kuch bhi hai: JSX (jaise <code>&lt;div /&gt;</code> ya <code>&lt;SomeComponent /&gt;</code>), ek Fragment (<code>&lt;&gt;...&lt;/&gt;</code>), ek string ya number, ya inki array. <code>domNode</code> ek DOM node hai, jaise <code>document.getElementById()</code> se mila — node <b>pehle se exist</b> karna chahiye. Update ke dauraan ek alag DOM node pass karna portal content ko dobara banata hai. Optional <code>key</code> portal ki key ke roop me ek unique string ya number hai. Return value ek React node hai jise JSX me shamil kar sakte ho ya React component se return kar sakte ho; jab React render output me use dekhta hai, to diye gaye <code>children</code> ko diye gaye <code>domNode</code> ke andar rakh deta hai.",
"<b>Portal sirf DOM node ki physical placement badalta hai</b> — interview ka sabse zyada poochha jaane wala mudda yahi hai. Har doosre tareeke se, portalled JSX use render karne wale React component ke child ki tarah behave karta hai: wo parent tree dwara provide ki gayi context access kar sakta hai, aur <b>events React tree ke hisaab se bubble hote hain, DOM tree ke hisaab se nahi</b>. To <code>&lt;div onClick&gt;</code> me lapete portal ke andar ka click us handler ko fire karta hai, chahe DOM nodes kitne bhi door kyun na hon.",
"Istemal ke cases: styled containers se bhaagne wale modals/tooltips; ek non-React server-rendered page ke hisson me React render karna (jaise ek Rails sidebar) — kai alag React roots ke muqable portals ek hi React tree ko shared state ke saath rakhte hain; React content ko ek non-React widget dwara manage kiye gaye DOM node me render karna (jaise ek map popup) — node ko state (<code>useState(null)</code>) me store karke, wo exist kare tab portal render karke.",
"Galtiyan: events ke DOM tree follow karne ki umeed — wo React tree follow karte hain; ek portal ke andar ka click React tree ke ancestors ke handlers trigger karta hai; fix: portal ke andar propagation roko ya portal ko React tree me upar le jao. Ek aisa <code>domNode</code> pass karna jo abhi exist nahi karta (jaise <code>getElementById</code> ka <code>null</code> return karna) — map wale example ki tarah state se guard karo. Renders ke beech <code>domNode</code> badalna — portal content dobara banta hai. Accessibility: modals ko focus management chahiye (focus ko swabhavik roop se andar-bahar le jana); WAI-ARIA Modal Authoring Practices follow karo. <code>createPortal</code> banam <code>createRoot</code>: ek hi app ke andar modal/tooltip ke liye portals; alag React trees ke liye <code>createRoot</code>."],
c:"import { createPortal } from 'react-dom';\n\nfunction MyComponent() {\n  return (\n    <div style={{ border: '2px solid black' }}>\n      <p>This child is placed in the parent div.</p>\n      {createPortal(\n        <p>This child is placed in the document body.</p>,\n        document.body\n      )}\n    </div>\n  );\n}\n// Resulting DOM: doosra <p> seedha <body> ke andar hai, #root ke bahar.\n\n// Non-React widget popup — node ko state me rakho\n// const [popupContainer, setPopupContainer] = useState(null);\n// useEffect(() => {\n//   if (mapRef.current === null) {\n//     const map = createMapWidget(containerRef.current);\n//     mapRef.current = map;\n//     setPopupContainer(addPopupToMapWidget(map));\n//   }\n// }, []);\n// return (\n//   <div style={{ width: 250, height: 250 }} ref={containerRef}>\n//     {popupContainer !== null && createPortal(<p>Hello from React!</p>, popupContainer)}\n//   </div>\n// );",
k:"Portal sirf DOM placement badalta hai, React tree nahi — context kaam karta hai, events React tree se bubble hote hain. domNode pehle se exist karna chahiye."},
{n:104,g:13,t:"flushSync",u:"https://react.dev/reference/react-dom/flushSync",
p:["<code>flushSync</code> (<code>react-dom</code> se) React ko majboor karta hai ki diye gaye callback ke andar ke saare updates ko <b>synchronously</b> flush kare, taaki DOM turant update ho jaye. Ye third-party integrations ke liye ek last-resort escape hatch hai — iska aksar istemal performance ko kaafi nuksan pahuncha sakta hai. Signature: <code>flushSync(callback)</code>; <code>undefined</code> return karta hai.",
"<code>callback</code> ek function hai. React use turant call karta hai aur uske andar ke saare updates ko synchronously flush karta hai. Ye pending updates, Effects, ya Effects ke andar ke updates bhi flush kar sakta hai. Agar is call ke natije me koi update suspend karta hai, to fallbacks dobara dikh sakte hain. Aam taur par React updates ko asynchronously batch karta hai; <code>flushSync</code> DOM ko code ki agli line chalne se pehle update kar deta hai: <code>flushSync(() =&gt; { setSomething(123); });</code> — is line tak, DOM update ho chuka hai.",
"Ye un browser APIs ke liye exist karta hai jo umeed karte hain ki callback ke khatm hone tak DOM synchronously likha jayega — jaise <code>onbeforeprint</code>, jahan tum print dialog khulne se turant pehle page badalte ho. Bina <code>flushSync</code> ke, print dialog purani value dikhayega kyunki React asynchronously batch karta hai. <code>onbeforeprint</code> wala example hi canonical legitimate use case hai. Agar tumhara app sirf React APIs use karta hai aur koi third-party library nahi, to <code>flushSync</code> bekaar hona chahiye.",
"Sabse badi galti: <code>flushSync</code> ko render, <code>useLayoutEffect</code>/<code>useEffect</code>, ya class lifecycle methods ke andar call karna — React pehle se rendering kar raha ho to flush nahi kar sakta; ye no-op hota hai aur warning deta hai: 'flushSync was called from inside a lifecycle method. React cannot flush when React is already rendering. Consider moving this call to a scheduler task or micro task.' (matlab: React pehle se render kar raha hai, isliye abhi flush nahi ho sakta — is call ko scheduler task ya microtask me le jao). Fix: use ek event handler me le jao, ya <code>queueMicrotask</code> se defer karo — lekin dhyaan do, microtask pattern performance ke liye aur bhi bura hai; saare doosre vikalp khatm karne ke baad hi use karo. Event handlers me <code>flushSync</code> surakshit hai. Aur do baatein: ise routinely use karna performance ko kaafi nuksan pahuncha sakta hai aur pending Suspense boundaries ko unka fallback state dikhane par achanak majboor kar sakta hai; aur zaroorat padne par <code>flushSync</code> callback ke <b>bahar</b> ke updates bhi flush kar sakta hai (jaise ek click ke pending updates pehle flush ho sakte hain). Interview me ye sawal aata hai: 'React me synchronous DOM update kaise force karun?' — jawab <code>flushSync</code> hai, aur follow-up hamesha hota hai 'kyun nahi karna chahiye?'"],
c:"import { flushSync } from 'react-dom';\n\n// ✅ Sahi: event handlers me flushSync surakshit hai\nfunction handleClick() {\n  flushSync(() => {\n    setSomething(newValue);\n  });\n  // Is line tak DOM update ho chuka hai\n}\n\n// ✅ Sahi (escape hatch): Effect se flushSync ko microtask me defer karo\nuseEffect(() => {\n  queueMicrotask(() => {\n    flushSync(() => {\n      setSomething(newValue);\n    });\n  });\n}, []);",
k:"flushSync synchronous DOM update force karta hai — sirf escape hatch ke roop me (jaise onbeforeprint). Render/lifecycle ke andar call karna warning ke saath no-op hai."},
{n:105,g:13,t:"requestFormReset",u:"https://react.dev/reference/react-dom/requestFormReset",
p:["<code>requestFormReset</code> (<code>react-dom</code> se) request karta hai ki ek React-managed form <b>current Action ya Transition ke complete hone ke baad</b> reset ho. Ye manual form-submission code (jaise <code>onSubmit</code> + <code>startTransition</code>) ko wahi auto-reset behavior deta hai jo <code>&lt;form action={...}&gt;</code> ko muft me milta hai. Signature: <code>requestFormReset(form)</code> — kuch return nahi karta.",
"<code>form</code> React dwara render kiya gaya ek HTML form element hai. React ek safal <code>&lt;form action={...}&gt;</code> submission ke baad uncontrolled fields ko automatically reset karta hai. Jab tum submission manually implement karo, to usi behavior ko opt in karne ke liye Transition ke andar <code>requestFormReset(form)</code> call karo — reset Action/Transition ke khatm hone ke liye schedule hota hai, turant perform nahi hota. Agar tumhara submission built-in <code>&lt;form action={...}&gt;</code> behavior use karta hai, to tumhe <code>requestFormReset</code> manually call karne ki zaroorat nahi — reset automatic hai.",
"Naam me hi iska svabhav hai: reset <i>request</i> hota hai (Action/Transition ke ant tak tala gaya), turant nahi hota — form element ke synchronous <code>reset()</code> method se yahi contrast hai.",
"Galtiyan: ek non-form element ya React dwara manage na kiya gaya form pass karna — error throw hota hai. Ise kisi Action ya Transition ke bahar call karna — React development me warning deta hai aur uski jagah ek synchronous reset perform karta hai. Iske controlled fields ko reset karne ki umeed — ye sirf uncontrolled fields ko reset karta hai; controlled fields ko state update karke reset karna hoga (jaise <code>onReset</code> me). Aur <code>&lt;form action&gt;</code> use karte waqt ise call karna — bekaar hai; reset automatic hai."],
c:"import { startTransition } from 'react';\nimport { requestFormReset } from 'react-dom';\n\nfunction SearchForm() {\n  async function onSubmit(event) {\n    event.preventDefault();\n    const form = event.currentTarget;\n    const formData = new FormData(form);\n    startTransition(async () => {\n      requestFormReset(form);\n      await submitSearch(formData);\n    });\n  }\n\n  return (\n    <form onSubmit={onSubmit}>\n      <input name=\"query\" defaultValue=\"react\" />\n      <button type=\"submit\">Search</button>\n    </form>\n  );\n}",
k:"Manual onSubmit + startTransition wale forms ko auto-reset chahiye to Transition ke andar requestFormReset(form) — reset turant nahi, Action ke ant me hota hai, aur sirf uncontrolled fields par."},
{n:106,g:13,t:"prefetchDNS",u:"https://react.dev/reference/react-dom/prefetchDNS",
p:["<code>prefetchDNS</code> (<code>react-dom</code> se) ek resource-hint API hai jo us server ka IP address (DNS) eagerly look up karta hai jisse tum resources load karne ki umeed rakhte ho — connection hints me <b>sabse sasta</b>. Signature: <code>prefetchDNS(\"https://example.com\")</code> — parameter <code>href</code>, us server ka URL jisse connect karna hai; kuch return nahi karta.",
"Ye browser ko ek hint deta hai ki host ka IP address pehle se resolve kar le; agar browser aisa karta hai, to us server ke resources zyada tezi se load hote hain. Ise ek component render karte waqt call karo (jab tumhe pata ho ki uske children us host se external resources load karenge) ya ek event handler me, kisi aisi page/state par transition karne se <b>pehle</b> jise un resources ki zaroorat hai — nayi page ke render ke dauraan call karne se pehle. Same server ke saath kai calls ka asar ek call ke barabar hota hai (de-duplication). Browser me tum ise kahin bhi call kar sakte ho (render, Effect, event handler). SSR / Server Components me iska asar sirf tab hota hai jab ise ek component render karte waqt ya rendering se utpann ek async context me call kiya jaye; doosri calls ignore ho jati hain.",
"<b>Resource-hint ki seedhi</b> (interview me pakki): <code>prefetchDNS</code> (sirf DNS) → <code>preconnect</code> (DNS + TCP + TLS) → <code>preload</code> (ek specific resource fetch karna) → <code>preinit</code> (fetch + execute). Har seedhi batati hai ki kaunsi kya karti hai. Galtiyan: apne khud ke host ko prefetch karna — koi fayda nahi; hint diye jaane tak uska DNS pehle se resolved hota hai. Jab tumhe specific resources pata hon tab iska istemal — uski jagah <code>preload</code>/<code>preinit</code> use karo, jo resources ko turant load karna shuru kar dete hain. SSR/Server Components me render ke bahar call karna — ignore ho jata hai. Aur kai speculative domains ke liye <code>preconnect</code> ka zyada istemal — wahan <code>prefetchDNS</code> behtar chunav hai, kyunki preconnections me har domain par zyada overhead hota hai."],
c:"import { prefetchDNS } from 'react-dom';\n\n// Render karte waqt\nfunction AppRoot() {\n  prefetchDNS(\"https://example.com\");\n  return ...;\n}\n\n// Event handler me, transition se pehle\nfunction CallToAction() {\n  const onClick = () => {\n    prefetchDNS('http://example.com');\n    startWizard();\n  };\n  return <button onClick={onClick}>Start Wizard</button>;\n}",
k:"prefetchDNS seedhi ka pehla paydan hai — sirf DNS resolve. Apne host par bekaar hai; kai speculative domains ke liye preconnect se sasta aur sahi chunav yahi hai."},
{n:107,g:13,t:"preconnect",u:"https://react.dev/reference/react-dom/preconnect",
p:["<code>preconnect</code> (<code>react-dom</code> se) us server se eagerly ek connection kholta hai jisse tum resources load karne ki umeed rakhte ho — <code>prefetchDNS</code> se ek paydan upar (DNS + TCP handshake + TLS negotiation). Signature: <code>preconnect(\"https://example.com\")</code> — parameter <code>href</code>, us server ka URL jisse connect karna hai; kuch return nahi karta.",
"Ye browser ko hint deta hai ki diye gaye server se pehle se connection khol le; agar browser aisa karta hai, to us server ke resources zyada tezi se load hote hain. Istemal ka pattern <code>prefetchDNS</code> wala hi hai: ek component render karte waqt call karo jiske children us host se external resources load karenge, ya ek event handler me unki zaroorat wali page/state par transition karne se pehle. Same server ke saath kai calls ek call ke barabar hain. Browser me kahin bhi callable hai; SSR / Server Components me sirf tab asar hota hai jab ek component render karte waqt ya rendering se utpann ek async context me call kiya jaye — render ke bahar ki calls ignore ho jati hain.",
"Galtiyan: apne khud ke host se preconnect karna — koi fayda nahi; hint diye jaane tak wo pehle se connected hota hai. Jab specific resources pata hon tab iska istemal — <code>preload</code>/<code>preinit</code> uski jagah unhe turant load karna shuru kar dete hain. Kai domains se speculatively preconnect karna — overhead fayde se zyada ho sakta hai; us case ke liye <code>prefetchDNS</code> sasta hai. Aur dhyaan do: dono hi sirf <b>hints</b> hain — browser unpar amal na karne ka chunav kar sakta hai. Interview ka mudda: <code>preconnect</code> banam <code>prefetchDNS</code> — preconnect DNS + TCP + TLS karta hai; prefetchDNS sirf DNS. Preconnect mazboot hai lekin har domain par mehenga hai."],
c:"import { preconnect } from 'react-dom';\n\nfunction AppRoot() {\n  preconnect(\"https://example.com\");\n  return ...;\n}\n\nfunction CallToAction() {\n  const onClick = () => {\n    preconnect('http://example.com');\n    startWizard();\n  };\n  return <button onClick={onClick}>Start Wizard</button>;\n}",
k:"preconnect = DNS + TCP + TLS pehle se. Mazboot hint hai lekin har domain par cost hai — chuninda hosts ke liye rakho, baakiyon ke liye prefetchDNS."},
{n:108,g:13,t:"preload",u:"https://react.dev/reference/react-dom/preload",
p:["<code>preload</code> (<code>react-dom</code> se) ek specific resource (stylesheet, font, external script, …) ko eagerly <b>fetch</b> karta hai jiske istemal ki tum umeed rakhte ho — ye use download karta hai, lekin execute <b>nahi</b> karta. Ek note: React-based frameworks aksar resource loading tumhare liye sambhalte hain, to shayad tumhe ye API khud call nahi karna padega. Signature: <code>preload(\"https://example.com/font.woff2\", {as: \"font\"})</code>; kuch return nahi karta.",
"Parameters: <code>href</code> — string; us resource ka URL jo download karna hai. <code>options</code> — ek object: <code>as</code> — <b>lazmi (required)</b> string; resource ki type: <code>audio</code>, <code>document</code>, <code>embed</code>, <code>fetch</code>, <code>font</code>, <code>image</code>, <code>object</code>, <code>script</code>, <code>style</code>, <code>track</code>, <code>video</code>, <code>worker</code>. <code>crossOrigin</code> — string; CORS policy: <code>anonymous</code> ya <code>use-credentials</code>; jab <code>as</code> <code>\"fetch\"</code> ho to required hai. <code>referrerPolicy</code> — string: <code>no-referrer-when-downgrade</code> (default), <code>no-referrer</code>, <code>origin</code>, <code>origin-when-cross-origin</code>, <code>unsafe-url</code>. <code>integrity</code> — string; authenticity verify karne ke liye cryptographic hash. <code>type</code> — string; resource ka MIME type. <code>nonce</code> — string; sakht CSP ke liye cryptographic nonce. <code>fetchPriority</code> — string: <code>auto</code> (default), <code>high</code>, <code>low</code>. <code>imageSrcSet</code> — string; sirf <code>as: \"image\"</code> ke saath; image ka source set. <code>imageSizes</code> — string; sirf <code>as: \"image\"</code> ke saath; image ke sizes.",
"Ye browser ko hint deta hai ki resource download karna shuru kar de, jisse samay bachta hai. Ise ek component render karte waqt call karo jo (ya jiske children) resource use karega, ya ek event handler me us page/state par transition karne se pehle jise uski zaroorat hai. Kai equivalent calls ek call ke barabar hain (same <code>href</code>; <code>as: \"image\"</code> ke liye same <code>imageSrcSet</code> aur <code>imageSizes</code> bhi). Browser me kahin bhi callable hai; SSR / Server Components me sirf render ke dauraan (ya rendering se utpann async context me) asar hota hai — bahar ki calls ignore. Agar tum chahte ho ki browser script ko sirf download karne ke bajaye turant <b>execute</b> bhi kare, to <code>preinit</code> use karo; ek ESM module ke liye <code>preloadModule</code> use karo.",
"Galtiyan: <code>as</code> na dena — ye required hai; browser ko resource type jaanna zaroori hai taaki wo use sahi tareeke se fetch kare. Execution ki umeed — <code>preload</code> sirf download karta hai; execute karne ke liye <code>preinit</code> use karo. Ise ek ESM module ke liye use karna — uski jagah <code>preloadModule</code>. Aur SSR wali wahi baat. Interview ka mukhya farq: <code>preload</code> (sirf download) banam <code>preinit</code> (download + execute)."],
c:"import { preload } from 'react-dom';\n\nfunction AppRoot() {\n  preload(\"https://example.com/script.js\", {as: \"script\"});\n  return ...;\n}\n\nfunction CallToAction() {\n  const onClick = () => {\n    preload(\"https://example.com/wizardStyles.css\", {as: \"style\"});\n    startWizard();\n  };\n  return <button onClick={onClick}>Start Wizard</button>;\n}",
k:"preload sirf download karta hai, execute nahi — execute chahiye to preinit. as required hai, aur ESM module ke liye preloadModule hai."},
{n:109,g:13,t:"preloadModule",u:"https://react.dev/reference/react-dom/preloadModule",
p:["<code>preloadModule</code> (<code>react-dom</code> se) ek <b>ESM module</b> ko eagerly fetch karta hai jiske istemal ki tum umeed rakhte ho — <code>preload</code> ka module counterpart. Frameworks aksar resource loading tumhare liye sambhalte hain, to shayad tumhe ye API khud call nahi karna padega. Signature: <code>preloadModule(\"https://example.com/module.js\", {as: \"script\"})</code>; kuch return nahi karta.",
"Parameters: <code>href</code> — string; us module ka URL jo download karna hai. <code>options</code> — ek object: <code>as</code> — <b>required</b> string; ye <code>'script'</code> hi hona chahiye. <code>crossOrigin</code> — string: <code>anonymous</code> ya <code>use-credentials</code>. <code>integrity</code> — string; cryptographic hash. <code>nonce</code> — string; sakht CSP ke liye cryptographic nonce. <code>fetchPriority</code> — string: <code>auto</code> (default), <code>high</code>, <code>low</code>.",
"Ye browser ko hint deta hai ki module download karna shuru kar de, jisse samay bachta hai. Ek component render karte waqt call karo jo (ya jiske children) module use karega, ya transition se pehle ek event handler me. Same <code>href</code> ke saath kai calls ek call ke barabar hain. Browser me kahin bhi callable hai; SSR / Server Components me sirf render ke dauraan (ya rendering se utpann async context me) asar hota hai. Module ko download par turant <b>execute</b> karne ke liye <code>preinitModule</code> use karo; ek non-ESM script ke liye <code>preload</code> use karo.",
"Galtiyan: ek ESM module ke liye <code>preload</code> use karna — <code>preloadModule</code> use karo; <code>preload</code> non-module scripts ke liye hai. Execution ki umeed — <code>preloadModule</code> sirf download karta hai; <code>preinitModule</code> execute karta hai. <code>'script'</code> ke alawa koi <code>as</code> dena — ye <code>'script'</code> hi hona chahiye. Aur SSR/Server Components me render ke bahar call karna — ignore. Interview ki pasandeeda <b>2×2 matrix</b>: <code>preload</code> (script, download) / <code>preinit</code> (script, download+execute) / <code>preloadModule</code> (ESM, download) / <code>preinitModule</code> (ESM, download+execute) — ye grid pakki rakho."],
c:"import { preloadModule } from 'react-dom';\n\nfunction AppRoot() {\n  preloadModule(\"https://example.com/module.js\", {as: \"script\"});\n  return ...;\n}\n\nfunction CallToAction() {\n  const onClick = () => {\n    preloadModule(\"https://example.com/module.js\", {as: \"script\"});\n    startWizard();\n  };\n  return <button onClick={onClick}>Start Wizard</button>;\n}",
k:"preloadModule = ESM ke liye sirf download; execute chahiye to preinitModule. as hamesha 'script' hi hoga."},
{n:110,g:13,t:"preinit",u:"https://react.dev/reference/react-dom/preinit",
p:["<code>preinit</code> (<code>react-dom</code> se) ek stylesheet ya external script ko eagerly fetch <b>aur evaluate</b> karta hai — <code>preload</code> se ek kadam aage, jo sirf download karta hai. Frameworks aksar resource loading tumhare liye sambhalte hain, to shayad tumhe ye API khud call nahi karna padega. Signature: <code>preinit(\"https://example.com/script.js\", {as: \"script\"})</code>; kuch return nahi karta.",
"Parameters: <code>href</code> — string; us resource ka URL jo download aur execute karna hai. <code>options</code> — ek object: <code>as</code> — <b>lazmi (required)</b> string; resource ki type: <code>script</code> ya <code>style</code> (sirf yahi do). <code>precedence</code> — string; <b>stylesheets ke saath required</b>; stylesheet ko doosron ke saapeksh kahan insert karna hai; zyada precedence kam ko override kar sakti hai; sambhav values: <code>reset</code>, <code>low</code>, <code>medium</code>, <code>high</code>. <code>crossOrigin</code> — string: <code>anonymous</code> ya <code>use-credentials</code>. <code>integrity</code> — cryptographic hash. <code>nonce</code> — sakht CSP ke liye cryptographic nonce. <code>fetchPriority</code> — string: <code>auto</code> (default), <code>high</code>, <code>low</code>.",
"Ye browser ko hint deta hai ki resource ko download <b>aur execute</b> karna shuru kar de, jisse samay bachta hai. Scripts download khatm hote hi execute ho jati hain; stylesheets document me insert ho jati hain aur turant asar karti hain. Ise tab call karo jab ek component render kar rahe ho jo resource use karega aur tumhe is baat se koi aitraaz nahi ki wo download par turant asar kare, ya transition se pehle ek event handler me. Same <code>href</code> ke saath kai calls ek call ke barabar hain. Browser me kahin bhi callable; SSR / Server Components me sirf render ke dauraan asar. Ise call karna browser ko ek <code>&lt;link&gt;</code>/<code>&lt;script&gt;</code> component render karne se pehle hi fetching shuru karwa sakta hai (jaise HTTP Early Hints ke zariye). Sirf download ke liye <code>preload</code> use karo; ek ESM module ke liye <code>preinitModule</code> use karo.",
