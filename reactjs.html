<style>

html{scroll-behavior:smooth}

.sidebar .brand{font-family:"JetBrains Mono",monospace;font-size:13px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase;padding:0 8px}
.sidebar .brand b{display:block;font-family:"Plus Jakarta Sans",sans-serif;font-size:22px;color:var(--text);letter-spacing:0;text-transform:none;margin-top:4px}
.sidebar .brand b span{color:var(--lime)}
.search-wrap{padding:12px 8px 4px}
.search-wrap input{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:11px 12px;font-size:15px;min-height:44px}

.nav-group h3{font-family:"JetBrains Mono",monospace;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);padding:0 8px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.nav-group h3 .gcount{color:var(--lime2);border:1px solid var(--border);border-radius:20px;padding:1px 8px;font-size:11px}

.chip.ghost{background:var(--surface2);color:var(--lime);border:1px solid var(--border)}
.nav-item .nt{flex:1;min-width:0;overflow-wrap:break-word}
.progress-wrap{padding:14px 8px 0}

.wrap{max-width:860px;margin:0 auto}
article.lesson{display:none}

.crumb{font-family:"JetBrains Mono",monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--lime);margin-bottom:10px}
article.lesson h2{font-size:32px;font-weight:800;margin-bottom:8px}
.lede{color:var(--muted);font-size:16.5px;margin:0 0 22px}

.faq-item{background:var(--surface);border:1px solid var(--border);border-radius:10px;margin:0 0 12px;overflow:hidden}

.faq-item .fa p{margin:0 0 8px}
.faq-item .fa code{color:var(--lime-soft);font-size:.92em}
.src-list{margin:0;padding:0;list-style:none}
.src-list li{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 14px;margin:0 0 8px;font-size:13.5px;word-break:break-all;display:flex;gap:10px;align-items:flex-start}

table{width:100%;border-collapse:collapse;font-size:14.5px}
th,td{border:1px solid var(--border);padding:10px 12px;text-align:left;vertical-align:top}
th{background:var(--surface2);font-family:"JetBrains Mono",monospace;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
td{background:var(--surface)}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:18px 0}

.stat .num{font-family:"JetBrains Mono",monospace;font-size:30px;font-weight:600;color:var(--lime);display:block}
.stat .lbl{font-size:13px;color:var(--muted)}
.check-result{font-family:"JetBrains Mono",monospace;font-size:16px;padding:16px;border-radius:10px;margin-top:14px;display:none}

.check-result.fail{display:block;background:#3a1512;border:1px solid var(--danger);color:var(--danger)}
.note-list li{margin-bottom:8px;color:var(--muted)}

footer.foot{color:var(--dim);font-size:13px;text-align:center;padding:26px 10px 0;font-family:"JetBrains Mono",monospace}

<script>
"use strict";
/* ================= DATA — 144 docs entries (143 unique pages) ================= */
var GROUPS=["Learn · Quick Start","Learn · Describing the UI","Learn · Adding Interactivity","Learn · Managing State","Learn · Escape Hatches","Reference · React — Hooks","Reference · React — Components","Reference · React — APIs","Reference · React — Directives","Reference · React — Legacy APIs","Reference · Rules of React","Reference · React DOM — Hooks","Reference · React DOM — Components","Reference · React DOM — APIs","Reference · React DOM — Client APIs","Reference · React DOM — Server APIs","Reference · React DOM — Static APIs","Reference · React Compiler","Reference · ESLint Plugin React Hooks"];
var S=[
{n:1,g:0,t:"Quick Start",u:"https://react.dev/learn",
p:["React ka pehla page — roz kaam aane wale <b>80% concepts</b> ek jagah: components banana aur nest karna, markup/styles, data dikhana, conditions aur lists, events aur state, aur components ke beech data share karna.",
"<b>Component = ek JavaScript function jo markup return karta hai.</b> Naam hamesha capital letter se shuru hota hai (chhota naam HTML tag samjha jata hai). <code>export default</code> file ke main component ko mark karta hai.",
"<b>JSX</b> markup likhne ka syntax hai — optional hai, lekin zyadaatar projects yahi use karte hain. HTML se sakht hai: saare tags band karo (<code>&lt;br /&gt;</code>), aur ek component do JSX tags return nahi kar sakta — shared parent (<code>&lt;div&gt;</code> ya fragment <code>&lt;&gt;...&lt;/&gt;</code>) me lapeto.",
"Styling ke liye <code>class</code> ki jagah <code>className</code> use hota hai; CSS alag file me likhte hain. Data dikhane ke liye curly braces JavaScript ki duniya me \"escape\" karte hain: content me <code>{user.name}</code>, attribute me quotes ki jagah <code>src={user.imageUrl}</code>. <code>style={{}}</code> koi special syntax nahi — <code>style={ }</code> ke andar ek plain object hai.",
"Conditional rendering ke liye koi special React syntax nahi — plain JavaScript: <code>if</code>/<code>else</code> se JSX variable me assign karo, ternary <code>? :</code> (JSX ke andar chalta hai), ya bina else wale case me <code>&amp;&amp;</code>. Lists ke liye <code>map()</code> — har item ko ek <code>key</code> chahiye (string ya number, siblings me unique, aam taur par database ID).",
"Events: handler function component ke andar declare karke <code>onClick={handleClick}</code> pass karo — <b>parentheses mat lagao</b>, warna handler render ke time hi call ho jayega. State ke liye <code>useState</code>: <code>const [count, setCount] = useState(0)</code> — current value + setter. Setter call karne par React component ko dobara call karta hai (re-render). Ek hi component ke har instance ki apni alag state hoti hai.",
"<b>Hooks</b> wo functions hain jo <code>use</code> se shuru hote hain. Ye sirf component (ya doosre Hook) ke <b>top level</b> par call hote hain — condition ya loop me kabhi nahi. Do sibling components ko same value dikhana aur saath update karna ho to state ko unke sabse kareebi common parent me \"upar uthao\" (<b>lifting state up</b>) aur value + handler props se neeche bhejo."],
c:"import { useState } from 'react';\n\nexport default function MyApp() {\n  const [count, setCount] = useState(0);\n  function handleClick() {\n    setCount(count + 1);\n  }\n  return (\n    <div>\n      <h1>Counters that update together</h1>\n      <MyButton count={count} onClick={handleClick} />\n      <MyButton count={count} onClick={handleClick} />\n    </div>\n  );\n}\n\nfunction MyButton({ count, onClick }) {\n  return (\n    <button onClick={onClick}>\n      Clicked {count} times\n    </button>\n  );\n}",
k:"Component = markup return karne wala function. State setter se re-render hota hai, aur shared state hamesha common parent me rehti hai."},
{n:2,g:0,t:"Tutorial: Tic-Tac-Toe",u:"https://react.dev/learn/tutorial-tic-tac-toe",
p:["Seekhte-seekhte banane wala tutorial: poora interactive tic-tac-toe game banao — move history ke saath (<b>time travel</b>). Koi pehle ki React jaankari nahi maangta; components, props aur state game banate-banate samajh aate hain.",
"Setup: CodeSandbox par fork karo, ya locally Node.js install karke <code>npm install</code> + <code>npm start</code>. Starter files: <code>App.js</code> (component), <code>styles.css</code> (<code>.square</code>, <code>.board-row</code> classes), <code>index.js</code> (bridge — React, React DOM, styles aur <code>App</code> ko import karke <code>index.html</code> me inject karta hai).",
"<b>Props:</b> reusable <code>Square</code> banao aur <code>Board</code> se <code>value</code> pass karo — <code>function Square({ value })</code> aur <code>&lt;Square value=\"1\" /&gt;</code>. Braces ke bina <code>value</code> likhne par literal shabd \"value\" render hoga; <code>{value}</code> JavaScript me escape karta hai. Paas wale JSX elements ek tag me lapetne padte hain, warna error: \"Adjacent JSX elements must be wrapped in an enclosing tag\" — Fragment se fix hota hai.",
"<b>State:</b> <code>const [value, setValue] = useState(null)</code> — <code>setValue('X')</code> par React us Square ko re-render karta hai. Har Square ki apni independent state hai. React Developer Tools (browser extension, Components tab) se props/state inspect kar sakte ho.",
"<b>Lifting state up:</b> winner check karne ke liye <code>Board</code> ko saare 9 squares ki state chahiye. Board ka har Square se \"poochhna\" technically mumkin hai lekin discouraged hai (samajhna mushkil, bug-prone, refactor mushkil). Behtar: game ki state parent me rakho — <code>const [squares, setSquares] = useState(Array(9).fill(null))</code> — aur <code>value={squares[i]}</code> neeche pass karo. State usi component ki private hoti hai jo use define karta hai, isliye Square seedha Board ki state nahi badal sakta — Board ek function (<code>onSquareClick</code>) neeche bhejta hai, Square use call karta hai.",
"<b>Pass karna vs call karna:</b> <code>onSquareClick={handleClick}</code> function pass karta hai; <code>onSquareClick={handleClick(0)}</code> use render ke dauraan <i>call</i> kar deta hai → <code>setSquares</code> → re-render → phir call — infinite loop (\"Too many re-renders\"). Fix: arrow function <code>onSquareClick={() =&gt; handleClick(0)}</code>. Convention: event props ke liye <code>onSomething</code>, handler definitions ke liye <code>handleSomething</code>.",
"<b>Immutability:</b> <code>handleClick</code> pehle <code>squares.slice()</code> se copy banata hai, phir <code>nextSquares[i] = 'X'</code> likhta hai. Seedha mutate karne se result waisa hi dikhega, lekin immutability (a) purane versions surakshit rakh kar time travel/undo-redo mumkin banati hai, aur (b) components ke liye \"data badla ya nahi\" compare karna sasta kar deti hai (<code>memo</code> ke liye zaroori).",
"Turns: <code>const [xIsNext, setXIsNext] = useState(true)</code>, har move par flip. Bhare hue square ko overwrite rokne ke liye early return: <code>if (squares[i]) { return; }</code>. <code>calculateWinner(squares)</code> 8 winning lines check karta hai — <code>[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]]</code> — aur <code>'X'</code>, <code>'O'</code> ya <code>null</code> return karta hai.",
"<b>Time travel:</b> har purana <code>squares</code> array ek <code>history</code> state me rakho (<code>[Array(9).fill(null)]</code>). State phir upar uthao — naye top-level <code>Game</code> component me; <code>Board</code> ab poori tarah props se controlled hai (<code>{ xIsNext, squares, onPlay }</code>). <code>handlePlay(nextSquares)</code> spread se jodta hai: <code>setHistory([...history, nextSquares])</code>. Move list <code>history.map(...)</code> se banti hai — move 0 ke liye \"Go to game start\", baaki ke liye \"Go to move #N\".",
"<b>Keys:</b> key React ko har component ki pehchan batati hai taaki re-renders ke beech state bani rahe. Key badli → component destroy hokar naye state ke saath dobara banta hai. <code>key</code> special/reserved hai — React use nikaal leta hai, component apni key khud nahi padh sakta. Dynamic lists ke liye strongly recommended; key na do to React default me array index use karta hai. Keys sirf siblings ke beech unique honi chahiye, globally nahi. Yahan move index key ke roop me safe hai kyunki moves kabhi reorder/delete/insert nahi hote.",
"<b>Derived state:</b> <code>currentMove</code> state rakho; <code>xIsNext</code> usi se derive hota hai — <code>const xIsNext = currentMove % 2 === 0</code> — isliye <code>xIsNext</code> state aur uske setter calls hata do. Jo cheez doosri state se hamesha calculate ho sakti hai, use alag state me rakhna redundant hai aur sync se bahar ja sakta hai. Past se khelne par future history truncate hoti hai: <code>[...history.slice(0, currentMove + 1), nextSquares]</code>."],
c:"const [squares, setSquares] = useState(Array(9).fill(null));\n\nfunction handleClick(i) {\n  if (calculateWinner(squares) || squares[i]) {\n    return;\n  }\n  const nextSquares = squares.slice();\n  nextSquares[i] = xIsNext ? 'X' : 'O';\n  onPlay(nextSquares);\n}\n\n// Game: time travel\nconst [history, setHistory] = useState([Array(9).fill(null)]);\nconst [currentMove, setCurrentMove] = useState(0);\nconst xIsNext = currentMove % 2 === 0;\nconst currentSquares = history[currentMove];",
k:"State parent me, updates immutable copies se, aur jo derive ho sakta hai use state mat banao — poora tutorial inhी teen aadaat par khada hai."},
{n:3,g:0,t:"Thinking in React",u:"https://react.dev/learn/thinking-in-react",
p:["Design-soch wala tutorial: designer ke mockup + JSON API se searchable product data table banao — React ke standard <b>paanch steps</b> me. Ye tic-tac-toe ka conceptual saathi hai.",
"<b>Paanch steps:</b> (1) UI ko component hierarchy me todo; (2) React me static version banao; (3) UI state ka minimal lekin complete representation dhoondho; (4) pehchano ki state kahan rehni chahiye; (5) inverse data flow jodo.",
"<b>Step 1 — hierarchy:</b> mockup me har component ke chaaron taraf box banao aur naam do (designer se poochho — design tool me naam pehle se ho sakte hain). Teen nazariye: programming (separation of concerns — component ideally ek hi kaam kare, bade to todo), CSS (kis ke liye class selector banate — lekin components thode kam granular hote hain), design (design ki layers kaise organize hain). Achhi-bani JSON aksar component structure se naturally map hoti hai kyunki UI aur data model ki information architecture ek hi hoti hai. Paanch components: <code>FilterableProductTable</code> (poora app), <code>SearchBar</code> (user input), <code>ProductTable</code> (list dikhana/filter karna), <code>ProductCategoryRow</code> (category heading), <code>ProductRow</code> (ek row). Table header <code>ProductTable</code> ke andar hi rakha gaya — complex hone par (jaise sorting) wo <code>ProductTableHeader</code> ban sakta hai.",
"<b>Step 2 — static version:</b> data model se UI render karo, bina kisi interactivity ke. Pehle static (bohot typing, soch kam), phir interactivity (soch zyada, typing kam). Sirf props use karo — <b>state bilkul nahi</b> (state sirf us data ke liye hai jo samay ke saath badalta hai). Chhote examples top-down, bade projects bottom-up banao. Upar wala component data model ko prop ke roop me leta hai — <b>one-way data flow</b>: data tree ke upar se neeche behta hai. <code>ProductRow</code> unstocked naam laal rang me dikhata hai; <code>ProductTable</code> <code>lastCategory</code> track karke rows group karta hai, keys <code>key={product.category}</code> / <code>key={product.name}</code>.",
"<b>Step 3 — minimal state:</b> state wo sabse chhota badalne-wala data hai jo app ko yaad rakhna hai; DRY rakho — baaki sab on-demand compute karo (list ka count state me mat rakho, array ki length padh lo). Teen test: kya ye samay ke saath unchanged rehta hai? Kya ye parent se props me aaya hai? Kya tum ise existing state/props se compute kar sakte ho? Kisi ka bhi jawab haan → ye state <i>nahi</i> hai. Yahan: original product list props se aati hai (state nahi), search text state hai, checkbox value state hai, filtered list computed hai (state nahi). Sirf search text aur checkbox hi state hain.",
"<b>Props vs State:</b> props function ke arguments jaise hain — parent child ko data dekar uska appearance customize karta hai (<code>Form</code> <code>Button</code> ko <code>color</code> deta hai). State component ki memory jaisi hai — jaankari track karti hai aur interaction par badalti hai (<code>Button</code> apna <code>isHovered</code> track karta hai). Parent aksar jaankari state me rakh kar props se neeche bhejta hai.",
"<b>Step 4 — state kahan rahe:</b> har state ke liye: (1) wo saare components pehchano jo uske basis par kuch render karte hain; (2) unka closest common parent dhoondho; (3) tay karo — aam taur par state seedha common parent me, ya usse upar kisi component me, ya sirf state rakhne ke liye ek naya component common parent ke upar. Yahan <code>ProductTable</code> state se filter karta hai aur <code>SearchBar</code> use dikhata hai; common parent <code>FilterableProductTable</code> hai, isliye <code>filterText</code>/<code>inStockOnly</code> wahi rehte hain aur dono children ko props se milte hain.",
"<b>Step 5 — inverse data flow:</b> props/state neeche behte hain, lekin tree me gehraai me hue user input ko upar wali state update karni hoti hai. React ise explicit banata hai (two-way binding se zyada typing, lekin saaf). Sirf <code>&lt;input value={filterText} /&gt;</code> bina <code>onChange</code> ke field ko read-only bana deta hai — React typing ignore karta hai, by design, aur console me error deta hai. Fix: setters ko props se neeche bhejo (<code>onFilterTextChange={setFilterText}</code>) aur <code>SearchBar</code> ke <code>onChange</code> handlers se call karo."],
c:"function FilterableProductTable({ products }) {\n  const [filterText, setFilterText] = useState('');\n  const [inStockOnly, setInStockOnly] = useState(false);\n  return (\n    <div>\n      <SearchBar\n        filterText={filterText}\n        inStockOnly={inStockOnly}\n        onFilterTextChange={setFilterText}\n        onInStockOnlyChange={setInStockOnly} />\n      <ProductTable\n        products={products}\n        filterText={filterText}\n        inStockOnly={inStockOnly} />\n    </div>\n  );\n}",
k:"Hierarchy → static version → minimal state → state ka sahi ghar → inverse data flow. Kisi bhi mockup ko React UI me badalne ka yahi canonical tareeqa hai."},
{n:4,g:1,t:"Your First Component",u:"https://react.dev/learn/your-first-component",
p:["\"Describing the UI\" ka pehla page: component kya hai, kyun hota hai, aur apna pehla component kaise likhte aur use karte hain.",
"<b>Components UI ke building blocks hain.</b> HTML built-in tags deta hai (<code>&lt;h1&gt;</code>, <code>&lt;li&gt;</code>); React markup, CSS aur JavaScript ko milakar custom, reusable UI elements banane deta hai — jaise <code>&lt;TableOfContents /&gt;</code> jo har page par render ho. Components HTML tags ki tarah compose, order aur nest hote hain — poora docs page khud components hai (<code>&lt;PageLayout&gt;</code>, <code>&lt;NavigationHeader&gt;</code>, <code>&lt;Sidebar&gt;</code>…). Reuse se development tez hota hai; Chakra UI, Material UI jaisi community libraries hazaaron shared components deti hain.",
"<b>Component define karne ke teen steps:</b> (1) export karo — <code>export default</code> standard JavaScript syntax hai (React-specific nahi), file ke main function ko mark karta hai; (2) function define karo — <code>function Profile() { }</code>; (3) markup jodo — component ek <code>&lt;img /&gt;</code> tag return karta hai; ye markup JSX hai, jo markup ko JavaScript ke andar embed karne deta hai. Component ek JavaScript function hai jisme tum markup \"chhidak\" sakte ho.",
"<b>Return ka niyam:</b> ek line ka return ho to parentheses nahi chahiye; markup <code>return</code> wali line par poora na ho to use parentheses me lapeto.",
"<b>Component use karna:</b> <code>Profile</code> ko <code>Gallery</code> ke andar nest karke kai baar render karo. Casing hi signal hai: lowercase <code>&lt;section&gt;</code> HTML tag hai; capital <code>&lt;Profile /&gt;</code> tumhara component. Browser ko aakhir me plain HTML hi dikhta hai (<code>&lt;section&gt;</code>, <code>&lt;h1&gt;</code>, teen <code>&lt;img&gt;</code>).",
"<b>Nesting aur organizing:</b> chhote ya closely related components ek file me reh sakte hain; file bheed-bhari ho jaye to component ko apni file me le jao (imports agle page par hain). Jo component doosre ke andar render hota hai wo \"child\" hai, render karne wala \"parent\". Ek baar define karo, kahin bhi, kitni bhi baar use karo.",
"<b>Components all the way down:</b> har app ek \"root\" component se shuru hota hai, jo aam taur par automatically banta hai (CodeSandbox ya Next.js ka <code>pages/index.js</code>). Zyadaatar apps har cheez ke liye components use karte hain — buttons, sidebars, lists, poore pages — one-off pieces ke liye bhi, ek organizing tool ke roop me. React frameworks components se automatically HTML bhi generate karte hain (taaki content JavaScript load hone se pehle dikhe). Kai sites React ko sirf existing HTML pages me interactivity jodne ke liye use karti hain, kai root components ke saath — jitna React chahiye utna hi use karo."],
c:"function Profile() {\n  return (\n    <img\n      src=\"https://react.dev/images/docs/scientists/MK3eW3As.jpg\"\n      alt=\"Katherine Johnson\"\n    />\n  );\n}\n\nexport default function Gallery() {\n  return (\n    <section>\n      <h1>Amazing scientists</h1>\n      <Profile />\n      <Profile />\n      <Profile />\n    </section>\n  );\n}",
k:"Component = export + function + JSX return. Capital letter hi React ko batata hai ki ye tumhara component hai, HTML tag nahi. Component definitions kabhi doosre component ke andar nest mat karo — bohot slow hota hai aur bugs aate hain; hamesha top level par define karo."},
{n:5,g:1,t:"Importing and Exporting Components",u:"https://react.dev/learn/importing-and-exporting-components",
p:["Components ko files me baantna: root component file, default vs named exports/imports, aur ek file se kai components export karna.",
"<b>Root component file:</b> wo file jisme top component rehta hai (yahan <code>App.js</code>). File-based routing (jaise Next.js) me root component har page ke liye alag hota hai.",
"<b>Component move karne ke 3 steps:</b> (1) nayi JS file banao; (2) component ko wahan se export karo (default ya named); (3) jahan use hota hai wahan matching style se import karo. Example: <code>Profile</code> + <code>Gallery</code> ko <code>Gallery.js</code> me le jao — <code>Profile</code> unexported rehta hai (sirf usi file me use hota hai), <code>Gallery</code> default export hai; <code>App.js</code> <code>Gallery</code> ko default-import karke root <code>App</code> ko default-export karta hai.",
"<b>File extension:</b> <code>import Gallery from './Gallery';</code> aur <code>'./Gallery.js'</code> dono React ke saath chalte hain; dusra native ES Modules ke zyada kareeb hai.",
"<b>Default vs named exports:</b> ek file me <b>ek se zyada default export nahi ho sakta, lekin named exports jitne chaaho</b>. Export hi import tay karta hai — default export ko named ki tarah import karne par error aayega. Default: <code>export default function Button() {}</code> → <code>import Button from './Button.js';</code> Named: <code>export function Button() {}</code> → <code>import { Button } from './Button.js';</code>",
"<b>Default import ke naam free hain:</b> <code>import Banana from './Button.js'</code> bhi wahi default export dega. Named imports dono taraf match hone chahiye — isiliye unhe \"named\" kehte hain. Riwaaz (convention) ye hai: file ek component export kare to default, kai components/values export kare to named. Kuch teams ek hi style rakhti hain ya ek file me dono mix nahi karti. Component functions aur files ko hamesha meaningful naam do — <code>export default () =&gt; {}</code> jaise anonymous components debugging mushkil kar dete hain.",
"<b>Ek file se kai components:</b> <code>Gallery.js</code> me default export pehle se hai, to <code>Profile</code> ko named export jodo: <code>export function Profile() {}</code> aur <code>import { Profile } from './Gallery.js';</code>. Ab <code>Gallery.js</code> ke paas default <code>Gallery</code> + named <code>Profile</code> hai; <code>App.js</code> dono import karta hai."],
c:"// Gallery.js\nexport function Profile() { /* ... */ }\nexport default function Gallery() { /* ... */ }\n\n// App.js\nimport Gallery, { Profile } from './Gallery.js';\n\nexport default function App() {\n  return <Profile />;\n}",
k:"Default export ek hi hota hai aur import par naam free hai; named exports kai ho sakte hain lekin naam dono taraf match hona chahiye."},
{n:6,g:1,t:"Writing Markup with JSX",u:"https://react.dev/learn/writing-markup-with-jsx",
p:["JSX kyun hai, HTML se kaise alag hai, aur HTML ko JSX me badalne ke <b>teen niyam</b> — \"Hedy Lamarr's Todos\" wale HTML snippet ko component me badal kar seekhte hain.",
"<b>Markup + logic saath kyun:</b> web pehle content (HTML), design (CSS) aur logic (JS) ko alag files me rakhta tha. Jaise-jaise web interactive hua, logic hi content tay karne laga — JavaScript HTML ka in-charge ban gaya. Isliye React me rendering logic aur markup components me saath rehte hain. Button ki rendering logic aur markup saath rakhne se har edit par dono sync me rehte hain; unrelated details (button markup vs sidebar markup) alag rehte hain, isliye ek ko badalna surakshit hai.",
"<b>JSX JavaScript ka syntax extension hai</b> (React khud nahi — JSX aur React do alag cheezein hain, dono independently use ho sakte hain). Ye ek JS file me HTML-jaisa markup likhne deta hai; zyadaatar React developers iski conciseness ke liye use karte hain.",
"<b>Niyam 1 — ek single root element return karo:</b> kai elements ko ek parent tag (<code>&lt;div&gt;</code>) ya Fragment (<code>&lt;&gt;...&lt;/&gt;</code>) me lapeto. Fragments cheezein group karte hain bina browser ke HTML tree me koi nishan chhode. Gehraai se: JSX plain JavaScript objects me transform hota hai, aur tum ek function se do objects bina array me lapete return nahi kar sakte — yahi wajah hai ki do JSX tags bina wrapper ke return nahi ho sakte.",
"<b>Niyam 2 — saare tags band karo:</b> self-closing tags jaise <code>&lt;img&gt;</code> ko <code>&lt;img /&gt;</code> banao; wrapping tags jaise <code>&lt;li&gt;oranges</code> ko <code>&lt;li&gt;oranges&lt;/li&gt;</code>.",
"<b>Niyam 3 — zyadaatar cheezein camelCase me:</b> JSX attributes JavaScript objects ki keys ban jate hain, aur JS variable naamo me dash nahi ho sakte aur <code>class</code> jaise reserved words nahi ho sakte. Isliye <code>stroke-width</code> → <code>strokeWidth</code>, <code>class</code> → <code>className</code> (corresponding DOM property ke naam par). Galat likhne par React browser console me possible correction ke saath message deta hai. Exception: historical reasons se <code>aria-*</code> aur <code>data-*</code> attributes apne HTML dashes rakhte hain.",
"Pro-tip: existing HTML/SVG ko JSX me badalne ke liye JSX converter (jaise transform.tools) use karo — practice me kaam ka hai, lekin niyam samajhna phir bhi zaroori hai taaki tum aaram se JSX likh sako. Atak jao to React ke on-screen error messages padho — wo aam taur par problem ki taraf ishara karte hain."],
c:"export default function TodoList() {\n  return (\n    <>\n      <h1>Hedy Lamarr's Todos</h1>\n      <img\n        src=\"https://react.dev/images/docs/scientists/yXOvdOSs.jpg\"\n        alt=\"Hedy Lamarr\"\n        className=\"photo\"\n      />\n      <ul>\n        <li>Invent new traffic lights</li>\n        <li>Rehearse a movie scene</li>\n        <li>Improve the spectrum technology</li>\n      </ul>\n    </>\n  );\n}",
k:"JSX ke teen niyam: ek root element, saare tags band, camelCase attributes. Aur yaad rakho — JSX HTML nahi, JavaScript objects me badalne wala syntax hai."},
{n:7,g:1,t:"JavaScript in JSX with Curly Braces",u:"https://react.dev/learn/javascript-in-jsx-with-curly-braces",
p:["Curly braces se JSX ke andar JavaScript embed karna: strings, variables, function calls, aur objects (inline styles samet).",
"<b>Quotes wali strings:</b> string attributes single/double quotes me jate hain (<code>src=\"https://...\"</code>). Value dynamically deni ho to quotes ko braces se badal do: <code>src={avatar}</code> JavaScript variable <code>avatar</code> padhta hai, jabki <code>className=\"avatar\"</code> literal string <code>\"avatar\"</code> pass karta hai.",
"<b>Curly braces = JavaScript duniya ki khidki:</b> JSX JavaScript likhne ka ek tareeqa hai, isliye braces ke beech koi bhi JavaScript expression chalta hai — variables (<code>{name}</code>), function calls jaise <code>formatDate()</code>.",
"<b>Curlies sirf do jagah use ho sakte hain:</b> (1) JSX tag ke andar seedha text ke roop me — <code>&lt;h1&gt;{name}'s To Do List&lt;/h1&gt;</code> chalta hai, lekin <code>&lt;{tag}&gt;...&lt;/{tag}&gt;</code> nahi chalta; (2) <code>=</code> ke turant baad attributes ke roop me — <code>src={avatar}</code> variable padhta hai, lekin <code>src=\"{avatar}\"</code> literal string <code>\"{avatar}\"</code> pass kar deta hai.",
"<b>\"Double curlies\" — JSX me objects:</b> objects braces se denote hote hain (<code>{ name: \"Hedy Lamarr\", inventions: 5 }</code>), isliye JSX me object pass karne ke liye ek aur pair chahiye: <code>person={{ name: \"Hedy Lamarr\", inventions: 5 }}</code>. Inline styles aam case hain: <code>style</code> ek object leta hai — <code>&lt;ul style={{ backgroundColor: 'black', color: 'pink' }}&gt;</code> sirf JSX curlies ke andar ek object hai, koi special syntax nahi. React inline styles maangta nahi hai; zyadaatar cases me CSS classes kaafi hain. Dhyaan do: inline <code>style</code> properties camelCase hoti hain — HTML ka <code>background-color</code> JSX me <code>backgroundColor</code> banta hai.",
"<b>Data ke roop me objects:</b> kai expressions ko ek object me le jao aur wahan se reference karo — <code>const person = { name: 'Gregorio Y. Zara', theme: { backgroundColor: 'black', color: 'pink' } }</code>, phir <code>&lt;div style={person.theme}&gt;&lt;h1&gt;{person.name}'s Todos&lt;/h1&gt;…</code>. JSX ek minimal templating language hai kyunki ye tumhe JavaScript se hi data aur logic organize karne deta hai."],
c:"const person = {\n  name: 'Gregorio Y. Zara',\n  theme: { backgroundColor: 'black', color: 'pink' }\n};\n\nexport default function TodoList() {\n  return (\n    <div style={person.theme}>\n      <h1>{person.name}'s Todos</h1>\n      <img\n        className=\"avatar\"\n        src=\"https://react.dev/images/docs/scientists/7vQD0fPs.jpg\"\n        alt=\"Gregorio Y. Zara\"\n      />\n      <ul>\n        <li>Improve the videophone</li>\n        <li>Prepare aeronautics lectures</li>\n        <li>Work on the alcohol-fuelled engine</li>\n      </ul>\n    </div>\n  );\n}",
k:"Braces sirf text ya attribute ki jagah aate hain, {{ }} sirf object-inside-braces hai. Poora object child ke roop me render karne par crash hoga — \"Objects are not valid as a React child\" — {person.name} likho, {person} nahi."},
{n:8,g:1,t:"Passing Props to a Component",u:"https://react.dev/learn/passing-props-to-a-component",
p:["Props system: parent → child data bhejna, use padhna, default values, spread syntax, <code>children</code>, aur samay ke saath props ka badalna.",
"<b>Jaane-pehchane props:</b> props wo jaankari hai jo tum JSX tag ko dete ho. <code>&lt;img&gt;</code> predefined props leta hai (<code>className</code>, <code>src</code>, <code>alt</code>, <code>width</code>, <code>height</code> — ReactDOM HTML standard ke mutabiq hai). Tumhare apne components tumhare define kiye hue koi bhi props le sakte hain. Props koi bhi JavaScript value le ja sakte hain — objects, arrays, functions.",
"<b>Props pass karna (2 steps):</b> (1) parent me pass karo: <code>&lt;Avatar person={{ name: 'Lin Lanying', imageId: '1bX5QH6' }} size={100} /&gt;</code>; (2) child me parameter list me destructuring se padho: <code>function Avatar({ person, size })</code>. <code>(</code> <code>)</code> ke andar <code>{</code> <code>}</code> lagana mat bhoolo — yahi destructuring syntax <code>person</code>/<code>size</code> ko variables ke roop me uplabdh karata hai. Props \"knobs\" jaise hain; parent aur child ko independently socha ja sakta hai.",
"<b>Props hi ekmatra argument hai:</b> component function ek single <code>props</code> object leta hai — <code>function Avatar(props) { let person = props.person; }</code> — lekin aam taur par tum use destructure karte ho.",
"<b>Default value dena:</b> destructuring me <code>=</code> lagao: <code>function Avatar({ person, size = 100 })</code>. Default sirf tab lagta hai jab prop missing ho ya <code>undefined</code> ho; <code>size={null}</code> ya <code>size={0}</code> par <b>nahi</b> lagta.",
"<b>Spread se forwarding:</b> <code>&lt;Avatar {...props} /&gt;</code> <code>Profile</code> ke saare props bina list kiye aage bhej deta hai. Repetitive explicit passing theek hai aur aksar zyada legible hota hai; spread sambhal kar use karo — har doosre component me spread use karna design problem ka signal hai (components split karo, <code>children</code> ke roop me JSX pass karo).",
"<b>JSX ko children ke roop me pass karna:</b> JSX tag ke andar nested content <code>children</code> naam ke prop me aata hai. <code>Card</code> ko <code>children</code> milta hai (yahan <code>&lt;Avatar /&gt;</code>) aur wo use ek wrapper div me render karta hai: <code>function Card({ children }) { return &lt;div className=\"card\"&gt;{children}&lt;/div&gt;; }</code>. <code>children</code> prop wala component ek \"hole\" hai jise parent manchaahe JSX se bharta hai — visual wrappers (panels, grids) ka standard pattern. <code>Card</code> ko jaanne ki zaroorat nahi ki andar kya hai.",
"<b>Props samay ke saath kaise badalte hain:</b> ek component ko samay ke saath alag props mil sakte hain — <code>Clock</code> example ka <code>time</code> prop har second badalta hai. Props kisi bhi samay component ke data ko reflect karte hain, sirf shuruaat me nahi. Lekin props <b>immutable</b> hain (\"unchangeable\"): inhe badalna ho to component ko parent se \"kehna\" padta hai ki wo <i>alag props</i> pass kare — ek naya object; purane props ek taraf kar diye jate hain aur garbage-collected ho jate hain. <b>Props ko \"change\" karne ki koshish mat karo</b> — interactivity chahiye to state set karo."],
c:"import { getImageUrl } from './utils.js';\n\nfunction Avatar({ person, size = 100 }) {\n  return (\n    <img\n      className=\"avatar\"\n      src={getImageUrl(person)}\n      alt={person.name}\n      width={size}\n      height={size}\n    />\n  );\n}\n\nfunction Card({ children }) {\n  return (\n    <div className=\"card\">\n      {children}\n    </div>\n  );\n}",
k:"Props parent se aate hain, immutable hote hain, aur har render par us samay ka data dikhate hain. Default sirf undefined par lagta hai, null par nahi."},
{n:9,g:1,t:"Conditional Rendering",u:"https://react.dev/learn/conditional-rendering",
p:["Conditions ke hisaab se alag cheezein dikhana — plain JavaScript se: <code>if</code>, ternary <code>? :</code>, logical <code>&amp;&amp;</code>, aur JSX ko variable me assign karna.",
"<b>Conditionally JSX return karna:</b> <code>Item({ name, isPacked })</code> har branch ke liye alag JSX tree return karta hai — <code>if (isPacked) { return &lt;li className=\"item\"&gt;{name} ✅&lt;/li&gt;; } return &lt;li className=\"item\"&gt;{name}&lt;/li&gt;;</code> React me control flow JavaScript sambhalta hai — koi template <code>if</code> directive nahi hai.",
"<b><code>null</code> se kuch render na karna:</b> component ko kuch return karna hi padta hai; <code>return null</code> kuch render nahi karta. Practice me ye uncommon hai (jo developer use render kar raha hai use surprise ho sakta hai) — zyadaatar tum component ko parent ke JSX me conditionally include/exclude karte ho.",
"<b>Ternary operator <code>? :</code>:</b> JSX ke andar two-branch choice ka compact roop — \"agar <code>isPacked</code> true hai to <code>name + ' ✅'</code> render karo, warna <code>name</code>\". Richer branches ke liye parentheses ke saath achhe se nest hota hai (jaise packed naam ko <code>&lt;del&gt;</code> me lapetna). Gehraai se: <code>if</code>-return aur ternary versions <i>poori tarah equivalent</i> hain — JSX elements \"instances\" nahi hote (koi internal state nahi, asli DOM nodes nahi), sirf lightweight descriptions/blueprints hain. Ternaries sambhal kar use karo; nested conditional markup messy ho jaye to child components extract karo.",
"<b>Logical AND <code>&amp;&amp;</code>:</b> \"ye render karo ya kuch nahi\" ke liye — <code>{name} {isPacked &amp;&amp; '✅'}</code>. JS <code>&amp;&amp;</code> expression left side true ho to right side return karta hai; left side false ho to poora expression <code>false</code> hota hai, aur React <code>false</code> ko JSX tree me ek \"hole\" maanta hai (<code>null</code>/<code>undefined</code> ki tarah) aur kuch render nahi karta.",
"<b>Pitfall — <code>&amp;&amp;</code> ke left me number:</b> JS left side ko boolean me badalta hai, lekin wo <code>0</code> ho to poora expression <code>0</code> evaluate hota hai, aur React <code>0</code> render kar deta hai. <code>messageCount &amp;&amp; &lt;p&gt;New messages&lt;/p&gt;</code> count 0 hone par ek stray <code>0</code> dikhayega. Fix: left side ko boolean banao — <code>messageCount &gt; 0 &amp;&amp; &lt;p&gt;New messages&lt;/p&gt;</code>.",
"<b>JSX ko variable me conditionally assign karna:</b> sabse verbose lekin sabse flexible style — <code>let</code> use karo, default assign karo, <code>if</code> me reassign karo, braces se embed karo. Arbitrary JSX par bhi chalta hai. Styles ki variety shuruaat me overwhelming lag sakti hai; ek se shuru karo, baaki reference se seekh loge — inhe seekhna tumhe sirf React nahi, koi bhi JavaScript padhna-likhna sikha deta hai."],
c:"function Item({ name, isPacked }) {\n  let itemContent = name;\n  if (isPacked) {\n    itemContent = name + ' ✅';\n  }\n  return (\n    <li className=\"item\">\n      {itemContent}\n    </li>\n  );\n}\n\n// Ternary aur && ke roop:\n// {isPacked ? <del>{name + ' ✅'}</del> : name}\n// {name} {isPacked && '✅'}\n// {messageCount > 0 && <p>New messages</p>}",
k:"Chaaron patterns JavaScript ke hain, React ke nahi. Sabse bada trap: count &amp;&amp; &lt;p&gt; — count 0 ho to screen par 0 chhap jata hai; hamesha boolean banao (count > 0)."},
{n:10,g:1,t:"Rendering Lists",u:"https://react.dev/learn/rendering-lists",
p:["JavaScript ke <code>map()</code> aur <code>filter()</code> se arrays se components render karna, aur <code>key</code> se list items ko order me rakhna.",
"<b>Arrays se data render karna:</b> jab list items sirf apne data me alag hon, to data ko array me le jao, use JSX nodes me <code>map</code> karo, aur <code>&lt;ul&gt;</code> me lapet kar return karo. Pehle sandbox me console error dikhta hai: \"Warning: Each child in a list should have a unique 'key' prop.\" — page par aage jaakar fix hota hai.",
"<b>Filtering:</b> data ko <code>id</code>, <code>name</code>, <code>profession</code>, <code>accomplishment</code>, <code>imageId</code> wale objects ke roop me structure karo. <code>filter()</code> ek test function leta hai jo <code>true</code>/<code>false</code> return karta hai aur sirf passing items ka naya array deta hai: <code>people.filter(person =&gt; person.profession === 'chemist')</code>. Phir filtered array par <code>map</code> karo.",
"<b>Arrow-function pitfall:</b> arrow functions <code>=&gt;</code> ke baad wale expression ko implicitly return karte hain, isliye <code>return</code> nahi chahiye — lekin <code>=&gt;</code> ke baad <code>{</code> (\"block body\") aaye to <code>return</code> khud likhna padega; bhool gaye to kuch return nahi hoga.",
"<b>Keys:</b> har array item ko ek <code>key</code> chahiye — string ya number jo use siblings ke beech uniquely pehchane: <code>&lt;li key={person.id}&gt;</code>. <code>map()</code> call ke seedha andar wale JSX elements ko hamesha keys chahiye. Keys React ko batati hain ki har component kis array item se correspond karta hai, taaki items move (sorting), insert ya delete hone par React unhe baad me match kar sake — achhi-chuni key se React samajhta hai ki kya hua aur DOM sahi update karta hai. Keys on-the-fly generate karne ke bajaye unhe data me shamil karo (database IDs).",
"<b>Ek item ke kai DOM nodes:</b> short <code>&lt;&gt;...&lt;/&gt;</code> Fragment syntax key nahi le sakta — ek <code>&lt;div&gt;</code> me group karo ya explicit <code>&lt;Fragment&gt;</code> use karo: <code>&lt;Fragment key={person.id}&gt;&lt;h1&gt;{person.name}&lt;/h1&gt;&lt;p&gt;{person.bio}&lt;/p&gt;&lt;/Fragment&gt;</code>. Fragments DOM se gayab ho jate hain, flat list banti hai.",
"<b>Keys kahan se lein:</b> database data → database keys/IDs (nature se unique); locally generated data → incrementing counter, <code>crypto.randomUUID()</code>, ya <code>uuid</code> package — items banate samay assign karo. <b>Keys ke niyam:</b> siblings ke beech unique honi chahiye (alag arrays me same keys theek hain); keys badalni nahi chahiye — rendering ke dauraan generate mat karo.",
"<b>React ko keys kyun chahiye:</b> desktop-files wali analogy — files ke naam hote hain, sirf positions nahi; ek file delete karo to positions shift ho jati hain, lekin naam har file ko phir bhi pehchante hain. Achhi key array position se zyada jaankari deti hai; position reorder se badal jaye tab bhi key React ko item ko uski poori lifetime me pehchanne deti hai. Pitfalls: key omit karne par React default me index use karta hai, lekin insertion/deletion/reordering se order samay ke saath badalta hai → subtle, confusing bugs. <code>key={Math.random()}</code> renders ke beech kabhi match nahi hota → saare components/DOM har baar dobara bante hain (slow, aur list items ke andar ka user input kho jata hai). Dhyaan do: components ko <code>key</code> prop ke roop me <b>nahi</b> milti — ye sirf React ke liye hint hai; component ko ID chahiye to alag se pass karo: <code>&lt;Profile key={id} userId={id} /&gt;</code>."],
c:"import { people } from './data.js';\nimport { getImageUrl } from './utils.js';\n\nexport default function List() {\n  const chemists = people.filter(person =>\n    person.profession === 'chemist'\n  );\n  const listItems = chemists.map(person =>\n    <li key={person.id}>\n      <img src={getImageUrl(person)} alt={person.name} />\n      <p>\n        <b>{person.name}:</b>\n        {' ' + person.profession + ' '}\n        known for {person.accomplishment}\n      </p>\n    </li>\n  );\n  return <ul>{listItems}</ul>;\n}",
k:"Key = item ki pehchan, position nahi. Stable ID data se lo; index aur Math.random() dono state ko galat item se jod dete hain."},
{n:11,g:1,t:"Keeping Components Pure",u:"https://react.dev/learn/keeping-components-pure",
p:["Components ke liye design niyam ke roop me purity: pure functions kya hain, React kyun maanta hai ki components pure hain, local mutation vs asli mutation, StrictMode, aur side effects kahan belong karte hain.",
"<b>Purity — components as formulas:</b> ek pure function (1) apne kaam se kaam rakhta hai — call hone se pehle exist karne wale objects/variables ko nahi badalta; (2) same inputs, same output — diye gaye inputs par hamesha wahi result. Math ki analogy: y = 2x; x = 3 → y = 6, hamesha, din ke samay ya stock market ki parwah kiye bina. <code>function double(number) { return 2 * number; }</code> pure hai. <b>React maanta hai ki tumhara har component ek pure function hai</b> — same inputs (props/state/context) par hamesha wahi JSX. Example: <code>Recipe({ drinkers })</code> — <code>drinkers={2}</code> hamesha \"2 cups of water\" deta hai. Components recipes hain: beech me naye ingredients daale bina follow karo to har baar wahi dish (JSX) milegi.",
"<b>Side effects — (un)intended consequences:</b> rendering hamesha pure hona chahiye; components ko sirf JSX <i>return</i> karna chahiye, pehle se maujood objects/variables ko badalna nahi. Impure <code>Cup</code> example: ek module-level <code>let guest = 0;</code> ko render ke dauraan <code>guest = guest + 1</code> karna — use kai baar call karne par har baar alag JSX milta hai, aur <code>guest</code> padhne wale doosre components render timing ke hisaab se alag JSX dete hain — unpredictable, untestable, confusing bugs. Fix: <code>guest</code> ko prop ke roop me pass karo — tab JSX sirf prop par nirbhar hai. Components ke kisi particular order me render hone ki ummeed mat rakho — har component ko \"apne liye sochna\" chahiye, rendering ke dauraan doosron ke saath coordinate ya un par nirbhar nahi hona chahiye; rendering ek school exam jaisa hai, har component apna JSX khud calculate karta hai.",
"<b>StrictMode se impure calculations pakdo:</b> rendering ke dauraan padhe ja sakne wale teen inputs — props, state, context — inhe hamesha read-only maano. User input ke jawab me kuch <i>badalna</i> ho to variable me likhne ke bajaye state set karo; rendering ke dauraan pehle se maujood variables/objects kabhi mat badlo. Strict Mode development me har component ke function ko <b>do baar</b> call karta hai, jo impurity ko ujagar karta hai: impure example \"Guest #2\", \"Guest #4\", \"Guest #6\" dikhata hai (#1/#2/#3 ki jagah), jabki pure version do baar call hone par bhi sahi kaam karta hai. Pure functions sirf calculate karte hain, isliye unhe do baar call karne se kuch nahi badalta — <code>double(2)</code> ko do baar call karne jaisa. Strict Mode ka production me koi asar nahi. Root component ko <code>&lt;React.StrictMode&gt;</code> me lapet kar opt in karo; kuch frameworks ye by default karte hain.",
"<b>Local mutation — tumhare component ka chhota sa secret:</b> jo variables/objects tumne <i>usi render ke dauraan abhi-abhi banaye</i> hain unhe mutate karna theek hai — jaise <code>TeaGathering</code> me ek <code>[]</code> array banakar <code>cups</code> me assign karke usme ek darjan cups push karna. Wahi code bohot badi problem hota agar <code>cups</code>/<code>[]</code> function ke bahar bane hote (pehle se maujood object ko badalna). Render ke andar, bahar ka koi code kabhi jaan hi nahi sakta ki ye hua.",
"<b>Side effects kahan <i>ja</i> sakte hain:</b> side effects (screen update karna, animation shuru karna, data badalna) \"side me\" hote hain, rendering ke dauraan nahi. React me ye aam taur par <b>event handlers</b> me belong karte hain — wo functions jo React user actions (jaise button click) par chalata hai. Event handlers component ke andar define hote hain lekin rendering ke <i>dauraan</i> nahi chalte, isliye unhe pure hona zaroori nahi. Koi event handler fit na ho to effect ko <code>useEffect</code> se attach karo — React use baad me, rendering ke baad chalata hai — lekin ye <b>last resort</b> hai. Jab mumkin ho, logic ko sirf rendering se express karo.",
"<b>React purity ki parwah kyun karta hai:</b> pure components alag environments me chal sakte hain (jaise server par — same inputs par same result, ek component kai requests serve karta hai); performance behtar ho sakti hai un components ki rendering skip karke jinke inputs nahi badle (pure results ko cache karna safe hai); agar ek gehri tree ke render ke beech me data badal jaye, to React purane render ko poora kiye bina rendering restart kar sakta hai (purity ise kisi bhi samay rokna safe banati hai). Har nayi React feature purity ka fayda uthati hai."],
c:"// ✅ Pure: JSX sirf prop par nirbhar hai\nfunction Cup({ guest }) {\n  return <h2>Tea cup for guest #{guest}</h2>;\n}\n\n// ❌ Impure: render ke dauraan pehle se maujood variable badalna\n// let guest = 0;\n// function Cup() {\n//   guest = guest + 1;\n//   return <h2>Tea cup for guest #{guest}</h2>;\n// }",
k:"Same inputs → same JSX, render me koi side effect nahi. Local mutation (usi render me bani cheez) theek hai; pehle se maujood cheez badalna bug hai. Side effects event handlers me, useEffect sirf last resort."},
{n:12,g:1,t:"Understanding Your UI as a Tree",u:"https://react.dev/learn/understanding-your-ui-as-a-tree",
p:["Ek conceptual page: React UI ko trees ke roop me model karta hai — render tree aur module dependency tree — aur har ek data flow, performance aur bundle size samajhne me kaise madad karta hai.",
"<b>UI as a tree:</b> trees items ke beech relationships model karte hain. Browsers HTML (DOM) aur CSS (CSSOM) ke liye trees use karte hain; mobile platforms view hierarchies ke liye trees use karte hain. React tumhare components se ek UI tree banata hai, jo phir DOM me render hone ke liye use hota hai. Trees tumhe samajhne me madad karte hain ki data ek React app me kaise behta hai aur rendering aur app size ko kaise optimize karein.",
"<b>Render tree:</b> components compose karne se parent/child relationships bante hain; rendering unhe ek tree ke roop me model karta hai. Example (Inspirations app): root <code>App</code> <code>InspirationGenerator</code> aur <code>FancyText</code> render karta hai; <code>InspirationGenerator</code> <code>FancyText</code> aur <code>Copyright</code> render karta hai. Nodes = components; root node app ka root component hai (sabse pehle render hone wala); arrows parent → child ki taraf. HTML tags render tree me <b>nahi</b> aate — isme sirf React components hote hain. React platform-agnostic hai: web examples HTML primitives me render hote hain, lekin ek React app mobile/desktop primitives (<code>UIView</code>, <code>FrameworkElement</code>) me bhi render ho sakta hai; wo primitives React ka hissa nahi hain, isliye render trees platform ki parwah kiye bina insight dete hain.",
"<b>Render trees har render par badalte hain:</b> ek render tree ek single render pass ko represent karta hai. Conditional rendering ke saath, ek parent data ke hisaab se alag children render kar sakta hai — jaise <code>inspiration.type</code> ke hisaab se <code>&lt;FancyText&gt;</code> ya <code>&lt;Color&gt;</code>, isliye tree har pass me alag hota hai.",
"<b>Top-level vs leaf components:</b> top-level components root ke sabse kareeb hote hain — wo apne neeche ki har cheez ki rendering performance ko affect karte hain aur aksar sabse zyada complexity rakhte hain. Leaf components neeche ke paas hote hain, unke koi children nahi hote, aur aksar frequently re-render hote hain. Dono ko pehchanna data flow aur performance samajhne me madad karta hai.",
"<b>Module dependency tree:</b> har node ek module hai, har branch ek <code>import</code> statement. Usi Inspirations app ke liye: root <code>App.js</code> <code>InspirationGenerator.js</code>, <code>FancyText.js</code>, <code>Copyright.js</code> import karta hai; <code>InspirationGenerator.js</code> <code>FancyText.js</code>, <code>Color.js</code>, <code>inspirations.js</code> import karta hai. Render tree se farak: nodes modules hain, components nahi; non-component modules jaise <code>inspirations.js</code> bhi aate hain; <code>Copyright.js</code> dependency tree me <code>App.js</code> ke neeche aata hai lekin <code>Copyright</code> component render tree me <code>InspirationGenerator</code> ka child hai — kyunki <code>InspirationGenerator</code> JSX ko <code>children</code> props ke roop me accept karta hai, wo <code>Copyright</code> ko uske module ko import kiye bina render karta hai.",
"<b>Dependency trees kyun mayne rakhte hain:</b> root node entrypoint file hai (aksar root component wali). Bundlers dependency tree ka use karke tay karte hain ki production bundle me kaunse modules shamil hon. App badhne ke saath bundle size badhta hai — bade bundles download/run karne me mehenge hote hain aur time-to-paint delay karte hain; dependency tree samajhna bundle-size issues debug karne aur jo bundle hota hai use optimize karne me madad karta hai."],
c:"Render tree (Inspirations app), parent → child:\nApp\n├── InspirationGenerator\n│   ├── FancyText\n│   └── Copyright\n└── FancyText\n\nModule dependency tree (wahi app), module → imports:\nApp.js\n├── InspirationGenerator.js\n│   ├── FancyText.js\n│   ├── Color.js\n│   └── inspirations.js\n├── FancyText.js\n└── Copyright.js",
k:"Render tree = components ka parent-child naksha (HTML tags nahi, har render par badal sakta hai). Dependency tree = imports ka naksha, jisse bundler bundle tay karta hai. Dono ko confuse karna sabse aam galti hai."},
{n:13,g:2,t:"Responding to Events",u:"https://react.dev/learn/responding-to-events",
p:["Components user interaction par kaise jawab dete hain: <b>event handlers</b> — wo functions jo tum JSX me props ke roop me pass karte ho, jaise <code>onClick</code>, jinhe React user ke interact karne par call karta hai.",
"Event handlers component ke andar define hone wale functions hain, aam taur par <code>handle</code> + event naam (jaise <code>handleClick</code>), ya inline pass kiye hue. Teenon roop equivalent hain: alag se define kiya handler, inline arrow function, aur JSX me inline define kiya handler.",
"Function ko khud pass karo, use <b>call kabhi mat karo</b>: <code>onClick={handleClick}</code>, <code>onClick={handleClick()}</code> nahi. Render ke dauraan call karne se wo turant chal jata hai aur uska return value (aam taur par <code>undefined</code>) handler ban jata hai.",
"Handlers props padh sakte hain, kyunki wo component ke andar define hote hain aur us render ke props aur state par close over karte hain. Handlers ko props ke roop me child components ko bhi bhej sakte ho. Convention: handler props ke naam <code>on</code> + capital letter (<code>onClick</code>, <code>onPlayMovie</code>, <code>onUploadImage</code>); component ke apne handlers ke naam <code>handle</code> + event (<code>handlePlayClick</code>).",
"Clickable cheezon ke liye asli <code>&lt;button&gt;</code> use karo, <code>&lt;div onClick&gt;</code> nahi — buttons keyboard-accessible hote hain; divs nahi.",
"<b>Event propagation (bubbling):</b> event sabse andar wale element par pehle fire hota hai, phir apne parents se hote hue upar bubble hota hai. <code>onScroll</code> ko chhodkar saare events propagate karte hain. <code>e.stopPropagation()</code> event ko parent handlers tak bubble hone se rokta hai.",
"<b>Capture phase:</b> events pehle tree me neeche travel karte hain (capture), phir target, phir bubble. Capture phase ke dauraan handler chalane ke liye <code>onClickCapture</code> use karo. <code>e.preventDefault()</code> browser ke default behaviour ko rokta hai (jaise form submit hona, link follow hona). Ye <code>stopPropagation()</code> se sambandhit nahi hai — ek default behaviour rokta hai, doosra bubbling.",
"<b>Event handlers side effects ke liye sabse achhi jagah hain:</b> rendering code (jo pure hona chahiye) ke vipreet, handlers cheezein mutate kar sakte hain, APIs call kar sakte hain, wagera."],
c:"function Button({ onClick, children }) {\n  return <button onClick={onClick}>{children}</button>;\n}\n\nfunction PlayButton({ movieName }) {\n  function handlePlayClick() {\n    \u0061lert(`Playing ${movieName}!`);\n  }\n  return <Button onClick={handlePlayClick}>Play \"{movieName}\"</Button>;\n}\n\n// Stop propagation: sirf child handler chalta hai\n// <button onClick={e => { e.stopPropagation(); \u0061lert('child'); }}>\n\n// Prevent default: form submit / link navigation roko\n// <form onSubmit={e => { e.preventDefault(); \u0061lert('submitting'); }}>",
k:"Handler ko reference se pass karo, call karke nahi. stopPropagation bubbling rokta hai, preventDefault browser ka default behaviour — dono alag kaam hain, aksar dono chahiye hote hain."},
{n:14,g:2,t:"State: A Component's Memory",u:"https://react.dev/learn/state-a-components-memory",
p:["<code>useState</code> ka parichay: component renders ke beech jaankari kaise yaad rakhta hai, aam local variables kyun nahi kar sakte, aur React state ko har component instance ke liye kaise track karta hai.",
"<b>Local variables do kaaranon se fail hote hain:</b> wo renders ke beech persist nahi karte (har render me naya variable banta hai), aur unhe badalne se re-render trigger nahi hota.",
"<code>useState</code> <b>exactly do cheezein</b> return karta hai — current value aur ek setter function: <code>const [index, setIndex] = useState(0)</code>. Initial value sirf pehle render par use hoti hai. Naamkaran convention hai <code>[something, setSomething]</code>.",
"Ek component ke paas kai independent state variables ho sakte hain. Hooks hamesha <code>use</code> se shuru hote hain aur sirf component ke top level par call hone chahiye — conditions, loops ya nested functions ke andar kabhi nahi.",
"<b>React ka internal model:</b> React har component ke liye state pairs ka ek array rakhta hai; \"current pair index\" har render se pehle 0 par reset hota hai aur har Hook call ke saath aage badhta hai, isliye Hooks state se call order ke dwara match hote hain. Yahi wajah hai ki call order renders ke beech kabhi badalna nahi chahiye.",
"State har component instance ke liye isolated aur private hai — page par do <code>&lt;Gallery /&gt;</code> components ki state poori tarah independent hai."],
c:"import { useState } from 'react';\n\nfunction Gallery() {\n  const [index, setIndex] = useState(0);\n\n  function handleNextClick() {\n    setIndex(index + 1);\n  }\n  // ...\n}\n\n// Do instances, do independent states\nexport default function Page() {\n  return (\n    <>\n      <Gallery />\n      <Gallery />\n    </>\n  );\n}",
k:"Local variable na persist karta hai, na re-render trigger karta hai — isliye useState chahiye. Hooks call order se match hote hain, isliye order kabhi mat badlo."},
{n:15,g:2,t:"Render and Commit",u:"https://react.dev/learn/render-and-commit",
p:["React screen ko kaise update karta hai, uske <b>teen steps</b>: <b>Trigger → Render → Commit</b> — restaurant analogy se samjhaya gaya (waiter order leta hai, cook dish taiyaar karta hai, waiter serve karta hai).",
"<b>Step 1 — Render trigger karo.</b> Do tareeqe: component ka <i>initial render</i> (<code>createRoot</code> + <code>root.render(&lt;Image /&gt;)</code>), ya component ya uske kisi ancestor ka state update.",
"<b>Step 2 — Component render karo.</b> React tumhare components ko (recursively) call karke pata lagata hai ki screen par kya hona chahiye. Rendering pure hona chahiye — same inputs, same JSX, koi side effects nahi. Strict Mode me React impurity ko ujagar karne ke liye har component ko development me do baar call karta hai.",
"<b>Step 3 — DOM me commit karo.</b> Initial render par React DOM nodes rakhne ke liye <code>appendChild()</code> use karta hai. Re-renders par React sirf wohi minimal DOM operations lagata hai jo latest render output se match karne ke liye zaroori hain. Uske baad browser screen paint karta hai.",
"Sabse aam confusion: \"render\" (React tumhare component function ko call karta hai) aur \"commit\" (DOM updates) ko ek samajhna — React DOM ko chhoone ke muqable me kahin zyada baar re-render karta hai. Side effects (network calls, DOM mutation, subscriptions) render me mat rakho — wo event handlers ya Effects me belong karte hain."],
c:"import { createRoot } from 'react-dom/client';\n\nconst root = createRoot(document.getElementById('root'));\nroot.render(<Image />); // initial render — ye \"trigger\" hai",
k:"Trigger → Render (component call, shudh/pure) → Commit (sabse kam DOM badlaav) → browser paint. Render aur commit alag cheezein hain."},
{n:16,g:2,t:"State as a Snapshot",u:"https://react.dev/learn/state-as-a-snapshot",
p:["Wo mental model jo <code>useState</code> ko predictable banata hai: <b>state set karne se pehle se chal rahe render me state variable nahi badalta</b> — ye ek re-render schedule karta hai, aur nayi value sirf <i>agle</i> render me dikhti hai. Har render ke state values ek frozen snapshot hain.",
"Jab tum ek handler me <code>setNumber(number + 1)</code> teen baar call karte ho, to har call current render ke snapshot se wahi <code>number</code> use karti hai, isliye result <code>number + 1</code> hota hai, <code>+3</code> nahi.",
"\"Rendering\" ka matlab hai React tumhare component function ko call karta hai — function JSX return karta hai, jo us pal ke UI ka ek snapshot hai, us render ke state values ka use karke. Substitution method: kisi render me state variable ko uski value se mentally replace karke predict kar sakte ho ki kya dikhega.",
"<code>setNumber(number + 5); \u0061lert(number)</code> <i>purani</i> value alert karta hai (jaise <code>0</code>), kyunki is render me <code>number</code> kabhi nahi badalta. <code>setTimeout(..., 3000)</code> ke andar bhi alert purani value hi dikhata hai — timeout callback us render ke snapshot par close over karta hai jab handler chala tha.",
"Form wala example: tum Alice ko \"Hello\" likhte ho, phir 5-second delay khatm hone se pehle recipient ko Bob par switch kar dete ho — alert phir bhi Alice kehta hai, kyunki timeout ne us render ko capture kiya tha jab recipient Alice thi.",
"<i>Sabse latest</i> state padhna ho to updater function use karo (<code>setNumber(n =&gt; n + 1)</code>) ya ek ref."],
c:"// \"+3\" button jo sirf 1 jodta hai — teenon calls wahi snapshot padhti hain\nfunction Counter() {\n  const [number, setNumber] = useState(0);\n  return (\n    <button onClick={() => {\n      setNumber(number + 1);\n      setNumber(number + 1);\n      setNumber(number + 1);\n    }}>+3</button>\n  );\n}\n\n// alert PURANI value dikhata hai\n// setNumber(number + 5);\n// \u0061lert(number); // 0, 5 nahi",
k:"State ek snapshot hai: set karne se is render ki value nahi badalti, sirf agla render nayi value laata hai. Yahi ek model aadhe React bugs samjha deta hai."},
{n:17,g:2,t:"Queueing a Series of State Updates",u:"https://react.dev/learn/queueing-a-series-of-state-updates",
p:["React ek event handler me kai state updates ko kaise batch karta hai, aur <b>updater functions</b> (<code>setNumber(n =&gt; n + 1)</code>) kaise updates ki ek series queue karne dete hain jo ek-doosre par build hoti hai.",
"<b>Batching:</b> React re-render karne se pehle event handler ke saare code ke chalne ka intezaar karta hai. Ek handler me kai <code>setState</code> calls ka result ek single re-render hota hai.",
"<b>Updater functions:</b> <code>setNumber(n =&gt; n + 1)</code> React ko kehta hai \"pichli state lo aur agli state compute karo\". Updaters queue hote hain aur agle render ke dauraan order me process hote hain.",
"Page ki queue tables (0 se shuru): teen <code>n =&gt; n + 1</code> updaters → 3. <code>setNumber(number + 5)</code> phir <code>setNumber(n =&gt; n + 1)</code> → 6. <code>setNumber(number + 5)</code>, <code>setNumber(n =&gt; n + 1)</code>, <code>setNumber(42)</code> → 42.",
"Ek plain value ka matlab hai \"X se replace karo\"; ek updater function ka matlab hai \"is transformation ko queue me jodo\".",
"<b>Updater functions rendering ke dauraan chalte hain, isliye unhe pure hona chahiye</b> — unke andar koi side effects nahi. Strict Mode me React har updater ko do baar chalata hai aur dusra result discard kar deta hai, jisse impurity ujagar hoti hai.",
"Naamkaran: state variable ke pehle akshar use karo (<code>number</code> ke liye <code>n</code>) ya ek fuller naam, aksar <code>prev</code> prefix ke saath (<code>prevNumber</code>)."],
c:"// +3 button jo asal me 3 jodta hai\n// <button onClick={() => {\n//   setNumber(n => n + 1);\n//   setNumber(n => n + 1);\n//   setNumber(n => n + 1);\n// }}>+3</button>\n\n// Mixed queue: replace, phir increment, phir replace\nsetNumber(number + 5);   // 5 se replace karo\nsetNumber(n => n + 1);   // queue: 5 -> 6\nsetNumber(42);           // 42 se replace — final result 42",
k:"Plain value = seedha badal do (replace), updater function = queue me badlaav (transformation) jodo. Pichli state par build karna ho to hamesha updater use karo."},
{n:18,g:2,t:"Updating Objects in State",u:"https://react.dev/learn/updating-objects-in-state",
p:["Object state ko sahi tareeqe se update karna: state immutable hai, isliye tumhe existing object ko mutate karne ke bajaye ek <i>naya</i> object banana padta hai — spread syntax se, ya nested updates ke liye Immer se.",
"Primitives (numbers, strings) immutable hain; state me objects ko read-only ki tarah treat karna chahiye. <code>position.x = e.clientX</code> mutate karke phir <code>setPosition(position)</code> call karne se kuch visible nahi hota — React reference se compare karta hai aur use wahi object dikhta hai, isliye wo re-render skip kar deta hai.",
"Sahi tareeqa: ek naya object banao aur setter ko pass karo: <code>setPosition({ x: e.clientX, y: e.clientY })</code>.",
"<b>Spread syntax</b> un fields ko copy karta hai jo tum nahi badalte: <code>setPerson({ ...person, firstName: e.target.value })</code>. Spread shallow hai — sirf ek level gehra. Ek nested object update karne ke liye badle ja rahe field tak ke path ke har level ko copy karna padta hai.",
"Ek single handler computed property name se kai fields update kar sakta hai: <code>setPerson({ ...person, [e.target.name]: e.target.value })</code>.",
"<b>Immer</b> (<code>npm install use-immer</code>, <code>useImmer</code>) tumhe ek <code>draft</code> (ek Proxy) par mutating-jaisa code likhne deta hai jabki ek naya immutable object produce hota hai: <code>updatePerson(draft =&gt; { draft.artwork.city = 'Lagos'; })</code>.",
"Mutate kyun nahi: debugging (time travel / change tracking), optimizations (React aur <code>memo</code> <code>prevObj === obj</code> par nirbhar hain), future features, aur Undo/Redo history."],
c:"// ❌ Mutation — koi re-render nahi\n// position.x = e.clientX;\n\n// ✅ Naya object\nsetPosition({ x: e.clientX, y: e.clientY });\n\n// ✅ Spread — baaki fields bache rahe\nsetPerson({ ...person, firstName: e.target.value });\n\n// ✅ Nested update — har level copy karo\nsetPerson({\n  ...person,\n  artwork: { ...person.artwork, city: 'New Delhi' }\n});\n\n// ✅ Immer\n// import { useImmer } from 'use-immer';\n// updatePerson(draft => { draft.artwork.city = 'Lagos'; });",
k:"State object ko kabhi mutate mat karo — naya object banao, spread sirf ek level kaam karta hai, gehri nesting ke liye har level copy ya Immer."},
{n:19,g:2,t:"Updating Arrays in State",u:"https://react.dev/learn/updating-arrays-in-state",
p:["Page 018 ka array counterpart: state me arrays ko read-only treat karo, aur items jodne, hatane, replace karne aur sort karne ke liye non-mutating operations (ya Immer) use karo.",
"<b>Avoid / prefer table:</b> jodna — <code>push</code>/<code>unshift</code> ki jagah <code>concat</code> ya <code>[...arr, newItem]</code>; hatana — <code>pop</code>/<code>shift</code>/<code>splice</code> ki jagah <code>filter</code> ya <code>slice</code>; replace karna — <code>splice</code>/<code>arr[i] = x</code> ki jagah <code>map</code>; sort karna — <code>reverse</code>/<code>sort</code> ki jagah pehle copy karo, phir sort karo. Immer dono columns ki ijazat deta hai (draft par mutating syntax).",
"<b>Pitfall:</b> <code>slice</code> copy karta hai (safe), <code>splice</code> mutate karta hai (unsafe) — naam confuse karna aasan hai.",
"Id se hatao: <code>setArtists(artists.filter(a =&gt; a.id !== artist.id))</code>. Transform karo: <code>setArtists(artists.map(a =&gt; a.id === artist.id ? { ...a, seen: !a.seen } : a))</code>. Ek index par insert karo: <code>[...list.slice(0, index), newItem, ...list.slice(index)]</code>.",
"<b>Shallow-copy warning:</b> <code>const nextList = [...list]; nextList[0].seen = true</code> phir bhi <code>list[0]</code> ko mutate karta hai, kyunki spread sirf array ko copy karta hai, uske andar ke objects ko nahi.",
"BucketList wala bug: do lists ek hi <code>initialList</code> share karti hain; <code>[...myList]</code> + <code>find</code> + <code>artwork.seen = nextSeen</code> shared item ko mutate kar deta hai, isliye dono lists badal jati hain. Fix: <code>map</code> + <code>{ ...artwork, seen: nextSeen }</code>."],
c:"// Add\nsetArtists([...artists, { id: nextId++, name }]);\n\n// Remove\nsetArtists(artists.filter(a => a.id !== artist.id));\n\n// Replace / transform\nsetArtists(artists.map(a => a.id === artist.id ? { ...a, seen: true } : a));\n\n// Index 1 par insert\nconst nextArtists = [...artists.slice(0, 1), newArtist, ...artists.slice(1)];\n\n// Sort — pehle copy karo!\nconst nextArtists2 = [...artists].sort((a, b) => a.name.localeCompare(b.name));",
k:"push/splice/sort state par seedha kabhi nahi — filter, map, slice aur copy-then-sort hi safe raaste hain. Spread array ko copy karta hai, andar ke objects ko nahi."},
{n:20,g:3,t:"Reacting to Input with State",u:"https://react.dev/learn/reacting-to-input-with-state",
p:["Interactive UIs ko declaratively banane ka design method: DOM ko imperatively manipulate karne ke bajaye, tum (1) visual states pehchante ho, (2) tay karte ho ki unhe kya trigger karta hai, (3) state ko <code>useState</code> se represent karte ho, (4) non-essential state hatate ho, aur (5) event handlers connect karte ho.",
"<b>Imperative vs declarative:</b> page ek plain-DOM city quiz (sahi jawab \"istanbul\") se khulta hai jo <code>disable</code>/<code>show</code>/<code>hide</code>/<code>enable</code> helpers se bhara hai — follow karna mushkil. React me tum har state ke liye declare karte ho ki <i>kya</i> dikhna chahiye (taxi-driver analogy: tum batate ho kahan jana hai, ye nahi ki wheel kaise ghumana hai).",
"<b>Quiz par lage 5 steps</b> (React wala sahi jawab \"lima\"): 1. Saare alag visual states pehchano: Empty, Typing, Submitting, Success, Error. 2. Human aur computer inputs tay karo jo state changes trigger karte hain. 3. State ko <code>useState</code> se memory me represent karo — must-haves (<code>answer</code>, <code>error</code>) se shuru karo, phir paryapt state (5 booleans). 4. Non-essential state hatao — booleans ko ek single <code>status</code> ('typing' / 'submitting' / 'success' / 'error') me merge karke paradoxes resolve karo; <code>answer.length === 0</code> aur <code>error !== null</code> ko store karne ke bajaye derive karo. 5. Event handlers ko state set karne ke liye connect karo.",
"Final result: 7 ke bajaye 3 essential variables. Ek Deep Dive dikhata hai ki ek reducer baaki bache impossible states ko bhi khatm kar deta hai.",
"Yahi method ek profile editor par lagta hai (<code>isEditing</code>, <code>firstName</code> 'Jane', <code>lastName</code> 'Jacobs' — koi <code>fullName</code> state nahi, wo computed hai) aur bina React ke ek imperative component ko refactor karne par (explicit variables + <code>updateDOM()</code> call karne wale setters)."],
c:"// Visual states EK status variable ke roop me, paanch booleans nahi\nconst [answer, setAnswer] = useState('');\nconst [error, setError] = useState(null);\nconst [status, setStatus] = useState('typing'); // 'typing' | 'submitting' | 'success' | 'error'\n\nif (status === 'success') {\n  return <h1>That's right!</h1>;\n}\n\n// Derived values, state nahi\nconst isEmpty = answer.length === 0;\nconst hasError = error !== null;",
k:"Pehle visual states gino, phir essential state rakho — baaki sab derive karo. Boolean soup ki jagah ek status string hamesha jeetti hai."},
{n:21,g:3,t:"Choosing the State Structure",u:"https://react.dev/learn/choosing-the-state-structure",
p:["State ko achhe se structure karne ke paanch principles, taaki jo state tum rakhte ho wo minimal, consistent aur update karne me aasan ho — aur Einstein ki mashhoor paraphrase: \"Make your state as simple as it can be—but no simpler.\" (matlab: state ko jitna simple ho sake utna rakho — lekin zaroorat se zyada simple bhi mat karo)",
"<b>1. Related state ko group karo.</b> Agar <code>x</code> aur <code>y</code> hamesha saath badalte hain, to ek object <code>{ x, y }</code> rakho. Pitfall: <code>setPosition({ x: 100 })</code> <code>y</code> ko gira deta hai — baaki ko spread karna padta hai.",
"<b>2. State me contradictions se bacho.</b> <code>isSending</code> + <code>isSent</code> booleans contradict kar sakte hain; ek <code>status</code> string use karo: <code>'typing'</code> / <code>'sending'</code> / <code>'sent'</code>.",
"<b>3. Redundant state se bacho.</b> Jo render ke dauraan compute ho sakta hai use store mat karo (<code>firstName</code> + <code>lastName</code> se <code>fullName</code>). Deep Dive: \"Props ko state me mirror mat karo\" — <code>useState(messageColor)</code> prop badalne par stale ho jata hai.",
"<b>4. State me duplication se bacho.</b> Travel-snack <code>Menu</code> poora <code>selectedItem</code> object store karta hai, <code>items</code> ko duplicate karke; fix: sirf <code>selectedId</code> (0) store karo aur <code>selectedItem = items.find(item =&gt; item.id === selectedId)</code> compute karo.",
"<b>5. Deeply nested state se bacho.</b> Travel-plan tree (49 places, root id 0 '(Root)', Earth 1, Moon 42, Mars 46) ko ID-keyed table me flatten/normalize kiya jata hai <code>childIds</code> arrays ke saath, taaki koi bhi place bina deep copying ke update ya delete ho sake. Ek Deep Dive Immer wala version dikhata hai jo ek place aur uske poore subtree ko delete karta hai.",
"Source me dekhi gayi ek quirk: flat <code>places.js</code> data me entry key 39 par 'Hawaii (the USA)' ke liye <code>id: 40</code> hai, jo New Zealand ke id 40 ko duplicate karta hai — docs ke apne example data ki galti hai, SPA use saaf taur par yahi note karta hai."],
c:"// 1. Related state group karo\nconst [position, setPosition] = useState({ x: 0, y: 0 });\nsetPosition({ ...position, x: 100 }); // y mat girafo!\n\n// 2. Ek status, do booleans nahi\nconst [status, setStatus] = useState('typing'); // 'typing' | 'sending' | 'sent'\n\n// 3. Compute karo, store mat karo\nconst fullName = firstName + ' ' + lastName;\n\n// 4. Id store karo, item derive karo\nconst [selectedId, setSelectedId] = useState(0);\nconst selectedItem = items.find(item => item.id === selectedId);",
k:"Group karo, contradictions hatao, redundant/duplicate state mat rakho, gehri nesting ko normalize karo. Multi-selection ke liye selectedIds ko Set me rakho — aur re-render ke liye naya Set banana padta hai."},
{n:22,g:3,t:"Sharing State Between Components",u:"https://react.dev/learn/sharing-state-between-components",
p:["<b>Lifting state up:</b> jab do child components ko wahi state chahiye, to use dono se hatao aur unke closest common parent me le jao, jo state aur setters ko props ke roop me neeche bhejta hai.",
"Accordion/Panel wala example (Almaty, Kazakhstan; About/Etymology panels) teen steps me samjho: 1. Child components se state hatao. 2. Common parent se hardcoded data pass karo. 3. Common parent me state jodo aur event handlers neeche pass karo.",
"Do booleans ke bajaye ek <code>activeIndex</code> (0/1) use karo — truth ka ek single source.",
"Deep Dive: <b>controlled vs uncontrolled components</b> — ek component \"controlled\" hai jab uski state parent ke paas hoti hai, \"uncontrolled\" jab wo apni state khud rakhta hai.",
"Single source of truth: state exactly ek jagah rehti hai; baaki sab usi se derive hota hai. Sabse aam pitfall hai wahi state do siblings me duplicate karna taaki wo sync se bahar ho jayein, ya state ko child me rakhna jab parent ko use coordinate karna hai."],
c:"export default function Accordion() {\n  const [activeIndex, setActiveIndex] = useState(0);\n  return (\n    <>\n      <Panel\n        title=\"About\"\n        isActive={activeIndex === 0}\n        onShow={() => setActiveIndex(0)}\n      >\n        With a population of about 2 million, Almaty is Kazakhstan's largest city.\n      </Panel>\n      <Panel\n        title=\"Etymology\"\n        isActive={activeIndex === 1}\n        onShow={() => setActiveIndex(1)}\n      >\n        The name comes from the Kazakh word for \"apple\"...\n      </Panel>\n    </>\n  );\n}\n\nfunction Panel({ title, children, isActive, onShow }) {\n  return (\n    <section className=\"panel\">\n      <h3>{title}</h3>\n      {isActive ? <p>{children}</p> : <button onClick={onShow}>Show</button>}\n    </section>\n  );\n}",
k:"Shared state hamesha closest common parent me — ek hi source of truth, baaki sab props se controlled."},
{n:23,g:3,t:"Preserving and Resetting State",u:"https://react.dev/learn/preserving-and-resetting-state",
p:["React kaise tay karta hai ki component ki state bachani hai ya destroy karni hai: <b>state component ki render tree me position se bandhi hoti hai, JSX markup se nahi</b> — aur <code>key</code> kaise tumhe wahi position par state reset karne deta hai.",
"Tree me alag positions par do <code>&lt;Counter /&gt;</code> components ki state independent hoti hai (<code>score</code>, <code>hover</code>). <b>Ek component ko hatane se uski state destroy ho jati hai.</b> Jab wo wapas aata hai, state fresh shuru hoti hai.",
"<b>Wahi component wahi position par state preserve karta hai</b> — ek ternary ke paar bhi (<code>isFancy ? &lt;Counter isFancy={true} /&gt; : &lt;Counter isFancy={false} /&gt;</code>) aur do alag <code>return</code> clauses ke paar bhi. <b>Wahi position par ek alag component state reset kar deta hai</b> — <code>Counter</code> ko ek <code>&lt;p&gt;</code> se swap karna counter ki state destroy kar deta hai; ek alag element me lapetna (<code>section</code> ↔ <code>div</code>) poore subtree ko reset kar deta hai.",
"<b>Pitfall: component definitions nest mat karo.</b> <code>MyComponent</code> ke andar <code>MyTextField</code> define karna har render par ek naya component function banata hai, isliye React use us position par ek alag component maanta hai aur input ki state har keystroke par gayab ho jati hai.",
"<b>Wahi position par state reset karna — do options:</b> 1. Component ko <i>alag positions</i> par render karo (Scoreboard: Taylor aur Sarah ke counters alag branches me). 2. Unhe <b>alag <code>key</code>s</b> do (<code>key=\"Taylor\"</code> / <code>key=\"Sarah\"</code>). Ek <code>key</code> component ki position ka hissa hai — use globally unique hona zaroori nahi, sirf siblings ke beech distinct hona chahiye.",
"Key ke saath form reset karna: <code>&lt;Chat key={to.id} contact={to} /&gt;</code> (contacts Taylor/Alice/Bob) — contacts switch karne par form fresh state ke saath remount hota hai. Deep Dive: <i>removed</i> components ke liye state preserve karna — saare chats render karo lekin inactive walon ko CSS se chhupao, state upar uthao, ya <code>localStorage</code> me persist karo."],
c:"// Wahi position, wahi component → state preserve hoti hai\n// {isFancy ? <Counter isFancy={true} /> : <Counter isFancy={false} />}\n\n// Alag key → state reset hoti hai\n// <Chat key={to.id} contact={to} />\n\n// ❌ Nested definition — har render naya component type, state gayab\n// function MyComponent() {\n//   function MyTextField() { /* ... */ }\n//   return <MyTextField />;\n// }",
k:"State position se bandhi hai: wahi component + wahi position + wahi key = state bachi; inme se kuch bhi badla to reset. Index-as-key list me state ko galat item se jod deta hai."},
{n:24,g:3,t:"Extracting State Logic into a Reducer",u:"https://react.dev/learn/extracting-state-logic-into-a-reducer",
p:["Bikhre hue <code>useState</code> + handler logic ko <code>useReducer</code> ke saath ek single <b>reducer</b> me consolidate karna: state updates <code>dispatch({ type: 'added', ... })</code> actions ban jate hain jinhe ek pure function handle karta hai.",
"<code>TaskApp</code> wala \"Prague itinerary\" example (Visit Kafka Museum done, Watch a puppet show, Lennon Wall pic). <code>useState</code> se <code>useReducer</code> me migration 3 steps me: 1. <b>State set karne se actions dispatch karne par aao</b> — <code>dispatch({ type: 'added', id: nextId++, text })</code>, <code>{ type: 'changed', task }</code>, <code>{ type: 'deleted', id: taskId }</code>. Actions plain objects hain jo describe karte hain ki <i>kya hua</i>; convention se unke paas ek <code>type</code> string hoti hai. 2. <b>Ek reducer function likho</b> — <code>function tasksReducer(tasks, action)</code> jo next state return karta hai; <code>switch (action.type)</code> jisme har <code>case</code> <code>{}</code> me wrapped hai; <code>default</code> me <code>Error('Unknown action: ' + action.type)</code> throw karo. Deep Dive: naam <code>Array.prototype.reduce()</code> par rakha gaya hai — ye accumulated value aur current item lekar next accumulated value return karta hai. 3. <b>Component se reducer use karo</b> — <code>const [tasks, dispatch] = useReducer(tasksReducer, initialTasks)</code>.",
"<b><code>useState</code> vs <code>useReducer</code> ki tulna:</b> code size, readability, debugging (actions loggable hain), testing (reducer ek pure function hai, isolation me testable).",
"<b>Reducers achhe se likhna:</b> pure hone chahiye (koi side effects nahi, koi mutations nahi — objects/arrays ko immutably update karo, pages 018–019 wale wahi niyam); har action ko ek single user interaction describe karna chahiye.",
"<b>Immer:</b> <code>useImmerReducer</code> tumhe reducer ke andar draft par mutating code likhne deta hai. Sabse aam galti: reducer ke andar side effect (jaise <code>alert</code>) — reducer kabhi alert nahi karta; iske bajaye ek <code>sent_message</code> action dispatch karo aur handler me alert karo."],
