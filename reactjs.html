"<code>use(context)</code>: parameter <code>createContext</code> se bana context; return calling component ke upar sabse kareebi provider ki value, ya provider na ho to <code>defaultValue</code>. <code>useContext</code> ke ulta, <code>use</code> ko <b>loops aur conditional statements (jaise <code>if</code>) ke andar</b> call kar sakte ho — yahi iska sabse bada farq hai. (Lekin Server Components me <code>use</code> se context padhna supported nahi hai.)",
"<code>use(promise)</code>: parameter wo Promise jiska resolved value padhna hai — Promise <b>cached</b> hona chahiye taaki re-renders me wahi instance reuse ho. Return resolved value. Promise pending ho to calling component <b>suspend</b> karta hai (sabse kareebi Suspense fallback dikhta hai); Promise reject ho to sabse kareebi Error Boundary ka fallback dikhta hai. Promises ko rendering se <i>pehle</i> banao (event handler, route loader, Server Component) aur pass karo — render ke dauraan banane par har render par naya Promise banta hai, kyunki React un renders ke liye state preserve nahi karta jo mount hone se pehle suspend ho gaye hon, aur fallback baar-baar dikhega. Client Components ke liye Promise ko cache karo (jaise URL se key kiya module-level <code>Map</code>); chaaho to Promise par <code>status</code>/<code>value</code>/<code>reason</code> fields set karo taaki <code>use</code> already-resolved value ko synchronously padh sake. Re-fetch karna ho to cache entry invalidate karo aur naya Promise <code>startTransition</code> ke andar state me rakho — purana content tab tak visible rahega. Ek Server Component Promise ko prop ke roop me Client Component ko de sakta hai (streaming), jo use <code>use</code> se unwrap karta hai — lekin resolved value serializable honi chahiye.",
"<code>use(browser())</code>: <code>browser</code> se mili value ko parameter ke roop me do; browser me <code>undefined</code> return hota hai, aur server rendering ke dauraan ye component ko suspend kar deta hai taaki sabse kareebi Suspense fallback HTML me shamil ho.",
"Niyam aur galtiyan: <code>use</code> ko Component ya Hook ke andar hi call karna hai. Promise ke liye hamesha <code>use</code> ko hi call karo — <code>promise.status</code>/<code>promise.value</code> ko seedha padhkar ise bypass kabhi mat karo (Suspense optimizations aur DevTools features toot te hain). Uncached Promise dena (<code>use(fetch('/albums'))</code>, uncached async IIFE, ya <code>.then()</code> chain — <code>.then</code> har render naya Promise deta hai) infinite Suspense fallback deta hai; warning milti hai: 'A component was suspended by an uncached promise'. <code>use</code> ko <code>try</code>-<code>catch</code> ke andar mat rakho — ye Suspense ke liye internally throw karta hai, to 'Suspense Exception: This is not a real error!' milega; uski jagah Error Boundary use karo. Aur Server Components me tree me upar context me Promise rakhne se bacho — use re-fetch karne par app ke bade hisse re-fetch honge."],
c:"// Context — conditionally\nfunction HorizontalRule({ show }) {\n  if (show) {\n    const theme = use(ThemeContext);\n    return <hr className={theme} />;\n  }\n  return false;\n}\n\n// Promise\nimport { use, Suspense } from 'react';\n\nfunction Albums({ albumsPromise }) {\n  const albums = use(albumsPromise);\n  return (\n    <ul>\n      {albums.map(album => (\n        <li key={album.id}>{album.title} ({album.year})</li>\n      ))}\n    </ul>\n  );\n}\n\n// Promise cache (Client Components)\nlet cache = new Map();\nexport function fetchData(url) {\n  if (!cache.has(url)) {\n    cache.set(url, getData(url));\n  }\n  return cache.get(url);\n}",
k:"use Hook nahi hai — isliye conditions/loops me chal sakta hai. Promise hamesha cached rakho, try-catch me mat rakho, aur promise.status ko seedha kabhi mat padho."},
{n:69,g:7,t:"browser",u:"https://react.dev/reference/react-dom/browser",
p:["<code>browser</code> (<code>react-dom</code> se) server rendering ke dauraan ek component ko <b>browser-only</b> mark karta hai. Ye <code>use</code> ke saath istemal hota hai. Signature: <code>use(browser(reason?))</code>. Ye React 19 ke daur ka naya API hai, aur yahi page Reference ke React APIs aur React DOM APIs — dono groups me list hai (page ek hi hai).",
"<code>reason</code> (optional) ek string ya function hai jo batata hai ki content ko browser me render hone ki zaroorat kyun hai. String, ya function ki return value, <code>onBrowserBailout</code> ko diye gaye <code>Error</code> ki <code>cause</code> ban jati hai. React reason function ko tab call karta hai jab koi server renderer us value se takrata hai — browser me nahi. Reason banana mehnga ho to function do, jaise <code>() =&gt; new Error(...)</code>.",
"<b>Return value</b> ek opaque value hai jise tum component me <code>use</code> ko pass karte ho, ya server render ko abort karte waqt reason ke roop me use karte ho. Browser me, ise <code>use</code> ko pass karne par <code>undefined</code> return hota hai. Server rendering ke dauraan <code>use(browser())</code> component ka rendering rok deta hai aur uski jagah sabse kareebi <code>&lt;Suspense&gt;</code> boundary ka fallback chhod deta hai; browser me component aam taur par render hota hai. Ye <code>typeof window</code> checks, Effect ke mounted state set karne ka intezaar, ya SSR disable karne wale framework options — teeno ki jagah leta hai.",
"Doosra istemal: server render ko abort karna. <code>browser</code> value ko <code>renderToPipeableStream</code> ke <code>abort()</code> ke reason ke roop me (ya <code>AbortSignal</code> lene wale APIs ke liye <code>AbortController.abort</code> me) do — pending content ka intezaar ruk jayega aur browser use render kar lega. <code>browser</code> wala abort reason <code>onError</code>/<code>onRecoverableError</code> trigger <b>nahi</b> karta; uski jagah har recover hui Suspense boundary <code>onBrowserBailout(error, errorInfo)</code> ko report hoti hai (<code>errorInfo.componentStack</code> batata hai kahan).",
"Galtiyan: <code>browser()</code> ko akela call karne ka koi asar nahi — value ko <code>use</code> ko pass karo (aur use throw mat karo). Server rendering ke dauraan <code>use(browser())</code> ke aas-paas Suspense boundary na ho to server render fail ho jata hai — aur boundary na ho to <code>onBrowserBailout</code> bhi call nahi hota; failure renderer ke aam error callbacks se jata hai. Server Component se call karna galat hai — ye <b>Client Component</b> hona chahiye (<code>'use client'</code> lagao ya call ko ek child Client Component me le jao)."],
c:"'use client';\nimport { use, useState } from 'react';\nimport { browser } from 'react-dom';\n\nexport default function SavedDraft() {\n  use(browser('The saved draft is stored in localStorage.'));\n  const [draft] = useState(() => localStorage.getItem('draft') ?? '');\n  return <DraftEditor initialDraft={draft} />;\n}\n\n// Hook ke andar conditional opt-out\nfunction useBrowserQuery(query, options) {\n  if (options.initialData === undefined) {\n    use(browser('useBrowserQuery: No initial data was provided.'));\n  }\n  return useQuery(query, options);\n}\n\n// Slow server render ko abort karna\nconst { pipe, abort } = renderToPipeableStream(<App />, {\n  onShellReady() {\n    pipe(response);\n    setTimeout(() => {\n      abort(browser('The server render timed out.'));\n    }, 10000);\n  }\n});",
k:"browser() + use() = saaf browser-only opt-out: server par Suspense fallback, browser me asal component. Suspense boundary zaroori hai, aur ye Client Component se hi chalega."},
{n:70,g:8,t:"'use client'",u:"https://react.dev/reference/rsc/use-client",
p:["<code>'use client'</code> directive ek module (aur uski transitive dependencies) ko client code ke roop me mark karta hai — React Server Components app ke module dependency tree me ek <b>server–client boundary</b> banata hai. Ye ek directive string hai jo file ke <b>bilkul shuru</b> me aati hai — kisi bhi import ya doosre code se pehle (comments chalenge), single ya double quotes me, backticks me nahi. Iske koi parameters/options nahi hain.",
"RSC apps default roop se server-rendered hote hain. Jab ek <code>'use client'</code> file kisi Server Component se import hoti hai, to compatible bundlers us import ko boundary mante hain: wo module aur uski saari transitive dependencies client par evaluate hoti hain, bundle hokar browser ko bheji jati hain. Render ke dauraan framework root ko server-render karke render tree me aage badhta hai, client-marked code ko evaluate karne se opt out karta rehta hai; server-rendered hissa client ko bheja jata hai, jo apne downloaded client code se rendering poori karta hai.",
"<b>Sabse bareek aur sabse zyada poochhi jaane wali baat:</b> boundary <b>module dependency tree</b> par hai, render tree par nahi. Ek component <i>usage</i> Client Component hai agar wo <code>'use client'</code> module me define hai ya kisi aise module ki transitive dependency hai; warna wo Server Component hai. Isi liye ek hi component alag usages me Server bhi ho sakta hai aur Client bhi — <code>FancyText</code> seedha <code>App</code> ke neeche Server Component hai; <code>InspirationGenerator</code> (jisme <code>'use client'</code> hai) ke neeche wahi Client Component hai, aur uski definition server aur client dono par evaluate hoti hai. Ulta: <code>Copyright</code> ek Client Component ke <i>child</i> ke roop me render hone par bhi Server Component rehta hai, kyunki <code>App</code> (server) use import karke call karta hai — Client Components Server Components ko <code>children</code> props ke roop me lekar render kar sakte hain. Ek hi module server code se import hone par server par, aur client code se import hone par client par evaluate ho sakta hai. Aur jab ek <code>'use client'</code> module kisi doosre client-rendered module se import ho, to directive ka koi asar nahi hota.",
"<b>Serializable props:</b> Server Component se Client Component ko non-serializable props pass karna galti hai. Serializable hain: primitives (string, number, bigint, boolean, undefined, null, <code>Symbol.for</code> symbols), serializable values ke iterables (String, Array, Map, Set, TypedArray, ArrayBuffer), Date, serializable properties wale plain objects, Server Functions, JSX elements, Promises. Supported <b>nahi</b> hain: (Server Function na hone wale) functions, classes, classes ke instances (upar listed built-ins ke alawa), null prototype wale objects, non-global symbols. <code>'use client'</code> module se koi non-component, non-serializable value server-evaluated code me import karna throw karta hai.",
"Kab chahiye: interactivity/state (event handlers aur zyadaatar Hooks ke liye Client Component zaroori hai — Server Components render ke baad memory me nahi rehte aur unki apni state nahi ho sakti), client APIs (jaise canvas), <code>createContext</code> use karne wali third-party libraries, <code>use</code>/<code>useId</code> ke alawa zyadaatar Hooks, <code>forwardRef</code>, <code>memo</code>, <code>startTransition</code>. Server Components ke fayde: client JS kam, filesystem access, low-latency fetches — seema: koi interaction nahi, zyadaatar Hooks nahi. Galtiyan: directive ko imports ke baad rakhna ya backticks me likhna (kaam nahi karega), aur parent–child render relationship se same environment assume karna (nahi hota — boundary module tree par hai)."],
c:"'use client';\nimport { useState } from 'react';\n\nexport default function Counter({ initialValue = 0 }) {\n  const [countValue, setCountValue] = useState(initialValue);\n  const increment = () => setCountValue(countValue + 1);\n  const decrement = () => setCountValue(countValue - 1);\n  return (\n    <>\n      <h2>Count Value: {countValue}</h2>\n      <button onClick={increment}>+1</button>\n      <button onClick={decrement}>-1</button>\n    </>\n  );\n}\n\n// Server Component — koi directive nahi; server par filesystem padhta hai\nimport { readFile } from 'node:fs/promises';\nimport Counter from './Counter';\n\nexport default async function CounterContainer() {\n  const initialValue = await readFile('/path/to/counter_value');\n  return <Counter initialValue={initialValue} />\n}",
k:"'use client' module tree par boundary banata hai, render tree par nahi — isiliye ek hi component ek usage me Server aur doosre me Client ho sakta hai."},
{n:71,g:8,t:"'use server'",u:"https://react.dev/reference/rsc/use-server",
p:["<code>'use server'</code> directive async functions ko <b>Server Functions</b> ke roop me mark karta hai — server-side functions jinhe client-side code network par call kar sakta hai. Do placements: <b>inline</b> — ek async function body ke bilkul upar; ya <b>module level</b> — file ke bilkul upar, jisse file ke <b>saare exports</b> Server Functions ban jate hain. Directive function ya module ke bilkul shuru me honi chahiye, imports samet kisi bhi code se pehle (comments chalenge), single ya double quotes me — backticks me nahi.",
"Client se Server Function call karne par serialized arguments ke saath ek network request jati hai; function koi value return kare to wo value serialize hokar client ko wapas aati hai (use padhne ke liye returned Promise ko await karo). Network calls hamesha async hoti hain, isliye <code>'use server'</code> sirf <b>async functions</b> par use ho sakta hai. Aur client code se Server Function import karna ho to directive module level par honi chahiye.",
"<b>Sabse aam istemal — forms se mutations:</b> Server Function ko <code>&lt;form action={...}&gt;</code> ko pass karo; React form ka <code>FormData</code> pehle argument ke roop me deta hai. React form ko progressively enhance karta hai, to JS bundle load hone se pehle bhi form submit ho sakta hai. <code>useActionState</code> ke saath Server Function ko <code>(prevState, formData)</code> milta hai aur uski return value UI update karti hai. Forms ke bahar, Server Functions exposed server endpoints hain jinhe client code me kahin bhi call kar sakte ho — unhe ek <b>Transition ke andar</b> call karo (forms ye khud karte hain) taaki loading indicator, optimistic updates aur error handling mile.",
"<b>Security — interview me pakka:</b> arguments poori tarah <b>client-controlled</b> hote hain. Hamesha unhe validate aur escape karo, aur mutation ko authorize karo (check karo ki logged-in user ko wo action karne ki ijaazat hai ya nahi). Serializable arguments: primitives, serializable values ke iterables, Date, <code>FormData</code> instances, plain objects, Server Functions, Promises. Supported nahi: JSX/React elements, (Server Function na hone wale) functions — component functions samet, classes, class instances (built-ins ke alawa), null-prototype objects, non-global symbols, event handlers se mile events.",
"Server Functions server-side state update karne wale <b>mutations</b> ke liye design hue hain, data fetching ke liye <b>nahi</b> — frameworks aam taur par ek samay par ek action process karte hain aur return value ko cache nahi karte. Form ke bahar bina Transition ke call karne par loading/optimistic/error handling ka fayda kho jata hai."],
c:"// Inline — async function body ke upar\nasync function addToCart(data) {\n  'use server';\n  // ...\n}\n\n// Module level — file ke saare exports Server Functions\n// 'use server';\n// export default async function incrementLike() {\n//   likeCount++;\n//   return likeCount;\n// }\n\n// Form action\nasync function requestUsername(formData) {\n  'use server';\n  const username = formData.get('username');\n  // ...\n}\nexport default function App() {\n  return (\n    <form action={requestUsername}>\n      <input type=\"text\" name=\"username\" />\n      <button type=\"submit\">Request</button>\n    </form>\n  );\n}",
k:"'use server' = network par call ho sakne wale server mutations (badlaav). Arguments client-controlled hain — hamesha validate + authorize karo; data fetching ke liye ye tool nahi hai."},
{n:72,g:9,t:"Children",u:"https://react.dev/reference/react/Children",
p:["<code>Children</code> API (capital C) tumhe <code>children</code> prop ke roop me mili JSX ko manipulate aur transform karne deta hai. Page ka banner chetaavni deta hai: <code>Children</code> ka istemal uncommon hai aur <b>fragile code</b> ki taraf le ja sakta hai — pehle alternatives dekho. Iske paanch methods hain: <code>Children.count(children)</code>, <code>Children.forEach(children, fn, thisArg?)</code>, <code>Children.map(children, fn, thisArg?)</code>, <code>Children.only(children)</code>, <code>Children.toArray(children)</code>.",
"<code>children</code> ek <b>opaque data structure</b> hai — assume mat karo ki wo array hai; ek single child andar se array me wrapped bhi nahi hota. <code>fn</code> ko <code>(child, index)</code> milta hai (index 0 se shuru); optional <code>thisArg</code> <code>fn</code> ka <code>this</code> hai. Return values: <code>count</code> nodes ki ginti deta hai; <code>forEach</code> <code>undefined</code>; <code>map</code> — <code>children</code> <code>null</code>/<code>undefined</code> ho to wahi value, warna <code>fn</code> ke returned nodes ki flat array (<code>null</code>/<code>undefined</code> ko chhod kar), aur returned elements ki keys original items ki keys ke saath automatically combine ho jati hain; <code>only</code> single element deta hai agar <code>children</code> ek valid element hai, warna throw karta hai; <code>toArray</code> elements ki flat array deta hai — empty nodes hata kar, aur keys ko original keys, nesting level aur position se recalculate karke taaki flattening se behavior na badle.",
"<b>Traversal ke niyam:</b> traversal empty nodes (<code>null</code>, <code>undefined</code>, Booleans), strings, numbers aur React elements ko alag-alag nodes gin-ta hai; arrays khud nodes nahi hain lekin unke children hain. Aur traversal React elements se <b>gehrा nahi jata</b> — elements render nahi hote aur unke children traverse nahi hote; Fragments bhi traverse nahi hote. Matlab <code>Children</code> sirf wahi JSX 'dekhta' hai jo use mili — inner components ka rendered output kabhi nahi.",
"Sabse badi galatfehmi yahi hai: <code>&lt;RowList&gt;&lt;p&gt;First&lt;/p&gt;&lt;MoreRows /&gt;&lt;/RowList&gt;</code> me <code>RowList</code> ke hisaab se sirf <b>2</b> children hain, chahe <code>MoreRows</code> 10 items render kare ya <code>null</code>. <code>Children.count</code> 2 hi dega — <code>children</code> ko manipulate karte waqt inner component ka rendered output paane ka koi tareeka nahi. <code>Children.only</code> ko array argument (jaise <code>Children.map</code> ka return) dena hamesha throw karta hai. Components extract karna <code>Children.map</code>-based wrapping ko tod deta hai (<code>MoreRows</code> ek single 'row' ban jata hai).",
"<b>Docs ke pasandeeda alternatives:</b> (1) kai components expose karo (haath se likhe hue <code>&lt;Row&gt;</code> wrappers); (2) objects ki array ko prop ke roop me lo (jaise <code>tabs={[{id, header, content}]}</code>) — phir normal array methods use kar sakte ho aur extra data attach kar sakte ho; (3) render prop use karo (<code>renderRow={(id, index) =&gt; ...}</code>). API deprecated nahi hai, lekin discouraged hai."],
c:"import { Children } from 'react';\n\nfunction RowList({ children }) {\n  return (\n    <div className=\"RowList\">\n      {Children.map(children, child =>\n        <div className=\"Row\">{child}</div>\n      )}\n    </div>\n  );\n}\n\n// Gin-na\n// <h1>Total rows: {Children.count(children)}</h1>\n\n// Array me badal kar phir filter/sort/reverse\nconst result = Children.toArray(children);\nresult.reverse();",
k:"children ek opaque structure hai — Children sirf mili hui JSX dekhta hai, rendered output kabhi nahi. Fragile hai; pehle data-prop ya render-prop alternatives socho."},
{n:73,g:9,t:"cloneElement",u:"https://react.dev/reference/react/cloneElement",
p:["<code>cloneElement</code> ek element ko starting point banakar, kuch props/children override karke, ek <b>naya React element</b> banata hai. Page ka banner yahan bhi chetaavni deta hai: iska istemal uncommon hai aur fragile code ki taraf le ja sakta hai. Signature: <code>const clonedElement = cloneElement(element, props, ...children)</code>.",
"<code>element</code> ek valid React element hona chahiye (JSX node, <code>createElement</code> ka result, ya kisi doosre <code>cloneElement</code> ka result). <code>props</code> ek object ya <code>null</code> hai: <code>null</code> saare original props rakhta hai; warna <code>props</code> me di har prop ke liye returned element <code>props</code> wali value ko <code>element.props</code> par tarjeeh deta hai, baaki original se bhar jate hain. <code>props.key</code>/<code>props.ref</code> originals ko replace karte hain. Optional <code>...children</code> zero ya zyada child nodes hain; koi na do to original <code>element.props.children</code> preserve rehta hai.",
"Return hua element: <code>type</code> wahi jo <code>element.type</code> tha; <code>props</code> original aur overriding props ka <b>shallow merge</b>; <code>ref</code>/<code>key</code> original, jab tak override na kiye hon. Cloning original element ko <b>modify nahi</b> karta. Elements ko creation ke baad opaque samjho — sirf render karo. Classic istemal: ek <code>List</code> har <code>&lt;Row&gt;</code> child ko <code>Children.map</code> se clone karke <code>isHighlighted: index === selectedIndex</code> inject karti hai — selected row alag render hoti hai aur 'Next' button selection ko cycle karta hai.",
"Galti: dynamic children ko kai arguments ke roop me dena. Poori array ko teesre argument ke roop me do (<code>cloneElement(element, null, listItems)</code>) taaki React missing keys ki warning de sake; kai arguments sirf statically known children ke liye hain. Aur asal nuksan: children ko clone karna data flow ko trace karna mushkil bana deta hai — page kehta hai pehle alternatives try karo.",
"<b>Alternatives:</b> (1) render prop — <code>renderItem={(product, isHighlighted) =&gt; &lt;Row .../&gt;}</code> — sabse explicit; (2) context se data pass karo — har item ke liye <code>HighlightContext</code> provider, <code>Row</code> use <code>useContext</code> se padhe; (3) logic ko custom Hook me nikalo — <code>useList</code> <code>[selected, onNext]</code> return kare aur parent rows ko seedha render kare. API deprecated nahi hai, lekin discouraged hai."],
c:"import { cloneElement } from 'react';\n\nconst clonedElement = cloneElement(\n  <Row title=\"Cabbage\">Hello</Row>,\n  { isHighlighted: true },\n  'Goodbye'\n);\n// <Row title=\"Cabbage\" isHighlighted={true}>Goodbye</Row>\n\n// Classic istemal — List har Row ko highlight state inject karti hai\nexport default function List({ children }) {\n  const [selectedIndex, setSelectedIndex] = useState(0);\n  return (\n    <div className=\"List\">\n      {Children.map(children, (child, index) =>\n        cloneElement(child, {\n          isHighlighted: index === selectedIndex\n        })\n      )}\n      <hr />\n      <button onClick={() => {\n        setSelectedIndex(i => (i + 1) % Children.count(children));\n      }}>\n        Next\n      </button>\n    </div>\n  );\n}",
k:"cloneElement = shallow-merge se naya element; original nahi badalta. Data flow chhup jata hai, isliye render prop, context ya custom Hook pehle try karo."},
{n:74,g:9,t:"Component",u:"https://react.dev/reference/react/Component",
p:["<code>Component</code> JavaScript classes ke roop me define hue React components ki <b>base class</b> hai. Class components ab bhi supported hain, lekin page components ko classes ki jagah <b>functions</b> ke roop me define karne ki sifarish karta hai (aur migration ka tareeka bhi dikhata hai). Sirf <code>render()</code> required hai; baaki saare methods optional hain. Class components ke andar <b>Hooks supported nahi</b> hain.",
"<b>Instance members:</b> <code>this.props</code> — component ko mile props (function component ke props ke barabar). <code>this.state</code> — ek object hona chahiye; seedha mutate kabhi mat karo, <code>setState</code> use karo (<code>useState</code> ke barabar). <code>this.context</code> — sirf tab uplabdh jab <code>static contextType</code> (modern) bataye ki kaunsi context chahiye; ek class ek samay par sirf <b>ek</b> context padh sakti hai (<code>useContext</code> ke barabar). <code>constructor(props)</code> mount se pehle chalta hai — sirf state declare karne aur methods bind karne ke liye; pehle <code>super(props)</code> call karo warna constructor me <code>this.props</code> <code>undefined</code> rahega; yahi ekmatra jagah hai jahan <code>this.state</code> ko seedha assign kar sakte ho; koi side effects/subscriptions nahi (wo <code>componentDidMount</code> ke liye hain); SSR ke dauraan server par chalta hai; Strict Mode dev me do baar call hota hai aur ek instance discard ho jata hai.",
"<b>setState(nextState, callback?):</b> ek state change ko enqueue karta hai. <code>nextState</code> ek object (shallowly merged) ya ek updater function <code>(prevState, props) =&gt; partialState</code> hai (pure hona chahiye; queued updaters kram se apply hote hain). Ye ek <i>request</i> hai, turant ka command nahi — updates batch hote hain aur pehle se chal rahe code me <code>this.state</code> nahi badalta. Optional <code>callback</code> commit ke baad chalta hai. <code>flushSync</code> synchrony force kar sakta hai lekin performance ko nuksan pahuncha sakta hai. <code>forceUpdate(callback?)</code> re-render force karta hai (<code>shouldComponentUpdate</code> ko skip karke) — aam taur par bekaar hai, kyunki render ko sirf <code>this.props</code>/<code>this.state</code>/<code>this.context</code> padhna chahiye; function duniya me iski jagah <code>useSyncExternalStore</code> ne li hai.",
"<b>Lifecycle trio:</b> <code>componentDidMount()</code> — component screen par aane ke baad; data fetching, subscriptions, DOM manipulation ki aam jagah. Strict Mode dev me React ise, phir <code>componentWillUnmount</code>, phir ise dobara call karta hai — cleanup ko setup ka mirror hona chahiye. <code>componentDidUpdate(prevProps, prevState, snapshot?)</code> — updated props/state ke saath re-render ke turant baad; initial render par nahi; <code>shouldComponentUpdate</code> ne <code>false</code> diya ho to nahi; <code>snapshot</code> <code>getSnapshotBeforeUpdate</code> ki value hai. Isme bina comparison ke logic chalana infinite loop ka khatra hai. <code>componentWillUnmount()</code> — hatne se pehle; fetching cancel karo, subscriptions hatao; logic ko <code>componentDidMount</code> ka mirror rakho. Teeno milkar lagbhag <code>useEffect</code> ke barabar hain (code ko paint se pehle chalna ho to <code>useLayoutEffect</code>). <code>getSnapshotBeforeUpdate(prevProps, prevState)</code> React ke DOM update karne se turant pehle chalta hai — badalne se pehle jaankari (jaise scroll position) capture karo; returned value <code>componentDidUpdate</code> ko teesre argument ke roop me milti hai. Classic pattern: chat list ki scroll position bachana (<code>list.scrollHeight - list.scrollTop</code>). Iska abhi koi function-component equivalent nahi hai.",
"<b>Error Boundaries:</b> <code>static getDerivedStateFromError(error)</code> — koi child rendering ke dauraan throw kare tab call hota hai; error message dikhane wali state return karo; pure hona chahiye (side effects, jaise analytics, <code>componentDidCatch</code> me jayein). <code>componentDidCatch(error, info)</code> — koi child (door ka bhi) rendering me throw kare tab; <code>info.componentStack</code> component stack trace hai; fallback dikhane ke liye isme <code>setState</code> call karna ab <code>getDerivedStateFromError</code> ke paksh me deprecated hai. Inka abhi koi direct function-component equivalent nahi hai — ek <code>ErrorBoundary</code> class likho ya <code>react-error-boundary</code> use karo. Aur Error Boundaries <b>sab kuch nahi pakadti</b>: event handlers ke errors, SSR, boundary ke khud ke errors, aur async code (<code>setTimeout</code>/<code>requestAnimationFrame</code>) ke errors nahi pakadti — apvaad: <code>useTransition</code> ke <code>startTransition</code> function ke andar ke errors pakde jate hain.",
"<b>Baaki members:</b> <code>shouldComponentUpdate(nextProps, nextState, nextContext)</code> — re-render skip karne ke liye <code>false</code> return karo; default <code>true</code>; initial render ya <code>forceUpdate</code> par call nahi hota; sirf performance optimization hai (component bina iske tute to pehle wo fix karo); deep equality/<code>JSON.stringify</code> yahan mat karo; <code>PureComponent</code> prefer karo; <code>false</code> return karna children ko unki apni state changes par re-render hone se nahi rokta aur no-re-render ki guarantee bhi nahi deta; function equivalent <code>memo</code> (+ <code>useMemo</code>) hai. <code>static defaultProps</code> — <code>undefined</code> aur missing props ke liye defaults, <code>null</code> props ke liye <b>nahi</b>; function equivalent default parameter values hain. <code>static getDerivedStateFromProps(props, state)</code> — <code>render</code> se turant pehle, mount aur har update par (har render par fire hota hai, <code>UNSAFE_componentWillReceiveProps</code> ke ulta); instance tak pahunch nahi; object return karo state update karne ke liye ya <code>null</code>; durlabh use case — samay ke saath prop changes par nirbhar state (docs ke <code>Form</code> example me <code>userID</code> badalne par <code>email</code> reset hota hai, compare karne ke liye <code>prevUserID</code> state me rehta hai).",
"<b>Deprecated lifecycles:</b> <code>componentWillMount()</code> / <code>componentWillReceiveProps(nextProps)</code> / <code>componentWillUpdate(nextProps, nextState)</code> <b>deprecated</b> hain — inka naam badal kar <code>UNSAFE_</code> wala kar diya gaya hai; future major version me sirf naye naam kaam karenge (<code>rename-unsafe-lifecycles</code> codemod chalao). <code>UNSAFE_componentWillMount</code> constructor ke turant baad chalta hai, sirf aitihasik hai, aur server rendering ke dauraan chalne wala ekmatra lifecycle hai (vyavaharik roop se constructor jaisa hi). <code>UNSAFE_componentWillReceiveProps</code> naye props milne par chalta hai — alternatives: side effects ke liye <code>componentDidUpdate</code>, prop change par recompute ke liye memoization helper, state reset ke liye fully controlled ya key ke saath fully uncontrolled, state adjust karne ke liye <code>getDerivedStateFromProps</code>; ye initial props par nahi chalta aur ye guarantee nahi deta ki props asal me aayenge hi (Suspense attempt ko discard kar sakta hai) ya badle bhi hain — khud compare karo. <code>UNSAFE_componentWillUpdate</code> naye props/state ke saath render se pehle chalta hai; isme <code>setState</code> supported nahi hai. <b>render()</b> khud: ekmatra required method; props/state/context ka pure function hona chahiye, koi side effect nahi; koi bhi valid React node return kar sakta hai; React ise kisi bhi pal call kar sakta hai aur results discard ho sakte hain; Strict Mode dev me do baar call hota hai. <b>Migration mapping</b> (page se): state → <code>useState</code> (har variable ke liye alag), handlers → plain functions, <code>this.*</code> references hatao; lifecycles → ek <code>useEffect</code> (unrelated kaam hon to kai independent Effects me baanto); context → <code>useContext</code>. Aur is page se gayab members — legacy <code>static contextTypes</code>, <code>static childContextTypes</code>, <code>getChildContext</code>, <code>static propTypes</code>, <code>this.refs</code> — React 19 me <b>removed</b> hain; unke apne sections (81–85) 18.react.dev par aadharit hain."],
c:"class ErrorBoundary extends React.Component {\n  constructor(props) {\n    super(props);\n    this.state = { hasError: false };\n  }\n  static getDerivedStateFromError(error) {\n    return { hasError: true };\n  }\n  componentDidCatch(error, info) {\n    logErrorToMyService(error, info.componentStack, React.captureOwnerStack());\n  }\n  render() {\n    if (this.state.hasError) {\n      return this.props.fallback;\n    }\n    return this.props.children;\n  }\n}\n\n// <ErrorBoundary fallback={<p>Something went wrong</p>}>\n//   <Profile />\n// </ErrorBoundary>\n\n// Function roop — lifecycle trio ek useEffect me\nfunction ChatRoom({ roomId }) {\n  const [serverUrl, setServerUrl] = useState('https://localhost:1234');\n  useEffect(() => {\n    const connection = createConnection(serverUrl, roomId);\n    connection.connect();\n    return () => { connection.disconnect(); };\n  }, [serverUrl, roomId]);\n  // ...\n}",
k:"Class components supported hain lekin naye code ke liye functions hi sifarish hai. Error Boundary ab bhi class hi mangti hai — getDerivedStateFromError + componentDidCatch ka joda yaad rakho."},
{n:75,g:9,t:"createElement",u:"https://react.dev/reference/react/createElement",
p:["<code>createElement</code> ek React element banata hai — JSX likhne ka <b>non-JSX alternative</b>. Signature: <code>const element = createElement(type, props, ...children)</code>.",
"<code>type</code> ek valid React component type hai: tag-name string (<code>'div'</code>, <code>'span'</code>) ya ek React component (function, class, ya <code>Fragment</code> jaisa special component). <code>props</code> ek object ya <code>null</code> hai (<code>null</code> matlab empty object). <code>props</code> me <code>ref</code> aur <code>key</code> <b>special</b> hain: wo <code>element.props.ref</code>/<code>element.props.key</code> ke roop me uplabdh <b>nahi</b> hote — wo <code>element.ref</code>/<code>element.key</code> par rehte hain. Optional <code>...children</code> zero ya zyada child nodes hain.",
"Return value ek React element object hai: <code>type</code> (jaise pass kiya), <code>props</code> (jaise pass kiye, <code>ref</code> aur <code>key</code> ko chhod kar), <code>ref</code> (pass kiya ref, warna <code>null</code>), <code>key</code> (pass ki key string me badal kar, warna <code>null</code>). Elements ko creation ke baad opaque samjho — sirf render karo.",
"<b>JSX asal me yahi hai:</b> JSX <code>createElement</code> calls me compile hota hai. <code>&lt;Something /&gt;</code> ≡ <code>createElement(Something)</code>; <code>&lt;something /&gt;</code> (lowercase) ≡ <code>createElement('something')</code> — ek string, jise built-in HTML tag mana jata hai (custom components ke liye capital-letter niyam ki jad yahi hai). Ek element ek halki description hai (saral roop me: <code>{ type: Greeting, props: { name: 'Taylor' }, key: null, ref: null }</code>) — use banane se component render <b>nahi</b> hota aur DOM nodes <b>nahi</b> bante; ye React ke liye baad me render karne ka ek instruction hai. Elements banana behad sasta hai.",
"Galtiyan: creation ke baad element ya uske props ko mutate karna — elements aur props immutable hain; React development me unhe shallow-freeze karta hai. Custom component ke liye lowercase tag dena — wo DOM tag ban jayega. Aur dynamic children ko kai arguments ke roop me dena — poori array ko teesre argument ke roop me do (<code>createElement('ul', {}, listItems)</code>) taaki React missing keys ki warning de; kai arguments sirf statically known children ke liye hain."],
c:"import { createElement } from 'react';\n\nfunction Greeting({ name }) {\n  return createElement(\n    'h1',\n    { className: 'greeting' },\n    'Hello ',\n    createElement('i', null, name),\n    '. Welcome!'\n  );\n}\n// JSX equivalent:\n// <h1 className=\"greeting\">Hello <i>{name}</i>. Welcome!</h1>\n\nexport default function App() {\n  return createElement(Greeting, { name: 'Taylor' });\n}",
k:"Element = ek plain, immutable description object — na component instance, na DOM node. JSX isi me compile hota hai; key/ref props se alag, element par rehte hain."},
{n:76,g:9,t:"createRef",u:"https://react.dev/reference/react/createRef",
p:["<code>createRef</code> class components ke andar istemal ke liye ek ref object banata hai — ek <code>{ current: null }</code> container. Signature: <code>createRef()</code> — koi parameter nahi.",
"Return value: ek hi property <code>current</code> wala object, shuru me <code>null</code>. Ref object ko kisi JSX node ke <code>ref</code> attribute ke roop me pass karo to React uski <code>current</code> property set kar deta hai (jaise DOM node se). Istemal: ise class field ke roop me declare karo (<code>inputRef = createRef()</code>), <code>&lt;input ref={this.inputRef} /&gt;</code> pass karo, aur React <code>this.inputRef.current</code> ko input DOM node se bhar dega — jaise ek button jo input ko focus kare.",
"Sabse badi baat: <code>createRef</code> hamesha ek <b>alag</b> object return karta hai — ye khud <code>{ current: null }</code> likhne ke barabar hai. Function component ke render ke dauraan ise call karne par har render ek naya ref banta; function components me iski jagah <code>useRef</code> use karo, jo hamesha wahi object return karta hai. Page ek bareek equivalence bhi deta hai: <code>const ref = useRef()</code> ≡ <code>const [ref, _] = useState(() =&gt; createRef(null))</code>.",
"API deprecated nahi hai, lekin <b>sirf class components ke liye</b> hai. Page ka Alternatives section ek class ko <code>createRef</code> se function me <code>useRef</code> ke saath migrate karna dikhata hai (is research ke text fetch me wo interactive example poora nahi aaya — disha record hai, poora example code nahi). Interview ka classic: <code>createRef</code> vs <code>useRef</code> — har call par naya object banam renders ke beech stable object."],
c:"import { Component, createRef } from 'react';\n\nclass Form extends Component {\n  inputRef = createRef();\n  // ...\n  // <input ref={this.inputRef} />\n  // this.inputRef.current.focus();\n}",
k:"createRef sirf classes ke liye hai aur har call par naya { current } object deta hai — function components me useRef hi sahi hai, kyunki wo stable rehta hai."},
{n:77,g:9,t:"forwardRef",u:"https://react.dev/reference/react/forwardRef",
p:["<code>forwardRef</code> ek component ko apne parent se <code>ref</code> praapt karke use kisi child component ya DOM node ko <b>forward</b> karne deta hai — parent ko ek DOM node expose karna. Signature: <code>const SomeComponent = forwardRef(render)</code>.",
"<b>⚠️ React 19 me deprecated:</b> page par deprecation banner hai — 'In React 19, <code>forwardRef</code> is no longer necessary. Pass <code>ref</code> as a prop instead. <code>forwardRef</code> will be deprecated in a future release.' React 19 me function components <code>ref</code> ko ek regular prop ke roop me praapt karte hain, isliye <code>forwardRef</code> ki zaroorat hi nahi rahi. Naye code me <code>ref</code> ko prop ki tarah lo (jaise is SPA ke <code>useImperativeHandle</code> section me dikhaya hai).",
"<code>render</code> function ko React <code>(props, ref)</code> ke saath call karta hai: <code>props</code> parent ke props hain; <code>ref</code> parent ka <code>ref</code> attribute hai (object ya function, kuch pass na ho to <code>null</code>). Praapt <code>ref</code> ko ya to kisi doosre component ko do ya <code>useImperativeHandle</code> ko. Return value ek React component hai jo JSX me render ho sakta hai aur, ek plain function component ke ulta, <code>ref</code> prop praapt kar sakta hai (React 19 se pehle ke model me).",
"Kaise kaam karta hai: component definition ko <code>forwardRef()</code> me lapeto aur mili <code>ref</code> ko doosre argument ke roop me us DOM node ko do jise expose karna hai (<code>&lt;input ref={ref} /&gt;</code>). Parent <code>useRef</code> se ref banakar pass karta hai aur phir jaise <code>ref.current.focus()</code> call kar sakta hai. Refs kai components se hokar forward ho sakte hain (<code>Form</code> → <code>FormField</code> → <code>MyInput</code> → <code>&lt;input&gt;</code>). Constrained API ke liye <code>useImperativeHandle(ref, () =&gt; ({ focus() {...}, scrollIntoView() {...} }))</code> ko ek alag internal ref ke saath use karo, taaki parent ko poora DOM node nahi, sirf <code>{ focus, scrollIntoView }</code> mile.",
"Galtiyan: mili <code>ref</code> ko asal me use hi na karna — parent ki ref <code>null</code> reh jati hai; fix: use DOM node ko ya ref lene wale component ko do. Conditional forwarding — ref paane wala node conditionally render ho (<code>{showInput &amp;&amp; &lt;input ref={ref} /&gt;}</code>) aur condition false ho (shayad kisi <code>Panel</code> jaise component ke andar chhupa ho) to ref khaali rehti hai. DOM node expose karna component ke internals ko baad me badalna mushkil bana deta hai — aam taur par sirf low-level reusable components (buttons, text inputs) DOM nodes expose karte hain, app-level components (avatar, comment) nahi. Strict Mode me React render function ko dev me do baar call karta hai; render pure ho to koi nuksan nahi. Aur wahi usool: refs ka zyada istemal mat karo — jo prop se ho sakta hai wo prop hi ho (<code>&lt;Modal isOpen={isOpen} /&gt;</code>, imperative <code>{ open, close }</code> handle nahi)."],
c:"import { forwardRef } from 'react';\n\nconst MyInput = forwardRef(function MyInput(props, ref) {\n  const { label, ...otherProps } = props;\n  return (\n    <label>\n      {label}\n      <input {...otherProps} ref={ref} />\n    </label>\n  );\n});\n\nfunction Form() {\n  const ref = useRef(null);\n  function handleClick() {\n    ref.current.focus();\n  }\n  return (\n    <form>\n      <MyInput label=\"Enter your name:\" ref={ref} />\n      <button type=\"button\" onClick={handleClick}>Edit</button>\n    </form>\n  );\n}\n\n// React 19 me yahi kaam bina forwardRef ke:\n// function MyInput({ label, ref, ...otherProps }) {\n//   return <label>{label}<input {...otherProps} ref={ref} /></label>;\n// }",
k:"React 19 me forwardRef ki zaroorat khatm — ref ko seedha prop ki tarah lo. Purane code me mile to pehchano: ref doosre argument se aakar DOM node tak forward hoti hai."},
{n:78,g:9,t:"isValidElement",u:"https://react.dev/reference/react/isValidElement",
p:["<code>isValidElement</code> check karta hai ki koi value ek <b>React element</b> hai ya nahi. Signature: <code>const isElement = isValidElement(value)</code> — <code>value</code> kisi bhi type ki ho sakti hai. Return: <code>true</code> agar <code>value</code> ek React element hai, warna <code>false</code>.",
"Sirf JSX tags aur <code>createElement</code> se return hue objects hi React elements gine jate hain. Numbers, strings, plain objects, arrays, aur <code>createPortal</code> se bane portals elements <b>nahi</b> hain — halanki jaise <code>42</code> ek bilkul valid React <i>node</i> hai jo koi component return kar sakta hai. Dhyaan do: <code>isValidElement(MyComponent)</code> bhi <code>false</code> hai — component khud element nahi hota, uska JSX istemal element hota hai.",
"<code>isValidElement</code> ki zaroorat padna bahut uncommon hai. Iska mukhya istemal sirf elements lene wale API (jaise <code>cloneElement</code>) ko call karne se pehle guard ke roop me hai, taaki argument element na ho to error se bach sako. Page saaf kehta hai: 'Unless you have some very specific reason to add an <code>isValidElement</code> check, you probably don't need it.'",
"Sabse aam galat istemal: ye check karna ki koi cheez render ho sakti hai ya nahi — ye galat test hai. Ek React node element, portal, string, number, <code>true</code>/<code>false</code>/<code>null</code>/<code>undefined</code>, ya nodes ki array — kuch bhi ho sakta hai. <code>42</code> renderable hai lekin element nahi. <b>Element vs node</b> ka yahi farq interview ka classic sawal hai."],
c:"import { isValidElement, createElement } from 'react';\n\n// ✅ React elements\nconsole.log(isValidElement(<p />)); // true\nconsole.log(isValidElement(<MyComponent />)); // true\nconsole.log(isValidElement(createElement('p'))); // true\n\n// ❌ React elements nahi\nconsole.log(isValidElement(null)); // false\nconsole.log(isValidElement(25)); // false\nconsole.log(isValidElement('Hello')); // false\nconsole.log(isValidElement({ age: 42 })); // false\nconsole.log(isValidElement([<div />, <div />])); // false\nconsole.log(isValidElement(MyComponent)); // false — component khud, element nahi",
k:"Element ≠ node: 42 render ho sakta hai lekin element nahi hai. isValidElement lagbhag kabhi nahi chahiye — bas cloneElement jaise APIs ke pehle guard ke liye."},
{n:79,g:9,t:"PureComponent",u:"https://react.dev/reference/react/PureComponent",
p:["<code>PureComponent</code> <code>Component</code> jaisa hi hai, lekin props aur state na badle hon (shallow comparison) to re-renders <b>skip</b> kar deta hai. Signature: <code>class Greeting extends PureComponent { render() { ... } }</code> — koi parameters/options nahi; tum <code>Component</code> ki jagah ise extend karte ho.",
"<code>PureComponent</code> <code>Component</code> ki subclass hai aur saare <code>Component</code> APIs support karti hai. Ise extend karna ek custom <code>shouldComponentUpdate</code> define karne ke barabar hai jo props aur state ko shallowly compare karta hai. Ye pure rendering logic maanta hai (same props/state/context → same output). Component phir bhi re-render hota hai agar uske use kiye hue kisi context me badlav aaye. Example: <code>Greeting</code> <code>name</code> badalne par re-render hota hai, lekin <code>address</code> badalne par nahi (wo prop ke roop me pass hi nahi hua).",
"Galtiyan: props/state ko mutate karna taaki shallow comparison badlav dekh hi na sake (same reference, andar ki content badli hui) — component re-render nahi hoga. Ise correctness tool ki tarah use karna — <code>memo</code> ki tarah ye bhi sirf ek optimization hai. Aur naye code me class components use karna — page functions ki sifarish karta hai; function equivalent <code>memo</code> hai, aur page ka Alternatives section ek <code>PureComponent</code> class ko function me migrate karna dikhata hai (is research ke text fetch me wo hissa poora nahi aaya — disha record hai). API deprecated nahi hai, lekin class components naye code ke liye recommended nahi hain."],
c:"import { PureComponent } from 'react';\n\nclass Greeting extends PureComponent {\n  render() {\n    return <h1>Hello, {this.props.name}!</h1>;\n  }\n}\n\n// Function equivalent:\n// const Greeting = memo(function Greeting({ name }) {\n//   return <h1>Hello, {name}!</h1>;\n// });",
k:"PureComponent = Component + built-in shallow shouldComponentUpdate. Class duniya ka memo hai — context change par phir bhi re-render hota hai."},
{n:80,g:9,t:"createFactory (Removed)",u:"https://18.react.dev/reference/react/createFactory",
p:["<code>createFactory</code> ek factory function banata tha jo diye gaye type ke React elements produce karta tha — JSX se pehle ke daur ka, bina JSX ke UI describe karne ka tareeka. Signature: <code>const factory = createFactory(type)</code>.",
"<code>type</code> ek valid React component type hai: tag-name string (<code>'div'</code>, <code>'span'</code>) ya ek React component (function, class, ya <code>Fragment</code> jaisa special component). Return value ek factory function hai — wo pehle argument ke roop me ek <code>props</code> object aur uske baad <code>...children</code> leta hai, aur diye gaye <code>type</code>, <code>props</code> aur <code>children</code> ke saath ek React element return karta hai. Soch me: factory = <code>createElement</code> jiska type pehle se bandha hua hai.",
"<b>Status: React 19 me REMOVED</b> — isiliye ye current react.dev par nahi hai. 18.react.dev par page ab bhi hai, Deprecated banner ke saath: 'This API will be removed in a future major version of React. See the alternatives.' (matlab: ye API aane wale bade React version me hat jayegi — iske vikalp dekho.) Is section ka source wahi 18.react.dev page hai. Naye code me ise bilkul call mat karo.",
"Migration ke teen raaste (page se): (1) apne project me ek <code>createFactory.js</code> implementation copy kar lo (saare call sites imports ke alawa waise ke waise rehte hain); (2) har factory call ko <code>createElement('button', { onClick }, 'Click me')</code> se badal do; (3) JSX use karo (sabse aam). Ek bareek baat: variable <code>type</code> (jaise <code>isSubheading ? 'h2' : 'h1'</code>) factory ke saath chalta hai, lekin JSX wale replacement me variable ka naam capital letter se shuru hona chahiye (<code>const Type = ...; return &lt;Type {...props} /&gt;</code>), warna React <code>&lt;type&gt;</code> ko built-in HTML tag manega."],
c:"import { createFactory } from 'react';\n\nconst button = createFactory('button');\n\nexport default function App() {\n  return button({\n    onClick: () => { \u0061lert('Clicked!') }\n  }, 'Click me');\n}\n\n// Aaj ka replacement — JSX:\n// <button onClick={() => \u0061lert('Clicked!')}>Click me</button>",
k:"createFactory React 19 me removed hai — sirf purana code padhne ke liye pehchano. Replacement JSX ya createElement hai."},
{n:81,g:9,t:"static contextTypes (Removed)",u:"https://18.react.dev/reference/react/Component#static-contexttypes",
p:["<code>static contextTypes</code> React ke legacy (pre-<code>createContext</code>) context API ka hissa tha — ye declare karta tha ki ek class component kaunsi legacy context values <b>consume</b> karta hai, jo <code>this.context</code> se padhi jati thi. Signature (18.react.dev ke anusaar): <code>static contextTypes = { /* legacy context shape */ }</code> — ek object jo component ke consume kiye hue legacy context keys ko describe karta hai.",
"Ye legacy context system ke saath joda bana kar kaam karta tha: provider <code>static childContextTypes</code> + <code>getChildContext()</code> declare karta tha, aur consumer <code>static contextTypes</code> declare karke values ko <code>this.context</code> se padhta tha. 18.react.dev ka Component page kehta hai: ek class component ki context <code>this.context</code> ke roop me uplabdh hai; ye sirf tab uplabdh hai jab tum <code>static contextType</code> (modern) ya <code>static contextTypes</code> (deprecated) se batao ki kaunsi context praapt karni hai. Ek class component ek samay par sirf ek context padh sakta hai — dono model me yahi seema hai. Iska zikr <code>shouldComponentUpdate</code> aur <code>UNSAFE_componentWillReceiveProps</code> ke <code>nextContext</code> ke legacy source ke roop me bhi aata hai.",
"<b>Status: React 19 me REMOVED.</b> 18.react.dev par is section ke saath Deprecated banner hai: 'This API will be removed in a future major version of React. Use <code>static contextType</code> instead.' (matlab: ye API aane wale bade React version me hat jayegi — iski jagah <code>static contextType</code> use karo.) Ye current react.dev ke Component page par nahi hai — is section ka source 18.react.dev hai.",
"Alternatives: <code>static contextType</code> (<code>createContext</code> se bani ek modern context) ya function components me <code>useContext</code>/<code>use</code>. Interview ke liye naam ki bareeki pakki rakho: <code>contextTypes</code> (legacy, plural, deprecated/removed) banam <code>contextType</code> (modern, singular). Naye code me <code>contextTypes</code> use karna galti hai."],
c:"class MyComponent extends Component {\n  static contextTypes = { /* legacy context shape */ };\n}\n\n// Aaj ka replacement — modern context\nclass MyComponent2 extends Component {\n  static contextType = ThemeContext; // createContext se bana hua\n  render() {\n    const theme = this.context;\n    // ...\n  }\n}",
k:"contextTypes (plural) legacy tha aur React 19 me removed hai — modern hai contextType (singular) ya function components me useContext."},
{n:82,g:9,t:"static childContextTypes (Removed)",u:"https://18.react.dev/reference/react/Component#static-childcontexttypes",
p:["<code>static childContextTypes</code> legacy context API ka hissa tha — ye declare karta tha ki ek class component apne descendants ko kaunsi legacy context values <b>provide</b> karta hai. Signature (18.react.dev ke anusaar): <code>static childContextTypes = { /* legacy context shape */ }</code> — ek object jo provide kiye hue legacy context keys ko describe karta hai.",
"Ye <code>getChildContext()</code> ke saath joda bana kar kaam karta tha: component provide ki hui keys ko <code>static childContextTypes</code> me declare karta tha aur values ko <code>getChildContext()</code> se return karta tha. Consumer taraf iska saathi <code>static contextTypes</code> tha (pichla section).",
"<b>Status: React 19 me REMOVED.</b> 18.react.dev par is section ke saath Deprecated banner hai: 'This API will be removed in a future major version of React. Use <code>static contextType</code> instead.' (matlab: ye API aane wale bade React version me hat jayegi — iski jagah <code>static contextType</code> use karo.) Ye current react.dev ke Component page par nahi hai — is section ka source 18.react.dev hai.",
"Alternative: <code>createContext</code> se bane context object ko provider ke roop me render karo (jaise <code>&lt;ThemeContext value={...}&gt;</code>) aur use <code>useContext</code> / <code>use</code> / <code>static contextType</code> se padho. Naye code me <code>childContextTypes</code> use karna galti hai — ye sirf purane code ko padhne ke liye pehchanna hai."],
c:"class MyComponent extends Component {\n  static childContextTypes = { /* legacy context shape */ };\n  getChildContext() {\n    return { /* legacy context values */ };\n  }\n}\n\n// Aaj ka replacement:\n// <ThemeContext value={theme}>\n//   {children}\n// </ThemeContext>",
k:"childContextTypes + getChildContext legacy provider ka joda tha — dono React 19 me removed. Aaj provider matlab createContext wala context element."},
{n:83,g:9,t:"getChildContext() (Removed)",u:"https://18.react.dev/reference/react/Component#getchildcontext",
p:["<code>getChildContext()</code> legacy context API ka hissa tha — ye <b>instance method</b> wo legacy context values return karta tha jo ek class component apne descendants ko provide karta tha. Ek sudhaar ke saath: 18.react.dev page par heading <code>getChildContext()</code> hai — ye ek instance method hai, static method nahi (isiliye is section ka title bhi waisa hi rakha gaya hai).",
"Signature (18.react.dev ke anusaar): <code>getChildContext() { return { /* legacy context values */ }; }</code> — koi parameter nahi (page text ke anusaar). Return value: legacy context values ka ek object milta hai. 18.react.dev page ise poori tarah yun bayan karta hai: 'Lets you specify the values for the legacy context is provided by this component.' (matlab: isse tum wo values tay karte ho jo ye component legacy context ke roop me apne neeche wale components ko deta hai.)",
"Ye <code>static childContextTypes</code> ke saath kaam karta tha, jo declare karta tha ki kaunsi keys provide ki gayi hain (pichla section). Joda milkar legacy provider banata tha: <code>childContextTypes</code> = ghoshna, <code>getChildContext()</code> = asal values.",
"<b>Status: React 19 me REMOVED.</b> 18.react.dev par is section ke saath apna koi deprecation banner nahi hai, lekin ye current react.dev ke Component page par nahi hai — is section ka source 18.react.dev hai. Alternative wahi hai: <code>createContext</code> se bane context object ko provider ke roop me render karo aur <code>useContext</code> / <code>use</code> / <code>static contextType</code> se padho. Naye code me iska istemal galti hai."],
c:"class MyComponent extends Component {\n  getChildContext() {\n    return { /* legacy context values */ };\n  }\n}\n\n// Aaj ka replacement:\n// function App() {\n//   return (\n//     <ThemeContext value=\"dark\">\n//       <Page />\n//     </ThemeContext>\n//   );\n// }",
k:"getChildContext() ek instance method tha (static nahi) jo legacy context values deta tha — React 19 me removed; aaj values provider ke value prop se jati hain."},
{n:84,g:9,t:"static propTypes (Removed)",u:"https://18.react.dev/reference/react/Component#static-proptypes",
p:["<code>static propTypes</code> un props ke types declare karta tha jo ek class component accept karta hai — <code>prop-types</code> library ka istemal karke <b>runtime</b> par (sirf development me) check kiye jate the. Signature (18.react.dev ke anusaar): prop names ko <code>PropTypes</code> validators se map karne wala ek object, jaise <code>PropTypes.string</code>.",
"Kaise kaam karta tha: <code>prop-types</code> library ke saath, React rendering ke dauraan props ko declared types ke khilaf validate karta tha aur mismatch par warning deta tha. Checks sirf development me chalte the — production me inka koi asar nahi tha.",
"<b>Status: React 19 me REMOVED.</b> 18.react.dev par is section ke saath apna koi removal/deprecation banner nahi hai, lekin ye current react.dev ke Component page par nahi hai — is section ka source 18.react.dev hai.",
"Page ki sifarish saaf hai: 'We recommend using TypeScript instead of checking prop types at runtime.' Runtime prop-type checks par bharosa karne ke bajaye static typing lo — <b>TypeScript</b> hi recommended replacement hai. Defaults ke liye default parameter values use karo (<code>static defaultProps</code> wala pattern). Interview ka mudda: runtime checking (dev-only, <code>prop-types</code> library) banam static checking (compile-time, TypeScript)."],
c:"import PropTypes from 'prop-types';\n\nclass Greeting extends React.Component {\n  static propTypes = {\n    name: PropTypes.string\n  };\n\n  render() {\n    return (\n      <h1>Hello, {this.props.name}</h1>\n    );\n  }\n}\n\n// Aaj ka replacement — TypeScript:\n// function Greeting({ name }: { name: string }) {\n//   return <h1>Hello, {name}</h1>;\n// }",
k:"propTypes runtime (dev-only) checking thi aur React 19 me removed hai — page ki sifarish hai ki iski jagah TypeScript se static typing lo."},
{n:85,g:9,t:"this.refs (Removed)",u:"https://18.react.dev/reference/react/Component#refs",
p:["<code>this.refs</code> <b>legacy string refs</b> tak pahunch deta tha — purana pattern jisme ek ref string attribute ke roop me declare hoti thi (jaise <code>&lt;input ref=\"myInput\" /&gt;</code>) aur <code>this.refs.myInput</code> ke roop me access hoti thi. Koi parameters/options nahi hain.",
"Return value ke roop me socho: ek object jo string ref names ko unke corresponding DOM nodes / component instances se map karta tha. 18.react.dev page ise poori tarah yun bayan karta hai: 'Lets you access legacy string refs for this component.'",
"<b>Status: React 19 me REMOVED.</b> 18.react.dev par is section ke saath apna koi deprecation banner nahi hai, lekin ye current react.dev ke Component page par nahi hai — is section ka source 18.react.dev hai.",
"String refs sabse purana ref API tha; unki jagah callback refs aur ref objects ne li. Alternatives: <code>createRef</code> (class components) ya <code>useRef</code> (function components), jinhe <code>ref={this.inputRef}</code> / <code>ref={inputRef}</code> ke roop me pass karo; ya callback refs. Naye code me string refs use karna galti hai — ye section sirf purane code ko pehchanne ke liye hai."],
c:"// Legacy string ref ka istemal\n// <input ref=\"myInput\" />\n// Access:\n// this.refs.myInput\n\n// Aaj ka replacement — class me createRef\nclass Form extends Component {\n  inputRef = createRef();\n  // <input ref={this.inputRef} />\n  // this.inputRef.current.focus();\n}\n\n// Function component me useRef\n// const inputRef = useRef(null);\n// <input ref={inputRef} />",
k:"this.refs string refs ka darwaza tha — sabse purana ref API, React 19 me removed. Aaj ref matlab createRef/useRef wala ref object ya callback ref."},
{n:86,g:10,t:"Components and Hooks must be pure",u:"https://react.dev/reference/rules/components-and-hooks-must-be-pure",
p:["Ye Rules of React ki reference page hai — koi API nahi, ek <b>niyam</b>: components aur Hooks <b>pure</b> hone chahiye — idempotent, render me koi side effects nahi, aur non-local values ko kabhi mutate nahi. Iske liye 'Keeping Components Pure' guide se parichit hona zaroori hai (Learn wala section 11).",
"<b>Purity ki teen pehchan:</b> (1) <b>Idempotent</b> — same inputs (components ke liye props, state, context; Hooks ke liye arguments) hamesha same result dein. (2) <b>Render me koi side effects nahi</b> — side-effect wala code alag se chalta hai, event handlers ya Effects me. (3) <b>Non-local values mutate nahi hote.</b> Purity isliye matter karti hai kyunki tab React kam important components ka rendering pause karke baad me resume kar sakta hai, rendering code ko kai baar dobara chala sakta hai, aur updates ko prioritize kar sakta hai. React ke phases: <i>render</i> (agla UI calculate karna), <i>commit</i> (minimal DOM changes apply karna), phir Effects flush hote hain. Ek heuristic — 'ye render me chalta hai kya?': component/Hook ke top level ka code render me chalta hai; event handlers aur Effects nahi chalte.",
"<b>Idempotency ki bareekiyan:</b> <code>new Date()</code> aur <code>Math.random()</code> idempotent nahi hain — inhe render ke dauraan call mat karo (ek <code>Clock</code> jo <code>new Date()</code> render kare, apne pehle render ke samay par atka rahega). Inhe ya to Effect me le jao (synchronize karo) ya event handler me. Side effects (sirf value return karne ke alawa koi bhi observable effect — Effects se broader shabd) pehle event handlers me belong karte hain, <code>useEffect</code> sirf last resort hai. Render me DOM badalna (jaise <code>document.title = ...</code>) galat hai — Effect me karo. React 100% functional-programming purity nahi mangta — <b>idempotency</b> hi asal maang hai.",
"<b>Local mutation theek hai, non-local nahi:</b> render ke andar ek array banakar usme <code>push</code> karna theek hai, kyunki wo har render par dobara banti hai. Ek module-level array ko renders ke paar mutate karna theek <b>nahi</b> hai (duplicates jama hote rahenge). Lazy initialization (<code>SuperCalculator.initializeIfNotReady()</code>) theek hai agar wo doosre components ko affect na kare.",
"<b>Immutability ki zanjeer:</b> props aur state immutable snapshots hain — inhe kabhi mutate mat karo; naye props neeche pass karo aur <code>useState</code> setter use karo. Props mutate karna (<code>item.url = ...</code>) galat hai — copy banao. State ko mutate karna (<code>count = count + 1</code>) kuch dikhai dene wala nahi karta — <code>setCount(count + 1)</code> use karo. Hook arguments aur return values bhi immutable hain: Hook ko pass ki value mutate mat karo (spread se copy karo), warna Hook ki internal memoization tootegi; Hook ke return values ko bhi mutate mat karo (wo memoized ho sakti hain). Yahi <i>local reasoning</i> ko bachata hai — ek component/Hook ko akele me samajhna. Aur values JSX ko pass hone ke <b>baad</b> immutable ho jati hain: React component ke render khatm hone se pehle hi JSX ko eagerly evaluate kar sakta hai, to JSX me use karne ke baad value mutate karne se purana UI milega — nayi value JSX se pehle banao."],
c:"// ✅ Local mutation theek hai\nfunction FriendList({ friends }) {\n  const items = [];\n  for (let i = 0; i < friends.length; i++) {\n    const friend = friends[i];\n    items.push(<Friend key={friend.id} friend={friend} />);\n  }\n  return <section>{items}</section>;\n}\n\n// 🔴 Galat: render ke bahar bani value ko mutate karna\n// const items = []; // module level\n// function FriendList({ friends }) {\n//   for (let i = 0; i < friends.length; i++) {\n//     items.push(<Friend key={friends[i].id} friend={friends[i]} />);\n//   }\n//   return <section>{items}</section>;\n// }\n\n// 🔴 Galat: render me non-idempotent call\n// function Clock() {\n//   const time = new Date();\n//   return <span>{time.toLocaleString()}</span>\n// }\n\n// 🔴 Galat: props / state mutate karna\n// function Post({ item }) {\n//   item.url = new Url(item.url, base); // props ko kabhi mutate mat karo\n//   return <Link url={item.url}>{item.title}</Link>;\n// }",
k:"Pure = idempotent + render me no side effects + non-local mutation nahi. Local mutation chalega, module-level accumulator nahi — aur JSX ko di gayi value usi pal immutable ho jati hai."},
{n:87,g:10,t:"React calls Components and Hooks",u:"https://react.dev/reference/rules/react-calls-components-and-hooks",
p:["Ye bhi ek Rules of React reference page hai — koi API nahi, ek niyam: components aur Hooks ko <b>React</b> call karta hai, tum nahi — taaki wo rendering, reconciliation aur optimization ko orchestrate kar sake.",
"<b>Component functions ko seedha kabhi call mat karo:</b> components sirf JSX me use hone chahiye (<code>&lt;Layout&gt;&lt;Article /&gt;&lt;/Layout&gt;</code>), kabhi <code>{Article()}</code> ke roop me nahi. Rendering ke dauraan component function kab call ho, ye React tay karta hai. Seedha call karna Hooks ke niyam aasani se tod deta hai (loop/condition me Hooks) aur ye sab kho deta hai: tree me component identity se judi local state; component type ke hisaab se reconciliation (jaise <code>&lt;Feed&gt;</code> → <code>&lt;Profile&gt;</code> reuse nahi hoga); browser ko calls ke beech kaam karne ka mauka (main thread block nahi hota); samriddh devtools introspection; aur efficient selective re-rendering.",
"<b>Hooks ko regular values ki tarah pass mat karo:</b> Hooks sirf components ya Hooks ke andar call hone chahiye — hamesha functions ke roop me call hon, kabhi values ke roop me pass na hon — taaki <i>local reasoning</i> bana rahe. Ise todna React ko tumhare component ko automatically optimize karne se rok deta hai.",
"Do pratibandhit patterns: (1) <b>Hook ko dynamically mutate mat karo</b> — <code>withLogging(useData)</code> jaise higher-order Hooks nahi; uski jagah desired functionality ko inline karke Hook ka ek static version banao (<code>useDataWithLogging</code>). (2) <b>Hooks ko dynamically use mat karo</b> — Hook ko prop ke roop me dependency injection nahi (<code>&lt;Button useData={useDataWithLogging} /&gt;</code>); Hook call ko usi component me inline karo jise uski zaroorat hai (conditional logic Hook ke <i>andar</i> rehti hai).",
"Testing ke liye page ki salah: components ko test ke liye mock karne ke bajaye server ko mock karo, ya end-to-end tests prefer karo. Ye niyam todne ke aam roop: components ko functions ki tarah call karna (khaas taur par loops/conditions me, jo Hook ordering tod deta hai), Hooks ko dynamically wrap karna, Hooks ko props se inject karna."],
c:"// ✅ Sahi\nfunction BlogPost() {\n  return <Layout><Article /></Layout>;\n}\n// 🔴 Galat\n// function BlogPost() {\n//   return <Layout>{Article()}</Layout>;\n// }\n\n// 🔴 Galat: higher-order Hook\n// function ChatInput() {\n//   const useDataWithLogging = withLogging(useData);\n//   const data = useDataWithLogging();\n// }\n// ✅ Sahi: static Hook\nfunction ChatInput() {\n  const data = useDataWithLogging();\n}\nfunction useDataWithLogging() { /* logic yahan inline hai */ }\n\n// 🔴 Galat: Hook ko prop ke roop me pass karna\n// function ChatInput() {\n//   return <Button useData={useDataWithLogging} />\n// }\n// ✅ Sahi: Hook wahi call karo jahan use ho\nfunction Button() {\n  const data = useDataWithLogging();\n}",
k:"Components ko JSX me, Hooks ko sirf call — kabhi function ki tarah call ya value ki tarah pass nahi. React ko call ka malik rehne do, tabhi state, reconciliation aur optimization kaam karte hain."},
{n:88,g:10,t:"Rules of Hooks",u:"https://react.dev/reference/rules/rules-of-hooks",
p:["Ye Rules of Hooks ki reference page hai — Hooks JavaScript functions hain jinpar ye pabandi hai ki unhe <b>kahan</b> call kiya ja sakta hai. (Is page ka fetched text chhota tha — 126 lines — aur 'Hooks ko regular JavaScript functions se call mat karo' wali guidance par beech-vakya me khatm ho jata hai; neeche diye bad-code examples fetcher ke diye hue poore set hain.)",
"<b>Headline niyam:</b> Hooks ko loops, conditions, nested functions, ya <code>try</code>/<code>catch</code>/<code>finally</code> blocks ke andar call <b>mat</b> karo. Uski jagah, Hooks ko hamesha apne React function ke <b>top level</b> par use karo, kisi bhi early return se pehle. Hooks ko sirf tab call kar sakte ho jab React ek function component render kar raha ho.",
"Hooks (jo functions <code>use</code> se shuru hote hain) sirf tab supported hain jab React ek function component render kar raha ho. Custom Hooks doosre Hooks call <i>kar sakte</i> hain (yahi unka poora maksad hai) kyunki custom Hooks bhi sirf tab call hote hain jab ek function component render ho raha ho. Hooks ko regular JavaScript functions se call mat karo. Niyam follow karne se saari stateful logic component ke source code se saaf dikhai deti hai.",
"<b>Galat patterns — har ek ka fix 'bahar le jao' hai:</b> condition ke andar <code>useContext</code> (fix: condition se bahar nikalo); loop ke andar Hook (fix: loop se bahar); conditional return ke <i>baad</i> Hook (fix: return se pehle le jao); event handler ke andar Hook (fix: component ke top level par); <code>useMemo</code> ke andar Hook (fix: bahar); class component ke andar Hook (fix: function component likho); <code>try</code>/<code>catch</code>/<code>finally</code> ke andar <code>useState</code> (fix: bahar).",
"<b>Order kyun matter karta hai:</b> React Hooks ki call <i>order</i> par nirbhar karta hai — har render me Hooks bilkul usi kram me call hone chahiye, tabhi React har Hook ko uski sahi state se jod pata hai. Condition/loop/early-return ke andar Hook dalna is kram ko tod deta hai, aur isiliye tumhe wo jaana-pahchana error dikhta hai. Aur ek zaroori apvaad jo ecosystem me bana hai: <code>use</code> (API, section 68) ek Hook <b>nahi</b> hai aur use conditionally/loops me call <i>kar sakte</i> ho — dono ko confuse mat karo."],
c:"// 🔴 Galat: condition ke andar (fix: bahar nikalo!)\n// function Bad({ cond }) {\n//   if (cond) {\n//     const theme = useContext(ThemeContext);\n//   }\n// }\n\n// 🔴 Galat: loop ke andar (fix: bahar nikalo!)\n// function Bad() {\n//   for (let i = 0; i < 10; i++) {\n//     const theme = useContext(ThemeContext);\n//   }\n// }\n\n// 🔴 Galat: conditional return ke baad (fix: return se pehle le jao!)\n// function Bad({ cond }) {\n//   if (cond) {\n//     return;\n//   }\n//   const theme = useContext(ThemeContext);\n// }\n\n// 🔴 Galat: event handler ke andar (fix: bahar nikalo!)\n// function Bad() {\n//   function handleClick() {\n//     const theme = useContext(ThemeContext);\n//   }\n// }\n\n// 🔴 Galat: useMemo ke andar (fix: bahar nikalo!)\n// function Bad() {\n//   const style = useMemo(() => {\n//     const theme = useContext(ThemeContext);\n//     return createStyle(theme);\n//   });\n// }\n\n// 🔴 Galat: class component ke andar (fix: function component likho!)\n// class Bad extends React.Component {\n//   render() {\n//     useEffect(() => {})\n//   }\n// }\n\n// 🔴 Galat: try/catch/finally ke andar (fix: bahar nikalo!)\n// function Bad() {\n//   try {\n//     const [x, setX] = useState(0);\n//   } catch {\n//     const [x, setX] = useState(1);\n//   }\n// }\n\n// ✅ Sahi roop — saare Hooks top level par, early return se pehle\nfunction Good({ cond }) {\n  const theme = useContext(ThemeContext);\n  const [x, setX] = useState(0);\n  if (cond) {\n    return <div className={theme}>{x}</div>;\n  }\n  return <div className={theme}>{x}</div>;\n}",
k:"Hooks sirf top level par, sirf React functions/custom Hooks me — kyunki React unki call order par jeeta hai. Ek apvaad yaad rakho: use ek Hook nahi hai."},
{n:89,g:11,t:"useFormStatus",u:"https://react.dev/reference/react-dom/hooks/useFormStatus",
p:["<code>useFormStatus</code> parent <code>&lt;form&gt;</code> ke <b>aakhri submission</b> ki status jaankari deta hai. Iska mukhya istemal pending state dikhana hai — jaise form Action chalte waqt submit button ko disable karke uska label 'Submitting…' kar dena. Signature: <code>const { pending, data, method, action } = useFormStatus()</code> — koi parameter nahi. Ek pakki baat: ye <code>react-dom</code> se import hota hai, <code>react</code> se <b>nahi</b> — interview ka pasandeeda trick question.",
"Return hua status object chaar properties deta hai: <code>pending</code> — boolean; parent form kisi Action ko submit kar raha ho ya <code>onSubmit</code> se ek Transition chala raha ho to <code>true</code>, warna <code>false</code>. <code>data</code> — wo <code>FormData</code> object jo parent form submit kar raha hai; koi active submission ya parent form na ho to <code>null</code>. <code>method</code> — <code>'get'</code> ya <code>'post'</code> (form ka default GET hota hai). <code>action</code> — parent form ke <code>action</code> prop ko diye gaye function ka reference; parent form na ho, <code>action</code> ek URI string ho, ya koi <code>action</code> prop hi na diya gaya ho to <code>null</code>.",
"<b>Parent-form-only niyam — yahi classic trap hai:</b> Hook sirf <b>parent</b> form ko track karta hai — wo form jo Hook call karne wale component ko wrap karta hai. Ise us component ke <b>andar</b> rendered kisi component se call karna hoga. React pending state ko form context ke zariye jodta hai: form ka Action (ek Transition me) shuru hone par is Hook ko use karne wale saare descendants ke liye <code>pending</code> <code>true</code> ho jata hai; khatm hone par <code>false</code>.",
"Galtiyan: <code>useFormStatus</code> ko <b>usi component</b> me call karna jo <code>&lt;form&gt;</code> render karta hai — <code>pending</code> kabhi <code>true</code> nahi hoga; call ko form ke andar nested ek child component (jaise ek alag <code>Submit</code> button component) me rakho. Kisi bhi form ke bahar call karna — <code>pending</code> hamesha <code>false</code>, <code>data</code>/<code>action</code> <code>null</code>. Plain <code>onSubmit</code> handler ke saath <code>pending</code> ki umeed karna — async kaam ko <code>startTransition</code> me lapete bina Hook ke observe karne ke liye koi Transition hi nahi banti; aur us manual route me, <code>action</code> prop ke ulta, form automatically reset bhi nahi hota. <code>action</code> ke URI string hone par <code>action</code> ke non-null hone ki umeed karna — wo <code>null</code> hota hai.",
"Ye React 19 ka wo tareeka hai jo form submission ke aas-paas <code>useState</code> se manually <code>isPending</code> track karne ki jagah leta hai. Submitted data padhne ke liye <code>data</code> ka istemal karo — jaise <code>data?.get('username')</code> se 'Requesting …' wala sandesh dikhana, aur inputs ko bhi <code>pending</code> ke dauraan disable karna."],
c:"import { useFormStatus } from 'react-dom';\nimport { submitForm } from './actions.js';\n\nfunction Submit() {\n  const { pending } = useFormStatus();\n  return (\n    <button type=\"submit\" disabled={pending}>\n      {pending ? 'Submitting...' : 'Submit'}\n    </button>\n  );\n}\n\nexport default function App() {\n  return (\n    <form action={submitForm}>\n      <Submit />\n    </form>\n  );\n}\n\n// Submitted data padhna\n// const { pending, data } = useFormStatus();\n// <p>{data ? `Requesting ${data?.get('username')}...` : ''}</p>",
k:"useFormStatus react-dom se aata hai aur sirf parent form ko dekhta hai — isiliye ise form ke andar wale child component se call karo, form wale component se nahi."},
{n:90,g:12,t:"Common components (e.g. <div>)",u:"https://react.dev/reference/react-dom/components/common",
p:["Ye reference page un props aur events ke liye hai jo <b>saare</b> built-in browser components (<code>&lt;div&gt;</code>, <code>&lt;span&gt;</code>, <code>&lt;button&gt;</code>, …) me <b>common</b> hain — special React props, standard DOM props, poori event-handler list, <code>ref</code> callback, aur React (synthetic) event object, plus har event type ke liye ek section.",
"<b>Special React props:</b> <code>children</code> — ek React node; aam taur par tags nest karke implicitly diya jata hai. <code>dangerouslySetInnerHTML</code> — <code>{ __html: '&lt;p&gt;some html&lt;/p&gt;' }</code> (raw HTML string ya <code>TrustedHTML</code>); DOM node ke <code>innerHTML</code> ko override karta hai — behad savdhani, untrusted HTML = XSS kamzori; aur <code>children</code> ke saath dono ek saath dena allowed nahi. <code>ref</code> — <code>useRef</code>/<code>createRef</code> ka ref object, ek ref callback function, ya legacy string ref; DOM element se bhara jata hai. <code>suppressContentEditableWarning</code> — boolean; <code>children</code> aur <code>contentEditable={true}</code> dono wale elements ki warning dabata hai (un text-input libraries ke liye jo <code>contentEditable</code> ko manually manage karti hain). <code>suppressHydrationWarning</code> — boolean; us element ke attributes aur content ke liye server/client mismatch warning band karta hai; sirf ek level deep kaam karta hai; ek escape hatch hai, zyada istemal mat karo. <code>style</code> — CSS styles ka object, jaise <code>{ fontWeight: 'bold', margin: 20 }</code>; property names <code>camelCase</code> me; numbers par <code>px</code> khud jud jata hai jab tak property unitless na ho; sifarish hai ki ise sirf dynamic styles ke liye rakho, warna <code>className</code> use karo.",
"<b>Standard DOM props:</b> saare supported hain — <code>accessKey</code>, <code>aria-*</code> (HTML wale hi naam), <code>autoCapitalize</code>, <code>className</code> (HTML <code>class</code> ka React naam — <code>class</code> JS me reserved word hai), <code>contentEditable</code>, <code>data-*</code>, <code>dir</code>, <code>draggable</code>, <code>enterKeyHint</code>, <code>htmlFor</code> (HTML <code>for</code> ka React naam, <code>&lt;label&gt;</code>/<code>&lt;output&gt;</code> par), <code>hidden</code>, <code>id</code> (clashes se bachne ke liye <code>useId</code> se generate karo), <code>is</code> (custom element), <code>inputMode</code>, <code>itemProp</code>, <code>lang</code>, <code>role</code>, <code>slot</code>, <code>spellCheck</code>, <code>tabIndex</code> (<code>-1</code> aur <code>0</code> ke alawa values se bacho), <code>title</code> (tooltip), <code>translate</code>. Custom attributes: koi bhi lowercase attribute jo <code>on</code> se shuru na ho, string ke roop me pass ho jata hai (jaise <code>mycustomprop=\"someValue\"</code>); <code>null</code>/<code>undefined</code> use hata deta hai. CSS ke liye <code>className</code> hi usool hai; <code>style={{}}</code> JSX braces ke andar sirf ek plain object hai. Conditional classes string concatenation se ya <code>classnames</code> jaise helper se banti hain.",
"<b>Event handler props:</b> har event ka ek <code>*Capture</code> variant hota hai jo capture phase me fire hota hai. Samooh: Animation (<code>onAnimationStart</code>, <code>onAnimationIteration</code>, <code>onAnimationEnd</code>); <code>onAuxClick</code> (non-primary button), <code>onBeforeInput</code> (React native <code>beforeinput</code> ko polyfill karta hai), <code>onBlur</code>/<code>onFocus</code> — <b>browser ke ulta, React me ye bubble karte hain</b> — <code>onClick</code>, <code>onDoubleClick</code>, <code>onContextMenu</code>; Composition (IME: <code>onCompositionStart</code>/<code>Update</code>/<code>End</code>); Clipboard (<code>onCopy</code>, <code>onCut</code>, <code>onPaste</code>); Drag (<code>onDrag</code>, <code>onDragStart</code>, <code>onDragEnter</code>, <code>onDragOver</code> — drop allow karne ke liye <code>e.preventDefault()</code> call karna padta hai, <code>onDragEnd</code>, <code>onDrop</code>); Pointer capture (<code>onGotPointerCapture</code>, <code>onLostPointerCapture</code>); Keyboard (<code>onKeyDown</code>, <code>onKeyUp</code>; <code>onKeyPress</code> <b>deprecated</b> hai — <code>onKeyDown</code>/<code>onBeforeInput</code> use karo); Mouse (<code>onMouseDown</code>, <code>onMouseEnter</code>/<code>onMouseLeave</code> — inka koi capture phase nahi, ye chhode gaye element se enter hue element ki taraf propagate karte hain, <code>onMouseMove</code>, <code>onMouseOut</code>, <code>onMouseUp</code>); Pointer (<code>onPointerCancel</code>, <code>onPointerDown</code>, <code>onPointerEnter</code>/<code>onPointerLeave</code> — koi capture nahi, <code>onPointerMove</code>, <code>onPointerOut</code>, <code>onPointerUp</code>); <code>onScroll</code> (bubble <b>nahi</b> karta), <code>onSelect</code> (React ise <code>contentEditable</code> elements, empty selections aur edits ke liye bhi fire karne tak badhata hai), Touch chaaron, <code>onTransitionEnd</code>, <code>onWheel</code>; sirf form ke liye <code>onReset</code>, <code>onSubmit</co
