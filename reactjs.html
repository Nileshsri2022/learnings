c:"import { useReducer } from 'react';\n\nfunction tasksReducer(tasks, action) {\n  switch (action.type) {\n    case 'added': {\n      return [...tasks, { id: action.id, text: action.text, done: false }];\n    }\n    case 'changed': {\n      return tasks.map(t => t.id === action.task.id ? action.task : t);\n    }\n    case 'deleted': {\n      return tasks.filter(t => t.id !== action.id);\n    }\n    default: {\n      throw Error('Unknown action: ' + action.type);\n    }\n  }\n}\n\nexport default function TaskApp() {\n  const [tasks, dispatch] = useReducer(tasksReducer, initialTasks);\n  // dispatch({ type: 'added', id: nextId++, text });\n  // dispatch({ type: 'changed', task });\n  // dispatch({ type: 'deleted', id: taskId });\n}",
k:"Reducer = (state, action) → nextState, pure aur immutable. Jab updates kai aur related hon, useState ki jagah useReducer saaf aur testable rehta hai."},
{n:25,g:3,t:"Passing Data Deeply with Context",u:"https://react.dev/learn/passing-data-deeply-with-context",
p:["<b>Context</b> ek parent component ko uske neeche ke poore tree ko data provide karne deta hai bina props ko har intermediate level se guzaare (prop drilling).",
"Heading/Section example: <code>Heading({ level, children })</code> <code>level</code> 1–6 par switch karke <code>&lt;h1&gt;</code>–<code>&lt;h6&gt;</code> render karta hai. 3 steps me: 1. <b>Context banao:</b> <code>export const LevelContext = createContext(1)</code> (argument default value hai). 2. <b>Use karo:</b> <code>const level = useContext(LevelContext)</code>. 3. <b>Provide karo:</b> <code>&lt;LevelContext.Provider value={level}&gt;{children}&lt;/LevelContext.Provider&gt;</code> (ya chhota roop <code>&lt;LevelContext value={...}&gt;</code>).",
"Ek component apne <b>upar ke sabse kareebi provider</b> ko padhta hai; koi provider na ho to use default value (<code>1</code>) milti hai.",
"<b>Ek hi component se use aur provide karna:</b> <code>Section</code> <code>level</code> padhta hai aur <code>level + 1</code> provide karta hai (<code>createContext(0)</code>; <code>Heading</code> level 0 ke liye <code>Error('Heading must be inside a Section!')</code> throw karta hai).",
"Context intermediate components se bina chhue guzar jata hai; alag contexts ek-doosre ko override nahi karte.",
"<b>Context use karne se pehle:</b> (1) props pass karke shuru karo; (2) components extract karo aur JSX ko <code>children</code> ke roop me pass karo — aksar yahi akele drilling khatm kar deta hai. Use cases: theming, current account, routing, state manage karna (reducer + context, page 026)."],
c:"import { createContext, useContext } from 'react';\n\nexport const LevelContext = createContext(1);\n\nfunction Heading({ children }) {\n  const level = useContext(LevelContext);\n  switch (level) {\n    case 1: return <h1>{children}</h1>;\n    case 2: return <h2>{children}</h2>;\n    // ...cases 3–6\n    default: throw Error('Unknown level: ' + level);\n  }\n}\n\nfunction Section({ children }) {\n  const level = useContext(LevelContext);\n  return (\n    <section className=\"section\">\n      <LevelContext.Provider value={level + 1}>\n        {children}\n      </LevelContext.Provider>\n    </section>\n  );\n}",
k:"Create → use → provide. Sabse kareebi provider jeet-ta hai; lekin pehle props aur children composition try karo, context baad me."},
{n:26,g:3,t:"Scaling Up with Reducer and Context",u:"https://react.dev/learn/scaling-up-with-reducer-and-context",
p:["Ek reducer ko context ke saath jodna taaki gehre nested components <b>bina prop drilling ke</b> state padh sakein aur actions dispatch kar sakein — plain React me standard \"global state\" pattern.",
"Starting point: <code>TaskApp</code> \"Day off in Kyoto\" (Philosopher's Path done, Visit the temple, Drink matcha) page 024 wale wahi <code>tasksReducer</code> (added/changed/deleted) ke saath. Problem: <code>tasks</code> aur <code>dispatch</code> sirf top-level <code>TaskApp</code> me rehte hain, isliye har child ko unhe props ke roop me chahiye.",
"<b>3 steps:</b> 1. <b>Do contexts banao</b> <code>TasksContext.js</code> me: <code>TasksContext = createContext(null)</code> (state) aur <code>TasksDispatchContext = createContext(null)</code> (dispatch). Do alag contexts taaki jo components sirf dispatch karte hain wo state badalne par re-render na hon. 2. <b>State aur dispatch ko context me rakho</b> — provider tree ko wrap karta hai aur dono values supply karta hai. 3. <b>Tree me kahin bhi use karo</b> — <code>TaskList</code> <code>useContext(TasksContext)</code> padhta hai; <code>AddTask</code> aur <code>Task</code> <code>useContext(TasksDispatchContext)</code> padhte hain.",
"<b>Wiring ko ek file me le jana:</b> ek <code>TasksProvider({ children })</code> component reducer ke saath state manage karta hai aur dono contexts provide karta hai; custom Hooks <code>useTasks()</code> aur <code>useTasksDispatch()</code> bhi export karo taaki components seedha contexts ko na chhuein.",
"Tum ek app me kai context–reducer pairs rakh sakte ho (har feature/domain ke liye ek). Is page par koi Challenges section nahi hai. Sabse aam galtiyaan: state aur dispatch ke liye ek hi context (jo components sirf dispatch karte hain wo har state change par re-render hote hain); contexts bana kar provider bhool jana, isliye <code>useContext</code> <code>null</code> return karta hai; is pattern ko us state ke liye over-use karna jo sirf ek parent aur ek child ko chahiye (wahan state upar uthana simple hai)."],
c:"// TasksContext.js\nimport { createContext, useContext, useReducer } from 'react';\n\nconst TasksContext = createContext(null);\nconst TasksDispatchContext = createContext(null);\n\nexport function TasksProvider({ children }) {\n  const [tasks, dispatch] = useReducer(tasksReducer, initialTasks);\n  return (\n    <TasksContext.Provider value={tasks}>\n      <TasksDispatchContext.Provider value={dispatch}>\n        {children}\n      </TasksDispatchContext.Provider>\n    </TasksContext.Provider>\n  );\n}\n\nexport function useTasks() {\n  return useContext(TasksContext);\n}\n\nexport function useTasksDispatch() {\n  return useContext(TasksDispatchContext);\n}",
k:"Reducer + do contexts (state alag, dispatch alag) + custom Hooks = bina Redux ke global state ka canonical pattern."},
{n:27,g:4,t:"Referencing Values with Refs",u:"https://react.dev/learn/referencing-values-with-refs",
p:["<b>Refs</b> (<code>useRef</code>) ek component ko ek mutable value rakhne dete hain jo renders ke paar persist karti hai <b>bina re-render trigger kiye</b> — React ki \"secret pocket\" un values ke liye jo JSX calculate karne ke liye zaroori nahi hain.",
"<code>useRef(0)</code> ek plain object <code>{ current: 0 }</code> return karta hai. Tum <code>ref.current</code> padhte aur likhte ho; use mutate karna immediate hai aur re-render nahi karta.",
"Stopwatch example: <code>startTime</code>/<code>now</code> state me rehte hain (wo affect karte hain ki kya display hota hai), lekin interval ID ek ref me rehti hai (<code>intervalRef = useRef(null)</code>).",
"<b>Refs vs state</b> (page ki table): state re-renders trigger karta hai aur ek snapshot hai; refs re-renders trigger nahi karte aur turant mutate hote hain; refs un values ke liye hain jo rendering ke liye zaroori nahi.",
"Ek Counter jo apna count ek ref me store karta hai aur JSX me <code>countRef.current</code> render karta hai, displayed text ko kabhi update nahi karta — render ke dauraan <code>ref.current</code> padhna unreliable hai, kyunki React ko pata nahi hota ki wo badalne par re-render karna hai.",
"Deep Dive: <code>useRef</code> ko <code>useState</code> ke upar implement kiya ja sakta hai (ek state pair jiska setter kabhi use nahi hota); refs OOP me instance fields jaise hain. <b>Refs kab use karein:</b> timeout IDs, DOM elements, aur doosre objects jo JSX calculate karne ke liye zaroori nahi.",
"<b>Best practices:</b> refs ko ek escape hatch ki tarah treat karo; rendering ke dauraan <code>ref.current</code> mat padho ya likho — ekmatra exception lazy initialization hai: <code>if (!ref.current) ref.current = new Thing()</code> pehle render par ek baar. Ref mutation immediate hai, state snapshot ke vipreet."],
c:"import { useRef } from 'react';\n\nfunction Stopwatch() {\n  const [startTime, setStartTime] = useState(null);\n  const [now, setNow] = useState(null);\n  const intervalRef = useRef(null);\n\n  function handleStart() {\n    setStartTime(Date.now());\n    setNow(Date.now());\n    clearInterval(intervalRef.current);\n    intervalRef.current = setInterval(() => {\n      setNow(Date.now());\n    }, 10);\n  }\n  // ...\n}\n\n// ❌ Ref JSX me — kabhi update nahi hota\n// function Counter() {\n//   const countRef = useRef(0);\n//   return <button onClick={() => { countRef.current++; }}>\n//     You clicked {countRef.current} times\n//   </button>;\n// }",
k:"Decision rule: kya ye value render hoti hai? Haan → state. Nahi (timer ID, DOM node) → ref. Ref badalne se re-render nahi hota aur badlaav turant lagta hai."},
{n:28,g:4,t:"Manipulating the DOM with Refs",u:"https://react.dev/learn/manipulating-the-dom-with-refs",
p:["React dwara manage kiye jaane wale asli DOM nodes tak pahunchna — ek input ko focus karne, ek element tak scroll karne, ya use measure karne ke liye — refs, ref callbacks aur <code>useImperativeHandle</code> ka use karke.",
"React DOM ko tumhare render output se match karne ke liye update karta hai, lekin kabhi-kabhi tumhe node khud chahiye hota hai: focus, scroll, measure. <code>useRef(null)</code> se ek ref lo aur use attach karo: <code>&lt;div ref={myRef}&gt;</code>. Shuruaat me <code>null</code>; node banne par React DOM node ko <code>myRef.current</code> me daal deta hai.",
"<b>Focusing:</b> ek event handler se <code>inputRef.current.focus()</code>. <b>Scrolling:</b> teen refs (<code>firstCatRef</code> / <code>secondCatRef</code> / <code>thirdCatRef</code>), buttons Neo/Millie/Bella, <code>ref.current.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' })</code>.",
"<b>Deep Dive — ref callback ke dwara refs ki list:</b> tum <code>useRef</code> ko loop ya <code>map()</code> me call nahi kar sakte. Iske bajaye <code>ref</code> attribute ko ek <i>function</i> pass karo — React use DOM node ke saath call karta hai jab wo use set karta hai, aur returned cleanup function ko call karta hai jab wo use clear karta hai. Apna array ya <code>Map</code> maintain karo (page ka example: <code>itemsRef</code> me cat se node tak ka <code>Map</code>, 10 cats). Note: Strict Mode me React development me ref callbacks ko do baar chalata hai.",
"<b>Doosre component ke DOM nodes tak pahunchna:</b> ref ko prop ke roop me pass karo: <code>MyInput({ ref })</code> <code>&lt;input ref={ref} /&gt;</code> return karta hai. <b>Deep Dive — <code>useImperativeHandle</code>:</b> parent jo API use kar sakta hai use restrict karo: <code>useImperativeHandle(ref, () =&gt; ({ focus() { realInputRef.current.focus(); } }))</code> sirf <code>focus()</code> expose karta hai, poora input element nahi.",
"<b>React refs kab attach karta hai:</b> refs commit phase ke dauraan set hote hain, rendering ke dauraan nahi — unhe render ke dauraan kabhi access mat karo.",
"<b>Deep Dive — <code>flushSync</code>:</b> ek TodoList me, ek todo jodkar phir <code>listRef.current.lastChild</code> tak scroll karna <i>pichle</i> last item tak scroll karta hai, kyunki <code>setTodos</code> queued hai. Fix: updates ko <code>flushSync(() =&gt; { setText(''); setTodos([...todos, newTodo]); })</code> me lapeto taaki DOM pehle synchronously update ho jaye.",
"<b>Best practices:</b> refs ek escape hatch hain — sirf focus/scroll/browser APIs ke liye. DOM ko manually modify karna conflicts ka risk rakhta hai: page ka example \"Remove from the DOM\" (<code>ref.current.remove()</code>) crash ho jata hai jab baad me ek <code>setState</code> element ko dobara dikhane ki koshish karta hai, kyunki React ki tree aur asli DOM disagree karte hain."],
c:"import { useRef } from 'react';\n\nfunction Form() {\n  const inputRef = useRef(null);\n  function handleClick() {\n    inputRef.current.focus();\n  }\n  return (\n    <>\n      <input ref={inputRef} />\n      <button onClick={handleClick}>Focus the input</button>\n    </>\n  );\n}\n\n// Ref callback: ek Map me refs ki list\n// const itemsRef = useRef(null);\n// function getMap() {\n//   if (!itemsRef.current) {\n//     itemsRef.current = new Map();\n//   }\n//   return itemsRef.current;\n// }",
k:"Refs commit phase me attach hote hain — render me haath mat lagao. List of refs ke liye ref callback + Map; turant DOM update chahiye to flushSync."},
{n:29,g:4,t:"Synchronizing with Effects",u:"https://react.dev/learn/synchronizing-with-effects",
p:["<b>Effects</b> (<code>useEffect</code>) ka parichay: ek component ko rendering ke <i>baad</i> ek external system (ek video element, ek chat connection, browser window, ek network fetch) ke saath synchronize karna — aur ek Effect likhne ke teen steps: use declare karo, dependencies specify karo, zaroorat ho to cleanup jodo.",
"<b>Do kism ki logic:</b> rendering code (pure — JSX calculate karta hai) aur event handlers (ek <i>specific user action</i> ke kaaran hue side effects). Effects teesri kism hain: kisi particular event ke bajaye <i>rendering ke kaaran</i> hue side effects.",
"<b>Step 1 — Effect declare karo.</b> VideoPlayer example: <code>&lt;VideoPlayer isPlaying={isPlaying} /&gt;</code> ko DOM <code>&lt;video&gt;</code> node par <code>play()</code>/<code>pause()</code> call karna padta hai. Use rendering ke dauraan call karna galat hai; use <code>useEffect</code> me lapeto. Pitfall: ek Effect jo bina dependencies ke state set karta hai, ek infinite loop hai.",
"<b>Step 2 — Dependencies specify karo.</b> By default Effect har render ke baad chalta hai; <code>[]</code> ka matlab hai sirf mount par (agar tum <code>isPlaying</code> omit karte ho to linter error deta hai); <code>[isPlaying]</code> ka matlab hai mount par aur jab bhi <code>isPlaying</code> badle (tab chale) (<code>Object.is</code> se compare kiya jata hai). Tum dependencies \"choose\" nahi kar sakte — unme har reactive value list honi chahiye jo Effect padhta hai. Deep Dive: <code>ref</code> object omit kiya jata hai kyunki uski identity stable hai.",
"<b>Step 3 — Zaroorat ho to cleanup jodo.</b> ChatRoom + <code>createConnection()</code> example (<code>connect()</code> \"✅ Connecting...\" log karta hai, <code>disconnect()</code> \"❌ Disconnected.\" log karta hai). <code>[]</code> deps ke saath, development me log do baar dikhta hai — React har component ko initial mount ke turant baad ek baar remount karta hai (Strict Mode). Fix: ek cleanup function return karo; React Effect ke dobara chalne se pehle cleanup call karta hai, aur aakhir me unmount par. Cleanup ke saath, dev logs hain Connecting, Disconnected, Connecting — dev me sahi, production me ek baar. Strict Mode on rakho. Pitfall: Effect ko fire hone se rokne ke liye refs ka use mat karo.",
"<b>Common patterns:</b> non-React widgets ko control karna (<code>map.setZoomLevel(zoomLevel)</code>, deps <code>[zoomLevel]</code>; ek <code>&lt;dialog&gt;</code> ka <code>showModal()</code> do baar call hone par throw karta hai — cleanup <code>return () =&gt; dialog.close()</code>); events subscribe karna (<code>window.addEventListener('scroll', handleScroll)</code>, cleanup <code>removeEventListener</code>); animations trigger karna (<code>node.style.opacity = 1</code> set karo, cleanup use 0 par reset karta hai); <b>data fetch karna</b> (<code>let ignore = false</code>, async fetch, <code>if (!ignore) setTodos(json)</code>, cleanup <code>ignore = true</code>, deps <code>[userId]</code> — Alice→Bob race; deduplicate/cache karne ke liye framework, TanStack Query, useSWR, ya React Router behtar hai); analytics bhejna (<code>logVisit(url)</code>, deps <code>[url]</code> — dev me do baar fire hota hai, use waisa hi rakho).",
"<b>Effect nahi hai:</b> app ko initialize karna (use components ke bahar rakho, <code>if (typeof window !== 'undefined')</code> se guarded); ek product kharidna (ek Effect me <code>fetch('/api/buy', { method: 'POST' })</code> dev me do baar fire hota hai — ye Buy button ke event handler me belong karta hai)."],
c:"// Step 1–3: declare, dependencies, cleanup\nfunction VideoPlayer({ src, isPlaying }) {\n  const ref = useRef(null);\n  useEffect(() => {\n    if (isPlaying) {\n      ref.current.play();\n    } else {\n      ref.current.pause();\n    }\n  }, [isPlaying]);\n  return <video ref={ref} src={src} loop playsInline />;\n}\n\n// Cleanup ke saath chat connection\nuseEffect(() => {\n  const connection = createConnection(roomId);\n  connection.connect();\n  return () => connection.disconnect();\n}, [roomId]);\n\n// Race-condition guard ke saath fetch\nuseEffect(() => {\n  let ignore = false;\n  async function startFetching() {\n    const json = await fetchTodos(userId);\n    if (!ignore) {\n      setTodos(json);\n    }\n  }\n  startFetching();\n  return () => { ignore = true; };\n}, [userId]);",
k:"Effect = rendering ke kaaran external system se sync. Declare → deps → cleanup. Dev me double log bug nahi, cleanup missing hone ka signal hai."},
{n:30,g:4,t:"You Might Not Need an Effect",u:"https://react.dev/learn/you-might-not-need-an-effect",
p:["Page 029 ka counterweight: Effects ek <b>escape hatch</b> hain, aur zyadaatar cheezein jo log Effects me rakhte hain unhe ek ki zaroorat nahi hoti. Do cases ko kabhi Effects ki zaroorat nahi padti: rendering ke liye data transform karna, aur user events handle karna.",
"<b>Agar koi external system involved nahi hai, to tumhe Effect ki zaroorat nahi honi chahiye.</b> Tumhe Effects ki zaroorat <i>padti</i> hai external systems ke saath synchronize karne ke liye (ek jQuery widget, search results fetch karna jo visible rehte hue sync me rehne chahiye).",
"<b>Props/state ke basis par state update karna:</b> <code>firstName</code> + <code>lastName</code> se <code>fullName</code> — use rendering ke dauraan calculate karo, use state + ek Effect me mat rakho.",
"<b>Expensive calculations cache karna:</b> state + Effect hatao aur seedha calculate karo; agar ye slow hai, to <code>useMemo(() =&gt; getFilteredTodos(todos, filter), [todos, filter])</code>. React Compiler auto-memoize kar sakta hai. Deep Dive: ek calculation expensive hai ya nahi kaise batayein — <code>console.time</code>/<code>console.timeEnd</code>, ~1ms ki threshold, CPU throttling ke saath test karo, production build me measure karo; Strict Mode dev me do baar render karta hai.",
"<b>Ek prop badalne par saari state reset karna:</b> <code>userId</code> + <code>comment</code> wala <code>ProfilePage</code> — <code>[userId]</code> par <code>setComment('')</code> wala Effect mat use karo; component ko split karo aur inner <code>Profile</code> ko <code>key={userId}</code> pass karo taaki uski state automatically reset ho jaye.",
"<b>Ek prop badalne par kuch state adjust karna:</b> <code>items</code> + <code>selection</code> wala <code>List</code> — Effect mat use karo; <code>prevItems</code> pattern ke saath rendering ke <i>dauraan</i> state adjust karo (<code>if (items !== prevItems) { setPrevItems(items); setSelection(null); }</code>) — React children ya DOM ko chhoone se pehle turant re-render karta hai. Aur bhi behtar: <code>selectedId</code> store karo aur <code>selection = items.find(item =&gt; item.id === selectedId) ?? null</code> compute karo.",
"<b>Event handlers ke beech logic share karna:</b> ProductPage ke Buy/Checkout dono <code>addToCart</code> + <code>showNotification</code> karte hain — use <code>product.isInCart</code> par ek Effect me mat rakho (notification refresh par dobara dikhta hai); ek <code>buyProduct()</code> function extract karo jo dono handlers se call ho.",
"<b>POST request bhejna:</b> ek Effect me <code>[]</code> ke saath analytics <code>post('/analytics/event', { eventName: 'visit_form' })</code> ACHHA hai (display ke kaaran hua); ek <code>jsonToSubmit</code> state + Effect se chalne wala <code>/api/register</code> POST BURA hai — use <code>handleSubmit</code> me le jao.",
"<b>Computations ki chains:</b> card/goldCardCount/round/isGameOver Effect chain wala ek game — inefficient (3 unnecessary re-renders) aur history ke liye rigid; <code>isGameOver = round &gt; 5</code> rendering ke dauraan calculate karo aur saari next state <code>handlePlaceCard</code> me compute karo. Handlers me state snapshot yaad rakho (<code>const nextRound = round + 1</code>). Exception: ek dropdown chain jahan agle options network ke dwara pichle selection par nirbhar hain — wahan ek Effect chain appropriate hai.",
"<b>Application initialize karna:</b> <code>App</code> me <code>[]</code> ke saath <code>loadDataFromLocalStorage()</code> / <code>checkAuthToken()</code> ke liye Effect mat use karo (dev me do baar chalta hai); ek module-level <code>didInit</code> flag use karo ya module initialization ke dauraan chalao (<code>if (typeof window !== 'undefined')</code>).",
"<b>Parent components ko notify karna:</b> <code>isOn</code> + <code>onChange</code> wala ek <code>Toggle</code> Effect me bohot der se chalta hai, ek extra render pass ke saath; dono states ko ek hi handler me <code>updateToggle(nextIsOn)</code> ke dwara update karo (batched, ek render) — ya state upar utha kar <code>Toggle</code> ko poori tarah controlled banao. <b>Parent ko data pass karna:</b> ek <code>Child</code> jo fetch karke phir Effect me <code>onFetched(data)</code> call karta hai, data flow ko trace karna mushkil bana deta hai; parent ko fetch karne do aur data ko prop ke roop me neeche bhejo.",
"<b>External store subscribe karna:</b> <code>navigator.onLine</code> / <code>online</code>/<code>offline</code> events subscribe karne wala manual Effect ideal nahi hai; <code>useSyncExternalStore(subscribe, () =&gt; navigator.onLine, () =&gt; true)</code> use karo. <b>Data fetch karna:</b> <code>SearchResults({ query })</code> + <code>page</code> — fetching ek Effect <i>hai</i> (results visible rehte hue synchronized rehne chahiye, chahe query URL/Back/Forward buttons se aaye); bug race condition hai — \"hello\" tezi se type karna (\"hell\" \"hello\" ke baad aata hai) — <code>ignore</code> cleanup se fix karo; caching, server fetching bhi jodo, aur waterfalls se bacho — ek framework use karo ya ek <code>useData(url)</code> custom Hook extract karo."],
c:"// ❌ Derived value ke liye Effect\n// const [fullName, setFullName] = useState('');\n// useEffect(() => { setFullName(firstName + ' ' + lastName); }, [firstName, lastName]);\n\n// ✅ Render ke dauraan calculate karo\nconst fullName = firstName + ' ' + lastName;\n\n// ✅ Key se state reset karo, Effect se nahi\n// <Profile key={userId} userId={userId} />\n\n// ✅ Expensive calculation useMemo se cache\nconst visibleTodos = useMemo(() => getFilteredTodos(todos, filter), [todos, filter]);",
k:"Sawaal ek hi hai: kya external system involved hai? Nahi → Effect nahi. Derived value render ke dauraan nikalo, reset key badal kar karo, aur form wala kaam submit handler me rakho."},
{n:31,g:4,t:"Lifecycle of Reactive Effects",u:"https://react.dev/learn/lifecycle-of-reactive-effects",
p:["Effects ka lifecycle components se alag hota hai: ek component mount/update/unmount hota hai, lekin ek Effect sirf <b>synchronize karna shuru aur baad me synchronize karna band</b> kar sakta hai — aur ye cycle ek component ki life ke dauraan kai baar ho sakta hai.",
"ChatRoom example: <code>serverUrl = 'https://localhost:1234'</code>; Effect body \"start\" hai (<code>createConnection(serverUrl, roomId); connection.connect()</code>), cleanup \"stop\" hai (<code>connection.disconnect()</code>).",
"<b>Ek se zyada baar sync kyun:</b> <code>roomId</code> general → travel → music badalta hai. Purana Effect ab bhi \"general\" se connected hai jabki UI \"travel\" dikhata hai — use general ko disconnect karke travel ko connect karna padta hai. <b>React kaise re-synchronize karta hai:</b> ye pichle render ke Effect ke cleanup ko call karta hai, phir naye Effect ko chalata hai.",
"<b>Effect ke nazariye se socho:</b> ek single start/stop cycle par focus karo, mount/update/unmount par nahi. Describe karo ki screen par kya hona chahiye; React baaki ka pata laga leta hai. <b>React re-synchronization ko kaise verify karta hai:</b> development me React har component ko ek baar remount karta hai, Connecting, Disconnected, Connecting log karke (pehle do sirf dev ke liye hain) — jaise ek lock check karne ke liye darwaza ek extra baar kholna. Sandbox me <code>serverUrl</code> edit karna bhi re-synchronize karta hai.",
"<b>React ko kaise pata:</b> tumne use dependencies ke dwara bataya, <code>Object.is</code> se compare karke. <code>[\"general\"]</code> vs <code>[\"travel\"]</code> alag hain → re-sync. <b>Har Effect ek alag synchronization process hai:</b> connection Effect me <code>logVisit(roomId)</code> mat jodo — agar Effect kisi aur kaaran se re-sync hota hai, to log anjaane me dobara fire ho jayega. Do alag Effects likho.",
"<b>Effects reactive values par \"react\" karte hain:</b> ek module-level constant ke roop me <code>serverUrl</code> reactive NAHI hai (re-render par kabhi nahi badalta, dep hona zaroori nahi); ek prop ke roop me <code>roomId</code> reactive HAI. Agar <code>serverUrl</code> state hoti, to wo reactive hoti — deps <code>[roomId, serverUrl]</code>. <b>Empty deps ka kya matlab hai:</b> dono values component ke bahar hone par, <code>[]</code> sahi hai. Component ke nazariye se ye mount-only hai; Effect ke nazariye se iske paas <i>aaj</i> koi reactive deps nahi hain — agar wo baad me reactive ho jayein to unhe jodo.",
"<b>Component body me declare ki gayi saari variables reactive hain:</b> props, state, context (<code>SettingsContext</code> se <code>settings</code>), aur calculated values (<code>serverUrl = selectedServerUrl ?? settings.defaultServerUrl</code>) — sab deps hone chahiye. Deep Dive: <b>global/mutable values deps nahi ho sakte</b> — <code>location.pathname</code> mutable hai; use badalna re-render trigger nahi karta aur purity todta hai; <code>ref.current</code> bhi dep nahi ho sakta (ref object khud ho sakta hai); iske bajaye <code>useSyncExternalStore</code> use karo.",
"<b>Linter verify karta hai ki har reactive value ek dependency hai:</b> <code>roomId</code> + <code>serverUrl</code> state wala ek <code>ChatRoom</code> lekin <code>[]</code> deps ek lint error hai — ye initial values se connected rehta hai; <code>[serverUrl, roomId]</code> se fix karo. Note: <code>useState</code> se <code>set</code> functions aur <code>useRef</code> se ref objects stable hain, reactive nahi hain, aur omit kiye ja sakte hain.",
"<b>Jab tum re-synchronize nahi karna chahte:</b> \"prove\" karo ki values reactive nahi hain — unhe component ke bahar ya Effect ke andar le jao. Effects reactive blocks hain; tum deps \"choose\" nahi kar sakte. Agar linter ek dep suggest karta hai lekin use jodna ek loop banata hai, to Effect ke andar/bahar ke code ko badlo taaki wo value reactive na rahe; check karo ki Effect ek single independent process hai, zaroorat ho to use split karo, latest value bina react kiye padhne ke liye ek Effect Event use karo, aur object/function deps se bacho. Pitfall: linter sirf ye jaanta hai ki deps kab galat hain, sabse achha solution nahi. Use <code>// eslint-ignore-next-line react-hooks/exhaustive-deps</code> se suppress mat karo."],
c:"// Ek Effect = ek synchronization process\nuseEffect(() => {\n  const connection = createConnection(serverUrl, roomId);\n  connection.connect();\n  return () => connection.disconnect();\n}, [serverUrl, roomId]);\n\n// Alag process, alag Effect\nuseEffect(() => {\n  logVisit(roomId);\n}, [roomId]);",
k:"Effect ko mount/unmount se nahi, start/stop sync cycle se samjho. Har reactive value dep hai; linter ko kabhi suppress mat karo."},
{n:32,g:4,t:"Separating Events from Effects",u:"https://react.dev/learn/separating-events-from-effects",
p:["Ek event handler aur ek Effect ke beech kaise choose karein — aur <b>Effect Events</b> (<code>useEffectEvent</code>), wo API jo ek Effect ko latest props/state padhne deta hai bina unke badalne par re-synchronize kiye.",
"<b>Event handlers</b> sirf tab dobara chalte hain jab wahi interaction dobara hota hai. <b>Effects</b> re-synchronize karte hain agar unke dwara padhi gayi koi value pichle render se alag hai. Kabhi-kabhi tumhe ek mix chahiye hota hai.",
"<b>Choose karna:</b> ChatRoom requirements — selected room se auto-connect karna ek Effect hai (kaaran <i>display</i> hai, interaction nahi); Send button ka message bhejna ek event handler hai (kaaran ek <i>click</i> hai).",
"<b>Reactive values aur reactive logic:</b> component body me props/state/variables reactive values hain (<code>roomId</code>, <code>message</code> reactive; module-level <code>serverUrl</code> nahi). Event handlers me logic reactive NAHI hai (ye bina react kiye reactive values padh sakta hai). Effects me logic reactive HAI (ise jo padhta hai use deps ke roop me list karna padta hai aur nayi value ke saath dobara chalta hai).",
"<b>Non-reactive logic extract karna:</b> connect hone par <code>showNotification('Connected!', theme)</code> dikhane wala <code>ChatRoom({ roomId, theme })</code> — <code>theme</code> reactive hai, isliye deps <code>[roomId, theme]</code> har theme switch par reconnect karte hain. Fix ek Effect Event hai.",
"<b>Ek Effect Event declare karna:</b> <code>const onConnected = useEffectEvent(() =&gt; { showNotification('Connected!', theme); });</code> — <code>onConnected()</code> ko Effect ke andar se call karo, <code>theme</code> ko deps se hatao, aur <code>onConnected</code> ko deps me kabhi mat jodo (Effect Events reactive nahi hain aur omit kiye jaane chahiye). Effect Events event handlers jaise hain lekin Effects se trigger hote hain — ye reactivity aur non-reactive code ke beech ki \"chain todte\" hain.",
"<b>Effect Events se latest props/state padhna:</b> <code>Page</code> wala logVisit example — <code>url</code> ko reactive HONA chahiye (ek alag URL ek alag page hai, deps <code>[url]</code>); <code>ShoppingCartContext</code> se <code>numberOfItems</code> ko ek nayi log trigger NAHI karni chahiye. Ise split karo: <code>onVisit = useEffectEvent(visitedUrl =&gt; { logVisit(visitedUrl, numberOfItems); })</code>, Effect <code>onVisit(url)</code> call karta hai, deps <code>[url]</code>. <code>url</code> ko explicitly ek argument ke roop me pass karo taaki agar dep hata di jaye to linter warn kare, aur taaki ek async <code>setTimeout(..., 5000)</code> original <code>visitedUrl</code> use kare, latest <code>url</code> nahi.",
"Deep Dive — iske bajaye linter ko suppress karna: kabhi suppress mat karo. Restrictions: Effect Events ko sirf Effects ke andar se call karo; unhe kabhi doosre components ya Hooks ko pass mat karo. Bura: ek <code>Timer</code> ka <code>onTick</code> ko <code>useTimer(onTick, 1000)</code> ko pass karna. Achha: <code>onTick</code> ko <code>useTimer</code> ke andar declare karo, use use karne wale Effect ke paas, sirf deps <code>[delay]</code>."],
c:"import { useEffect, useEffectEvent } from 'react';\n\nfunction ChatRoom({ roomId, theme }) {\n  const onConnected = useEffectEvent(() => {\n    showNotification('Connected!', theme);\n  });\n\n  useEffect(() => {\n    const connection = createConnection(roomId);\n    connection.connect();\n    onConnected();\n    return () => connection.disconnect();\n  }, [roomId]); // ✅ theme ek dependency nahi hai\n  // ...\n}\n\n// URL ke liye visit log karo, lekin cart size ko bina\n// us par react kiye latest shamil karo\nconst onVisit = useEffectEvent(visitedUrl => {\n  logVisit(visitedUrl, numberOfItems);\n});\nuseEffect(() => {\n  onVisit(url);\n}, [url]);",
k:"Kaaran dekho: display → Effect, interaction → handler. Latest value bina react kiye chahiye to useEffectEvent — lekin use deps me kabhi mat daalo, kahin pass mat karo."},
{n:33,g:4,t:"Removing Effect Dependencies",u:"https://react.dev/learn/removing-effect-dependencies",
p:["Dependency problems fix karne ki practical guide: linter verify karta hai ki ek Effect jo bhi reactive value padhta hai wo uske deps me hai; <b>unnecessary dependencies Effect ko bohot zyada baar chalate hain ya hamesha ke liye loop kar dete hain</b>. Ek dependency hatane ke liye, code ko badlo taaki wo value ab dependency na rahe.",
"<b>Dependencies code se match honi chahiye:</b> pehle start/stop code likho, phir linter ke mutabiq deps bhardo (<code>ChatRoom</code>, <code>[]</code> → <code>[roomId]</code>). <b>Ek dependency hatane ke liye, prove karo ki ye dependency nahi hai:</b> <code>roomId</code> ko component ke bahar le jao (<code>const roomId = 'music'</code>) → ye ab reactive nahi hai, <code>[]</code> sahi hai.",
"<b>Dependencies badalne ke liye, code badlo:</b> (1) Effect code ya reactive values ke declare hone ka tareeqa badlo, (2) linter ko follow karo aur deps ko match karne ke liye adjust karo, (3) agar khush nahi ho, to step 1 par wapas jao. Deps code ko describe karte hain — tum unhe choose nahi karte.",
"<b>Pitfall: linter ko suppress karna</b> (<code>// eslint-ignore-next-line react-hooks/exhaustive-deps</code>) React se jhooth bolta hai aur high risk hai. Deep Dive — suppress karna khatarnak kyun hai: component body me define kiye <code>onTick</code> (<code>setCount(count + increment)</code>) wala ek <code>Timer</code>, Effect <code>setInterval(onTick, 1000)</code> deps <code>[]</code> + suppression, hamesha initial-render <code>onTick</code> use karta hai jahan <code>count = 0</code>, <code>increment = 1</code>, isliye display hamesha <code>1</code> dikhata hai. Fix: <code>onTick</code> ko deps me jodo, ya <code>onTick</code> ko ek Effect Event banao taaki interval sirf ek baar set up ho. Ek lint error ko ek compilation error ki tarah treat karo.",
"<b>Unnecessary dependencies hatana — diagnostic sawal:</b> <i>Kya is code ko ek event handler me jana chahiye?</i> <code>submitted</code> + <code>/api/register</code> post karne aur notification dikhane wala Effect wala <code>Form</code>; ek <code>theme</code> dep jodne se notification theme switch par dobara dikhta hai. Use <code>handleSubmit</code> me le jao. <i>Kya tumhara Effect kai unrelated cheezein kar raha hai?</i> <code>country</code> ke dwara cities aur <code>city</code> ke dwara areas fetch karne wala ek <code>ShippingForm</code> ek Effect me deps <code>[country, city]</code> ke saath har city change par cities refetch karta hai. Do Effects me split karo, deps <code>[country]</code> aur <code>[city]</code>. <i>Kya tum next state calculate karne ke liye kuch state padh rahe ho?</i> deps <code>[roomId, messages]</code> ke saath <code>setMessages([...messages, receivedMessage])</code> wala ek ChatRoom messages Effect har message par reconnect karta hai. Updater se fix karo: <code>setMessages(msgs =&gt; [...msgs, receivedMessage])</code>, deps <code>[roomId]</code>. <i>Kya tum ek value ko bina us par \"react\" kiye padhna chahte ho?</i> ek message handler me <code>isMuted</code> + <code>playSound()</code> — <code>isMuted</code> ko dep ke roop me jodna mute toggle par reconnect karta hai; linter suppress karna use atka deta hai. Ek Effect Event se fix karo. <i>Object/function deps:</i> component body me banaya gaya <code>options = { serverUrl, roomId }</code>, deps <code>[options]</code> — har render par ek naya object (<code>Object.is(options1, options2)</code> <code>false</code> hai) <code>message</code> ki har keystroke par reconnect karta hai. Primitives content se compare hote hain (<code>Object.is('music', 'music')</code> <code>true</code> hai). Fixes: static objects/functions ko component ke bahar le jao; dynamic objects/functions ko Effect ke andar le jao (deps <code>[roomId]</code> ban jate hain); objects se primitive values padho; pure functions se primitive values calculate karo; event handlers → ek Effect Event me lapeto."],
c:"// ❌ Object dep — har render nayi identity, lagatar reconnect\n// const options = { serverUrl, roomId };\n// useEffect(() => {\n//   const connection = createConnection(options);\n//   connection.connect();\n//   return () => connection.disconnect();\n// }, [options]);\n\n// ✅ Primitives bahar padho, object andar banao\nconst { roomId, serverUrl } = options;\nuseEffect(() => {\n  const connection = createConnection({ serverUrl, roomId });\n  connection.connect();\n  return () => connection.disconnect();\n}, [roomId, serverUrl]);\n\n// ✅ Updater ek state dep hata deta hai\nuseEffect(() => {\n  const connection = createConnection(roomId);\n  connection.on('message', (msg) => {\n    setMessages(msgs => [...msgs, msg]); // `messages` dep nahi chahiye\n  });\n  connection.connect();\n  return () => connection.disconnect();\n}, [roomId]);",
k:"Deps code ko describe karte hain, tum unhe choose nahi karte. Effect zyada chale to pehle code badlo — handler me le jao, split karo, updater lagao, ya object ko primitives me todo."},
{n:34,g:4,t:"Reusing Logic with Custom Hooks",u:"https://react.dev/learn/reusing-logic-with-custom-hooks",
p:["<b>Custom Hooks</b> tumhe stateful logic ko components se reusable functions me extract karne dete hain jinke naam <code>use*</code> hain — components ke beech logic share karna, bina state khud share kiye.",
"<b>Motivating problem:</b> ek app jo network band hone par user ko warn karta hai, use online status track karne wali state + global <code>online</code>/<code>offline</code> events subscribe karne wala ek Effect chahiye. <code>StatusBar</code> (<code>&lt;h1&gt;{isOnline ? '✅ Online' : '❌ Disconnected'}&lt;/h1&gt;</code>) aur <code>SaveButton</code> (offline hone par disabled, text 'Save progress' vs 'Reconnecting...') dono us logic ko duplicate karte hain.",
"<b>Apna custom Hook extract karna:</b> ek built-in <code>useOnlineStatus</code> ki kalpana karo; duplicated code ko usme extract karo, use <code>useOnlineStatus.js</code> me rakho, aur dono components <code>const isOnline = useOnlineStatus()</code> tak simple ho jate hain. Components ab describe karte hain ki wo <i>kya</i> chahte hain, <i>kaise</i> nahi.",
"<b>Hook naamo ki shuruaat hamesha <code>use</code> se hoti hai</b> (uske baad ek capital letter, jaise <code>useState</code> / <code>useOnlineStatus</code>): <code>use</code> prefix signal deta hai ki function Rules of Hooks follow karta hai aur linter ko use check karne deta hai. Sirf Hooks aur components hi doosre Hooks call kar sakte hain. Ise <code>getOnlineStatus</code> naam dene se uske andar <code>useState</code>/<code>useEffect</code> call karna ek lint error ban jayega. Deep Dive — kya rendering ke dauraan call hone wale saare functions ko <code>use</code> se shuru hona chahiye? Nahi. Jo functions Hooks call nahi karte unhe Hooks hone ki zaroorat nahi: <code>useSorted</code> (koi Hooks nahi, <code>items.slice().sort()</code>) ko <code>getSorted</code> hona chahiye — aur tab use conditionally call kiya ja sakta hai.",
"<b>Custom Hooks stateful logic share karte hain, state khud nahi.</b> <code>StatusBar</code> aur <code>SaveButton</code> dono ke <code>useOnlineStatus()</code> call karne par do poori tarah independent state variables aur Effects hote hain — unki value ek hi hoti hai kyunki dono ek hi external value (network) se synchronize karte hain. Ek Hook ki har call har doosri call se poori tarah independent hai. Ek aur example: <code>firstName</code> 'Mary' / <code>lastName</code> 'Poppins' wala ek <code>Form</code> — per-field repetitive logic ko <code>useFormInput(initialValue)</code> me extract karo, jo <code>{ value, onChange }</code> props return karta hai; component use do baar call karta hai aur results spread karta hai (<code>&lt;input {...firstNameProps} /&gt;</code>). Hook ke andar ek <code>value</code> state variable, practice me do independent states. <i>State khud</i> components ke beech share karni ho to use upar uthao.",
"<b>Hooks ke beech reactive values pass karna:</b> custom Hook code component ke har re-render par dobara chalta hai, isliye use pure hona chahiye — use component body ke hisse ki tarah socho. Use hamesha latest props aur state milte hain. ChatRoom example: <code>useChatRoom({ serverUrl, roomId })</code> connection Effect ko wrap karta hai (deps <code>[roomId, serverUrl]</code>); server URL ya room badalne par dobara connect hota hai. Ek Hook ka return value (<code>useState</code> ka <code>serverUrl</code>) doosre ke input me jata hai — audio/video effects chain karne jaisa.",
"<b>Custom Hooks ko event handlers pass karna:</b> message-arrival logic ko ek <code>onReceiveMessage</code> option ke dwara component me wapas le jao. Use deps me jodne se har render par reconnect hoga — use ek Effect Event me lapeto: <code>const onMessage = useEffectEvent(onReceiveMessage)</code>, Effect deps <code>[roomId, serverUrl]</code>. Ab tumhe ye jaanne ki zaroorat nahi ki <code>useChatRoom</code> <i>kaise</i> kaam karta hai, use use karne ke liye.",
"<b>Custom Hooks kab use karein:</b> har chhoti duplication ke liye ek Hook extract mat karo — ek single <code>useState</code> ko wrap karne wala <code>useFormInput</code> shayad unnecessary hai. Lekin jab bhi tum ek Effect likho, use ek custom Hook me wrap karne par vichar karo: Effects ka matlab hai tum React ke bahar kadam rakh rahe ho ek external system se sync karne ke liye, aur ek Hook intent aur data flow ko precisely communicate karta hai. <code>ShippingForm</code> example: do dropdowns (ek country ke liye cities, ek city ke liye areas) do repetitive fetch Effects ke saath. Effects ko alag rakho (wo alag cheezein synchronize karte hain) lekin common logic ko <code>useData(url)</code> me extract karo. Data flow explicit ho jata hai (url in, data out), aur koi hidden Effect me unnecessary deps nahi jod sakta. Samay ke saath, ek app ke zyadaatar Effects custom Hooks me rehte hain.",
"Deep Dive — <b>custom Hooks ko concrete high-level use cases par focused rakho.</b> Achhe naam: <code>useData(url)</code>, <code>useImpressionLog(eventName, extraData)</code>, <code>useChatRoom(options)</code>, <code>useMediaQuery(query)</code>, <code>useSocket(url)</code>, <code>useIntersectionObserver(ref, options)</code>. Agar tumhe naam dene me sangharsh ho raha hai, to Effect component se bohot zyada coupled hai. <b>\"Lifecycle\" Hooks banane se bacho</b> (<code>useMount</code>, <code>useEffectOnce</code>, <code>useUpdateEffect</code>) — ye React paradigm me fit nahi hote: <code>useMount</code> example me ek bug hai (<code>roomId</code>/<code>serverUrl</code> changes par react nahi karta) jo linter pakad nahi sakta kyunki ye sirf direct <code>useEffect</code> calls check karta hai. Raw Effects ko purpose ke hisaab se alag karke shuru karo, phir purpose-naam wale Hooks extract karo. Ek achha custom Hook calling code ko <i>jo wo karta hai use constrain karke</i> zyada declarative banata hai.",
"<b>Custom Hooks tumhe behtar patterns par migrate karne me madad karte hain:</b> <code>useOnlineStatus</code> ko <code>useState</code> + <code>useEffect</code> se <code>useSyncExternalStore(subscribe, () =&gt; navigator.onLine, () =&gt; true)</code> par rewrite karna uski saari problems fix kar deta hai — aur <b>koi bhi component nahi badalta</b>. Teen fayde: explicit data flow, components intent par focus karte hain, aur nayi React features components ko chhue bina Effects hata sakti hain. Deep Dive — kya React data fetching ke liye ek built-in solution dega? Aaj, <code>use</code> API render me ek Promise se data padhta hai (<code>const messageContent = use(messagePromise)</code>, <code>&lt;Suspense&gt;</code> ke andar). Bhavishya me, data fetching <code>const cities = use(fetch(`/api/cities?country=${country}`))</code> jaisa dikh sakta hai. <code>useData</code>-style Hooks use karne wale apps kam changes ke saath migrate karenge — lekin purana approach ab bhi kaam karta hai."],
c:"// useOnlineStatus.js\nimport { useState, useEffect } from 'react';\n\nexport function useOnlineStatus() {\n  const [isOnline, setIsOnline] = useState(true);\n  useEffect(() => {\n    function handleOnline() { setIsOnline(true); }\n    function handleOffline() { setIsOnline(false); }\n    window.addEventListener('online', handleOnline);\n    window.addEventListener('offline', handleOffline);\n    return () => {\n      window.removeEventListener('online', handleOnline);\n      window.removeEventListener('offline', handleOffline);\n    };\n  }, []);\n  return isOnline;\n}\n\n// useFormInput — ek state variable, do baar call = do states\n// export function useFormInput(initialValue) {\n//   const [value, setValue] = useState(initialValue);\n//   function handleChange(e) { setValue(e.target.value); }\n//   return { value, onChange: handleChange };\n// }",
k:"Custom Hook logic share karta hai, state nahi — har call independent hai. Naam use se shuru karo, useMount jaise lifecycle Hooks mat banao, aur har Effect ko Hook me lapetne par vichar karo."},
{n:35,g:5,t:"useState",u:"https://react.dev/reference/react/useState",
p:["<code>useState</code> component me ek <b>state variable</b> jodne ka Hook hai — local, interactive state (counter, form field, toggle) rakhne ka primary tareeka. Signature: <code>const [state, setState] = useState(initialState)</code>. Do cheezein return hoti hain: current state, aur <code>set</code> function jo state badal kar re-render trigger karta hai.",
"<b>initialState</b> kisi bhi type ka ho sakta hai, lekin function pass karne par wo <i>initializer function</i> mana jata hai — pure hona chahiye, React use sirf pehle render par ek baar call karta hai. Isi liye mehenga initial computation <code>useState(() =&gt; createTodos())</code> se do — <code>useState(createTodos())</code> likhne par function har render par call hoga, result sirf pehli baar use hoga.",
"<b>State ek snapshot hai:</b> <code>set</code> function sirf <i>agle</i> render ke liye state update karta hai — <code>setName('Robin')</code> ke baad usi code me <code>name</code> padhne par purani value hi milegi. Setter ko function pass karne par wo <i>updater function</i> hai: pending state leta hai, next state return karta hai. <code>setAge(age + 1)</code> teen baar call karne par sirf +1 hota hai (teeno ek hi stale <code>age</code> se hisaab lagate hain); <code>setAge(a =&gt; a + 1)</code> teen baar queue hokar 42 → 43 → 44 → 45 deta hai.",
"<b>Batching aur bailout:</b> React state updates ko batch karta hai — event handler ke saare <code>set</code> calls ke baad ek hi re-render hota hai. Agar nayi value <code>Object.is</code> se current state ke barabar hai to React component aur uske children ka re-render skip kar deta hai. <code>set</code> function ki identity stable hoti hai, isliye use Effect dependencies se aaram se hata sakte ho.",
"<b>Objects/arrays read-only samjho:</b> <code>form.firstName = 'Taylor'</code> galat hai — naya object banao: <code>setForm({ ...form, firstName: 'Taylor' })</code>. Same reference mutate karke setter ko dene par <code>Object.is</code> comparison update ko ignore kar deta hai aur screen nahi badalti. Function ko state me <i>store</i> karna ho to lapeto: <code>useState(() =&gt; someFunction)</code> aur <code>setFn(() =&gt; someOtherFunction)</code>.",
"<b>Key se state reset:</b> component ko alag <code>key</code> dene par React use scratch se dobara banata hai — <code>&lt;Form key={version} /&gt;</code> aur Reset button par <code>version</code> badha do. Render ke dauraan apne hi component ka setter call karna allowed hai (purane renders ki jaankari rakhne ke liye), lekin condition ke andar hi — warna infinite loop. Strict Mode me initializer aur updater functions dev me do baar call hote hain taaki impurity pakdi ja sake."],
c:"import { useState } from 'react';\n\nfunction Counter() {\n  const [count, setCount] = useState(0);\n  return <button onClick={() => setCount(c => c + 1)}>Count: {count}</button>;\n}\n\n// Lazy initial state — function sirf initialization par call hota hai\nconst [todos, setTodos] = useState(() => createTodos());\n\n// Key se state reset\nconst [version, setVersion] = useState(0);\n<Form key={version} />",
k:"Setter agle render ke liye state badalta hai — purani value par based update ho to updater function use karo, aur state ko hamesha replace karo, mutate kabhi nahi."},
{n:36,g:5,t:"useReducer",u:"https://react.dev/reference/react/useReducer",
p:["<code>useReducer</code> component me ek <b>reducer</b> jodta hai. <code>useState</code> jaisa hi hai, lekin state-update logic event handlers se nikaal kar ek hi function (reducer) me le jata hai — jab state complex ho, kai sub-values hon, ya next state kai tareekon se previous state par nirbhar ho. Signature: <code>const [state, dispatch] = useReducer(reducer, initialArg, init?)</code>.",
"<b>Reducer function</b> <code>(state, action) =&gt; nextState</code> — pure hona chahiye. Convention: <code>action.type</code> par <code>switch</code>, har case next state return kare, unknown action par <code>throw Error('Unknown action: ' + action.type)</code>. <code>dispatch(action)</code> call karne par React current state aur action ko reducer me bhejta hai, returned next state store karke re-render karta hai. <code>dispatch</code> ki identity stable hai.",
"Action aam taur par <code>type</code> wala object hota hai plus reducer ko chahiye wali minimal jaankari: <code>dispatch({ type: 'changed_name', nextName: e.target.value })</code>. Har action ek single interaction describe karta hai, chahe usse data me kai changes hon. Action type ke naam component-local hote hain.",
"<b>State read-only hai:</b> reducer ke andar <code>state.age = state.age + 1; return state;</code> galat hai — hamesha naya object return karo: <code>return { ...state, age: state.age + 1 }</code>. Do aam galtiyan: case me <code>...state</code> bhoolna (baaki fields <code>undefined</code> ho jate hain) aur <code>return</code> bhoolna ya kisi case se match na hona (poori state <code>undefined</code>). Isi liye switch ke baad throw rakho.",
"<b>Lazy initialization:</b> teesra argument <code>init</code> function do — <code>useReducer(reducer, username, createInitialState)</code> — function <i>khud</i> pass karo, uska result nahi. Initializer ko koi jaankari na chahiye ho to doosra argument <code>null</code> do. <code>dispatch</code> ke baad state padhne par purani value hi milti hai (snapshot); next value chahiye to reducer ko khud call karo: <code>reducer(state, action)</code>.",
"Strict Mode me React reducer aur initializer ko dev me do baar call karta hai — impure reducer (jaise <code>state.todos.push(...)</code>) me todo do baar dikhega. Interview ka classic sawal: <b>useState vs useReducer</b> — reducer update logic ko ek pure function me centralize karta hai, state transitions explicit aur testable bante hain."],
c:"import { useReducer } from 'react';\n\nfunction reducer(state, action) {\n  switch (action.type) {\n    case 'incremented_age': {\n      return { ...state, age: state.age + 1 };\n    }\n    case 'changed_name': {\n      return { ...state, name: action.nextName };\n    }\n  }\n  throw Error('Unknown action: ' + action.type);\n}\n\nfunction Form() {\n  const [state, dispatch] = useReducer(reducer, { name: 'Taylor', age: 42 });\n  // dispatch({ type: 'incremented_age' })\n  // dispatch({ type: 'changed_name', nextName: e.target.value })\n}",
k:"Reducer = saare state transitions ek pure function me. Mutate kabhi mat karo, har case me naya state return karo, unknown action par throw karo."},
{n:37,g:5,t:"useOptimistic",u:"https://react.dev/reference/react/useOptimistic",
p:["<code>useOptimistic</code> UI ko <b>optimistically</b> update karne deta hai — asli async kaam chalte hue hi user ko result dikha do, aur confirmed result aane par dono converge ho jate hain. Signature: <code>const [optimisticState, setOptimistic] = useOptimistic(value, reducer?)</code>. Like button, follow, todo add — jahan perceived performance matter karta hai.",
"<b>Flow:</b> Action ke andar <code>setOptimistic('b')</code> call hote hi React <code>'b'</code> render karta hai; await ke dauraan wahi dikhta rehta hai; asal state <code>setValue(newValue)</code> se update hoti hai; Transition complete hone par <b>ek hi render</b> me <code>value</code> aur optimistic dono nayi value par commit hote hain — optimistic state ko 'clear' karne ke liye koi extra render nahi hota. Koi Action pending na ho to optimistic state = <code>value</code>.",
"<b>Sabse badi shart:</b> setter ko <b>Action ke andar</b> hi call karna hai — <code>startTransition</code> ke andar ya kisi Action prop me. Bahar call karne par warning aati hai aur optimistic value ek pal dikh kar revert ho jati hai. Render ke dauraan call karna error hai. Action props (jaise form ke <code>action</code>) pehle se hi Transition me chalte hain, wahan alag se <code>startTransition</code> nahi chahiye.",
"<b>Failure par automatic rollback:</b> Action throw kare to Transition khatm hota hai aur React jo bhi current <code>value</code> hai wahi render karta hai. Parent aam taur par <code>value</code> sirf success par update karta hai, isliye failure par UI khud purani sthiti par laut jati hai — error pakad kar message dikha do. Optimistic delete ke liye reducer item ko <code>deleting: true</code> mark karta hai (dim/strike-through); fail hone par item khud wapas aa jata hai.",
"<b>Reducer vs updater:</b> simple hisaab ke liye updater chalta hai (<code>setOptimistic(c =&gt; !c)</code>), lekin agar base state Action ke dauraan badal sakti hai to <b>reducer</b> use karo — React naye base data ke saath reducer ko dobara chalata hai, optimistic additions sabse taaza data ke upar rehte hain. Updater sirf Transition shuru hone ke time ki state dekhta hai. Kai values ek saath badalni hon (jaise <code>isFollowing</code> + <code>followerCount</code>) to bhi reducer — dono atomic rehte hain.",
"<b>Pending pata karne ke teen tareeke:</b> (1) <code>optimisticValue === value</code> compare karo; (2) saath me <code>useTransition</code> ka <code>isPending</code> lo; (3) reducer me per-item <code>pending: true</code> flag rakho (list me 'Adding…' dikhane ke liye). <code>useOptimistic(false)</code> khud ek pending-flag pattern hai — Button Action me <code>true</code> set karke 'Submitting…' dikhata hai aur Action khatm hote hi khud <code>false</code> ho jata hai."],
c:"import { useOptimistic, startTransition } from 'react';\n\n// Simple optimistic toggle\nconst [optimisticIsLiked, setOptimisticIsLiked] = useOptimistic(isLiked);\nstartTransition(async () => {\n  setOptimisticIsLiked(!optimisticIsLiked);\n  const updatedValue = await toggleLike(!optimisticIsLiked);\n  startTransition(() => setIsLiked(updatedValue));\n});\n\n// Reducer pattern — list me optimistic add, pending flag ke saath\nconst [optimisticTodos, addOptimisticTodo] = useOptimistic(\n  todos,\n  (currentTodos, newTodo) => [\n    ...currentTodos,\n    { id: newTodo.id, text: newTodo.text, pending: true }\n  ]\n);",
k:"Optimistic state sirf Action ke dauraan jeeti hai; success par asal value se converge, failure par khud rollback. Base badal sakta ho to reducer, warna updater."},
{n:38,g:5,t:"useContext",u:"https://react.dev/reference/react/useContext",
p:["<code>useContext</code> component ko context padhne aur subscribe karne deta hai — prop drilling ke bina data ko tree me gehraai tak bhejna. Signature: <code>const value = useContext(SomeContext)</code>, jahan <code>SomeContext</code> pehle <code>createContext</code> se banaya gaya object hai. Context khud jaankari nahi rakhta — wo sirf us <i>tarah</i> ki jaankari ko represent karta hai jo provide/read ho sakti hai.",
"Return value = calling component ke <b>upar sabse kareebi</b> matching provider ki <code>value</code>. Upar koi provider na ho to <code>createContext</code> ko di gayi <code>defaultValue</code> milti hai — ye default <b>kabhi nahi badalta</b>. Isliye meaningful default do (aam taur par <code>null</code> nahi), taaki provider bhoolne par component tute nahi aur tests me bina providers ke chale.",
"<b>Ek hi component ka provider kaam nahi karta:</b> <code>useContext()</code> call usi component ke return kiye gaye providers se affected nahi hoti — provider calling component ke <i>upar</i> hona chahiye. Aur dhyaan do: provider bina <code>value</code> ke (<code>&lt;ThemeContext&gt;</code>) matlab <code>value={undefined}</code> hai — consumer ko default nahi, <code>undefined</code> milega. Default sirf tab milta hai jab upar koi matching provider hi na ho.",
"<b>Re-render semantics:</b> provider ki value badalne par React us context ko padhne wale <b>saare</b> children ko re-render karta hai (<code>Object.is</code> comparison). <code>memo</code> se re-render skip karna context updates ko <b>nahi</b> rokta — fresh context value consumers tak phir bhi pahunchegi. Providers ko nest karke tree ke hisse ke liye value override kar sakte ho — andar wala provider jeet-ta hai.",
"<b>Performance ki sabse aam galti:</b> provider value me inline object/function dena — <code>value={{ currentUser, login }}</code> har parent render par naya object banata hai, to saare consumers bina wajah re-render hote hain. Fix: function ko <code>useCallback</code> aur object ko <code>useMemo</code> me rakho — <code>const contextValue = useMemo(() =&gt; ({ currentUser, login }), [currentUser, login])</code>.",
"Context identity bilkul same object (<code>===</code>) honi chahiye dono taraf — build system symlinks se duplicate modules bana de to context toot jata hai (console me <code>window.SomeContext1 === window.SomeContext2</code> check karo). Yaad rakho: <b>context state manager nahi hai</b> — updates ke liye use state ya reducer ke saath jodo."],
c:"import { useContext, useState, useCallback, useMemo } from 'react';\n\n// Context padhna\nconst theme = useContext(ThemeContext);\n\n// Provide + update — state ke saath\nfunction MyPage() {\n  const [theme, setTheme] = useState('dark');\n  return (\n    <ThemeContext value={theme}>\n      <Form />\n      <button onClick={() => setTheme('light')}>Switch to light theme</button>\n    </ThemeContext>\n  );\n}\n\n// Memoized context value — bekaar re-renders rokne ke liye\nconst login = useCallback((response) => {\n  storeCredentials(response.credentials);\n  setCurrentUser(response.user);\n}, []);\nconst contextValue = useMemo(() => ({ currentUser, login }), [currentUser, login]);",
k:"Sabse kareebi provider jeet-ta hai, value badli to saare consumers re-render — isliye object/function values ko memoize karo, aur context ko state manager mat samjho."},
{n:39,g:5,t:"useRef",u:"https://react.dev/reference/react/useRef",
p:["<code>useRef</code> ek aisi value reference karne deta hai jo <b>rendering ke liye nahi</b> chahiye — ek mutable box jo renders ke beech bana rehta hai lekin re-render trigger nahi karta. Signature: <code>const ref = useRef(initialValue)</code>. Return hota hai ek hi property wala object: <code>{ current: initialValue }</code>. Har render par React <b>wahi object</b> return karta hai.",
"<b>State se farq:</b> <code>ref.current</code> badalna allowed hai (state ke opposite), lekin React ko is change ka pata nahi chalta — <b>koi re-render nahi</b> hota. Isi liye jo cheez screen par dikhani hai wo state me rakho; <code>{ref.current}</code> ko JSX me render karne par click par number update nahi hoga. Refs un values ke liye hain jo rendering me nahi chahiye: interval ID, DOM node, previous value.",
"<b>Render ke dauraan ref mat padho/likho</b> (initialization ke alawa) — component body ko pure function jaisa behave karna hai; render me ref chhedna behavior unpredictable bana deta hai. Refs ko event handlers ya Effects me padho/likho. Ek exception: lazy initialization — <code>if (playerRef.current === null) { playerRef.current = new VideoPlayer(); }</code> allowed hai kyunki result hamesha same aur predictable hai.",
"<b>DOM manipulation:</b> <code>const inputRef = useRef(null)</code> declare karo, <code>&lt;input ref={inputRef} /&gt;</code> pass karo — React DOM node banate hi <code>inputRef.current</code> me node set kar deta hai, node hatne par wapas <code>null</code>. Phir <code>inputRef.current.focus()</code>, <code>scrollIntoView()</code>, measurement — sab imperative kaam handlers/Effects se. Apne component ko ref dene par default me andar ka DOM node nahi milta — child ko <code>ref</code> prop lekar built-in element ko forward karna padta hai.",
"<b>Mehengi cheez dobara mat banao:</b> <code>useRef(new VideoPlayer())</code> har render par constructor call karta hai, result sirf pehli baar use hota hai — upar wala lazy-init pattern use karo. <code>useRef</code> vs <code>createRef</code>: <code>createRef</code> har render par naya ref banata hai (class components ka tareeka); <code>useRef</code> hamesha wahi object deta hai. Strict Mode me component function dev me do baar call hota hai — har ref object do baar banta hai, ek discard ho jata hai; pure component par koi asar nahi."],
c:"import { useRef } from 'react';\n\n// Value rakhna (interval ID)\nconst intervalRef = useRef(0);\nfunction handleStartClick() {\n  intervalRef.current = setInterval(() => { /* ... */ }, 1000);\n}\nfunction handleStopClick() {\n  clearInterval(intervalRef.current);\n}\n\n// DOM manipulate karna\nconst inputRef = useRef(null);\n// <input ref={inputRef} />\nfunction handleClick() {\n  inputRef.current.focus();\n}\n\n// Mehengi object ki lazy initialization\nconst playerRef = useRef(null);\nif (playerRef.current === null) {\n  playerRef.current = new VideoPlayer();\n}",
k:"Ref = render ke bina persist karne wala mutable box. Dikhana hai to state, sirf rakhna/napna hai to ref — aur render ke dauraan ref ko haath mat lagao."},
{n:40,g:5,t:"useImperativeHandle",u:"https://react.dev/reference/react/useImperativeHandle",
p:["<code>useImperativeHandle</code> ref ke roop me expose hone wale handle ko customize karta hai — poora DOM node parent ko dene ke bajaye sirf chune hue methods (ya apne custom methods) expose karo. Signature: <code>useImperativeHandle(ref, createHandle, dependencies?)</code>. Ye <code>undefined</code> return karta hai.",
"<code>ref</code> wo ref hai jo component ko prop ke roop me mila. <code>createHandle</code> koi argument nahi leta aur wo handle return karta hai jo tum expose karna chahte ho — aam taur par methods wala ek object. <code>dependencies</code> optional hai: <code>createHandle</code> ke andar use hue saare reactive values; koi dependency badli ya array diya hi nahi, to <code>createHandle</code> dobara chalta hai aur naya handle ref ko assign hota hai (<code>Object.is</code> comparison).",
"<b>Pattern:</b> asal DOM node ko ek alag internal ref me rakho (<code>inputRef</code>), aur <code>useImperativeHandle</code> se sirf <code>focus</code> aur <code>scrollIntoView</code> expose karo — dono andar se <code>inputRef.current</code> ko delegate karte hain. Parent ab sirf yahi do kaam kar sakta hai; poore <code>&lt;input&gt;</code> node tak uski pahunch nahi — yahi <b>encapsulation</b> hai.",
"Exposed methods DOM methods se match karna zaroori nahi — apne imperative methods bhi de sakte ho. Jaise ek <code>Post</code> component <code>scrollAndFocusAddComment</code> expose kare: parent <code>Page</code> ek button click par comment list ko scroll bhi karta hai aur input ko focus bhi.",
"<b>Refs ka zyada istemal mat karo:</b> refs sirf un imperative behaviors ke liye hain jo props se express nahi ho sakte — node par scroll karna, focus karna, animation trigger karna, text select karna. Jo cheez prop se ho sakti hai, use prop hi rakho: Modal ke liye imperative <code>{ open, close }</code> handle ki jagah <code>&lt;Modal isOpen={isOpen} /&gt;</code> declarative hai aur behtar hai. Dependencies galat likhne par stale closure wala handle reh sakta hai — linter ise check karta hai."],
c:"import { useRef, useImperativeHandle } from 'react';\n\nfunction MyInput({ ref }) {\n  const inputRef = useRef(null);\n\n  useImperativeHandle(ref, () => {\n    return {\n      focus() {\n        inputRef.current.focus();\n      },\n      scrollIntoView() {\n        inputRef.current.scrollIntoView();\n      },\n    };\n  }, []);\n\n  return <input ref={inputRef} />;\n}",
k:"Parent ko poora DOM node nahi, sirf zaroori methods do. Aur pehle prop se socho — ref sirf sach-much imperative kaam ke liye."},
{n:41,g:5,t:"useEffect",u:"https://react.dev/reference/react/useEffect",
p:["<code>useEffect</code> component ko ek <b>external system</b> ke saath synchronize karta hai — network, browser API, third-party library, ya koi bhi system jo React ke control me nahi. Ye ek <i>escape hatch</i> hai: jab bahar kadam rakhna hi pade aur koi behtar built-in tareeka na ho. Signature: <code>useEffect(setup, dependencies?)</code>; <code>undefined</code> return karta hai.",
"<b>Lifecycle:</b> setup component ke page par aane (mount) par chalta hai. Har commit ke baad jisme dependencies badli hon, React pehle <b>cleanup</b> (purani values ke saath) chalata hai, phir setup (nayi values ke saath). Component hatne (unmount) par cleanup ek antim baar chalta hai. Har Effect ko ek independent process samjho — ek setup/cleanup cycle par dhyaan do. Cleanup ko setup ka <i>mirror</i> banao: setup jo karta hai, cleanup use undo kare — tab Effect kitni bhi baar chale, sahi rahega.",
"<b>Dependencies code se tay hoti hain, pasand se nahi:</b> setup ke andar use hua har reactive value (props, state, component body me declare hue variables/functions) list me hona chahiye; linter verify karta hai. React har dependency ko <code>Object.is</code> se compare karta hai. Array do hi mat — Effect har commit ke baad chalega. Component ke andar bane object/function dependencies Effect ko zaroorat se zyada chalate hain — object ko Effect ke <i>andar</i> banao ya component se bahar nikalo. <b>Linter ko suppress kabhi mat karo</b> — dependencies code se match na hon to bugs pakke hain.",
"<b>Strict Mode ka stress test:</b> dev me React pehle asli setup se pehle ek extra setup → cleanup cycle chalata hai. Cleanup missing ho to chat connections jaisi cheezein badhti dikhengi — turant pata chal jata hai. User ko production ka ek setup aur dev ka setup → cleanup → setup ek jaisa lagna chahiye.",
"<b>Data fetching Effects me mumkin hai, lekin manual hai:</b> race condition se bachne ke liye <code>ignore</code> flag pattern use karo — cleanup me <code>ignore = true</code>, response aane par <code>if (!ignore)</code> tabhi state set karo (responses out of order aa sakti hain). Kamiyan: Effects server par nahi chalte (initial HTML me sirf loading state), network waterfalls bante hain, preload/cache nahi milta. Behtar: framework ka data fetching ya client-side cache (TanStack Query, useSWR, React Router).",
"<b>Kab Effect nahi chahiye:</b> koi external system involved nahi hai to shayad Effect galat tool hai — derived state render me calculate karo, prop change par reset ke liye <code>key</code> use karo, interaction ka jawab event handler me do. Infinite cycle (Effect state badalta hai → dependency badalti hai → Effect phir chalta hai) aam taur par isi galat istemal ka signal hai. Latest props/state ko <i>bina react kiye</i> padhna ho to <code>useEffectEvent</code> use karo. Effects sirf client par chalte hain, server rendering me nahi."],
c:"import { useState, useEffect } from 'react';\nimport { createConnection } from './chat.js';\n\nfunction ChatRoom({ roomId }) {\n  const [serverUrl, setServerUrl] = useState('https://localhost:1234');\n\n  useEffect(() => {\n    const connection = createConnection(serverUrl, roomId);\n    connection.connect();\n    return () => {\n      connection.disconnect();\n    };\n  }, [serverUrl, roomId]);\n}\n\n// Data fetching — ignore flag se race condition guard\nuseEffect(() => {\n  let ignore = false;\n  setBio(null);\n  fetchBio(person).then(result => {\n    if (!ignore) {\n      setBio(result);\n    }\n  });\n  return () => { ignore = true; };\n}, [person]);",
k:"Effect = external system se synchronization. Cleanup setup ka mirror ho, dependencies code se tay hon — aur jahan external system hi nahi, wahan Effect bhi nahi."},
{n:42,g:5,t:"useLayoutEffect",u:"https://react.dev/reference/react/useLayoutEffect",
p:["<code>useLayoutEffect</code>, <code>useEffect</code> ka wo version hai jo <b>browser ke screen repaint karne se pehle</b> chalta hai. Layout measurement aur aise synchronous DOM changes ke liye jo user ko flicker ke roop me nahi dikhne chahiye. Signature aur dependencies ke rules <code>useEffect</code> wale hi hain. Docs ki chetaavni: ye performance ko nuksan pahuncha sakta hai — jab mumkin ho <code>useEffect</code> hi prefer karo.",
"<b>Classic use case — tooltip positioning:</b> tooltip upar aayega ya neeche, ye uski height jaane bina tay nahi hota, aur height render ke baad hi nap sakte hain. Two-pass rendering chahiye: (1) tooltip kahin bhi render karo (galat position chalegi); (2) <code>useLayoutEffect</code> me <code>ref.current.getBoundingClientRect().height</code> napo aur turant re-render trigger karo; (3) sahi position ke saath dobara render. Ye sab <b>paint se pehle</b> hota hai, isliye user ko sirf final result dikhta hai — tooltip hilta hua nahi dikhta.",
"<b>Cost:</b> <code>useLayoutEffect</code> ke andar ka code aur usse schedule hue saare state updates browser ka repaint <b>block</b> karte hain. Zyada istemal app ko slow kar dega. Agar iske andar state update trigger karo to React baaki saare Effects (regular <code>useEffect</code> samet) turant chala deta hai. Iske opposite, aam interaction me React Effect se pehle browser ko paint karne deta hai — flicker na ho tabhi layout effect ki taraf jao.",
"<b>SSR problem:</b> server par koi layout jaankari nahi hoti, isliye wahan <code>useLayoutEffect</code> kuch nahi karta aur warning milti hai. Fix ke tareeke: (1) <code>useEffect</code> se badal do (initial render pehle dikhna acceptable ho to); (2) <code>use(browser())</code> se component ko browser-only mark karo — server rendering me sabse kareebi <code>&lt;Suspense&gt;</code> boundary ka fallback dikhega; (3) component ko client-only mark karo; (4) hydration ke baad hi render karo — <code>isMounted</code> state ko <code>useEffect</code> me <code>true</code> karke; (5) agar istemal external store synchronization ke liye hai (measurement nahi), to <code>useSyncExternalStore</code> lo — wo server rendering support karta hai.",
"Strict Mode me yahan bhi dev-only extra setup+cleanup cycle chalta hai, aur saare Effects ki tarah ye bhi sirf client par chalta hai. Timing ka kram yaad rakho: <code>useInsertionEffect</code> (sabse pehle) → <code>useLayoutEffect</code> (paint se pehle) → <code>useEffect</code> (paint ke baad)."],
c:"import { useState, useRef, useLayoutEffect } from 'react';\n\nfunction Tooltip() {\n  const ref = useRef(null);\n  const [tooltipHeight, setTooltipHeight] = useState(0); // Asli height abhi nahi pata\n\n  useLayoutEffect(() => {\n    const { height } = ref.current.getBoundingClientRect();\n    setTooltipHeight(height); // Asli height milte hi re-render\n  }, []);\n  // ...neeche rendering logic me tooltipHeight use karo...\n}",
k:"Paint se pehle napna/position karna ho tabhi useLayoutEffect — ye repaint block karta hai, isliye default hamesha useEffect rakho."},
{n:43,g:5,t:"useInsertionEffect",u:"https://react.dev/reference/react/useInsertionEffect",
p:["<code>useInsertionEffect</code> DOM me elements <b>koi bhi layout Effect chalne se pehle</b> insert karne deta hai. Ye <b>CSS-in-JS library authors</b> ke liye bana ek specialized Hook hai — aam application code ke liye nahi. Docs saaf kehte hain: agar tum CSS-in-JS library par kaam nahi kar rahe, to tumhe shayad <code>useEffect</code> ya <code>useLayoutEffect</code> chahiye. Signature: <code>useInsertionEffect(setup, dependencies?)</code>.",
"<b>Problem jo ye solve karta hai:</b> CSS-in-JS ke teen tareeke hain — (1) compiler se static CSS files, (2) inline styles, (3) runtime me <code>&lt;style&gt;</code> tags inject karna. React pehle do ka combination recommend karta hai. Runtime injection ke do nuksan: browser ko styles baar-baar recalculate karne padte hain, aur galat lifecycle moment par ho to bahut slow. <code>useInsertionEffect</code> doosri problem solve karta hai: styles <b>sab layout Effects se pehle</b> insert ho jate hain, taaki jab koi Effect layout naape to styles pehle se jagah par hon — warna purane styles se galat measurement milega.",
"<b>Rendering ke dauraan ya useLayoutEffect me injection kyun nahi:</b> render ke dauraan styles ghusana browser ko har frame style recalculation par majboor karta hai — behad slow. <code>useInsertionEffect</code> guarantee deta hai ki <code>&lt;style&gt;</code> tags baaki Effects se pehle lag jayenge, isliye ye <code>useLayoutEffect</code>/<code>useEffect</code> dono se behtar hai is kaam ke liye.",
"<b>Khaas pabandiyan (baaki Effects se alag):</b> iske andar se <b>state update nahi</b> kar sakte; jab ye chalta hai tab <b>refs attached nahi</b> hote; DOM update ho chuka hai ya nahi, is par bharosa nahi kar sakte (ye DOM update se pehle ya baad, kabhi bhi chal sakta hai); aur baaki Effects ke ulta — jo pehle saare cleanups phir saare setups chalate hain — <code>useInsertionEffect</code> har component ke liye cleanup aur setup <b>ek-ek karke</b> chalata hai (interleaving).",
"Ye bhi sirf client par chalta hai — server par nahi. Server par kaun se CSS rules use hue, ye collect karna ho to rendering ke dauraan karo (jaise <code>if (typeof window === 'undefined') { collectedRulesSet.add(rule); }</code>). Timing kram: <code>useInsertionEffect</code> → <code>useLayoutEffect</code> → <code>useEffect</code>."],
c:"import { useInsertionEffect } from 'react';\n\n// CSS-in-JS library ke andar\nlet isInserted = new Set();\n\nfunction useCSS(rule) {\n  useInsertionEffect(() => {\n    // Runtime <style> injection recommend nahi hai.\n    // Lekin karna hi pade to useInsertionEffect me hi karo.\n    if (!isInserted.has(rule)) {\n      isInserted.add(rule);\n      document.head.appendChild(getStyleForRule(rule));\n    }\n  });\n\n  return rule;\n}",
k:"App code ke liye nahi — ye CSS-in-JS libraries ke liye hai, taaki &lt;style&gt; tags layout Effects ke layout naapne se pehle lag jayein."},
{n:44,g:5,t:"useEffectEvent",u:"https://react.dev/reference/react/useEffectEvent",
p:["<code>useEffectEvent</code> events ko Effects se alag karne deta hai. Ek <b>Effect Event</b> tumhare Effect logic ka hissa hai lekin event handler jaisa behave karta hai: ye hamesha render ki <b>sabse taaza values</b> (props/state) 'dekhta' hai, lekin tumhare Effect ko re-synchronize <b>nahi</b> karta — isliye ye Effect dependencies se bahar rehta hai. Signature: <code>const onEvent = useEffectEvent(callback)</code>.",
"<b>Sabse aam (canonical) example:</b> chat room connect hone par notification dikhao jo latest <code>theme</code> use kare. <code>onConnected</code> ko Effect Event banao aur Effect ke andar <code>connection.on('connected', onConnected)</code> lagao — dependencies sirf <code>[roomId]</code>. Theme badalne par room reconnect nahi hota, lekin notification hamesha taaza theme ke saath aati hai. Isi pattern se: interval jo latest <code>increment</code> padhe bina restart hue, ya <code>pointermove</code> listener jo ek baar register hokar latest checkbox value padhe.",
"<b>Kab call kar sakte ho:</b> sirf <code>useEffect</code>, <code>useLayoutEffect</code>, <code>useInsertionEffect</code> ke andar se, ya usi component ke doosre Effect Events se. Render ke dauraan call karna error hai ('A function wrapped in useEffectEvent can't be called during rendering'), event handler se call karna ya child ko pass karna bhi lint error hai — handlers/children ke liye regular function ya <code>useCallback</code> use karo.",
"<b>Identity jaan-boojh kar unstable hai:</b> Effect Event function ki identity har render par badalti hai. Ye design choice hai: ye sirf locally call ho sakte hain, na pass ho sakte hain na dependency ban sakte hain — stable identity ka koi fayda nahi hota, ulta bugs chhup sakte the. Unstable identity ek runtime assertion ka kaam karti hai: galti se identity par nirbhar hue to Effect har render chalega aur bug saaf dikhega. Isi liye ise dependency array me dalna lint error hai.",
"<b>Sabse badi chetaavni:</b> <code>useEffectEvent</code> ko dependency array se bachne ke shortcut ki tarah <b>mat</b> use karo — ye bugs chhupata hai. Jaise <code>log(pageUrl)</code> ko Effect Event me lapet kar Effect ki deps <code>[]</code> rakh di, to URL badalne par log hi nahi hoga. Jo value Effect ko re-run <i>karani</i> chahiye, use dependency hi rakho. Effect Event sirf us logic ke liye jo sach me Effect se fire hone wala event hai — logging, notifications, timers, listeners. Custom Hooks me bhi kaam ka hai: <code>useInterval(callback, delay)</code> callback ko Effect Event me lapet-ta hai, to naya callback aane par bhi interval reset nahi hota — Effect sirf <code>[delay]</code> par nirbhar rehta hai."],
c:"import { useEffectEvent, useEffect } from 'react';\n\nfunction ChatRoom({ roomId, theme }) {\n  const onConnected = useEffectEvent(() => {\n    showNotification('Connected!', theme);\n  });\n\n  useEffect(() => {\n    const connection = createConnection(roomId);\n    connection.on('connected', onConnected);\n    connection.connect();\n    return () => connection.disconnect();\n  }, [roomId]); // onConnected aur theme dependencies NAHI hain\n}\n\n// Timer — restart hue bina latest values\nconst onTick = useEffectEvent(() => {\n  setCount(count + increment);\n});\nuseEffect(() => {\n  const id = setInterval(() => { onTick(); }, 1000);\n  return () => clearInterval(id);\n}, []);",
k:"Effect Event = taaza values padho, react mat karo. Dependencies se bachne ka shortcut nahi hai — sirf sach-much wale events (log, notify, tick) ke liye."},
{n:45,g:5,t:"useMemo",u:"https://react.dev/reference/react/useMemo",
p:["<code>useMemo</code> ek calculation ke result ko re-renders ke beech <b>cache</b> karta hai (memoization). Signature: <code>const cachedValue = useMemo(calculateValue, dependencies)</code>. <code>calculateValue</code> pure ho, koi argument na le. Pehle render par React use call karta hai; baad ke renders me dependencies (<code>Object.is</code> se compare) na badli hon to wahi stored value milti hai, warna dobara calculation hoti hai.",
"<b>Ye sirf performance optimization hai, semantic guarantee nahi:</b> React cached value ko phenk sakta hai (dev me file edit karne par, initial mount par suspend hone par, bhavishya me virtualized lists ke off-screen items par). Code ki correctness <code>useMemo</code> par nirbhar hai to pehle asal problem fix karo — warna state variable ya ref zyada sahi rahega.",
"<b>Kab fayda hota hai — sirf teen cases:</b> (1) calculation sach me slow hai aur dependencies kam badalti hain; (2) value <code>memo</code> me lapete child ko prop ke roop me ja rahi hai; (3) value kisi aur Hook ki dependency hai. Calculation 'expensive' hai ya nahi, guess mat karo — interaction ke aas-paas <code>console.time()</code>/<code>console.timeEnd()</code> lagakar napo; kul samay ~1 ms ya zyada bane tab memoize karna socho. Hazaaron objects par loop nahi hai to shayad expensive hai hi nahi. <code>useMemo</code> pehle render ko fast nahi karta — sirf updates par bekaar kaam bachata hai.",
"<b>Har jagah useMemo mat lagao</b> — readability ghategi aur fayda zero. Memoization ko bekaar banane wale patterns pehle fix karo: wrapper components ko JSX <code>children</code> ke roop me lo (parent ki state badalne par children re-render nahi hote), state ko local rakho (zaroorat se upar mat uthao), rendering logic pure rakho, state update karne wale bekaar Effects hatao, aur Effect dependencies kam karo (object/function ko Effect ke andar ya component ke bahar le jao).",
