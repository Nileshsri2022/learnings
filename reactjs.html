"Galtiyan: stylesheet ke liye <code>precedence</code> na dena — <code>as: \"style\"</code> ke saath ye required hai. Jab tum sirf download chahte ho tab <code>preinit</code> use karna — script execute ho jayegi / stylesheet turant apply ho jayegi; timing control karni ho to <code>preload</code> use karo. Ise ESM module ke liye use karna — <code>preinitModule</code> use karo. Ek bareek farq jo interview me kaam aata hai: <code>preinit</code> ke stylesheet <code>precedence</code> values ek fixed set hain (<code>reset</code>, <code>low</code>, <code>medium</code>, <code>high</code>) — <code>&lt;link&gt;</code>/<code>&lt;style&gt;</code> par milne wali man-maani precedence strings ke ulta."],
c:"import { preinit } from 'react-dom';\n\nfunction AppRoot() {\n  preinit(\"https://example.com/script.js\", {as: \"script\"});\n  return ...;\n}\n\nfunction CallToAction() {\n  const onClick = () => {\n    preinit(\"https://example.com/wizardStyles.css\", {as: \"style\"});\n    startWizard();\n  };\n  return <button onClick={onClick}>Start Wizard</button>;\n}",
k:"preinit = download + execute; stylesheet turant apply hoti hai aur uske liye precedence (reset/low/medium/high) required hai. Sirf download chahiye to preload."},
{n:111,g:13,t:"preinitModule",u:"https://react.dev/reference/react-dom/preinitModule",
p:["<code>preinitModule</code> (<code>react-dom</code> se) ek ESM module ko eagerly fetch <b>aur evaluate</b> karta hai — <code>preinit</code> ka module counterpart. Frameworks aksar resource loading tumhare liye sambhalte hain, to shayad tumhe ye API khud call nahi karna padega. Signature: <code>preinitModule(\"https://example.com/module.js\", {as: \"script\"})</code>; kuch return nahi karta.",
"Parameters: <code>href</code> — string; us module ka URL jo download karna hai. <code>options</code> — ek object: <code>as</code> — <b>required</b> string; ye <code>'script'</code> hi hona chahiye. <code>crossOrigin</code> — string: <code>anonymous</code> ya <code>use-credentials</code>. <code>integrity</code> — cryptographic hash. <code>nonce</code> — sakht CSP ke liye cryptographic nonce. <code>fetchPriority</code> — string: <code>auto</code> (default), <code>high</code>, <code>low</code>.",
"Ye browser ko hint deta hai ki module ko download aur execute karna shuru kar de; modules download khatm hote hi execute ho jate hain. Ek component render karte waqt call karo jo module use karega aur tumhe is baat se koi aitraaz nahi ki wo download par turant asar kare, ya transition se pehle ek event handler me. Same <code>href</code> ke saath kai calls ek call ke barabar hain. Browser me kahin bhi callable hai; SSR / Server Components me sirf render ke dauraan (ya rendering se utpann async context me) asar hota hai. Sirf download ke liye <code>preloadModule</code> use karo; ek non-ESM script ke liye <code>preinit</code> use karo.",
"Galtiyan: sirf-download behavior ki umeed — module download par execute ho jata hai; execution talne ke liye <code>preloadModule</code> use karo. Ise ek classic script ke liye use karna — <code>preinit</code> use karo. <code>'script'</code> ke alawa <code>as</code> dena — ye <code>'script'</code> hi hona chahiye. Aur SSR wali baat — render ke bahar ki calls ignore. Iske saath resource-hint ki 2×2 poori hoti hai: <code>preload</code> / <code>preinit</code> / <code>preloadModule</code> / <code>preinitModule</code> — <code>preinit</code> + <code>preinitModule</code> hi sirf wo hints hain jo execute karte hain; <code>preload*</code> joda sirf download karta hai."],
c:"import { preinitModule } from 'react-dom';\n\nfunction AppRoot() {\n  preinitModule(\"https://example.com/module.js\", {as: \"script\"});\n  return ...;\n}\n\nfunction CallToAction() {\n  const onClick = () => {\n    preinitModule(\"https://example.com/module.js\", {as: \"script\"});\n    startWizard();\n  };\n  return <button onClick={onClick}>Start Wizard</button>;\n}",
k:"preinitModule = ESM ke liye download + execute. 2×2 yaad rakho: preload* sirf download, preinit* download ke saath execute bhi."},
{n:112,g:13,t:"browser",u:"https://react.dev/reference/react-dom/browser",
p:["Ye wahi <code>browser</code> page hai jo section 69 me React APIs group me aayi thi — react.dev ise <b>do groups</b> me list karta hai (React APIs aur React DOM APIs), lekin page ek hi hai; isiliye is SPA me 144 entries ke peeche 143 unique pages hain. Yahan mukhya baatein dohra raha hoon taaki ye group bhi apne pairon par khada rahe.",
"<code>browser</code> (<code>react-dom</code> se) server rendering ke dauraan ek component ko <b>browser-only</b> mark karta hai, aur <code>use</code> ke saath istemal hota hai: <code>use(browser(reason?))</code>. <code>reason</code> (optional) ek string ya function hai jo batata hai ki content ko browser me render hone ki zaroorat kyun hai; string, ya function ki return value, <code>onBrowserBailout</code> ko diye gaye <code>Error</code> ki <code>cause</code> ban jati hai. React reason function ko sirf tab call karta hai jab koi server renderer us value se takrata hai — browser me nahi; reason banana mehnga ho to function do, jaise <code>() =&gt; new Error(...)</code>.",
"Return value ek opaque value hai jise tum component me <code>use</code> ko pass karte ho, ya server render ko abort karte waqt reason ke roop me use karte ho. Browser me ise <code>use</code> ko pass karne par <code>undefined</code> return hota hai. Server rendering ke dauraan <code>use(browser())</code> component ka rendering rok deta hai aur uski jagah sabse kareebi <code>&lt;Suspense&gt;</code> boundary ka fallback chhod deta hai; browser me component aam taur par render hota hai. Ye <code>typeof window</code> checks, Effect ke mounted state set karne ke intezaar, ya SSR disable karne wale framework options — teeno ki jagah leta hai.",
"Doosra istemal server render ko abort karna hai: <code>browser</code> value ko <code>renderToPipeableStream</code> ke <code>abort()</code> ke reason ke roop me do (ya <code>AbortSignal</code> lene wale APIs ke liye <code>AbortController.abort</code> me) — pending content ka intezaar ruk jayega aur browser use render kar lega. <code>browser</code> wala abort reason <code>onError</code>/<code>onRecoverableError</code> trigger nahi karta; uski jagah har recover hui Suspense boundary <code>onBrowserBailout(error, errorInfo)</code> ko report hoti hai, jahan <code>errorInfo.componentStack</code> batata hai ki bailout kahan hua.",
"Galtiyan: <code>browser()</code> ko akela call karne ka koi asar nahi — value ko <code>use</code> ko pass karo (aur use throw mat karo). Server rendering ke dauraan <code>use(browser())</code> ke aas-paas Suspense boundary na ho to server render fail ho jata hai — aur boundary na ho to <code>onBrowserBailout</code> bhi call nahi hota; failure renderer ke aam error callbacks se jata hai. Server Component se call karna galat hai — ye <b>Client Component</b> hona chahiye (<code>'use client'</code> lagao ya call ko ek child Client Component me le jao). Poori detail section 69 me hai."],
c:"'use client';\nimport { use, useState } from 'react';\nimport { browser } from 'react-dom';\n\nexport default function SavedDraft() {\n  use(browser('The saved draft is stored in localStorage.'));\n  const [draft] = useState(() => localStorage.getItem('draft') ?? '');\n  return <DraftEditor initialDraft={draft} />;\n}\n\n// Server render ko browser reason ke saath abort karna\n// const { pipe, abort } = renderToPipeableStream(<App />, {\n//   onShellReady() {\n//     pipe(response);\n//     setTimeout(() => {\n//       abort(browser('The server render timed out.'));\n//     }, 10000);\n//   }\n// });",
k:"browser do groups me listed ek hi page hai (isiliye 144 entries, 143 unique pages). Tareeqa wahi hai: use(browser()) + Suspense boundary + Client Component."},
{n:113,g:14,t:"createRoot",u:"https://react.dev/reference/react-dom/client/createRoot",
p:["<code>createRoot</code> (<code>react-dom/client</code> se) ek browser DOM node ke andar React components dikhane ke liye ek React root banata hai — un apps ke liye client-side entry point jo server-rendered <b>nahi</b> hain. Signature: <code>const root = createRoot(domNode, options?)</code>, phir <code>root.render(reactNode)</code> aur <code>root.unmount()</code>. <code>createRoot</code> do methods wala ek object return karta hai: <code>render</code> aur <code>unmount</code>.",
"<code>domNode</code> ek DOM element hai; React uske liye ek root banata hai aur uske andar ke DOM ko manage karne ka zimma le leta hai. Optional <code>options</code>: <code>onCaughtError</code> — callback jo tab call hota hai jab React ek Error Boundary me error pakadta hai; use <code>error</code> aur ek <code>errorInfo</code> object (jisme <code>componentStack</code> hai) milta hai. <code>onUncaughtError</code> — callback jab koi error throw ho aur Error Boundary use na pakde; wahi <code>error</code> + <code>errorInfo</code>. <code>onRecoverableError</code> — callback jab React errors se automatically recover karta hai; kuch recoverable errors me asal kaaran <code>error.cause</code> ke roop me shamil hota hai. <code>identifierPrefix</code> — <code>useId</code> se generated IDs ke liye React ka use kiya string prefix; ek hi page par kai roots ke beech takrav se bachne ke liye upyogi.",
"<code>root.render(reactNode)</code>: <code>reactNode</code> dikhane ke liye ek React node hai, aam taur par JSX jaise <code>&lt;App /&gt;</code>; ye ek <code>createElement()</code> element, string, number, <code>null</code>, ya <code>undefined</code> bhi accept karta hai; <code>undefined</code> return karta hai. Basic istemal: <code>const root = createRoot(document.getElementById('root')); root.render(&lt;App /&gt;);</code> — aam taur par startup par ek baar chalaya jata hai. Poori tarah React se bani app me ek root hota hai; React ke 'sprinkles' wali page me kai roots ho sakte hain. Uske baad se React poora DOM manage karta hai; UI ko state se update karo, aur modals/tooltips ko DOM node ke bahar ek portal (<code>createPortal</code>) se render karo, doosre root se nahi.",
"<b>First render saaf karta hai:</b> pehla <code>root.render</code> root ke andar ki saari maujood HTML ko render karne se pehle saaf kar deta hai. Agar DOM node me server-generated HTML hai, to uski jagah <code>hydrateRoot</code> use karo. <b>Re-rendering:</b> same root par dobara <code>render</code> call karna naye tree ko pichle se mila kar DOM update karta hai (root component ke <code>set</code> function ko call karne jaisa); tree structure match kare to state preserve rehti hai. Ye uncommon hai — components aam taur par state update karte hain. <b>Timing:</b> rendering shuru hone ke baad synchronous hoti hai, lekin <code>root.render(...)</code> khud nahi hai — uske baad ka code us render ke effects fire hone se pehle chal sakta hai. Un durlabh cases me jahan effect timing matter karta hai, use <code>flushSync</code> me lapeto.",
"<code>root.unmount()</code> tree ko destroy karta hai aur React ko DOM node se alag kar deta hai (event handlers aur state hatate hue). Ye tab upyogi hai jab root ke DOM node (ya kisi ancestor) ko doosra code hata sakta hai (jaise ek jQuery tab panel) — warna andar ke components subscriptions cleanup nahi karenge. Unmount karne ke baad tum same root par dobara <code>root.render</code> call nahi kar sakte ('Cannot update an unmounted root'); tum same DOM node ke liye ek naya root bana sakte ho.",
"<b>Empty HTML / SSR note:</b> ek khaali <code>&lt;div id=\"root\"&gt;&lt;/div&gt;</code> ke saath, user ko JS load aur run hone tak ek blank page dikhta hai. Uski jagah initial HTML server par ya build time par generate karo (SSR/SSG) — lekin tab tumhe <code>createRoot</code> nahi, <code>hydrateRoot</code> use karna hoga. <b>Production me error logging:</b> default roop se React saare errors console me log karta hai. Apni reporting implement karne ke liye <code>onUncaughtError</code>/<code>onCaughtError</code>/<code>onRecoverableError</code> pass karo (jaise ek gyaat error ko filter karna, <code>error</code> + <code>errorInfo.componentStack</code> ko ek crash service ko bhejna). Docs development me inhe hatane ki sifarish karte hain taaki React ke default handlers/dev overlay bane rahein.",
"Sabse aam galtiyan: root banakar <code>root.render</code> bhool jana — kuch display nahi hota. <code>root.render</code> ko options pass karna — ye sirf ek argument accept karta hai; options <code>createRoot</code> ko do ('You passed a second argument to root.render'). 'Target container is not a DOM element' — argument ek DOM node nahi hai: <code>getElementById</code> ne <code>null</code> return kiya (id me typo, ya <code>&lt;script&gt;</code> element ke HTML me exist hone se pehle chalti hai), ya tumne <code>createRoot(domNode)</code> ki jagah <code>createRoot(&lt;App /&gt;)</code> likha. 'Functions are not valid as a React child' — <code>root.render(&lt;App /&gt;)</code> ki jagah <code>root.render(App)</code>, ya <code>root.render(createApp())</code> ki jagah <code>root.render(createApp)</code>. Server-rendered HTML ke liye <code>createRoot</code> use karna — ye saari server HTML delete karke DOM ko scratch se dobara banata hai (slow hai, focus/scroll reset karta hai, user input kho sakta hai); <code>hydrateRoot</code> use karo. <code>root.unmount</code> ke baad <code>root.render</code> call karna — 'Cannot update an unmounted root' throw hota hai. Interview ka buniyaadi sawal yahi joda hai: <code>createRoot</code> saaf karke banata hai; <code>hydrateRoot</code> maujood server HTML se judta hai."],
c:"import { createRoot } from 'react-dom/client';\n\nconst root = createRoot(document.getElementById('root'));\nroot.render(<App />);\n\n// Aanshik-React page par kai roots\nconst domNode = document.createElement('div');\nconst root2 = createRoot(domNode);\nroot2.render(<Comment />);\ndocument.body.appendChild(domNode);\n\n// Production error reporting\nconst root3 = createRoot(container, {\n  onCaughtError: (error, errorInfo) => {\n    if (error.message !== \"Known error\") {\n      reportCaughtError({ error, componentStack: errorInfo.componentStack });\n    }\n  },\n  onRecoverableError: onRecoverableErrorProd,\n  onUncaughtError: onUncaughtErrorProd,\n});\nroot3.render(<App />);",
k:"createRoot pehle render par container saaf karke khud DOM banata hai — server HTML ho to ye galat tool hai, wahan hydrateRoot lagega. Options createRoot ko do, render ko nahi."},
{n:114,g:14,t:"hydrateRoot",u:"https://react.dev/reference/react-dom/client/hydrateRoot",
p:["<code>hydrateRoot</code> (<code>react-dom/client</code> se) React ko us maujood HTML se jodta hai jo pehle se server par React (<code>react-dom/server</code>) dwara render ki gayi thi — ye ek static HTML snapshot ko DOM dobara banaye bina ek poori interactive app me badal deta hai. Signature: <code>const root = hydrateRoot(domNode, reactNode, options?)</code>, phir <code>root.render(reactNode)</code> aur <code>root.unmount()</code>. <code>hydrateRoot</code> bhi do methods (<code>render</code>, <code>unmount</code>) wala object return karta hai.",
"Parameters: <code>domNode</code> — ek DOM element jo server par root element ke roop me render hua tha. <code>reactNode</code> — maujood HTML ko render karne ke liye use hua React node, aam taur par JSX jaise <code>&lt;App /&gt;</code> jaisa kisi server method (jaise <code>renderToPipeableStream(&lt;App /&gt;)</code>) se render hua tha. Optional <code>options</code>: <code>createRoot</code> wale hi teen error callbacks (<code>onCaughtError</code>, <code>onUncaughtError</code>, <code>onRecoverableError</code> — kuch recoverable errors me <code>error.cause</code>); <code>identifierPrefix</code> — <code>useId</code> IDs ke liye string prefix, jo server par use hue prefix ke <b>bilkul same</b> hona chahiye; <code>formState</code> — ek Server Function dwara handle ki gayi form submission se mila form state. Agar page ek <code>useActionState</code> + <code>permalink</code> wale form ke jawab me server par render hui thi, to resulting form state pass karo taaki <code>useActionState</code> <code>initialState</code> ke bajaye submitted state return kare. Ye wahi value honi chahiye jo server renderer ko di gayi thi; aam taur par tumhara framework ise pass through karta hai.",
"<b>Hydration:</b> <code>hydrateRoot(document.getElementById('root'), &lt;App /&gt;)</code> server HTML se component logic (event listeners, state) jodta hai. Aam taur par startup par ek baar call hota hai; uske baad UI ko state se update karo, <code>hydrateRoot</code> dobara call karke nahi. Poore document ko bhi hydrate kar sakte ho: apps poore document ko JSX ke roop me render kar sakti hain (<code>&lt;html&gt;</code> samet); pehle argument ke roop me <code>document</code> global pass karo: <code>hydrateRoot(document, &lt;App /&gt;)</code>.",
"<b>Tree match hona hi chahiye — hydration ka niyam number ek:</b> <code>hydrateRoot</code> ko diya gaya React tree <b>wahi output</b> produce kare jo server par hua tha. Mismatches bugs hain: development me React warning deta hai; is baat ki koi guarantee nahi ki attribute differences patch ho jayengi (saare markup ko validate karna bahut mehnga padega). React kuch hydration errors se recover karta hai, lekin wo cheezein slow kar sakti hain ya, sabse buri haalat me, event handlers ko galat elements se jod sakti hain. Aam kaaran: root node ke andar React-generated HTML ke aas-paas extra whitespace/newlines; render logic me <code>typeof window !== 'undefined'</code> checks; render logic me <code>window.matchMedia</code> jaise browser-only APIs; server aur client par alag data.",
"<b>Na taal sakne wale mismatches ko dabana:</b> ek single element par <code>suppressHydrationWarning={true}</code> jodo (jaise ek timestamp). Ye sirf ek level deep kaam karta hai; ek escape hatch hai — React mismatched text content ko patch <b>nahi</b> karega. <b>Jaankari se alag client/server content:</b> two-pass rendering karo — pehle server jaisa hi render karo, phir hydration ke turant baad synchronously hone wale ek additional pass me client-only content ke liye ek state variable (jaise <code>isClient</code>) ko Effect me <code>true</code> set karo. Agar koi component sirf browser me render hona chahiye, to Effect ka intezaar karne ke bajaye <code>use(browser())</code> call karo. Cost: hydration slow hoti hai (components do baar render hote hain) aur hydration ke baad ka UI badlav slow connections par jarring lag sakta hai.",
"Baaki baatein: hydration khatm hone ke baad tum <code>root.render</code> call kar sakte ho; tree match kare to state preserve rehti hai — ye asamanya hai, kyunki content pehle se HTML ke roop me rendered hai. <b>Hydration khatm hone se pehle <code>root.render</code> call karna server HTML saaf karke poore root ko client rendering par switch kar deta hai.</b> Unmounting ke semantics <code>createRoot</code> wale hi hain — tree destroy, React detach; unmount ke baad <code>root.render</code> 'Cannot update an unmounted root' throw karta hai. Production error logging ke liye wahi teen options. Galtiyan: server/client output mismatch (sabse bada hydration bug — kaaran theek karo, <code>suppressHydrationWarning</code> se usool par kagaz mat lagao); bina server HTML ke <code>hydrateRoot</code> use karna — supported nahi, <code>createRoot</code> use karo; client aur server par alag <code>identifierPrefix</code> — <code>useId</code> values takrayengi/mismatch hongi; ek <code>useActionState</code> + <code>permalink</code> form submission ke jawab me server-rendered page ke liye <code>formState</code> bhool jana — submitted state restore nahi hogi."],
c:"import { hydrateRoot } from 'react-dom/client';\n\n// Basic hydration\nhydrateRoot(document.getElementById('root'), <App />);\n\n// Poore document ko hydrate karna\nhydrateRoot(document, <App />);\n\n// Na taal sakne wale mismatch ko dabana (jaise ek timestamp)\n// <time suppressHydrationWarning={true}>{new Date().toLocaleTimeString()}</time>\n\n// Client-only content ke liye two-pass rendering\nconst [isClient, setIsClient] = useState(false);\nuseEffect(() => { setIsClient(true); }, []);\n// return isClient ? <ClientOnly /> : <ServerVersion />;",
k:"Hydration matlab server HTML par React ko jodna — output server se bilkul same hona chahiye. Mismatch ka fix suppressHydrationWarning nahi, kaaran theek karna hai."},
{n:115,g:15,t:"renderToReadableStream",u:"https://react.dev/reference/react-dom/server/renderToReadableStream",
p:["<code>renderToReadableStream</code> (<code>react-dom/server</code> se) ek React tree ko HTML ke roop me ek <b>Readable Web Stream</b> me render karta hai — Deno aur modern edge runtimes ke liye streaming SSR API (Node.js <code>renderToPipeableStream</code> use karta hai). Signature: <code>const stream = await renderToReadableStream(reactNode, options?)</code>.",
"<code>reactNode</code> HTML me render karne ke liye ek React node hai, jaise <code>&lt;App /&gt;</code>. Isse <b>poore document</b> ko represent karne ki umeed hai, to <code>App</code> ko <code>&lt;html&gt;</code> tag render karna chahiye. Optional <code>options</code> ke mukhya hisse: <code>bootstrapScripts</code> (emit karne ke liye <code>&lt;script&gt;</code> tags ke string URLs ki array; wo script shamil karo jo <code>hydrateRoot</code> call karti hai; agar tum client par React bilkul nahi chahte to ise chhod do), <code>bootstrapScriptContent</code> (ek inline <code>&lt;script&gt;</code> tag me rakhi string), <code>bootstrapModules</code> (<code>bootstrapScripts</code> jaisa, lekin <code>&lt;script type=\"module\"&gt;</code> emit karta hai), <code>formState</code>, <code>identifierPrefix</code> (<code>hydrateRoot</code> ko diye prefix se match karna chahiye), <code>signal</code> (server rendering abort karke baaki client par render karne ke liye ek abort signal), <code>onError</code>, <code>onHeaders</code>, <code>onBrowserBailout</code>, <code>nonce</code>, <code>namespaceURI</code> (root namespace URI; default aam HTML; SVG ke liye <code>'http://www.w3.org/2000/svg'</code> ya MathML ke liye <code>'http://www.w3.org/1998/Math/MathML'</code> pass karo), <code>maxHeadersLength</code> (default 2000), <code>progressiveChunkSize</code>, aur <code>importMap</code> (<b>Canary only</b>).",
"Return value ek Promise hai: <b>shell</b> ka rendering safal ho to ye ek Readable Web Stream par resolve hota hai; shell ka rendering fail ho to Promise reject hota hai — isse ek fallback shell output karo. Returned stream ki ek extra property hai: <code>allReady</code> — ek Promise jo saare rendering ke complete hone (shell + additional content) par resolve hota hai. Crawlers/static generation ke liye response return karne se pehle <code>await stream.allReady</code> karo; phir koi progressive loading nahi hoti aur stream me final HTML hota hai.",
"<b>Shell kya hai:</b> kisi bhi <code>&lt;Suspense&gt;</code> boundary ke bahar wala hissa; ye tay karta hai ki user ko sabse pehla loading state kya dikhega. Ise <i>minimal lekin complete</i> rakho — page layout ka ek skeleton, ek vishal spinner nahi (poori app ko ek boundary me lapetna use slow mehsoos karata hai). Basic flow: stream banao, <code>new Response(stream, { headers: { 'content-type': 'text/html' } })</code> return karo. React doctype aur bootstrap <code>&lt;script&gt;</code> tags inject karta hai; client par bootstrap script <code>hydrateRoot(document, &lt;App /&gt;)</code> call karti hai.",
"<b>Suspense ke saath streaming:</b> slow content ko <code>&lt;Suspense&gt;</code> boundaries me lapeto. React pehle shell (Suspense ke bahar ki har cheez) stream karta hai, fallback HTML bhejta hai, phir resolved content ko baad me ek inline <code>&lt;script&gt;</code> ke saath stream karta hai jo fallback ko asal HTML se badal deta hai. Nested boundaries ek bareek loading sequence deti hain. Streaming React JS ke browser me load hone ka intezaar nahi karti — koi bhi <code>&lt;script&gt;</code> load hone se pehle HTML kram se reveal hota hai. Sirf ek Suspense boundary activate karne wale source se aaya data (jaise <code>use</code> se padha Promise) suspend karta hai; Effect ya event handler me fetch kiya data nahi karta.",
"<b>Errors ki do kahaani:</b> shell ke <i>andar</i> ke errors — React ke paas bhejne ke liye koi arthapurn HTML nahi hai — call ko <code>try...catch</code> me lapeto aur fallback HTML return karo (jaise <code>&lt;h1&gt;Something went wrong&lt;/h1&gt;</code>, status 500). <code>onError</code> aur <code>catch</code> dono fire hote hain; reporting ke liye <code>onError</code> use karo, fallback ke liye <code>catch</code>. Fallback ek client-only shell bhi ho sakta hai. Shell ke <i>bahar</i> ke errors (Suspense ke andar) — React recover karta hai: (1) sabse kareebi boundary ka fallback emit karta hai, (2) us content ko server par render karna chhod deta hai, (3) JS load hone par client par retry karta hai. Client retry bhi fail ho to error client par throw hota hai aur sabse kareebi Error Boundary UI tay karti hai; user ko tab tak loading indicator dikhta hai jab tak pakka na ho ki error unrecoverable hai. Retry safal ho to fallback chupchaap badal jata hai; server <code>onError</code> aur client <code>onRecoverableError</code> phir bhi fire hote hain.",
"<b>Status codes:</b> streaming shuru ho jane ke baad tum status code nahi badal sakte. Shell error ho to <code>catch</code> block use set karta hai (500). Warna 200 bhejo — app client par recover ho sakti hai. Shell ke bahar ke errors ko reflect karne ke liye <code>onError</code> me ek <code>didError</code> flag track karo aur <code>status: didError ? 500 : 200</code> return karo — lekin ye sirf initial shell generate karte waqt hue errors pakadta hai; critical content ke liye use shell me le jao. Custom <code>Error</code> subclasses + <code>instanceof</code> (jaise <code>NotFoundError</code> → 404) code ko error type ke hisaab se badalne dete hain. <b>Asset paths:</b> build-hashed filenames (<code>styles.123456.css</code>) hardcode nahi ho sakte; server aur client dono par <code>App</code> ko ek <code>assetMap</code> prop pass karo (client ko <code>bootstrapScriptContent</code> se serialize karke: <code>window.assetMap = ${JSON.stringify(assetMap)};</code>) taaki hydration match kare. <b>Aborting:</b> ek <code>AbortController</code> ka <code>signal</code> pass karo (jaise 10 s ke baad abort); React baaki loading fallbacks ko HTML ke roop me flush karta hai aur baaki client par render hota hai. Galtiyan: shell/error split bhoolna; streaming shuru hone ke baad status code set karne ki koshish; Suspense ke Effect/event-handler fetches ko pakadne ki umeed; poori app ko ek Suspense boundary me lapetna; server aur client ke beech mismatched <code>assetMap</code> (ya koi prop) — hydration errors; <code>onError</code> ko <code>console.error</code> call kiye bina override karna — tum default logging kho doge."],
c:"import { renderToReadableStream } from 'react-dom/server';\n\nasync function handler(request) {\n  const stream = await renderToReadableStream(<App />, {\n    bootstrapScripts: ['/main.js']\n  });\n  return new Response(stream, {\n    headers: { 'content-type': 'text/html' },\n  });\n}\n\n// Shell error → fallback document\nasync function handler2(request) {\n  try {\n    const stream = await renderToReadableStream(<App />, {\n      bootstrapScripts: ['/main.js'],\n      onError(error) { console.error(error); logServerCrashReport(error); }\n    });\n    return new Response(stream, { status: 200, headers: { 'content-type': 'text/html' } });\n  } catch (error) {\n    return new Response('<h1>Something went wrong</h1>', {\n      status: 500, headers: { 'content-type': 'text/html' },\n    });\n  }\n}\n\n// 10s ke baad abort\nconst controller = new AbortController();\nsetTimeout(() => controller.abort(), 10000);\nconst stream2 = await renderToReadableStream(<App />, { signal: controller.signal });",
k:"Shell ready hote hi stream resolve hoti hai; allReady poore page ka intezaar karti hai. Shell ke andar ka error Promise reject karta hai, bahar ka fallback + client retry se recover hota hai."},
{n:116,g:15,t:"resume",u:"https://react.dev/reference/react-dom/server/resume",
p:["<code>resume</code> (<code>react-dom/server</code> se) ek pre-rendered React tree ko HTML ke roop me ek Readable Web Stream me <b>resume</b> karke render karta hai — <code>prerender</code> (<code>react-dom/static</code> se) dwara shuru kiye gaye partial-prerendering flow ka doosra hissa. Signature: <code>const stream = await resume(reactNode, postponedState, options?)</code>.",
"Parameters: <code>reactNode</code> — wahi React node jiske saath tumne <code>prerender</code> call kiya tha, jaise <code>&lt;App /&gt;</code>; isse poore document ko represent karna chahiye (<code>App</code> <code>&lt;html&gt;</code> render karta hai). <code>postponedState</code> — ek prerender API se return hua opaque <code>postpone</code> object, jahan se tumne use store kiya tha wahan se load kiya hua (jaise Redis, ek file, ya S3). Optional <code>options</code> sirf ye lete hain: <code>nonce</code>, <code>signal</code>, <code>onBrowserBailout</code>, <code>onError</code> (koi bhi server error par fire hota hai, recoverable ho ya na ho; default sirf <code>console.error</code> call karta hai; crash reports log karne ke liye override karo to bhi <code>console.error</code> call karo).",
"Return value ek Promise hai: <code>resume</code> safalta se ek shell produce kare to ye ek Readable Web Stream par resolve hota hai jise ek Writable Web Stream me pipe kar sakte ho; shell me error ho to Promise us error ke saath reject hota hai. Stream ki <code>allReady</code> property bhi hai — saare rendering ke complete hone par resolve hone wala Promise; crawlers/static generation ke liye respond karne se pehle <code>await stream.allReady</code> karo (phir koi progressive loading nahi; stream me final HTML hota hai).",
"<b>Partial-prerendering flow ki teen paratein:</b> Layer 1 — ek <code>AbortController</code> ke saath <code>prerender(&lt;App /&gt;)</code>, ek macrotask me turant abort kiya gaya (jaise <code>controller.abort(new Postponed())</code>), taaki jo data synchronously ya ek microtask me uplabdh nahi hai wo kabhi khatm na ho; returned <code>{ prelude, postponed }</code> prelude HTML (plain HTML ke roop me turant flush ki gayi) aur serializable postponed state deta hai. Layer 2 — baad me (jaise request cookies ke aane ke baad), <code>resume(&lt;App /&gt;, postponed)</code> rendering ko wahan se jaari rakhta hai jahan prerender ne chhoda tha aur baaki stream karta hai. Layer 3 — client par <code>hydrateRoot</code>. <code>resume</code> root se dobara render karta hai jab tak use ek aisa component na mil jaye jo poori tarah pre-render nahi hua tha; sirf poori tarah prerendered components (component + children ka prerendering khatm) poori tarah skip ho jate hain.",
"Galtiyan: <code>resume</code> ko bootstrap options pass karna — ye <code>bootstrapScripts</code>, <code>bootstrapScriptContent</code>, ya <code>bootstrapModules</code> accept <b>nahi</b> karta; unhe us <code>prerender</code> call ko do jisne <code>postponedState</code> generate kiya tha (ya bootstrap content ko writable stream me manually inject karo). <code>identifierPrefix</code> pass karna — accept nahi hota; prefix <code>prerender</code> aur <code>resume</code> dono me same hona chahiye. <code>resume</code> ko <code>nonce</code> dena jabki <code>prerender</code> ko scripts bhi de rahe ho — <code>nonce</code> prerender ko nahi diya ja sakta, to <code>resume</code> ko sirf tab <code>nonce</code> do jab tum prerender ko scripts nahi de rahe. <code>resume</code> ke sab kuch skip karne ki umeed — ye root se dobara render karta hai jab tak ek not-fully-prerendered component na mile. Interview ka mudda: <b>partial prerendering (PPR)</b> — static shell ko build time par prerender karo, dynamic hisson ko har request par resume karo; <code>prerender</code> + <code>resume</code> iske liye React ka built-in mechanism hai. <code>postponed</code> state opaque aur JSON-serializable hai — ye paraton ke beech Redis/S3/ek file me reh sakta hai. Aur joda yaad rakho: <code>resume</code> (Web Streams) banam <code>resumeToPipeableStream</code> (Node.js)."],
c:"import { resume } from 'react-dom/server';\nimport { getPostponedState } from './storage';\n\nasync function handler(request, writable) {\n  const postponed = await getPostponedState(request);\n  const resumeStream = await resume(<App />, postponed);\n  return resumeStream.pipeTo(writable);\n}\n\n// Layer 1 (prerender, turant abort)\nconst controller = new AbortController();\nconst prerenderedApp = prerender(<App />, {\n  signal: controller.signal,\n  onError(error) {\n    if (error instanceof Postponed) {\n      // Expected — prerender jaan-boojh kar postponed kiya gaya tha\n    } else {\n      console.error(error);\n    }\n  },\n});\nsetTimeout(() => { controller.abort(new Postponed()); });\nconst { prelude, postponed } = await prerenderedApp;\n\n// Layer 2 (baad me, jaise cookies resolve hone ke baad)\nconst stream = await resume(<App />, postponed);",
k:"resume prerender ka doosra hissa hai: postponed state se rendering wahan se jaari jahan ruki thi. Bootstrap options aur identifierPrefix yahan nahi, prerender ko do."},
{n:117,g:15,t:"renderToPipeableStream",u:"https://react.dev/reference/react-dom/server/renderToPipeableStream",
p:["<code>renderToPipeableStream</code> (<code>react-dom/server</code> se) ek React tree ko HTML ke roop me ek pipeable <b>Node.js Stream</b> me render karta hai — <code>renderToReadableStream</code> ka Node.js counterpart (wahi concepts, awaited Promise ke bajaye callback-based API). Signature: <code>const { pipe, abort } = renderToPipeableStream(reactNode, options?)</code>.",
"<code>reactNode</code> HTML me render karne ke liye ek React node hai, jaise <code>&lt;App /&gt;</code>; isse <b>poore document</b> ko represent karna chahiye (<code>App</code> <code>&lt;html&gt;</code> render karta hai). <code>options</code> me <code>renderToReadableStream</code> wale hi shared options hain (<code>bootstrapScriptContent</code>, <code>bootstrapScripts</code>, <code>bootstrapModules</code>, <code>formState</code>, <code>identifierPrefix</code>, <code>importMap</code> [Canary only], <code>maxHeadersLength</code> [default 2000], <code>namespaceURI</code>, <code>nonce</code>, <code>onBrowserBailout</code>, <code>onError</code>, <code>progressiveChunkSize</code>), plus Node-specific callbacks: <code>onHeaders</code> — jab React resource hints tay kar chuka ho tab fire hota hai; ek object milta hai jisme <code>Link</code> property me <code>Link</code> header value hai (dhyaan do: yahan ek object hai, <code>renderToReadableStream</code> ki tarah <code>Headers</code> instance nahi), ek HTTP response header ya 103 Early Hints ke liye; koi hints na hon tab bhi call hota hai; <code>maxHeadersLength</code> se capped. <code>onShellReady</code> — initial shell render hone ke turant baad fire hota hai; status code set karo aur streaming shuru karne ke liye yahan <code>pipe</code> call karo; React shell ke baad ki additional content ko inline <code>&lt;script&gt;</code> tags ke saath stream karta hai jo loading fallbacks ko badal dete hain. <code>onShellError</code> — initial shell render karne me error ho to fire hota hai; error milta hai; abhi koi bytes emit nahi hue, aur na <code>onShellReady</code> fire hoga na <code>onAllReady</code>, to tum ek fallback HTML shell output kar sakte ho. <code>onAllReady</code> — saare rendering ke complete hone (shell + additional content) par fire hota hai; crawlers/static generation ke liye <code>onShellReady</code> ki jagah ise use karo; koi progressive loading nahi, stream me final HTML hota hai.",
"Return value do methods wala ek object hai: <code>pipe</code> — HTML ko diye gaye Writable Node.js Stream me output karta hai; streaming ke liye <code>onShellReady</code> me call karo, ya crawlers/static generation ke liye <code>onAllReady</code> me. <code>abort</code> — server rendering ko abort karta hai; baaki client par render hota hai.",
"Kaise kaam karta hai: wahi streaming model jo <code>renderToReadableStream</code> ka hai, callbacks se vyakt: <code>onShellReady</code> = 'shell ready hai, piping shuru karo'; <code>onShellError</code> = 'shell fail ho gayi, ek fallback bhejo'; <code>onAllReady</code> = 'sab ho gaya'. Shell, Suspense streaming, error recovery (shell ke andar → <code>onShellError</code>; shell ke bahar → fallback emit, server par haar, client par retry), status-code ke niyam, <code>didError</code> flag pattern, custom <code>NotFoundError</code> → 404 handling, <code>assetMap</code> handling, aur abort-after-timeout — sab bilkul waise hi kaam karte hain; sirf API ka aakar alag hai (callbacks + <code>pipe</code>/<code>abort</code>, ek awaited stream + <code>allReady</code> + <code>signal</code> ke bajaye).",
"Galtiyan: <code>onShellReady</code> se pehle <code>pipe</code> call karna — stream karne layak abhi kuch arthapurn nahi hai; shell ready nahi hai. <code>onShellError</code> bhool jana — phir ek shell failure ke paas koi fallback response nahi hota. <code>pipe</code> ke baad status code set karna — streaming shuru ho jane ke baad namumkin. <code>onError</code> ka matlab response fail ho gaya samajhna — shell ke bahar ke errors ke liye <code>onError</code> fire hota hai lekin tumhe phir bhi <code>onShellReady</code> milta hai (React client par recover karta hai); status me use reflect karna ho to <code>didError</code> flag use karo. Aur Suspense ke Effect/event-handler fetches ko pakadne ki umeed — sirf <code>use</code> se padhe promises suspend karte hain. Interview ka naksha: <code>onShellReady</code>/<code>onShellError</code>/<code>onAllReady</code> kramshah awaited shell / rejected Promise / <code>stream.allReady</code> se map hote hain; aur server rendering chhodne ke do tareeke hain — <code>abort()</code> banam <code>signal</code> option."],
c:"import { renderToPipeableStream } from 'react-dom/server';\n\n// Route handler ka syntax tumhare backend framework par nirbhar hai\napp.use('/', (request, response) => {\n  const { pipe } = renderToPipeableStream(<App />, {\n    bootstrapScripts: ['/main.js'],\n    onShellReady() {\n      response.setHeader('content-type', 'text/html');\n      pipe(response);\n    }\n  });\n});\n\n// Poora error handling\nconst { pipe } = renderToPipeableStream(<App />, {\n  bootstrapScripts: ['/main.js'],\n  onShellReady() {\n    response.statusCode = 200;\n    response.setHeader('content-type', 'text/html');\n    pipe(response);\n  },\n  onShellError(error) {\n    response.statusCode = 500;\n    response.setHeader('content-type', 'text/html');\n    response.send('<h1>Something went wrong</h1>');\n  },\n  onError(error) {\n    console.error(error);\n    logServerCrashReport(error);\n  }\n});\n\n// 10s ke baad abort\nconst { pipe: pipe2, abort } = renderToPipeableStream(<App />, { /* ... */ });\nsetTimeout(() => { abort(); }, 10000);",
k:"renderToPipeableStream = renderToReadableStream ka Node roop: onShellReady par pipe karo, onShellError par fallback, crawlers ke liye onAllReady."},
{n:118,g:15,t:"resumeToPipeableStream",u:"https://react.dev/reference/react-dom/server/resumeToPipeableStream",
p:["<code>resumeToPipeableStream</code> (<code>react-dom/server</code> se) ek pre-rendered React tree ko HTML ke roop me ek pipeable <b>Node.js Stream</b> me resume karta hai — <code>resume</code> (Web Streams) ka Node.js counterpart. Node servers par partial prerendering ke liye use hota hai. Signature: <code>const {pipe, abort} = await resumeToPipeableStream(reactNode, postponedState, options?)</code>.",
"Parameters: <code>reactNode</code> — wahi React node jiske saath tumne <code>prerender</code> call kiya tha, jaise <code>&lt;App /&gt;</code>; isse poore document ko represent karna chahiye. <code>postponedState</code> — ek prerender API se return hua opaque <code>postpone</code> object, jahan se tumne use store kiya tha wahan se load kiya hua (jaise Redis, ek file, ya S3). Optional <code>options</code>: <code>nonce</code>; <code>onAllReady</code> (saare rendering ke complete hone par fire; crawlers/static generation ke liye <code>pipe</code> ko <code>onShellReady</code> ki jagah yahan call karo; stream me final HTML hoga); <code>onBrowserBailout</code>; <code>onError</code> (koi bhi server error, recoverable ho ya na ho; default sirf <code>console.error</code>; override karo to bhi <code>console.error</code> call karo); <code>onShellReady</code> (shell khatm hone ke turant baad fire; streaming shuru karne ke liye yahan <code>pipe</code> call karo); <code>onShellError</code> (shell render karne me error ho to fire; error milta hai; abhi koi bytes emit nahi hue, aur na <code>onShellReady</code> fire hoga na <code>onAllReady</code>, to tum ek fallback HTML shell output kar sakte ho ya prelude use kar sakte ho).",
"Return value do methods wala ek object hai: <code>pipe</code> — HTML ko diye gaye Writable Node.js Stream me output karta hai; streaming ke liye <code>onShellReady</code> me call karo, ya crawlers/static generation ke liye <code>onAllReady</code> me. <code>abort</code> — server rendering ko abort karta hai; baaki client par render hota hai.",
"Kaise kaam karta hai: resuming <code>renderToReadableStream</code> ki tarah behave karta hai (poori streaming/error kahaani ke liye uska section dekho). <code>resumeToPipeableStream</code> root se dobara render karta hai jab tak use ek aisa component na mil jaye jo poori tarah pre-render nahi hua tha; sirf poori tarah prerendered components (component + children ka prerendering khatm) poori tarah skip ho jate hain. <code>prerender</code> wala section <code>prerenderToNodeStream</code> ke istemal ke examples dikhata hai. Note: ye API Node.js-specific hai; Web Streams wale environments (Deno, modern edge runtimes) ko iski jagah <code>resume</code> use karna chahiye.",
"Galtiyan: <code>resumeToPipeableStream</code> ko bootstrap options pass karna — ye <code>bootstrapScripts</code>, <code>bootstrapScriptContent</code>, ya <code>bootstrapModules</code> accept nahi karta; unhe us <code>prerender</code> call ko do jisne <code>postponedState</code> generate kiya tha (ya bootstrap content ko writable stream me manually inject karo). <code>identifierPrefix</code> pass karna — accept nahi hota; prefix <code>prerender</code> aur <code>resumeToPipeableStream</code> dono me same hona chahiye. Scripts prerender ko dete hue <code>nonce</code> dena — <code>nonce</code> prerender ko nahi diya ja sakta, to yahan sirf tab <code>nonce</code> do jab tum prerender ko scripts nahi de rahe. Ek Web Streams environment me iska istemal — <code>resume</code> use karo. Interview ka naksha: resume joda render jode ko mirror karta hai — <code>resume</code> ↔ <code>resumeToPipeableStream</code>, bilkul jaise <code>renderToReadableStream</code> ↔ <code>renderToPipeableStream</code>; postponed-state mechanics <code>resume</code> wale hi hain — opaque, JSON-serializable, bahar store kiya hua."],
c:"import { resumeToPipeableStream } from 'react-dom/server';\nimport { getPostponedState } from './storage';\n\nasync function handler(request, response) {\n  const postponed = await getPostponedState(request);\n  const { pipe } = resumeToPipeableStream(<App />, postponed, {\n    onShellReady: () => {\n      pipe(response);\n    }\n  });\n}",
k:"resumeToPipeableStream, resume ka Node roop hai — postponed state wahi, sirf stream Node ki aur callbacks wale. Web Streams wale runtime me resume hi use karo."},
{n:119,g:15,t:"renderToString",u:"https://react.dev/reference/react-dom/server/renderToString",
p:["<code>renderToString</code> (<code>react-dom/server</code> se) ek React tree ko ek HTML <b>string</b> ke roop me render karta hai — legacy, non-streaming SSR API. Ye un environments ke liye rakha gaya hai jahan streams nahi hain; streams uplabdh hon to streaming APIs prefer karo. Signature: <code>const html = renderToString(reactNode, options?)</code>.",
"Parameters: <code>reactNode</code> — HTML me render karne ke liye ek React node, jaise <code>&lt;App /&gt;</code>. Optional <code>options</code> me sirf ek option hai: <code>identifierPrefix</code> — <code>useId</code> se generated IDs ke liye React ka use kiya string prefix; ye <code>hydrateRoot</code> ko diye gaye prefix ke same hona chahiye. Return value ek HTML string hai.",
"<b>Seemayein — interview ka classic 'React renderToString se aage kyun badha':</b> (1) <b>Koi streaming nahi:</b> koi HTML bhejne se pehle poora tree render hota hai; koi incremental delivery nahi. (2) <b>Data ka koi intezaar nahi:</b> HTML return karne se pehle ye data load hone ka intezaar nahi karta. (3) <b>Seemit Suspense support:</b> ek component jo suspend karta hai, apni sabse kareebi <code>&lt;Suspense&gt;</code> boundary ka fallback turant render karta hai; asal content sirf client JS load hone ke baad dikhta hai. Ye server par ek React tree ko HTML me render karke client ko bhejne ke liye upyogi ho sakta hai; client par, iski jagah <code>createRoot</code> se ek DOM node me render karo.",
"<b>Migration naksha</b> (interview ki pasandeeda checklist): Node.js → <code>renderToPipeableStream</code>; Deno ya Web Streams wale modern edge runtimes → <code>renderToReadableStream</code>; static generation → Node.js par <code>prerenderToNodeStream</code>, Deno/edge par <code>prerender</code>. <code>renderToString</code> ka istemal sirf tab jaari rakho jab tumhara environment streams support na karta ho.",
"Sabse badi galti: client code me <code>react-dom/server</code> import karna — ye bundle ko phulata hai aur build errors ka kaaran banta hai. Uski jagah, ek DOM node me <code>createRoot</code> aur <code>flushSync</code> se render karo, phir node ka <code>innerHTML</code> padho — ye client-side <code>renderToString</code> workaround hi dikhata hai ki tumhe pata hai <code>react-dom/server</code> browser ko kabhi ship nahi hona chahiye. Doosri galtiyan: Suspense content ke server-side dikhne ki umeed (ye fallback render karta hai; content sirf client hydration ke baad dikhta hai); streaming ya data-waiting behavior ki umeed (dono nahi hote — yahi kaaran hai ki streaming APIs ne iski jagah li); server aur client par alag <code>identifierPrefix</code> — hydration ke dauraan <code>useId</code> mismatches."],
c:"import { renderToString } from 'react-dom/server';\n\nconst html = renderToString(<App />, {\n  identifierPrefix: 'server-',\n});\n\n// Client code me react-dom/server KABHI import mat karo.\n// Uski jagah — div banao, flushSync + createRoot, innerHTML padho:\nimport { createRoot } from 'react-dom/client';\nimport { flushSync } from 'react-dom';\n\nfunction renderToStringClient(element) {\n  const div = document.createElement('div');\n  flushSync(() => {\n    createRoot(div).render(element);\n  });\n  return div.innerHTML;\n}",
k:"renderToString legacy hai: na streaming, na data ka intezaar, Suspense sirf fallback. Naye code me Node par renderToPipeableStream, edge par renderToReadableStream."},
{n:120,g:15,t:"renderToStaticMarkup",u:"https://react.dev/reference/react-dom/server/renderToStaticMarkup",
p:["<code>renderToStaticMarkup</code> (<code>react-dom/server</code> se) ek React tree ko <b>static, non-interactive</b> content ke liye HTML string ke roop me render karta hai — jaise ek static HTML page ya ek email ka HTML generate karna. Iska output hydrate <b>nahi</b> kiya ja sakta. Signature: <code>const html = renderToStaticMarkup(reactNode, options?)</code>.",
"Parameters: <code>reactNode</code> — HTML me render karne ke liye ek React node, jaise <code>&lt;App /&gt;</code>. Optional <code>options</code> me sirf ek option hai: <code>identifierPrefix</code> — <code>useId</code> se generated IDs ke liye string prefix. Return value ek HTML string hai jo hydrate nahi ho sakti — ye plain static HTML hai, interactive banne ke liye nahi bani.",
"<b>renderToString se asal farq sirf hydration ka hai:</b> <code>renderToString</code> ka output hydrate ho sakta hai, <code>renderToStaticMarkup</code> ka output nahi ho sakta. Yahi ek farq matter karta hai. Interactive apps ke liye server par <code>renderToString</code> (ya behtar, ek streaming API) aur client par <code>hydrateRoot</code> use karo. Poori tarah static content ke liye ise use karo — docs ki example ek email ka HTML hai, jahan koi interactivity nahi chahiye.",
"<b>Seemit Suspense support:</b> <code>renderToString</code> ki tarah, ek suspending component apni sabse kareebi <code>&lt;Suspense&gt;</code> boundary ka fallback turant render karta hai — Suspense content ke dikhne ki umeed mat rakho. Galtiyan: <code>renderToStaticMarkup</code> ke output ko hydrate karne ki koshish — ye hydrate nahi ho sakta; docs is baare me spasht hain. Aur client code me <code>react-dom/server</code> import karna — bundle phulata hai; uski jagah ek DOM node me render karo (<code>renderToString</code> wala hi <code>createRoot</code> + <code>flushSync</code> + <code>innerHTML</code> workaround)."],
c:"import { renderToStaticMarkup } from 'react-dom/server';\n\nconst html = renderToStaticMarkup(<App />, {\n  identifierPrefix: 'static-',\n});\n\n// Canonical use case — ek email ka HTML:\n// const emailHtml = renderToStaticMarkup(<EmailTemplate />);",
k:"renderToStaticMarkup = static-only HTML (jaise email), jo kabhi hydrate nahi hoga. Interactive chahiye to renderToString/streaming + hydrateRoot."},
{n:121,g:16,t:"prerender",u:"https://react.dev/reference/react-dom/static/prerender",
p:["<code>prerender</code> (<code>react-dom/static</code> se) ek React tree ko <b>static HTML</b> ke roop me render karta hai — ek Promise jo <code>{ prelude, postponed }</code> par resolve hoti hai — static site generation (SSG) ke liye. <code>renderToString</code> ke ulta, ye resolve hone se pehle <b>saare data</b> ke load hone ka intezaar karta hai; <code>renderToReadableStream</code> ke ulta, ye content load hote hi stream nahi karta. Ise beech me abort bhi kiya ja sakta hai (partial prerendering) aur baad me <code>resumeAndPrerender</code> se jaari rakha ja sakta hai ya <code>resume</code> se resume kiya ja sakta hai. Signature: <code>const { prelude, postponed } = await prerender(reactNode, options?)</code>.",
"<code>reactNode</code> HTML me render karne ke liye ek React node hai, jaise <code>&lt;App /&gt;</code>; isse <b>poore document</b> ko represent karna chahiye (<code>App</code> <code>&lt;html&gt;</code> render karta hai). Optional <code>options</code> ke mukhya hisse: <code>bootstrapScriptContent</code>, <code>bootstrapScripts</code> (<code>&lt;script&gt;</code> tags ke string URLs ki array; wo script shamil karo jo <code>hydrateRoot</code> call karti hai), <code>bootstrapModules</code>, <code>identifierPrefix</code> (<code>hydrateRoot</code> ko diye prefix se match karna chahiye), <code>importMap</code> (<b>Canary only</b>), <code>maxHeadersLength</code> (default 2000), <code>namespaceURI</code>, <code>onBrowserBailout</code>, <code>onError</code> (koi bhi server error par fire; default sirf <code>console.error</code>; override karo to bhi <code>console.error</code> call karo), <code>onHeaders</code> (jab React document ke resource hints tay kar chuka ho tab fire; ek <code>Headers</code> instance milta hai jisme corresponding <code>Link</code> header value hai, taaki tum use prerendered output ke saath save kar sako ya 103 Early Hints response ke roop me bhej sako; koi hints na hon tab bhi call hota hai; <code>maxHeadersLength</code> se capped), <code>progressiveChunkSize</code>, <code>signal</code> (prerender ko abort karne ke liye ek abort signal; adhuri Suspense boundaries prelude me fallbacks ke roop me rehti hain).",
"Return value ek Promise hai jo do properties wale object par resolve hoti hai: <code>prelude</code> — HTML ki ek Readable Web Stream; ise jitni jaldi ho sake browser ko bhejna chahiye (jaise response me pipe karke), ya agar tum use ek file me save kar rahe ho to ek string me padhna chahiye. <code>postponed</code> — postponed boundaries ko represent karne wala ek object; ye JSON-serializable hai aur store kiya ja sakta hai (jaise file ya database); agar prerendering complete ho gayi to ye <code>null</code> hai. Agar non-null hai, to use <code>resumeAndPrerender</code> ko do (static generation khatm karne ke liye) ya <code>resume</code> ko (baaki ko har request par stream karne ke liye). Prerendering fail ho to Promise reject hoti hai — uski jagah ek fallback shell output karo.",
"<b>SSG semantics:</b> <code>renderToString</code> ke ulta, <code>prerender</code> resolve hone se pehle <b>saare</b> data (Suspense/<code>use</code> se fetch kiye) ke load hone ka intezaar karta hai — to prelude me poora page hota hai, static HTML ke roop me save karne ke liye ready. Content load hote hi streaming ke liye iski jagah <code>renderToReadableStream</code> use karo. <b>Partial prerendering:</b> prerender ko abort karo (AbortController + <code>signal</code>); abhi resolve na hui boundaries prelude me fallbacks ke roop me rehti hain, aur <code>postponed</code> state tumhe baad me jaari rakhne deti hai — <code>resumeAndPrerender</code> (static HTML khatm karne ke liye) ya <code>resume</code> (dynamic baaki ko har request par stream karne ke liye). Yahi <b>PPR pattern</b> hai: static shell ko build time par prerender karo, dynamic hisson ko request time par resume karo.",
"<b>Stream poori app ke render hone tak shuru nahi hoti</b> — design se; <code>prerender</code> static HTML pehle se generate karne ke liye hai, progressive streaming ke liye nahi. Agar stream shuru nahi hoti, to ye expected hai — progressive streaming chahiye to <code>renderToReadableStream</code> use karo. <b>Koi <code>nonce</code> option nahi:</b> nonces har request par unique hone chahiye; ek prerender me ek ko shamil karna CSP ke tahat asurakshit hoga, isliye <code>prerender</code> use accept nahi karta. Asset paths ke liye streaming APIs wala hi <code>assetMap</code> pattern hai (use <code>bootstrapScriptContent</code> se <code>window.assetMap</code> me serialize karo, server aur client ko identically pass karo). Errors: <code>onError</code> kisi bhi server error par fire hota hai; shell failure par Promise reject hoti hai. Galtiyan: prelude stream ke jaldi shuru hone ki umeed; ek <code>nonce</code> pass karna (accept nahi hota); <code>postponed</code> ke non-null ho sakne ko bhool jana — abort kiya tha to tumhe use store karna hi hoga (JSON-serializable), warna dynamic hisse kabhi resume nahi ho sakenge; har-request streaming ke liye <code>prerender</code> use karna — <code>renderToReadableStream</code> use karo. Interview ke nakse: <code>prerender</code> banam <code>renderToString</code> — dono static HTML dete hain, lekin <code>prerender</code> saare data ka intezaar karta hai, <code>renderToString</code> nahi karta; <code>prerender</code> banam <code>renderToReadableStream</code> — static-first (poora page, phir stream) banam progressive streaming."],
c:"import { prerender } from 'react-dom/static';\n\n// Basic SSG\nconst { prelude, postponed } = await prerender(<App />, {\n  bootstrapScripts: ['/main.js']\n});\n// `prelude` ko save karo (aur `postponed` ko bhi, agar non-null hai) baad ke liye.\n\n// Abort + partial prerender\nconst controller = new AbortController();\nconst prerenderedApp = prerender(<App />, {\n  signal: controller.signal,\n  onError(error) {\n    if (error instanceof Postponed) {\n      // Expected — jaan-boojh kar postponed kiya gaya\n    } else {\n      console.error(error);\n    }\n  },\n});\nsetTimeout(() => { controller.abort(new Postponed()); });\nconst { prelude: prelude2, postponed: postponed2 } = await prerenderedApp;\n// `prelude` static shell hai; `postponed` tumhe baad me resume karne deta hai.",
k:"prerender SSG ke liye hai: saare data ka intezaar karke { prelude, postponed } deta hai. Abort kiya to postponed ko store karna mat bhoolna — wahi PPR ki kunji hai."},
{n:122,g:16,t:"resumeAndPrerender",u:"https://react.dev/reference/react-dom/static/resumeAndPrerender",
p:["<code>resumeAndPrerender</code> (<code>react-dom/static</code> se) pehle shuru kiye gaye aur <b>abort</b> kiye gaye ek prerender ko static HTML tak jaari rakhta hai — partial-prerendering flow ka 'static generation ko baad me khatm karo' wala hissa. Signature: <code>const { prelude, postponed } = await resumeAndPrerender(reactNode, postponedState, options?)</code>.",
"Parameters: <code>reactNode</code> — wahi React node jo tumne <code>prerender</code> ko diya tha (ya ek pichle <code>resumeAndPrerender</code> ko), jaise <code>&lt;App /&gt;</code>; isse poore document ko represent karna chahiye. <code>postponedState</code> — ek prerender API se return hua opaque <code>postpone</code> object, jahan se tumne use store kiya tha wahan se load kiya hua (jaise Redis, ek file, ya S3). Optional <code>options</code> me sirf teen options hain: <code>signal</code> (prerender ko abort karne ke liye ek abort signal; adhuri Suspense boundaries prelude me fallbacks ke roop me rehti hain), <code>onBrowserBailout</code>, <code>onError</code> (koi bhi server error par fire; default sirf <code>console.error</code>; override karo to bhi <code>console.error</code> call karo).",
"Return value ek Promise hai jo do properties wale object par resolve hoti hai: <code>prelude</code> — HTML ki ek Readable Web Stream (chunks me bhejo, ya poori ek string me padho). <code>postponed</code> — postponed boundaries ko represent karne wala ek object (JSON-serializable; prerendering complete ho gayi ho to <code>null</code>). Agar non-null hai, to use <code>resume</code> ko do (baaki ko har request par stream karne ke liye) ya ek aur <code>resumeAndPrerender</code> ko (static HTML generate karte rehne ke liye). Prerendering fail ho to Promise reject hoti hai — uski jagah ek fallback shell output karo.",
"Kaise kaam karta hai: ye bilkul <code>prerender</code> ki tarah behave karta hai, sirf iske ki ye ek naye prerender ko shuru karne ke bajaye <b>pehle shuru kiye, abort kiye gaye prerender ko jaari</b> rakhta hai. <code>prerender</code> ki tarah ye resolve hone se pehle saare data ke load hone ka intezaar karta hai, to ye SSG ke liye hai; ye bootstrap options accept nahi karta (unhe asal <code>prerender</code> ko do) aur ye ek <code>nonce</code> accept nahi karta (<code>prerender</code> wala hi CSP kaaran). Ise khud bhi abort karke dobara resume kiya ja sakta hai — partial prerendering ko baar-baar jaari rakha ja sakta hai.",
"Galtiyan: bootstrap options ya <code>nonce</code> pass karna — accept nahi hote; dono asal <code>prerender</code> call ke hain (aur <code>nonce</code> prerendered output ke liye varjit hai). Ek taaza prerender shuru karne ke liye iska istemal — <code>prerender</code> use karo; <code>resumeAndPrerender</code> ko ek pehle ke aborted prerender se mila <code>postponedState</code> chahiye. <code>postponed</code> ke phir bhi non-null ho sakne ko bhool jana — dobara abort hua to use phir store karo. Interview ka naksha: resume parivaar — <code>resume</code> (har request par stream) banam <code>resumeAndPrerender</code> (static HTML khatm karna) — same <code>postponedState</code>, alag manzil. Aur zanjeer dohra sakti hai: <code>prerender</code> → <code>resumeAndPrerender</code> → <code>resumeAndPrerender</code> → … jab tak <code>postponed</code> <code>null</code> na ho jaye."],
c:"import { resumeAndPrerender } from 'react-dom/static';\n\n// Ek aborted prerender ko jaari rakho (state storage se load hua)\nconst { prelude, postponed } = await resumeAndPrerender(<App />, postponedState);\n\n// Agar ye dobara abort hua, to `postponed` resume() ko ja sakta hai\n// ya ek aur resumeAndPrerender() ko.",
k:"resumeAndPrerender aborted prerender ko static HTML tak poora karta hai — bootstrap options yahan nahi chalte, wo asal prerender ke the."},
{n:123,g:16,t:"prerenderToNodeStream",u:"https://react.dev/reference/react-dom/static/prerenderToNodeStream",
p:["<code>prerenderToNodeStream</code> (<code>react-dom/static</code> se) ek React tree ko static HTML ke roop me ek <b>Node.js Stream</b> me render karta hai — <code>prerender</code> (Web Streams) ka Node.js counterpart. Node servers par static site generation ke liye use hota hai. Signature: <code>const { prelude, postponed } = await prerenderToNodeStream(reactNode, options?)</code>.",
"<code>reactNode</code> HTML me render karne ke liye ek React node hai, jaise <code>&lt;App /&gt;</code>; isse <b>poore document</b> ko represent karna chahiye (<code>App</code> <code>&lt;html&gt;</code> render karta hai). Optional <code>options</code> <code>prerender</code> wale hi hain (<code>bootstrapScriptContent</code>, <code>bootstrapScripts</code>, <code>bootstrapModules</code>, <code>identifierPrefix</code>, <code>importMap</code> [Canary only], <code>maxHeadersLength</code> [default 2000], <code>namespaceURI</code>, <code>onBrowserBailout</code>, <code>onError</code>, <code>progressiveChunkSize</code>, <code>signal</code>), is apvaad ke saath: <code>onHeaders</code> — jab React document ke resource hints tay kar chuka ho tab fire hota hai; ek object milta hai jisme <code>Link</code> property me <code>Link</code> header value hai (dhyaan do: yahan ek object hai, <code>prerender</code> ki tarah <code>Headers</code> instance nahi), ek HTTP response header ya 103 Early Hints ke liye; koi hints na hon tab bhi call hota hai; <code>maxHeadersLength</code> se capped.",
"Return value ek Promise hai jo do properties wale object par resolve hoti hai: <code>prelude</code> — HTML ki ek Node.js Stream; use response me pipe karo (<code>prelude.pipe(response)</code>), ya agar tum use ek file me save kar rahe ho to ek string me padho: <code>data</code> events ikatthe karo aur <code>end</code> par resolve karo (<code>error</code> par reject). <code>postponed</code> — postponed boundaries ko represent karne wala ek object (JSON-serializable; prerendering complete ho gayi ho to <code>null</code>). Agar non-null hai, to use <code>resumeToPipeableStream</code> ko do (baaki ko har request par stream karne ke liye) ya <code>resumeAndPrerenderToNodeStream</code> ko (static HTML generate karte rehne ke liye). Prerendering fail ho to Promise reject hoti hai — uski jagah ek fallback shell output karo.",
"Kaise kaam karta hai: <code>prerender</code> wale hi SSG semantics — resolve hone se pehle <b>saare</b> data ke load hone ka intezaar karta hai; prelude poori app ke render hone tak shuru nahi hoti (design se — progressive streaming ke liye <code>renderToPipeableStream</code> use karo); abort kiya ja sakta hai (AbortController + <code>signal</code>; adhuri Suspense boundaries fallbacks ke roop me rehti hain) aur baad me <code>resumeToPipeableStream</code> ya <code>resumeAndPrerenderToNodeStream</code> se jaari rakha ja sakta hai. Koi <code>nonce</code> option nahi (<code>prerender</code> wala hi CSP kaaran). Galtiyan: prelude stream ke jaldi shuru hone ki umeed; ek <code>nonce</code> pass karna (accept nahi hota — nonces har request par unique hone chahiye); <code>postponed</code> ke non-null ho sakne ko bhool jana — abort kiya tha to use store karo (JSON-serializable), warna dynamic hisse kabhi resume nahi ho sakenge. Interview ke nakse: <code>prerender</code> ↔ <code>prerenderToNodeStream</code>, <code>renderToReadableStream</code> ↔ <code>renderToPipeableStream</code> ko mirror karta hai — same engine, Web Streams banam Node streams; aur <code>onHeaders</code> ke aakar ka farq (ek <code>Link</code> property wala object banam <code>Headers</code> instance) dono parivaaron ke beech ki pehchan hai."],
c:"import { prerenderToNodeStream } from 'react-dom/static';\n\n// Route handler ka syntax tumhare backend framework par nirbhar hai\napp.use('/', async (request, response) => {\n  const { prelude } = await prerenderToNodeStream(<App />, {\n    bootstrapScripts: ['/main.js']\n  });\n  prelude.pipe(response);\n});\n\n// Ek string me padho (jaise, ek file me save karne ke liye)\nconst { prelude: prelude2, postponed } = await prerenderToNodeStream(<App />, {\n  bootstrapScripts: ['/main.js']\n});\nconst html = await new Promise((resolve, reject) => {\n  let data = '';\n  prelude2.on('data', (chunk) => { data += chunk; });\n  prelude2.on('end', () => resolve(data));\n  prelude2.on('error', reject);\n});",
k:"prerenderToNodeStream, prerender ka Node roop hai — SSG semantics wahi, sirf prelude Node stream hai aur onHeaders ek object deta hai, Headers instance nahi."},
{n:124,g:16,t:"resumeAndPrerenderToNodeStream",u:"https://react.dev/reference/react-dom/static/resumeAndPrerenderToNodeStream",
p:["<code>resumeAndPrerenderToNodeStream</code> (<code>react-dom/static</code> se) pehle shuru kiye gaye aur <b>abort</b> kiye gaye ek prerender ko static HTML tak, ek <b>Node.js Stream</b> me, jaari rakhta hai — <code>resumeAndPrerender</code> (Web Streams) ka Node.js counterpart. Signature: <code>const { prelude, postponed } = await resumeAndPrerenderToNodeStream(reactNode, postponedState, options?)</code>.",
"Parameters: <code>reactNode</code> — wahi React node jo tumne <code>prerender</code> ko diya tha (ya ek pichle <code>resumeAndPrerenderToNodeStream</code> ko), jaise <code>&lt;App /&gt;</code>; isse poore document ko represent karna chahiye. <code>postponedState</code> — ek prerender API se return hua opaque <code>postpone</code> object. Docs ki example use <code>JSON.parse(postponedState)</code> ke roop me pass karti hai — postponed state JSON ke roop me store hoti hai aur wapas parse ki jati hai. Optional <code>options</code> me sirf teen options hain: <code>signal</code> (prerender ko abort karne ke liye ek abort signal; adhuri Suspense boundaries prelude me fallbacks ke roop me rehti hain), <code>onBrowserBailout</code>, <code>onError</code> (koi bhi server error par fire; default sirf <code>console.error</code>; override karo to bhi <code>console.error</code> call karo).",
"Return value ek Promise hai jo do properties wale object par resolve hoti hai: <code>prelude</code> — HTML ki ek Node.js Stream; use response me pipe karo (<code>prelude.pipe(writable)</code>), ya <code>data</code> events ikatthe karke ek string me padho (<code>end</code> par resolve, <code>error</code> par reject). <code>postponed</code> — postponed boundaries ko represent karne wala ek object (JSON-serializable; prerendering complete ho gayi ho to <code>null</code>). Agar non-null hai, to use <code>resumeToPipeableStream</code> ko do (baaki ko har request par stream karne ke liye) ya ek aur <code>resumeAndPrerenderToNodeStream</code> ko (static HTML generate karte rehne ke liye). Prerendering fail ho to Promise reject hoti hai — uski jagah ek fallback shell output karo.",
"Kaise kaam karta hai: ye bilkul <code>prerenderToNodeStream</code> ki tarah behave karta hai, sirf iske ki ye ek naye prerender ko shuru karne ke bajaye <b>pehle shuru kiye, abort kiye gaye prerender ko jaari</b> rakhta hai. Uski tarah ye resolve hone se pehle saare data ke load hone ka intezaar karta hai, to ye SSG ke liye hai; ye bootstrap options accept nahi karta (unhe asal <code>prerender</code> call ko do) aur ye ek <code>nonce</code> accept nahi karta (wahi CSP kaaran). Ise khud bhi abort karke dobara resume kiya ja sakta hai — partial prerendering ko baar-baar jaari rakha ja sakta hai.",
"Galtiyan: bootstrap options ya <code>nonce</code> pass karna — accept nahi hote; dono asal <code>prerender</code> call ke hain. Postponed state ko ek raw JSON string ke roop me pass karna — example use pehle parse karti hai (<code>JSON.parse(postponedState)</code>); check karo ki tumhara storage kya return karta hai. Ek taaza prerender shuru karne ke liye iska istemal — <code>prerenderToNodeStream</code> use karo; ise ek pehle ke aborted prerender se mila <code>postponedState</code> chahiye. Interview ka poora resume grid: <code>resume</code> / <code>resumeToPipeableStream</code> (har request par stream) banam <code>resumeAndPrerender</code> / <code>resumeAndPrerenderToNodeStream</code> (static HTML khatm karna) — Web Streams bayein taraf, Node streams dayein taraf. Aur zanjeer tab tak dohra sakti hai jab tak <code>postponed</code> <code>null</code> na ho jaye."],
c:"import { resumeAndPrerenderToNodeStream } from 'react-dom/static';\n\n// Ek aborted prerender ko jaari rakho (state storage se load hua, JSON se parse kiya)\nconst { prelude, postponed } = await resumeAndPrerenderToNodeStream(\n  <App />,\n  JSON.parse(postponedState)\n);\nprelude.pipe(writable);\n\n// Agar dobara abort hua, to `postponed` resumeToPipeableStream ko ja sakta hai\n// ya ek aur resumeAndPrerenderToNodeStream ko.",
k:"Resume grid ka aakhri khana: Node streams par static HTML poora karna. Postponed state JSON se parse karke do, aur bootstrap options yahan bhi nahi chalte."},
{n:125,g:17,t:"Configuration",u:"https://react.dev/reference/react-compiler/configuration",
p:["Ye React Compiler ke saare configuration options ki top-level reference hai — options <code>babel-plugin-react-compiler</code> ko <code>babel.config.js</code> me pass hote hain. Page ki apni salah: zyadaatar apps ke liye defaults bina kisi config ke kaam karte hain; ye options khaas zarooraton ke liye advanced hain.",
"Options paanch samoohon me bante hain: <b>Compilation Control</b> (compiler kya optimize kare aur functions kaise chune), <b>Version Compatibility</b> (generated code kis React version ko target kare), <b>Error Handling</b> (code Rules of React tode to kya ho), <b>Debugging</b> (compilation ki logging/analysis) aur <b>Feature Flags</b> (compiled code ka runtime gating).",
"<code>compilationMode</code> function chunne ki strategy hai: saare functions, sirf annotated wale, ya intelligent detection. Example value <code>'annotation'</code> — sirf <code>\"use memo\"</code> wale functions compile karo. <code>target</code> React version hai: <code>'17'</code>, <code>'18'</code> ya <code>'19'</code>; React 17/18 ke liye <code>react-compiler-runtime</code> package bhi chahiye hota hai.",
"<code>panicThreshold</code> tay karta hai ki build fail ho ya problematic components skip ho jayein. <code>'none'</code> matlab errors wale components ko skip kar do, build mat roko — page production ke liye yahi recommend karta hai. <code>logger</code> se custom logging milti hai: <code>logEvent(filename, event)</code> har compilation event par fire hota hai, jaise <code>event.kind === 'CompileSuccess'</code>.",
"<code>gating</code> runtime feature flags ke liye hai — A/B testing ya gradual rollout ke liye: <code>{ source: 'my-feature-flags', importSpecifierName: 'isCompilerEnabled' }</code>. Galtiyan: React 19 par bina zaroorat config jodna (zero config kaafi hai), React 17/18 par <code>react-compiler-runtime</code> bhoolna, production me sakht <code>panicThreshold</code> rakhna (ek kharab component poori build gira dega), aur option ke naam ki galti — <code>compileMode</code> likh diya to config chup chaap ignore ho jati hai (usi ke liye <code>config</code> lint hai)."],
c:"// babel.config.js — React 19 par default (koi config nahi chahiye)\nmodule.exports = {\n  plugins: ['babel-plugin-react-compiler']\n};\n\n// Incremental adoption\n{\n  compilationMode: 'annotation' // Sirf \"use memo\" functions compile karo\n}\n\n// React 17/18\n{\n  target: '18' // ya '17' — react-compiler-runtime bhi install karo\n}\n\n// Production error handling\n{\n  panicThreshold: 'none' // Error wale components skip karo, build mat fail karo\n}",
k:"React 19 par zero config hi sahi shuruaat hai. panicThreshold: 'none' production me build ko ek kharab component se bachata hai — badle me wo component bina optimization ke reh jata hai."},
{n:126,g:17,t:"Directives",u:"https://react.dev/reference/react-compiler/directives",
p:["Directives khaas string literals hain — <code>\"use memo\"</code> aur <code>\"use no memo\"</code> — jo function body ya module ke sabse upar rakhne se tay hota hai ki wo function compile hoga ya nahi. Ye compiler ka sabse bareek, per-function override hai.",
"<code>\"use memo\"</code> function ko compilation me <b>opt-in</b> karta hai; <code>\"use no memo\"</code> use compilation se <b>opt-out</b> karta hai. Function-level directive function body ka pehla statement hota hai; module-level directive file ke bilkul upar hota hai aur us file ke saare functions par lagu hota hai. Function-level directive module-level ko override kar deta hai.",
"<code>compilationMode</code> ke saath rishta: <code>annotation</code> mode me sirf <code>\"use memo\"</code> wale functions compile hote hain; <code>infer</code> mode me compiler khud tay karta hai aur directives uske faisle override karte hain; <code>all</code> mode me sab compile hota hai aur <code>\"use no memo\"</code> khaas functions ko bahar rakhta hai.",
"Galtiyan: directive pehla statement na ho ya spelling galat ho to wo bas ek bekaar string ban jati hai — ignore ho jati hai. Module directive imports ke baad rakha to kaam nahi karega — imports se pehle hona chahiye. <code>\"use no memo\"</code> ke baad bhi compilation ho raha ho to <code>ignoreUseNoForget</code> setting check karo.",
"Page directives ko 'escape hatches' kehta hai — har jagah directives lagane ke bajaye project-level <code>compilationMode</code> config pasand karo. Aur <code>\"use no memo\"</code> lagao to wajah document karo (TODO + tracking issue ke saath) aur use hatane ka plan banao — opt-outs asthayi (temporary) hone chahiye. Ye pattern <code>\"use client\"</code> / <code>\"use server\"</code> jaisa hi hai: string literal jiska arth hai, comment nahi."],
c:"// Compilation me opt-in\nfunction OptimizedComponent() {\n  \"use memo\";\n  return <div>Ye optimize hoga</div>;\n}\n\n// Compilation se opt-out\nfunction UnoptimizedComponent() {\n  \"use no memo\";\n  return <div>Ye optimize nahi hoga</div>;\n}\n\n// Module level — saare functions compiled, ek exception\n\"use memo\";\nfunction Component1() { return <div>Compiled</div>; }\nfunction Component3() {\n  \"use no memo\"; // Module directive ko override karta hai\n  return <div>Compiled nahi</div>;\n}",
k:"Gradual adoption ki kahani: annotation mode + stable components par \"use memo\" se shuru karo, phir infer par jao aur \"use no memo\" sirf problematic functions par — wajah likh kar, asthayi taur par."},
{n:127,g:17,t:"Compiling Libraries",u:"https://react.dev/reference/react-compiler/compiling-libraries",
p:["Ye guide un <b>library authors</b> ke liye hai jo npm par pehle se compiled (optimized) code bhejna chahte hain, taaki unke users ko React Compiler ka fayda mile bhale hi users khud compiler na use karte hon.",
"Author apni library ki build me <code>babel-plugin-react-compiler</code> jodta hai (devDependency ke roop me) aur publish karne se pehle compile karta hai. Page ke bataye fayde: saare users ko performance improvement, users ko koi configuration nahi karni padti, aur user ke build setup se farq nahi padta — behaviour consistent rehta hai.",
"Steps: (1) plugin devDependency ke roop me install karo — <code>npm install -D babel-plugin-react-compiler@latest</code> — aur <code>babel.config.js</code> me jodo. (2) React &lt; 19 ke liye backwards compatibility: <code>react-compiler-runtime</code> ko <b>direct dependency</b> ke roop me install karo (devDependency nahi) aur <code>target</code> ko sabse purane supported React version par rakho (<code>'17'</code> ya <code>'18'</code>). (3) Peer dependencies usi hisaab se declare karo.",
"Testing strategy: library ko <b>compilation ke saath aur bina compilation ke</b> — dono tarah test karo. Maujooda test suite compiled code par chalao aur ek alag test configuration rakho jo compiler ko bypass kare, taaki compilation se hone wali toot-phoot pakdi jaye.",
"Sabse badi galtiyan: library React 17/18 par tootti hai — check karo ki <code>react-compiler-runtime</code> dependency ke roop me hai, <code>target</code> minimum supported version se milta hai, aur runtime published bundle me shamil hai. Users ko 'Cannot find module react-compiler-runtime' mile to aksar kaaran yahi hai ki runtime galti se devDependencies me chala gaya. Doosre Babel plugins se takraav ho to compiler plugin ko plugin list me pehle rakho."],
c:"// package.json — runtime ko dependencies me rakho, devDependencies me nahi\n{\n  \"dependencies\": { \"react-compiler-runtime\": \"^1.0.0\" },\n  \"peerDependencies\": { \"react\": \"^17.0.0 || ^18.0.0 || ^19.0.0\" }\n}\n\n// babel.config.js — library ki apni build me compiler\n// target = sabse purana supported React version\n{\n  target: '17'\n}",
k:"Library compile karne ka matlab: optimization published code ke saath safar karti hai, user ko zero setup. Aur yaad rakho — react-compiler-runtime runtime par chahiye, isliye dependencies me jayega."},
{n:128,g:18,t:"exhaustive-deps",u:"https://react.dev/reference/eslint-plugin-react-hooks/lints/exhaustive-deps",
p:["Ye sabse mashhoor React Hooks lint hai: ye jaanchta hai ki <code>useEffect</code>, <code>useMemo</code> aur <code>useCallback</code> ke dependency arrays me andar istemal hone wale <b>saare</b> values maujood hon. Ek dependency chhooti to React us value ke badalne par effect dobara nahi chalega / value dobara nahi banayega — yehi stale closure ki jad hai.",
"Rule hook ke body ka static analysis karta hai, andar use hue har reactive value (props, state, component me bane variables/functions) ko ikattha karta hai, aur har ek ko dependency array me hona lazmi banata hai.",
"Page ki sabse badi salah: linter se ladkar effect ke chalne ka samay control karne ki koshish mat karo. Agar dependencies ke baare me jhooth bolne ka man kare, to code ko restructure karo. Effect bahari systems ke saath synchronize karte hain; dependency array React ko batata hai ki effect <b>kya</b> use karta hai, ye nahi ki wo <b>kab</b> chale.",
"Function ko dependency banana infinite loop bana sakta hai: har render par banti nayi function (<code>const logItems = () =&gt; {...}</code>) dep banegi to effect baar-baar chalega. Chaar ilaaj: (a) effect hi mat use karo — event handler se call karo; (b) side effect na ho to render ke dauraan derive karo; (c) <code>useCallback</code> se stabilize karo; (d) logic ko seedha effect ke andar le jao.",
"'Sirf mount par ek baar chalana hai' wala case bhi flag hota hai: <code>useEffect(() =&gt; { sendAnalytics(userId); }, [])</code>. Salah: dep shamil karo (<code>[userId]</code>), ya agar sach me ek hi baar chalana hai to ref guard (<code>sent.current</code>) use karo. Options: shared ESLint setting <code>additionalEffectHooks</code> (6.1.1+, <code>settings.react-hooks</code> ke neeche regex, jaise <code>\"(useMyEffect|useCustomEffect)\"</code>) custom hooks ko bhi jaanchta hai; purana rule-level <code>additionalHooks</code> diya gaya ho to wahi precedence leta hai."],
c:"// ❌ Dependency chhooti — stale closure\nuseEffect(() => { console.log(count); }, []); // 'count' missing\nuseEffect(() => { fetchUser(userId); }, []);  // 'userId' missing\nuseMemo(() => items.sort(sortOrder), [items]); // 'sortOrder' missing\n\n// ✅ Saari dependencies shamil\nuseEffect(() => { console.log(count); }, [count]);\nuseEffect(() => { fetchUser(userId); }, [userId]);",
k:"Dependency array jhooth nahi bolta: effect jo use karta hai, wahi likho. Effect ko kab chalana hai ye control karna hai to code ka design badlo, array nahi."},
{n:129,g:18,t:"rules-of-hooks",u:"https://react.dev/reference/eslint-plugin-react-hooks/lints/rules-of-hooks",
p:["Ye lint jaanchta hai ki components aur hooks Rules of Hooks ka paalan karen. React state ko hooks ke <b>call order</b> se sambhalta hai — har render par wahi hooks, usi order me call hone chahiye.",
"Jo kuch bhi hook call order badal sakta hai, wo flag hota hai: conditions (<code>if</code>/<code>else</code>, ternary, <code>&amp;&amp;</code>/<code>||</code>) me hooks, loops (<code>for</code>, <code>while</code>, <code>do-while</code>) me hooks, early return ke baad hooks, callbacks/event handlers me hooks, async functions me hooks, class methods me hooks, aur module level par hooks. Inse state mismatch hota hai aur 'Rendered fewer/more hooks than expected' errors aate hain.",
