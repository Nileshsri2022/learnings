{n:38,g:3,t:"Theory",u:"https://www.typescriptlang.org/docs/handbook/modules/theory.html",
p:["Purane JS me modules nahi the — saare <code>&lt;script&gt;</code> ek hi GLOBAL scope share karte the. Module system har file ko apna scope deta hai + code share karne ka tareeqa. TS kai systems emit karta hai; docs ka focus do par hai: <b>ESM</b> (language built-in) aur <b>CJS</b> (Node ka original system).",
"TS ka kaam: compile time par runtime errors pakadna. Ek import ke liye compiler ko host se jude kai sawaalon ke jawab chahiye — output kahan load hoga, kis format me, lookup kahan hoga, naam ko kya type milega. <b>Host</b> = wo system jo output consume karta hai (Node runtime, bundler, browser+server). TS khud host NAHI hai, aur transpiler bhi host nahi hota agar wo imports na chhede.",
"Isiliye TS lagbhag hamesha <b>OUTPUT JS files</b> ke terms me sochta hai, input TS files ke nahi (esbuild/Bun jaise TS-first runtimes apwaad hain). Teen kaam: valid output format me compile karna, output imports resolve honge ye pakka karna, imported naamo ke types jaanna.",
"<b><code>module</code> option</b> host ki ummeed batata hai — emitted format ke saath-saath format detection, cross-format import rules, <code>import.meta</code>/top-level await ki availability bhi. Node projects ke liye <b>sirf <code>node16</code>/<code>nodenext</code> sahi hain</b> — <code>esnext</code>/<code>commonjs</code> galat hain, chahe emitted JS same dikhe, kyunki type checking alag hoti hai.",
"<b>Node format detection:</b> <code>.mjs</code> hamesha ESM, <code>.cjs</code> hamesha CJS, <code>.js</code> nearest package.json ke <code>\"type\"</code> par nirbhar. Galat format = crash. Input files par bhi wahi algorithm (<code>.mts</code>/<code>.cts</code>).",
"Input syntax aur output format <b>decoupled</b> hain — ESM <code>import</code> CJS <code>require</code> ban kar emit ho sakta hai. <b><code>verbatimModuleSyntax</code></b> (5.0) us form me likhne par majboor karta hai jo sabse kam transform ho.",
"<b>Interop ke teen camps:</b> ESM-only (browsers), bundler-like (Babel ke permissive rules — de facto standard), Node.js (apne sakht rules). TS <code>node16/nodenext</code> par Node rules enforce karta hai; baaki settings + <code>esModuleInterop</code> bundler-like dete hain.",
"<b>Specifiers transform NAHI hote</b> — import string as-written emit hoti hai (TS 5.7 ka <code>rewriteRelativeImportExtensions</code> apwaad). <b>Resolution host-defined hai</b> — <code>moduleResolution</code> modes: <code>classic</code> (naye projects me mat use karo, TS 6.0 me deprecation scheduled), <code>node10</code> (purana Node), <code>node16</code>/<code>nodenext</code>, <code>bundler</code> (module: esnext ke saath).",
"Declaration files: compiler pehle TS/.d.ts files dhoondta hai. Extension mapping yaad rakho: <code>.d.ts ↔ .js ↔ .ts</code>, <code>.d.mts ↔ .mjs ↔ .mts</code>, <code>.d.cts ↔ .cjs ↔ .cts</code>. <b>Library authors</b> ke liye strictest raasta: <code>module: node18</code> — Node-compatible code bundlers me bhi lagbhag hamesha chalta hai; <code>moduleResolution: bundler</code> 'infectious' hai (locally pass, Node me fail)."],
c:"// Node detection: .mjs=ESM, .cjs=CJS, .js=package.json \"type\" par\n// Sirf ye do Node ke liye sahi:\n// \"module\": \"node16\"  ya  \"module\": \"nodenext\"",
k:"Host samjho, output ke terms me socho, Node par node16/nodenext hi lagao — theory ka saar yahi hai."},
{n:39,g:3,t:"Choosing Compiler Options",u:"https://www.typescriptlang.org/docs/handbook/modules/guides/choosing-compiler-options.html",
p:["<b>Ek tsconfig = ek environment.</b> Server, DOM, worker, tests, shared code — har ek ka apna tsconfig, project references se jude hue. Ye guide har tsconfig ke liye ek baar use karo.",
"<b>App + bundler:</b> <code>module: esnext</code>, <code>moduleResolution: bundler</code>, <code>noEmit: true</code>, <code>verbatimModuleSyntax: true</code>, <code>allowImportingTsExtensions: true</code>. Bundler projects me abhi <code>\"type\": \"module\"</code> ya <code>.mts</code> mat use karo — kuch bundlers ki interop TS analyze nahi kar sakta.",
"<b>App jo Node me compile + run ho:</b> <code>module: nodenext</code> (moduleResolution, esModuleInterop, target khud imply ho jate hain) + <code>verbatimModuleSyntax: true</code>. ESM emit karna ho to <code>\"type\": \"module\"</code> ya <code>.mts</code>.",
"ts-node Node wale settings par chalta hai; <b>tsx bundler jaisa behave karta hai</b> — bundler settings use karo. Browser ESM bina bundler ke: <code>nodenext</code> + <code>paths</code> se approximate karo (import maps ke saath).",
"<b>Library alag jaanwar hai:</b> app ek known host ke liye banti hai, library har consumer ke host par chalti hai — isiliye <b>strictest settings</b>: <code>module: node18</code>, <code>target</code> = sabse purana supported version, <code>strict: true</code>, <code>verbatimModuleSyntax: true</code>, <code>declaration: true</code>, <code>sourceMap</code>/<code>declarationMap: true</code>, alag <code>rootDir: src</code>/<code>outDir: dist</code>.",
"Libraries ko bundle karna risky hai: TS split resolution model nahi kar sakta, aur .d.ts files bhi bundle honi chahiye warna Node users ko errors + <code>any</code> infection milta hai. Behtar: library bundle hi mat karo.",
"<b>Dual-emit</b> (CJS+ESM dono) ek type-check se dono outputs ki guarantee nahi de sakta — publish se pehle saare output bundles test + analyze karo. <code>verbatimModuleSyntax</code> dual emit se fundamentally incompatible hai."],
c:"// Library template:\n{ \"compilerOptions\": {\n  \"module\": \"node18\", \"target\": \"es2020\", \"strict\": true,\n  \"verbatimModuleSyntax\": true, \"declaration\": true,\n  \"sourceMap\": true, \"declarationMap\": true,\n  \"rootDir\": \"src\", \"outDir\": \"dist\" } }",
k:"Bundler app, Node app, library — teen templates yaad kar lo; library hamesha strictest."},
{n:40,g:3,t:"Reference",u:"https://www.typescriptlang.org/docs/handbook/modules/reference.html",
p:["TS standard ESM syntax ke saath CJS ke kai forms (JS files me) aur TS-specific extensions pehchanta hai. Exported types named exports me reh sakte hain; namespace import se types sirf TYPE position me milte hain.",
"<b>Type-only imports/exports:</b> TS type-position me hi use hone wale imports ko default se elide kar deta hai; <code>import type</code>/<code>export type</code>/inline <code>type</code> elision ki GUARANTEE dete hain. <code>import type</code> wala value sirf non-emitting positions me use ho sakta hai; type-only import ek saath default + named nahi rakh sakta.",
"<b><code>import()</code> types:</b> <code>type X = import(\"fs\").WriteFileOptions</code> — bina import declaration ke kisi module ka type refer karo (JSDoc me khaas upyogi). <code>export =</code> / <code>import = require()</code> CJS ke <code>module.exports</code>/<code>require</code> ke analog hain.",
"<b>Ambient modules:</b> script file me <code>declare module \"path\" {…}</code> runtime-provided module declare karta hai; module file me wahi syntax <b>module augmentation</b> ban jata hai — same syntax, alag matlab! Wildcard patterns (<code>declare module \"*.html\"</code>) custom loaders ke liye.",
"<b><code>module</code> modes ki sachchai:</b> <code>node16/node18/nodenext</code> Node ke pure dual-format system ko describe karte hain — per-file detection se ESM ya CJS emit. node18 import attributes jodta hai, nodenext <code>require</code>(ESM) bhi. <code>preserve</code> (5.4) har statement ka format as-written rakhta hai — bundlers/Bun ke liye best. <code>commonjs</code>/<code>amd</code>/<code>umd</code>/<code>system</code> naye projects ke liye nahi.",
"<b>Resolution detail:</b> extension substitution (<code>/mod.js</code> → <code>.ts/.tsx/.d.ts</code> koshish), Node ESM <code>import</code> me extensionless/directory imports NAHI chalte (<code>require</code> me chalte hain). <code>paths</code> sirf TS ko batata hai — <b>emit par koi asar nahi</b>; libraries <code>paths</code> publish kabhi na karein.",
"<code>package.json</code> <b><code>\"exports\"</code></b> maujud ho to unlisted subpaths BLOCK ho jate hain (<code>\"main\"</code> bhi nahi chalega); TS hamesha <code>\"types\"</code> + <code>\"default\"</code> conditions match karta hai. <code>\"typesVersions\"</code> TS-version ke hisaab se redirect karta hai — lekin <code>\"exports\"</code> padha jaye to ye nahi padha jata. <code>\"imports\"</code> (<code>#</code>-prefixed) aur self-name imports bhi supported hain.",
"<code>moduleResolution: bundler</code> ko <code>module: esnext/preserve</code> ke saath pair karo; <code>node10</code> aur <code>classic</code> ab use mat karo."],
c:"type WriteFileOptions = import(\"fs\").WriteFileOptions;\ndeclare module \"*.html\" { const content: string; export default content; }\n// exports field ka asar:\n// { \"exports\": { \".\": { \"types\": \"./index.d.ts\", \"default\": \"./index.js\" } } }\n// → unlisted subpath import = blocked, chahe file exist kare",
k:"Type-only elision, ambient-vs-augmentation, node modes ka table, exports-blocks-subpaths — reference ka core."},
{n:41,g:3,t:"ESM/CJS Interoperability",u:"https://www.typescriptlang.org/docs/handbook/modules/appendices/esm-cjs-interop.html",
p:["<b>2015 ki problem:</b> transpilers ESM ko CJS me badalte the, lekin CJS ke <code>module.exports = function(){}</code> jaisi shape ke liye koi ESM export exist hi nahi karta. Interop behavior kahin specified nahi tha — transpilers ko GUESS karna pada.",
"Transpilers ka hal: default import ko poore <code>exports</code> se link karna, aur transpiled modules ko <code>__esModule</code> flag se pehchanna (<code>__esModule ? mod.default : mod</code>). Traceur se shuru, Babel/Webpack ne अपनाया.",
"<b><code>allowSyntheticDefaultImports</code></b> (TS 1.8) sirf type-checking badalta tha, emit nahi — isiliye incomplete aur <code>--module commonjs</code> + Node par khatarnak (build error chhup gaya, runtime crash bacha).",
"<b><code>esModuleInterop</code></b> (TS 2.7) ne checking + emit dono theek kiye: <code>__importDefault</code>/<code>__importStar</code> helpers, namespace imports hamesha objects. TS, uska emit aur transpiler ecosystem ek hi scheme par aa gaye. <code>importHelpers</code> se helpers <code>tslib</code> se aa sakte hain.",
"<b>Node ki apni dikkat:</b> Node hamesha synthetic default banata hai — <b>'double default' problem</b> (Node ESM me <code>pkg.default()</code>, transpiled me <code>pkg()</code>). Named exports static analysis se bante hain — runtime par banaye gaye exports (<code>exports[\"wor\"+\"d\"]</code>) Node me MISSING rahenge. Node v22.12 se pehle CJS, ESM ko <code>require</code> nahi kar sakta tha.",
"<b>Conclusions:</b> sahi <code>module</code> option sabse critical hai. CJS apps hamesha <code>esModuleInterop</code> on rakhein; <code>allowSyntheticDefaultImports</code> akele (bina esModuleInterop) avoid karo. <b>Libraries default exports se bachein</b> — access har consumer par alag banta hai; single main export ke liye <code>export =</code>, warna named exports."],
c:"// __esModule ka khel:\n// exports.__esModule = true; exports.default = fn;\n// transpiled import:  mod.__esModule ? mod.default : mod\n// Node ESM import:    hamesha synthetic default = poora exports\n// => pkg() vs pkg.default() — 'double default' problem",
k:"__esModule ki kahani, double-default, aur 'library me default export mat do' — interop ka final sabak."},
{n:42,g:4,t:"ASP.NET Core",u:"https://www.typescriptlang.org/docs/handbook/asp-net-core.html",
p:["<b>Legacy note:</b> ye tutorial Visual Studio 2015/2017 ke zamane ka hai — setup walkthrough ke roop me padho, aaj ki best practice ke roop me nahi (modern setups <code>dotnet new</code> + Vite/esbuild use karte hain).",
"Flow: Empty template se ASP.NET Core Web App banao → NuGet se <code>Microsoft.AspNetCore.StaticFiles</code> aur <code>Microsoft.TypeScript.MSBuild</code> → <code>Startup.cs</code> me <code>app.UseDefaultFiles(); app.UseStaticFiles();</code>.",
"<code>scripts/app.ts</code> me TS likho (DOM inputs ko <code>as HTMLInputElement</code> se cast karke), aur <code>scripts/tsconfig.json</code> me <code>noEmitOnError</code>, <code>noImplicitAny</code>, <code>sourceMap</code>, <code>target: es6</code> + <code>compileOnSave: true</code>.",
"NPM + gulp se build outputs <code>wwwroot/scripts</code> me copy hote hain (clean + default tasks). <code>wwwroot/index.html</code> compiled <code>app.js</code> load karti hai.",
"Debugging source maps ki badaulat Edge ke F12 debugger me seedha <code>.ts</code> file par breakpoint lagta hai."],
c:"// scripts/tsconfig.json\n{ \"compilerOptions\": { \"noEmitOnError\": true, \"noImplicitAny\": true,\n  \"sourceMap\": true, \"target\": \"es6\" },\n  \"files\": [\"./app.ts\"], \"compileOnSave\": true }",
k:"MSBuild package + compileOnSave + source-map debugging — ye tutorial ke teen takeaway; baaki sab dated setup hai."},
{n:43,g:4,t:"Gulp",u:"https://www.typescriptlang.org/docs/handbook/gulp.html",
p:["Quick-start: <b>gulp</b> se TS build karna, phir Browserify, Watchify, terser aur Babel (Babelify) jodna. Project: <code>src/</code> (TS in) aur <code>dist/</code> (JS out); dev deps me <code>typescript</code>, <code>gulp@4</code>, <code>gulp-typescript</code>.",
"<code>gulpfile.js</code> me <code>ts.createProject(\"tsconfig.json\")</code> aur default task: <code>tsProject.src() → tsProject() → .js → gulp.dest(\"dist\")</code>. Modules jodne par ES2015 syntax andar, CommonJS bahar (Node default) — <code>module</code> option se badalta hai.",
"<b>Browserify</b> saare modules ko browser ke liye ek file me bundle karta hai; <code>tsify</code> uska TS plugin hai, <code>vinyl-source-stream</code> Browserify output ko gulp ki vinyl duniya me wapas lata hai. <code>debug: true</code> se inline source maps — browser me original TS debug hota hai.",
"<b>Watchify</b> save par incremental re-bundle karta hai (<code>on(\"update\", bundle)</code>, <code>on(\"log\", fancy_log)</code>) — gulp chalta rehta hai, edit-save-refresh cycle ban jata hai.",
"<b>Terser</b> minify karta hai — pipeline me <code>buffer()</code> + <code>sourcemaps.init({ loadMaps: true })</code> zaroori hai warna maps toot jayenge. <b>Babelify</b> ko <code>.ts</code> process karane ke liye <code>extensions: [\".ts\"]</code> dena padta hai, aur TS ka target <code>es2015</code> rakho taaki Babel ES5 bana sake."],
c:"const tsProject = ts.createProject(\"tsconfig.json\");\ngulp.task(\"default\", () =>\n  tsProject.src().pipe(tsProject()).js.pipe(gulp.dest(\"dist\")));",
k:"gulp-typescript seedha compile ke liye, tsify Browserify ke andar; source maps har step par sambhal kar rakho."},
{n:44,g:4,t:"DOM Manipulation",u:"https://www.typescriptlang.org/docs/handbook/dom-manipulation.html",
p:["DOM browser ka wo programming interface hai jo static HTML ko functional banata hai — jQuery/React/Angular sab isi ke upar bane hain. TS DOM ke types <code>lib.dom.d.ts</code> (20,000+ lines) me ship karta hai; is duniya ki backbone type hai <b><code>HTMLElement</code></b>.",
"<code>document.getElementById</code> ka return type <code>HTMLElement | null</code> hai — element runtime se pehle pakka exist karta hai ya nahi, koi nahi jaanta; isiliye <code>app?.appendChild(p)</code> me optional chaining.",
"<code>createElement</code> <b>overloaded + generic</b> hai: <code>HTMLElementTagNameMap</code> se tag naam se exact type milta hai — <code>\"a\"</code> → <code>HTMLAnchorElement</code>, <code>\"p\"</code> → <code>HTMLParagraphElement</code>. Dusra string overload custom tags ke liye hai.",
"<code>HTMLElement</code> extends <code>Element</code> extends <code>Node</code> — <code>appendChild&lt;T extends Node&gt;</code> generic hai, <code>T</code> argument se infer hota hai.",
"<b><code>children</code> vs <code>childNodes</code>:</b> <code>children</code> sirf ELEMENTS ka <code>HTMLCollection</code>; <code>childNodes</code> saare nodes (text, comments sab) ka <code>NodeList</code>. Ek <code>&lt;div&gt;&lt;p&gt;Hello&lt;/p&gt; TypeScript!&lt;/div&gt;</code> me children=1, childNodes=2.",
"<code>querySelector(All)</code> bhi same tag-map generics use karte hain — <code>querySelectorAll(\"li\")</code> → <code>NodeListOf&lt;HTMLLIElement&gt;</code>. <code>NodeListOf</code> poora array NAHI hai — sirf <code>length</code>, <code>item()</code>, <code>forEach</code>, indexing."],
c:"const app = document.getElementById(\"app\");\nconst p = document.createElement(\"p\"); // HTMLParagraphElement\np.textContent = \"Hello, World!\";\napp?.appendChild(p); // app: HTMLElement | null — isiliye ?. \nconst items = document.querySelectorAll(\"li\"); // NodeListOf<HTMLLIElement>",
k:"getElementById ka | null, tag-map generic trick, aur children-vs-childNodes — DOM typing ke teen sawal interview me pakke."},
{n:45,g:4,t:"Migrating from JavaScript",u:"https://www.typescriptlang.org/docs/handbook/migrating-from-javascript.html",
p:["JS codebase ko TS me badalna tedious hai, mushkil nahi. Pehla kadam: input/output directories alag rakho taaki TS tumhari <code>.js</code> files overwrite na kare.",
"Bare-bones tsconfig: <code>allowJs: true</code> (JS inputs accept), <code>outDir: \"./built\"</code>, <code>target</code>, <code>include: [\"./src/**/*\"]</code>. <code>tsc</code> chalao — <code>built/</code> me mirror ban jayega. Koi file badle bina hi editor tooling aur <code>noImplicitReturns</code>/<code>noFallthroughCasesInSwitch</code> jaise bug-catchers mil jate hain.",
"<b>Asli migration bas rename hai:</b> ek <code>.js</code> ko <code>.ts</code> karo (<code>.tsx</code> JSX ke liye). Red squiggles Word ke spell-check jaise hain — TS phir bhi emit karta hai. Strict settings file-editing se PEHLE on karo.",
"Common errors ka ilaaj: <code>require</code> ke liye <code>module</code> option + TS import syntax; missing module types ke liye <code>npm i -S @types/lodash</code>; <code>module.exports = foo</code> ke liye <code>export = foo</code>; <code>arguments</code> object wale functions ke liye overloads; sequentially jodi gayi properties ke liye <code>{} as Options</code> pattern.",
"<code>any</code> vs <code>Object</code> vs <code>{}</code>: <code>any</code> sabse flexible par checking gayab; <code>Object</code> par <code>.toLowerCase()</code> bhi nahi chalega; <code>{}</code> ko <code>Object</code> par prefer karo.",
"Aakhir me strictness badhao: <code>noImplicitAny</code>, <code>strictNullChecks</code> (null ke liye unions + pakka ho to <code>!</code>), <code>noImplicitThis</code> (<code>this</code> parameter se fix). Webpack ke liye <code>ts-loader</code> + <code>source-map-loader</code>."],
c:"// pehla tsconfig — migration ki shuruaat\n{ \"compilerOptions\": { \"outDir\": \"./built\", \"allowJs\": true,\n  \"target\": \"es5\" }, \"include\": [\"./src/**/*\"] }\n// phir: file.js → file.ts, squiggles ek-ek karke saaf karo",
k:"allowJs + rename + dheere-dheere strict — migration ka yehi teen-step raasta hai, big-bang rewrite nahi."},
{n:46,g:4,t:"Using Babel with TypeScript",u:"https://www.typescriptlang.org/docs/handbook/babel-with-typescript.html",
p:["Babel ya <code>tsc</code>? Heuristic saaf hai: build output lagbhag source jaisa hi hai to <code>tsc</code>; pipeline se kai outputs chahiye to <b>Babel transpiling ke liye + tsc type checking ke liye</b>. Frameworks (tsdx, Angular, NestJS) aksar ye faisla tumhare liye kar dete hain.",
"Hybrid pattern: Babel ka <code>preset-typescript</code> JS banata hai (tez, kyunki type check nahi karta), TS type checking aur <code>.d.ts</code> generation sambhalta hai. Existing pipelines ke saath ye aaram se fit hota hai.",
"Babel ki do kamzoriyan: (1) TS→JS ke dauran koi type checking nahi — editor me chhuti galti production tak ja sakti hai; (2) Babel <code>.d.ts</code> files nahi bana sakta — libraries ke liye dikkat.",
"Ilaaj: ek tsc type-check command jodo jiska tsconfig ye teen flags rakhe — <code>declaration: true</code>, <code>emitDeclarationOnly: true</code> (sirf .d.ts, .js nahi), <code>isolatedModules: true</code> (har file akeli safely transpile ho sake — Babel ke liye zaroori guarantee)."],
c:"{ \"compilerOptions\": {\n  \"declaration\": true,        // .d.ts banao\n  \"emitDeclarationOnly\": true, // .js Babel banayega\n  \"isolatedModules\": true } }  // per-file transpile safe",
k:"Babel = speed, tsc = sachchai. Dono chalao: Babel emit kare, tsc check kare."},
{n:47,g:4,t:"React & Webpack",u:"https://www.typescriptlang.org/docs/handbook/react-&-webpack.html",
p:["<b>Ye page TypeScript docs par hosted content nahi hai</b> — page khulte hi <code>window.location.href</code> se <b>webpack ki official TypeScript guide</b> par redirect ho jata hai.",
"React + Webpack + TypeScript setup ke liye seedha wahi guide padho: <a href=\"https://webpack.js.org/guides/typescript/\">webpack.js.org/guides/typescript/</a>",
"Us guide ka core (webpack docs se): <code>ts-loader</code> + <code>resolve.extensions</code> me <code>.ts/.tsx</code> — is SPA ke Migrating from JavaScript section me webpack config ka pattern bhi diya hai."],
c:"// is page par koi TS code/hosted example nahi hai\n// → https://webpack.js.org/guides/typescript/",
k:"React & Webpack ke liye TS docs tumhe webpack ki guide par bhejti hai — wahi source of truth hai."},
{n:48,g:5,t:"Introduction",u:"https://www.typescriptlang.org/docs/handbook/declaration-files/introduction.html",
p:["Ye Declaration Files section ka roadmap hai — high-quality <code>.d.ts</code> files likhna sikhata hai. Basic TS familiarity maani gayi hai (pehle Handbook, khaaskar types aur modules).",
"Sections: <b>Declaration Reference</b> (common API patterns), <b>Library Structures</b> (library ka format .d.ts ki shape tay karta hai — naye authors pehle ye padhein), <b>Templates</b> (starter .d.ts files), <b>Do's and Don'ts</b> (sabke liye), <b>Deep Dive</b> (advanced mechanics), <b>Publishing</b>, <b>Consumption</b>.",
"Sabse common case — bina types wali npm package ko type karna hai to seedha 'Modules .d.ts' template par jao."],
c:"",
k:"Declaration files = JS libraries ke liye type contracts. Structure pehchano, phir template uthao."},
{n:49,g:5,t:"Declaration Reference",u:"https://www.typescriptlang.org/docs/handbook/declaration-files/declaration-reference.html",
p:["Har pattern ke saath teen cheezein: API documentation, sample usage, aur usi ki declaration. (Is SPA me page ke 8 patterns cover hain, Global Functions tak.)",
"<b>Objects with Properties:</b> global <code>myLib</code> ke liye <code>declare namespace myLib { function makeGreeting(s: string): string; let numberOfGreetings: number; }</code> — dotted notation se access hone wale types/values ke liye <code>declare namespace</code>.",
"<b>Overloaded Functions:</b> <code>getWidget(43)</code> aur <code>getWidget(\"all\")</code> ke liye do <code>declare function</code> overloads.",
"<b>Reusable Types:</b> option objects ke liye interfaces (<code>GreetingSettings</code> — mandatory + optional mila kar); string/function/instance teeno chal sakein to type alias union (<code>type GreetingLike = string | (() =&gt; string) | MyGreeter</code>). Option interfaces ko namespace me organize karo — nested namespaces bhi chalte hain (<code>GreetingLib.Options.Log</code>).",
"<b>Classes:</b> <code>declare class Greeter { constructor(greeting: string); greeting: string; showGreeting(): void; }</code> — properties, methods, constructor sab describe hota hai.",
"<b>Globals:</b> variable ke liye <code>declare var foo: number</code> (read-only ho to <code>const</code>, block-scoped ho to <code>let</code>); function ke liye <code>declare function greet(greeting: string): void</code>."],
c:"declare namespace myLib {\n  function makeGreeting(s: string): string;\n  let numberOfGreetings: number;\n}\ninterface GreetingSettings { greeting: string; duration?: number; color?: string; }\ndeclare function greet(setting: GreetingSettings): void;",
k:"declare namespace/class/var/function — chaar shabdon se lagbhag har library describe ho jati hai."},
{n:50,g:5,t:"Library Structures",u:"https://www.typescriptlang.org/docs/handbook/declaration-files/library-structures.html",
p:[".d.ts ki structure is par nirbhar hai ki library <b>consume kaise hoti hai</b>. Pehle usage/code se structure pehchano, phir matching template uthao.",
"<b>Modular libraries</b> (aaj ki lagbhag saari Node libraries, jaise express): sirf module loader ke saath. Nishaaniyan: <code>require</code>/<code>define</code> calls, <code>import</code>/<code>export</code>, <code>exports</code>/<code>module.exports</code> assignments. Templates: module.d.ts (overview), module-function (callable), module-class (<code>new</code> se), module-plugin (dusre modules ko badalne wali).",
"<b>Global libraries</b> (jQuery ka <code>$</code>): bina import ke global scope se. Nishaaniyan: docs me <code>&lt;script&gt;</code> tag, top-level <code>var</code>/<code>function</code>, <code>window.x</code> assignments, koi loader nahi. Template: global.d.ts.",
"<b>UMD:</b> module bhi, global bhi (Moment, lodash). Nishaan: file ke upar <code>typeof define</code>/<code>typeof module</code>/<code>typeof window</code> check karne wala wrapper; docs me Node aur browser dono examples.",
"<b>Dependencies consume karna:</b> global library par <code>/// &lt;reference types=\"...\" /&gt;</code>; module par <code>import</code>; UMD par — global file se reference, module/UMD file se import. Module se UMD ke liye reference tag KABHI mat use karo.",
"<b>Name-conflict rule:</b> global .d.ts me types sirf library ke global variable ke namespace me rakho (<code>declare namespace cats {…}</code>), top-level naam kabhi nahi. Aur ES6 loaders me module object callable nahi ho sakta — callable cheez ke liye <code>default</code> export + <code>esModuleInterop</code> ka pattern hai."],
c:"// UMD wrapper ki pehchan:\n// (function (global, factory) {\n//   typeof exports === 'object' && typeof module !== 'undefined' ? factory(exports) :\n//   typeof define === 'function' && define.amd ? define(['exports'], factory) :\n//   (global = global || self, factory(global.myLib = {}));\n// }(this, function (exports) { /* ... */ }));",
k:"Pehle library ki kism pehchano (modular/global/UMD), phir template — ulta karoge to .d.ts galat banega."},
{n:51,g:5,t:"Modules .d.ts",u:"https://www.typescriptlang.org/docs/handbook/declaration-files/templates/module-d-ts.html",
p:["CommonJS module (<code>module.exports</code> wala) ki .d.ts ES-Module jaisi syntax me likhi jati hai — <code>export function getArrayLength(arr: any[]): number; export const maxInterval: 12;</code>. TS Playground JS code ki .d.ts equivalent dikha sakta hai.",
"<b>Default/CJS exports:</b> <code>module.exports = /regex/</code> → <code>declare const helloWorld: RegExp; export = helloWorld;</code>. Function ke saath extra fields hon to declaration merging: <code>declare function</code> + <code>declare namespace</code> same naam par, phir <code>export =</code>.",
"Consumers kai import styles likh sakte hain (<code>require</code>, destructured, <code>import =</code>, <code>import * as</code>, named, default) — saare tabhi kaam karenge jab JS khud saare patterns support kare (fastify apni shape teeno jagah set karta hai isi liye).",
"Runtime par exist na karne wale types bhi export ho sakte hain — generics ke saath aur behtar: <code>ArrayMetadata&lt;ArrType&gt;</code> array ka element type propagate karta hai.",
"Module ke andar ESM syntax kaafi na ho to namespaces: <code>export class API</code> + merged <code>declare namespace API</code> me <code>InfoRequest/InfoResponse</code>. <code>export as namespace moduleName</code> UMD contexts me global availability declare karta hai.",
"<b>Layout library ko mirror karta hai:</b> <code>myLib/foo.js</code> → <code>@types/myLib/foo.d.ts</code>, <code>bar/baz.js</code> → <code>bar/baz.d.ts</code>. File ka naam <code>index.d.ts</code>, folder ka naam module jaisa."],
c:"export function getArrayLength(arr: any[]): number;\nexport const maxInterval: 12;\n// function + fields wale CJS export ke liye:\ndeclare function getArrayLength2(arr: any[]): number;\ndeclare namespace getArrayLength2 { const maxInterval: 12; }\nexport = getArrayLength2;",
k:"export = + declare function/namespace merging — CJS ko type karne ka standard juggad yahi hai."},
{n:52,g:5,t:"Module: Plugin",u:"https://www.typescriptlang.org/docs/handbook/declaration-files/templates/module-plugin-d-ts.html",
p:["Ye template un JS libraries ke liye hai jo <b>dusri library ko runtime par extend</b> karti hain — plugin import karte hi base library ke function par naye methods aa jate hain (<code>greeter.hyperGreet()</code>).",
"Trick <b>declaration merging</b> hai: plugin ki .d.ts base module ko import karke USI module ko dobara declare karke uske interface ko badha deti hai.",
"ES6 caveat: kuch plugins top-level exports ko modify karte hain — CommonJS me legal, lekin ES6 modules immutable hote hain, isliye ES6 loaders par ye pattern possible nahi hoga. TS loader-agnostic hai (compile time par rok nahi lagata), lekin developers ko pata hona chahiye."],
c:"import { greeter } from \"super-greeter\";\nexport module \"super-greeter\" {\n  export interface GreeterFunction {\n    /** Greets even better! */\n    hyperGreet(): void;\n  }\n}",
k:"Plugin .d.ts = base module ko import karke usi ko merge se badhana. ES6 immutability is pattern ki seema hai."},
{n:53,g:5,t:"Module: Class",u:"https://www.typescriptlang.org/docs/handbook/declaration-files/templates/module-class-d-ts.html",
p:["Ye template us JS ke liye hai jo <code>const Greeter = require(\"super-greeter\"); new Greeter()</code> se consume hota hai — class constructor hi module ka export hai.",
"Structure: <code>export as namespace myClassLib;</code> (UMD global — UMD na ho to hata do), <code>export = Greeter;</code>, phir <code>declare class Greeter</code> aur uske option types ke liye merged <code>declare namespace</code>.",
"<b>ES6 modules class objects ko directly export nahi kar sakte</b> — import ke liye ya to CommonJS-style <code>import x = require('[module]')</code>, ya <code>allowSyntheticDefaultImports</code>/<code>esModuleInterop</code> ke saath default import.",
"Warning: namespace shamil karne se module galti se namespace object ki tarah import ho sakta hai (<code>import * as x</code> — GALAT), jab tak <code>esModuleInterop</code> on na ho."],
c:"export as namespace myClassLib;\nexport = Greeter;\ndeclare class Greeter {\n  constructor(customGreeting?: string);\n  greet: void;\n  myMethod(opts: MyClass.MyClassMethodOptions): number;\n}\ndeclare namespace MyClass {\n  interface MyClassMethodOptions { width?: number; height?: number; }\n}",
k:"export = Class + merged namespace — callable-class modules ka template yahi hai."},
{n:54,g:5,t:"Module: Function",u:"https://www.typescriptlang.org/docs/handbook/declaration-files/templates/module-function-d-ts.html",
p:["Ye template us JS ke liye hai jo khud ek function ki tarah consume hota hai: <code>import greeter from \"super-greeter\"; greeter(2); greeter(\"Hello\")</code> — UMD + module dono imports handle karta hai.",
"Structure class wale template jaisi hi: <code>export as namespace</code> (UMD ke liye), <code>export = Greeter</code>, <code>declare function Greeter</code> ke overloads, aur return types/properties ke liye merged <code>declare namespace Greeter</code> (<code>defaultName</code>, <code>defaultLength</code> jaisi module properties yahi rehti hain).",
"Wahi ES6 caveat: import ke liye <code>import x = require()</code> ya synthetic-default flags; namespace ki wajah se galat <code>import * as x</code> sirf <code>esModuleInterop</code> ke saath sahi banta hai."],
c:"export as namespace myFuncLib;\nexport = Greeter;\ndeclare function Greeter(name: string): Greeter.NamedReturnType;\ndeclare function Greeter(length: number): Greeter.LengthReturnType;\ndeclare namespace Greeter {\n  interface NamedReturnType { firstName: string; lastName: string; }\n  const defaultName: string;\n}",
k:"Function-as-module = declare function + merged namespace + export =. Class template ka bhai hai."},
{n:55,g:5,t:"Global .d.ts",u:"https://www.typescriptlang.org/docs/handbook/declaration-files/templates/global-d-ts.html",
p:["Global library ki pehchan dobara: global scope, koi import nahi, docs me <code>&lt;script&gt;</code> tag, top-level <code>var</code>/<code>function</code> declarations, <code>window.x</code> assignments — aur pakka kar lo ki wo asal me UMD to nahi.",
"Template me library ek saath kai roop leti hai: callable overloads (<code>declare function myLib(a: string): string</code>), ek <code>interface myLib</code> (taaki library ka naam khud ek TYPE ki tarah use ho sake — sirf tab jab sensible ho), aur ek <code>declare namespace myLib</code> jisme mutable <code>let timeout</code>, read-only <code>const version</code>, classes, interfaces aur type aliases rehte hain."],
c:"declare function myLib(a: string): string;\ndeclare function myLib(a: number): number;\ninterface myLib { name: string; length: number; extras?: string[]; }\ndeclare namespace myLib {\n  let timeout: number;\n  const version: string;\n  class Cat { constructor(n: number); readonly age: number; purr(): void; }\n}",
k:"Global template = function + interface + namespace ka triple-role — ek naam, teen matlab (Deep Dive dekho)."},
{n:56,g:5,t:"Global: Modifying Module",u:"https://www.typescriptlang.org/docs/handbook/declaration-files/templates/global-modifying-module-d-ts.html",
p:["<b>Global-modifying modules</b> import hote hi global scope ki existing cheezon ko badal dete hain — jaise <code>String.prototype</code> par naye methods. Thode khatarnak (runtime conflicts possible), lekin describable hain.",
"Pehchan: docs me aisa <code>require</code> jiska return value use hi nahi hota — require sirf effects ACTIVATE karta hai (<code>x.startsWithHello()</code> jaise methods built-ins par aa jate hain).",
"Template: <code>declare global { interface String { fancyFormat(…): string } }</code> se augmentation, saath me module ke apne exports. Module kuch export na kare to end me <code>export {};</code> zaroori hai, warna file module nahi maani jayegi. Callable/constructable bhi ho to module-class/function templates ke saath combine karo."],
c:"declare global {\n  interface String { fancyFormat(opts: StringFormatOptions): string; }\n}\nexport interface StringFormatOptions { fancinessLevel: number; }\nexport function doSomething(): void;\nexport {}; // module banane ke liye zaroori (jab exports na hon)",
k:"declare global + export {} — prototype-patching libraries ko type karne ka template."}
];
var S4=[
{n:57,g:5,t:"Do's and Don'ts",u:"https://www.typescriptlang.org/docs/handbook/declaration-files/do-s-and-don-ts.html",
p:["<b>General types:</b> <code>Number/String/Boolean/Symbol/Object</code> (boxed) KABHI mat use karo — lowercase primitives use karo, non-primitive ke liye <code>object</code>. Generic type parameter jo use hi na ho, wo galat hai. <code>any</code> sirf migration ke dauran; type na pata ho ya value blindly pass-through ho to <code>unknown</code>.",
"<b>Callback types:</b> jiska return value ignore hota hai us callback ka return <code>void</code> rakho, <code>any</code> nahi — <code>void</code> galti se return value use karne se rokta hai. Callback parameters ko optional mat banao jab tak asal me matlab na ho. Arity par alag overloads ki jagah EK overload maximum arity ke saath — chhota callback hamesha legal hota hai.",
"<b>Overload ordering:</b> general overloads ko specific ke BAAD kabhi mat rakho ulta — TS PEHLA matching overload chunata hai, isliye specific pehle, general baad me; warna specific wala chhup jayega.",
"Trailing parameters me hi farak ho to overloads ki jagah <b>optional parameters</b> — par sirf jab sab ka return type same ho. Ek hi argument position ke type me farak ho to overloads ki jagah <b>union type</b> — warna pass-through code (<code>x: number | string</code> aage bhejna) galat error dega."],
c:"// ❌ function utcOffset(b: number): X; function utcOffset(b: string): X;\n// ✅ function utcOffset(b: number | string): X;\n// ❌ callback return: any  ✅ (value: string) => void\n// ❌ overloads: diff(one: string); diff(one: string, two: string);\n// ✅ diff(one: string, two?: string, three?: boolean);",
k:"Boxed types mana, callbacks me void, specific-pehle overloads, union-over-overload — declaration files ke chaar sunahre usool."},
{n:58,g:5,t:"Deep Dive",u:"https://www.typescriptlang.org/docs/handbook/declaration-files/deep-dive.html",
p:["Ek naam ek saath <b>TYPE, VALUE aur NAMESPACE</b> — teeno ho sakta hai; context tay karta hai konsa matlab lagega: <code>let m: A.A = A;</code> me pehla A namespace, dusra type, teesra value hai — teeno alag declarations bhi ho sakte hain.",
"Types introduce hote hain: type alias, interface, class, enum, type ko refer karte <code>import</code> se. Values bante hain: <code>let/const/var</code>, value-rakhne wale namespace/module, enum, class, value ko refer karte <code>import</code>, function se.",
"<code>class C {}</code> ek saath type C (instance shape) AUR value C (constructor) banata hai — enums bhi aise hi. User khud bhi jod sakta hai: <code>export var Bar: { a: Bar }; export interface Bar { count: number; }</code> — same naam value bhi, type bhi, aazad roop se.",
"Merging ke rules: values same-naam values se takrate hain (namespace apwaad); types type alias se takrate hain; <b>namespaces kabhi nahi takrate</b>. <code>interface</code> se existing class/interface me members judo; <code>namespace</code> se bina conflict ke naye types/values aur class par statics (<code>C.x</code>) judo.",
"Poora example: do <code>namespace X</code> blocks + <code>type X = string</code> milkar value X, namespace X, X ke andar types Y/Z, values, nested namespace Z, usme type C — sab ek saath coexist karte hain."],
c:"export var Bar: { a: Bar };\nexport interface Bar { count: number; }\nimport { Bar } from \"./foo\";\nlet x: Bar = Bar.a; // pehla Bar = type, dusra = value",
k:"Ek naam, teen matlab — declaration merging aur .d.ts ke saare advanced patterns isi par khade hain."},
{n:59,g:5,t:"Publishing",u:"https://www.typescriptlang.org/docs/handbook/declaration-files/publishing.html",
p:["Declaration files publish karne ke do raaste: <b>apne npm package ke saath bundle</b> karo, ya <b>DefinitelyTyped ke through @types org</b> par publish karo (PR bhejo, types-publisher khud publish kar deta hai). Types source se generate hote hon to source ke saath hi publish karo.",
"Package me shamil karna: package.json me <code>\"types\": \"./lib/main.d.ts\"</code> set karo (<code>\"typings\"</code> iska synonym hai), <code>\"main\"</code> ke saath.",
"Jo declaration packages tum expose karte ho, unhe <code>dependencies</code> me rakho, <code>devDependencies</code> me nahi — consumers ko bhi chahiye honge. Package khud types bundle kare (jaise typescript) to extra dependency nahi.",
"<b>Red flags:</b> declaration files me <code>/// &lt;reference path=\"...\" /&gt;</code> mat use karo — <code>types=\"...\"</code> wala use karo. Dusre package ki declarations apni file me copy mat karo — uske type package par depend karo.",
"<b><code>typesVersions</code></b> TS version ke hisaab se alag declaration files serve karta hai — folder redirects (<code>\"&gt;=3.1\": { \"*\": [\"ts3.1/*\"] }</code>) aur file redirects dono. Matching ORDER par nirbhar hai: <code>&gt;=3.2</code> ko <code>&gt;=3.1</code> se PEHLE rakho. Redirects sirf external API par lagte hain, package ke internal imports par nahi."],
c:"{ \"name\": \"awesome\", \"main\": \"./lib/main.js\", \"types\": \"./lib/main.d.ts\",\n  \"typesVersions\": { \">=3.2\": { \"*\": [\"ts3.2/*\"] }, \">=3.1\": { \"*\": [\"ts3.1/*\"] } } }",
k:"types field + dependencies ka sahi ghar + typesVersions ka order — publishing ke teen kaam."},
{n:60,g:5,t:"Consumption",u:"https://www.typescriptlang.org/docs/handbook/declaration-files/consumption.html",
p:["Declaration files download karne ke liye npm ke alawa koi tool nahi chahiye: <code>npm install --save-dev @types/lodash</code> — bas, ho gaya.",
"Package khud apni declaration file bundle karta ho (Publishing dekho) to @types package ki zaroorat hi nahi.",
"Consume karna modules aur global code dono me chalta hai — <code>import * as _ from \"lodash\"</code> ya bina modules ke seedha global <code>_</code>.",
"@types packages ka naam lagbhag hamesha npm package ke naam par <code>@types/</code> prefix ke saath hota hai. Jo declaration exist hi na kare, use DefinitelyTyped me contribute karke wapas do."],
c:"npm install --save-dev @types/lodash\n// phir:\nimport * as _ from \"lodash\";\n_.padStart(\"Hello TypeScript!\", 20, \" \");",
k:"@types/<naam> install karo aur use karo — consumption isse zyada simple ho hi nahi sakta."},
{n:61,g:6,t:"JS Projects Utilizing TypeScript",u:"https://www.typescriptlang.org/docs/handbook/intro-to-js-ts.html",
p:["TS ke type system me strictness ki ek <b>seedhi</b> hai — har project ko sabse upar wali seedhi nahi chahiye: (1) sirf inference ke saath JS, (2) JSDoc se incremental typing, (3) JS file me <code>// @ts-check</code>, (4) TypeScript code, (5) <code>strict</code> ke saath TypeScript.",
"Sirf TS-aware editor (VS Code) use karne se bina ek line TS likhe autocomplete, jump-to-symbol aur rename refactoring mil jate hain.",
"JSDoc se type hints: <code>/** @type {number} */ var x;</code> — lekin dhyaan do, JS me by default <code>x = false</code> par bhi error NAHI aayega jab tak checking on na karo.",
"<code>// @ts-check</code> file ki PEHLI line par lagao to us file me errors milne lagte hain. Kai files ke liye <code>jsconfig.json</code>; kisi file ko skip karna ho to <code>// @ts-nocheck</code>; kisi line ko suppress karna ho to <code>// @ts-ignore</code> ya <code>// @ts-expect-error</code> — <b><code>@ts-expect-error</code> prefer karo</b>, kyunki error gayab ho jaye to ye khud error de deta hai."],
c:"// @ts-check\n/** @type {number} */\nvar x;\nx = 0;     // OK\nx = false; // Error 2322 — @ts-check ne pakda!",
k:"JS project me TS ka fayda bina migration ke: editor → JSDoc → @ts-check → .ts → strict, seedhi chadhte jao."},
{n:62,g:6,t:"Type Checking JavaScript Files",u:"https://www.typescriptlang.org/docs/handbook/type-checking-javascript-files.html",
p:[".js files me checking .ts se kai jagah alag hoti hai — ye farak jaanna zaroori hai warna ajeeb behaviors bug lagenge.",
"<b>Class properties assignments se infer hoti hain:</b> constructor me assigned props pakke exist maane jate hain; sirf methods/getters me set hone wale OPTIONAL maane jate hain (<code>string | boolean | undefined</code>). Kabhi set na hone wale props ke liye constructor me JSDoc annotation do.",
"Pre-ES2015 constructor functions ko bhi TS classes ki tarah samajhta hai — same property-inference rules. CommonJS (<code>exports</code>/<code>require</code>) bhi supported hai, aur JS ki module syntax TS se zyada maaf karne wali hai.",
"Classes/functions/object literals namespaces ki tarah behave kar sakte hain (<code>C.D = class {}</code>, IIFE patterns) — pre-ES2015 code ke simulation patterns TS pehchanta hai.",
"<b>Object literals JS me open-ended hain</b> — <code>var obj = { a: 1 }; obj.b = 2;</code> ALLOWED hai (jaise <code>[x: string]: any</code> index signature ho). JSDoc type de do to object band ho jata hai aur <code>obj.b</code> error dega.",
"<code>null</code>/<code>undefined</code>/<code>[]</code> initializers <code>any</code>/<code>any[]</code> bante hain — strictNullChecks on ho tab bhi. Function parameters <b>by default optional</b> hain (kam args OK), lekin ZYADA args ab bhi error hain. <code>arguments</code> use karne wala function <code>(...arg: any[]) =&gt; any</code> infer hota hai.",
"Unspecified generic type parameters <code>any</code> ban jate hain (JS me generics ka syntax hi nahi) — <code>@augments</code> aur JSDoc references se specify karo."],
c:"var obj = { a: 1 };\nobj.b = 2; // JS me OK — object literal open-ended hai\n/** @type {{ a: number }} */\nvar closed = { a: 1 };\nclosed.b = 2; // Error 2339 — JSDoc ne band kar diya",
k:"Open-ended objects, optional-by-default params, any-default generics — JS checking ke teen bade farak."},
{n:63,g:6,t:"JSDoc Reference",u:"https://www.typescriptlang.org/docs/handbook/jsdoc-supported-types.html",
p:["Sirf listed JSDoc tags hi supported hain (jaise <code>@async</code> nahi hai). Documentation tags (<code>@deprecated</code>, <code>@see</code>, <code>@link</code>) TS files me bhi chalte hain; baaki sab JS-only hain.",
"<b>Core tags:</b> <code>@type</code>, <code>@import</code>, <code>@param/@returns</code>, <code>@typedef</code>, <code>@callback</code>, <code>@template</code>, <code>@satisfies</code>. Class tags: <code>@public/@private/@protected/@readonly</code>, <code>@override</code>, <code>@extends/@augments</code>, <code>@implements</code>, <code>@class/@constructor</code>, <code>@this</code>.",
"<code>@type</code> me poora TS syntax chalta hai — unions, arrays (<code>number[]</code>, <code>Array.&lt;number&gt;</code>), object literals, functions, import types (<code>{import(\"./types\").Pet}</code>), hatta ki casts (<code>/** @type {number} */ (x)</code>) aur <code>{const}</code> casts. <code>*</code> = any, <code>?</code> = unknown.",
"<b><code>@import</code></b> sirf TYPE-CHECKING ke liye symbols lata hai — runtime import NAHI karta; sirf <code>@import</code> ke baad <code>new Dog()</code> karoge to error.",
"<code>@typedef</code>/<code>@callback</code> complex aur function types define karte hain (nested <code>@property</code> syntax ke saath, ya single-line TS syntax me). <code>@param</code> me optional ke teen tareeqe: <code>{string=}</code>, <code>[p3]</code>, default ke saath <code>[p4=\"test\"]</code>.",
"<b><code>@template</code></b> generics deta hai — constraints sirf pehle parameter par (<code>@template {string} K</code>), defaults <code>[T=object]</code> syntax se. <b><code>@satisfies</code></b> value ka type badle bina check karta hai — literal type bacha rehta hai, <code>@type</code> se ulta.",
"Gotchas: object literal me postfix <code>=</code> optional NAHI banata (<code>b?: number</code> use karo); <code>?number</code>/<code>!number</code> ke khaas matlab nahi — unions likho. Unsupported tags: <code>@memberof</code>, <code>@yields</code>, <code>@member</code>. Legacy synonyms (<code>String</code>→<code>string</code> adi) hain, par <code>Object</code>/<code>object</code> → <code>any</code> wale <code>noImplicitAny</code> se band ho jate hain."],
c:"/**\n * @template T\n * @param {T} x\n * @returns {T}\n */\nfunction id(x) { return x; }\n/** @type {import(\"./types\").Pet} */\nlet pet;",
k:"@type, @typedef, @template, @satisfies — JSDoc ke chaar kaam ke tags; @import type-only hai, ye mat bhoolna."},
{n:64,g:6,t:"Creating .d.ts Files from .js files",u:"https://www.typescriptlang.org/docs/handbook/declaration-files/dts-from-js.html",
p:["TS 3.7 se TS <b>JSDoc se .js files ki .d.ts generate</b> kar sakta hai — na port karna padta hai, na .d.ts haath se maintain karni padti hai, aur TS-powered editor experience mil jata hai.",
"Setup ke 4 steps: (1) TypeScript devDependencies me jodo, (2) <code>tsconfig.json</code> banao, (3) compiler chalao, (4) chaaho to package.json me types reference karo.",
"Jadooi flags: <code>allowJs: true</code> (JS padho), <code>declaration: true</code> (.d.ts banao), <code>emitDeclarationOnly: true</code> (sirf .d.ts), <code>outDir</code>, aur <code>declarationMap: true</code> (Go to Definition seedha .js par le jata hai).",
"package.json resolution ka order: pehle <code>types</code> field, phir <code>main</code> se bana .d.ts, phir root ka <code>index.d.ts</code>. Ek gotcha: <code>\"types\": \"./dist/main.js\"</code> likhne par TS <code>./dist/main.d.ts</code> dhoondhega.",
"Tips: generated files package me shamil hon chahe <code>.gitignore</code> me hon; generated .d.ts ko <b>tsd</b> ya <b>TSTyche</b> se test karo."],
c:"{ \"include\": [\"src/**/*\"], \"compilerOptions\": {\n  \"allowJs\": true, \"declaration\": true,\n  \"emitDeclarationOnly\": true, \"outDir\": \"dist\",\n  \"declarationMap\": true } }\n// CLI: npx -p typescript tsc src/**/*.js --declaration --allowJs --emitDeclarationOnly --outDir types",
k:"JSDoc likho, chaar flags lagao, .d.ts khud banegi — JS libraries ke liye sabse sasta type contract."},
{n:65,g:7,t:"What is a tsconfig.json",u:"https://www.typescriptlang.org/docs/handbook/tsconfig-json.html",
p:["Kisi directory me <code>tsconfig.json</code> ka hona usey TS project ka root mark karta hai — root files aur compiler options wahi tay karte hain. JS projects ke liye <code>jsconfig.json</code> hai (lagbhag same, JS flags default-on).",
"<code>tsc</code> bina input files ke chalao to compiler current directory se upar parent chain me tsconfig dhoondhta hai; <code>tsc --project</code>/<code>-p</code> se specific config de sakte ho. <b>Command line par files doge to tsconfig IGNORE ho jayega</b> — ye sabse common confusion hai.",
"Files chunne ke do tareeqe: <code>files</code> (explicit chhoti list) ya <code>include</code>/<code>exclude</code> globs (<code>include: [\"src/**/*\"]</code>, <code>exclude: [\"**/*.spec.ts\"]</code>).",
"<b>TSConfig Bases:</b> github.com/tsconfig/bases par per-runtime ready configs hain — <code>\"extends\": \"@tsconfig/node12/tsconfig.json\"</code> se inherit karke runtime mechanics ki fikar khatm karo, apne project ke options upar jodo."],
c:"{ \"extends\": \"@tsconfig/node12/tsconfig.json\",\n  \"compilerOptions\": { \"preserveConstEnums\": true },\n  \"include\": [\"src/**/*\"], \"exclude\": [\"**/*.spec.ts\"] }",
k:"tsconfig = project root + options. CLI files = tsconfig ignore. extends/bases se boilerplate khatm."},
{n:66,g:7,t:"Compiler Options in MSBuild",u:"https://www.typescriptlang.org/docs/handbook/compiler-options-in-msbuild.html",
p:["MSBuild projects (jaise ASP.NET Core) me TS do tarike se configure hota hai: <b>tsconfig.json (recommended — source of truth)</b> ya <code>.csproj</code> ke project settings.",
"Har <code>.csproj</code> property seedha ek tsc flag se map hoti hai: <code>TypeScriptNoImplicitAny</code> → <code>--noImplicitAny</code>, <code>TypeScriptModuleKind</code> → <code>--module</code>, <code>TypeScriptTarget</code> → <code>--target</code>, <code>TypeScriptGeneratesDeclarations</code> → <code>--declaration</code>, <code>TypeScriptESModuleInterop</code> → <code>--esModuleInterop</code> — poori mapping table source page par hai.",
"Jo flag mapping me na ho, use <code>TypeScriptAdditionalFlags</code> se seedha CLI ko pass karo.",
"Debug vs Release ke alag <code>PropertyGroup Condition</code> rakh sakte ho — Debug me comments+sourcemaps, Release me dono off. <code>Microsoft.TypeScript.targets</code> import karna hota hai.",
"<code>TypeScriptToolsVersion</code> compiler version pin karta hai; <code>TypeScriptCompileBlocked</code> = true karne se VS editing/debugging support deta hai lekin F5 par build nahi karta (jab gulp/grunt build sambhale); <code>TypeScriptEnableIncrementalMSBuild</code> (4.2+) sirf badli hui sources par tsc chalata hai."],
c:"<PropertyGroup>\n  <TypeScriptNoEmitOnError>true</TypeScriptNoEmitOnError>\n  <TypeScriptNoImplicitReturns>true</TypeScriptNoImplicitReturns>\n</PropertyGroup>\n<PropertyGroup Condition=\"'$(Configuration)' == 'Release'\">\n  <TypeScriptRemoveComments>true</TypeScriptRemoveComments>\n</PropertyGroup>",
k:"MSBuild duniya me bhi tsconfig hi raja hai; .csproj properties usi ke flag-names ke XML roop hain."},
{n:67,g:7,t:"TSConfig Reference",u:"https://www.typescriptlang.org/tsconfig/",
p:["Ye har tsconfig option ka complete reference hai — saikdon options, groups me: Type Checking, Modules, Emit, JavaScript Support, Editor Support, Interop Constraints, Backwards Compatibility, Language and Environment, Compiler Diagnostics, Projects, Output Formatting, Completeness, Watch Options, Type Acquisition. (Ye section grouped inventory hai; kisi ek option ki exact wording ke liye source page dekho.)",
"<b>Root fields:</b> <code>files</code> (chhoti allowlist; file na mile to error), <code>include</code> (globs — <code>*</code>, <code>?</code>, <code>**/</code>; bina extension/wildcard wala last segment = directory), <code>exclude</code> (SIRF include ki khoj badalta hai — <code>import</code>/<code>files</code>/reference se aane wali file ko NAHI rok sakta; default: node_modules, outDir adi), <code>extends</code> (base pehle load, inheriting file override; <code>references</code> inherit NAHI hota), <code>references</code> (project references).",
"<b>Strict family</b> (<code>strict: true</code> se sab on, recommended): <code>noImplicitAny</code>, <code>strictNullChecks</code>, <code>strictFunctionTypes</code> (methods exempt), <code>strictPropertyInitialization</code>, <code>noImplicitThis</code>, <code>strictBindCallApply</code>, <code>useUnknownInCatchVariables</code>, <code>alwaysStrict</code>, <code>strictBuiltinIteratorReturn</code>. Akele kaam ke: <code>exactOptionalPropertyTypes</code> (<code>?</code> sach me undefined exclude kare — recommended), <code>noUncheckedIndexedAccess</code> (index access par <code>| undefined</code>), <code>noImplicitOverride</code>, <code>noUnusedLocals/Parameters</code> (<code>_</code>-prefix exempt), <code>noFallthroughCasesInSwitch</code>.",
"<b>Modules:</b> <code>module</code>/<code>moduleResolution</code> ki jodi (Modules Reference dekho); <code>paths</code> emit NAHI badalta; <code>baseUrl</code> AMD ke liye tha, ab not recommended; <code>rootDir</code> output structure tay karta hai (emittable files iske andar honi chahiye); <code>customConditions</code>, <code>moduleSuffixes</code> (React Native), <code>resolveJsonModule</code>, <code>allowImportingTsExtensions</code> (sirf noEmit/emitDeclarationOnly ke saath), <code>rewriteRelativeImportExtensions</code> (5.7).",
"<b>Emit:</b> <code>declaration</code>/<code>declarationDir</code>/<code>declarationMap</code>, <code>outDir</code>/<code>outFile</code> (outFile sirf None/System/AMD ke saath), <code>sourceMap</code>/<code>inlineSourceMap</code>/<code>inlineSources</code>, <code>noEmit</code> (dusra tool emit kare), <code>noEmitOnError</code> (default false!), <code>importHelpers</code> (tslib), <code>downlevelIteration</code>, <code>stripInternal</code>, <code>removeComments</code>.",
"<b>Interop:</b> <code>esModuleInterop</code> (recommended), <code>verbatimModuleSyntax</code> (5.0, recommended — deprecated <code>importsNotUsedAsValues</code>/<code>preserveValueImports</code> ki jagah), <code>isolatedModules</code>, <code>isolatedDeclarations</code> (5.5), <code>erasableSyntaxOnly</code> (Node type-stripping ke liye), <code>forceConsistentCasingInFileNames</code> (recommended, default true).",
"<b>Language/Environment:</b> <code>target</code> (default lib bhi tay karta hai), <code>lib</code>, <code>jsx</code>/<code>jsxFactory</code>/<code>jsxImportSource</code>, <code>experimentalDecorators</code>/<code>emitDecoratorMetadata</code>, <code>useDefineForClassFields</code> (target ≥ ES2022 par default true), <code>moduleDetection</code>, <code>noLib</code>.",
"<b>Projects/Completeness:</b> <code>composite</code> + <code>incremental</code> (.tsbuildinfo), <code>skipLibCheck</code> (tez par kam accurate — duplicate deps theek karna behtar ilaaj), diagnostics ke liye <code>explainFiles</code>/<code>traceResolution</code>/<code>generateTrace</code>. <b>Watch:</b> <code>watchFile</code>/<code>watchDirectory</code>/<code>fallbackPolling</code> strategies + <code>excludeDirectories</code>. Type Acquisition sirf JS projects ke liye hai."],
c:"{ \"compilerOptions\": {\n  \"strict\": true, \"exactOptionalPropertyTypes\": true,\n  \"noUncheckedIndexedAccess\": true,\n  \"module\": \"nodenext\", \"verbatimModuleSyntax\": true,\n  \"skipLibCheck\": true, \"forceConsistentCasingInFileNames\": true } }",
k:"Har option yaad nahi karna — groups yaad rakho: strict family, module jodi, emit, interop. Baaki reference page kis liye hai."},
{n:68,g:7,t:"tsc CLI Options",u:"https://www.typescriptlang.org/docs/handbook/compiler-options.html",
p:["<code>tsc</code> bina args ke sabse qareebi tsconfig wala project compile karta hai (upar ki taraf dhoondh kar); file globs doge to tsconfig poori tarah IGNORE ho jata hai.",
"<b>Commands:</b> <code>--init</code> (tsconfig scaffold), <code>--project/-p</code> (specific config/folder), <code>--showConfig</code> (final resolved config print karo — config debug karne ka sabse achha tareeqa), <code>--version</code>, <code>--help</code>/<code>--all</code>, <code>--ignoreConfig</code>, <code>--listFilesOnly</code>, <code>--locale</code> (messages ki bhasha; emit par asar nahi).",
"<b>Build mode</b> (<code>--build</code> ke saath): <code>--clean</code>, <code>--dry</code>, <code>--force</code>, <code>--verbose</code> — detail Project References section me. <b>Watch:</b> <code>--watch</code> + <code>--watchFile/--watchDirectory/--fallbackPolling</code> strategies (tsconfig ke watchOptions jaise hi).",
"Saare compiler flags CLI par bhi available hain (<code>--flag value</code>, boolean flags bare). CLI-only extras: <code>--stableTypeOrdering</code>, <code>--stopBuildOnErrors</code>, <code>--generateCpuProfile</code>, <code>--disableSizeLimit</code> (language server ki 20MB cap hatata hai). <code>--out</code> deprecated hai — <code>--outFile</code> use karo; <code>--charset</code> ab supported nahi (UTF-8 assumed)."],
c:"tsc                       # nearest tsconfig wala project\ntsc --project tsconfig.production.json\ntsc --showConfig          # asal me konsi config lagi, dekho\ntsc index.js --declaration --emitDeclarationOnly",
k:"Config samajh na aaye to --showConfig. Files doge to tsconfig gayab — ye do baatein CLI ki jaan hain."},
{n:69,g:7,t:"Project References",u:"https://www.typescriptlang.org/docs/handbook/project-references.html",
p:["Project references (TS 3.0+) program ko chhote tukdon me baant-te hain — tsconfig ke top-level <code>references</code> array me (<code>{ \"path\": \"../src\" }</code>). Fayde: tez builds, logical separation enforce, editor me kam memory, incremental builds.",
"Bina references ke dard: impl files test files import kar leti thin; <code>src</code> aur <code>test</code> alag build nahi hote the; ek badlo to dusra re-typecheck. Kai tsconfigs bina references ke: no up-to-date checking, double startup cost, <code>tsc -w</code> kai configs nahi dekh sakta.",
"Reference ka matlab: import karne par referenced project ki <b>output .d.ts</b> load hoti hai, .ts sources nahi. Referenced project ke liye <b><code>composite</code> zaroori</b> hai — <code>rootDir</code> default tsconfig dir, har impl file <code>include</code>/<code>files</code> me honi chahiye, <code>declaration</code> on (default true).",
"<code>declarationMap</code> editor me project boundaries ke paar Go to Definition/Rename ko asli .ts source tak le jata hai. Caveat: dependents built .d.ts khate hain — clone ke baad build nahi kiya to editor me nakli errors dikhenge (VS Code ka in-memory fallback isko kam karta hai).",
"<b><code>tsc --build</code> (<code>tsc -b</code>) compiler nahi, orchestrator hai</b> — plain <code>tsc</code> dependencies auto-build NAHI karta, <code>-b</code> karta hai: out-of-date projects ko dependency order me build karta hai. Flags: <code>--verbose</code>, <code>--dry</code>, <code>--clean</code>, <code>--force</code>, <code>--watch</code>.",
"Build mode effectively <code>noEmitOnError</code> jaisa behave karta hai (error par emit karne se agli run me project up-to-date dikhega aur error chhup jayega). Guidance: shared options ke liye <code>extends</code>; ek 'solution' tsconfig sirf references + <code>files: []</code> ke saath; MSBuild ke liye <code>&lt;TypeScriptBuildMode&gt;true&lt;/TypeScriptBuildMode&gt;</code>."],
c:"// solution tsconfig — sirf references\n{ \"files\": [], \"references\": [{ \"path\": \"./src\" }, { \"path\": \"./test\" }] }\n// build: tsc -b src test   (order TS khud theek kar dega)",
k:"References = chhote projects + d.ts boundaries; tsc -b = unka conductor. Plain tsc dependencies build nahi karta."},
{n:70,g:7,t:"Integrating with Build Tools",u:"https://www.typescriptlang.org/docs/handbook/integrating-with-build-tools.html",
p:["Common build tools ke saath TS ke config snippets — kai tools legacy hain, page khud unmaintained ko mark karta hai.",
"<b>Babel:</b> <code>@babel/preset-typescript</code> — sirf type-stripping, koi checking nahi; saath me <code>tsc --noEmit</code> chalao. <b>Browserify:</b> <code>tsify</code> plugin. <b>Grunt:</b> <code>grunt-ts</code> ab maintained nahi — <code>grunt-browserify</code> + tsify alternative. <b>Gulp:</b> <code>gulp-typescript</code>.",
"<b>Rollup:</b> <code>@rollup/plugin-typescript</code> (typescript + tslib peer deps). <b>Webpack:</b> <code>ts-loader</code> — full type checking karta hai (tez transpilers se slow, par sahi); rule <code>/\\.tsx?$/</code> + <code>resolve.extensions</code> me <code>.tsx/.ts/.js</code>.",
"<b>Vite:</b> .ts import out-of-the-box, lekin <b>sirf transpile karta hai, type-check nahi</b> — kuch compilerOptions values required hain (Vite docs dekho). <b>Svelte:</b> <code>svelte-preprocess</code> + CLI checking ke liye <code>svelte-check</code>.",
"<b>MSBuild/NuGet:</b> project file me <code>Microsoft.TypeScript.Default.props</code> upar aur <code>Microsoft.TypeScript.targets</code> neeche import karo, ya <code>Microsoft.TypeScript.MSBuild</code> NuGet package. Jspm wala section legacy hai.",
"Sabak ek hi: transpile-only tools (Babel/Vite/swc) ke saath <code>tsc --noEmit</code> hamesha jodo, aur unke liye <code>isolatedModules</code> safety net hai."],
c:"// webpack — ts-loader full checking ke saath\nmodule.exports = { module: { rules: [\n  { test: /\\.tsx?$/, use: 'ts-loader', exclude: /node_modules/ } ] },\n  resolve: { extensions: ['.tsx', '.ts', '.js'] } };",
k:"Tool chahe jo ho: transpile-only = tsc --noEmit saath me. ts-loader checking karta hai, baaki strip."},
{n:71,g:7,t:"Configuring Watch",u:"https://www.typescriptlang.org/docs/handbook/configuring-watch.html",
p:["Watch mode ki configuration TS 3.8+ se <code>watchOptions</code> me hoti hai — usse pehle sirf environment variables the, ab wahi suggested tareeqa hai.",
"<b>Do mechanisms ka trade-off:</b> <code>fs.watch</code> event-based hai (kam CPU) lekin OS-dependent aur unreliable — kuch Linux par watchers ki limit khatm ho jati hai, recursive directory watching Linux par kaam hi nahi karta (Windows/macOS par karta hai). <code>fs.watchFile</code> polling hai — reliable lekin CPU khaata hai, files ki tadaad ke hisaab se. TS aam taur par directories ke liye fs.watch aur source/config/missing files ke liye fs.watchFile use karta hai, aur directory watchers se file watchers ki nakamiyon ko cover karta hai.",
"tsconfig me example: <code>watchFile/watchDirectory: \"useFsEvents\"</code>, <code>fallbackPolling: \"dynamicPriority\"</code>, <code>synchronousWatchDirectory: true</code> (notifications coalesce mat karo), <code>excludeDirectories: [\"**/node_modules\", \"_build\"]</code>, <code>excludeFiles</code> — watch ki laagat kam karne ka sabse bada lever yahi exclusions hain.",
"Legacy env vars <code>TSC_WATCHFILE</code>/<code>TSC_WATCHDIRECTORY</code> ab bhi chalte hain (PriorityPollingInterval, DynamicPriorityPolling, UseFsEvents, UseFsEventsOnParentDirectory adi strategies ke saath) — naye setups me watchOptions hi use karo."],
c:"\"watchOptions\": {\n  \"watchFile\": \"useFsEvents\", \"watchDirectory\": \"useFsEvents\",\n  \"fallbackPolling\": \"dynamicPriority\", \"synchronousWatchDirectory\": true,\n  \"excludeDirectories\": [\"**/node_modules\", \"_build\"] }",
k:"Events saste par najuk, polling mehenga par pakka — Linux par watch ki har shikayat ki jad yahi trade-off hai."},
{n:72,g:7,t:"Nightly Builds",u:"https://www.typescriptlang.org/docs/handbook/nightly-builds.html",
p:["Har raat midnight PST par TypeScript ke <code>main</code> branch se nightly build npm par publish hota hai: <code>npm install -D typescript@next</code>.",
"Editors ko nightly par le jana: <b>VS Code</b> me workspace me nightly install karke workspace TS version chuno, ya <code>.vscode/settings.json</code> me <code>\"typescript.tsdk\": \"&lt;path&gt;/node_modules/typescript/lib\"</code> set karo — ya 'JavaScript and TypeScript Nightly' extension lagao (workspace version badle bina nightly editing experience).",
"Sublime Text me <code>\"typescript_tsdk\"</code> setting; IntelliJ me Preferences → Languages &amp; Frameworks → TypeScript me version path; purane Visual Studio (2013/2015) ke liye <code>VSDevMode.ps1</code> script.",
"Use case: unreleased features try karna ya kisi bug fix ko release se pehle verify karna. Risk: nightly unreleased code hai — production builds ke liye nahi."],
c:"npm install -D typescript@next\n// VS Code .vscode/settings.json:\n// { \"typescript.tsdk\": \"node_modules/typescript/lib\" }",
k:"typescript@next = kal ki TS aaj. Editor ka tsdk path badlo, production se door rakho."},

{n:74,g:9,t:"Installation",u:"https://www.typescriptlang.org/download",
p:["TypeScript install karne ke teen raaste: <b>npm module</b> (Node.js users), <b>NuGet package</b>, ya <b>Visual Studio extension</b> (MSBuild projects).",

/* ================= FAQs ================= */
var FAQS=[
["TypeScript kya hai — JavaScript se alag kaise?","TS JavaScript ka typed superset hai: saara JS valid TS hai, TS sirf static type checking jodta hai. Compile ke baad types erase ho jate hain — runtime par emitted JS bilkul aam JS hai, koi TS runtime ya library nahi hoti."],
["interface aur type me kya farak hai?","Interface sirf object shapes declare karta hai, hamesha extendable hai aur declaration merging se re-open ho sakta hai. Type alias unions, tuples, primitives ke naam — kuch bhi bana sakta hai, lekin re-open nahi hota. Interface extends zyadaatar type intersections se performant bhi hai. Heuristic: interface pehle, type tab jab uski feature chahiye."],
["any, unknown aur never me farak?","any saari checking band kar deta hai (contagious bhi hai). unknown koi bhi value accept karta hai lekin use se pehle narrowing maangta hai — safe any. never wo type hai jo kabhi occur nahi hoti: exhaustiveness checks aur never-returning functions me aata hai; never sab ko assignable hai, use kuch assignable nahi (never ke alawa)."],
["Structural typing kya hoti hai?","TS naam (nominal) nahi, shape dekhta hai. Jis object ke paas required properties hain wo compatible hai — chahe usne kabhi us interface ka naam suna bhi na ho. Isiliye same-shape classes interchangeable hain, aur empty class sab kuch accept kar leti hai. Private/protected members is rule ke apwaad hain — wo sirf usi class se aane par match hote hain."],
["Type inference kab fail hoti hai aur annotation kab zaroori hai?","Inference initializers, defaults aur returns se type nikaalti hai. Fail/galat tab hoti hai jab best common type na bane (union ban jata hai, jaise Animal[] ki jagah (Rhino|Elephant)[]), ya jab tumhe inference se zyada specific type chahiye (tuple, literal union). Function parameters aur public APIs par annotations lagbhag hamesha achhi aadat hai."],
["Narrowing kya hai? Kaun se guards hain?","Control flow ke basis par union type ko specific type me refine karna narrowing hai. Guards: typeof, truthiness, equality (===/switch, == null dono null+undefined hatata hai), in operator, instanceof, assignments, user-defined type predicates (pet is Fish), assertion functions, aur discriminated unions par discriminant check."],
["Discriminated union kaise banate hain aur exhaustiveness check kya hai?","Har union member me ek common property par alag literal type rakho (kind: \"circle\" | \"square\") — discriminant check karte hi TS sahi member narrow kar deta hai. Exhaustiveness ke liye default branch me const x: never = shape; rakho — naya member judne par wahan compile error aayega, koi case miss nahi hoga."],
["Generics kyun chahiye? Constraint kya hota hai?","Generics types ko parameterize karte hain taaki ek hi code kai types par type-safety ke saath chale — identity function number-only (narrow) ya any (unsafe) ki jagah Type ko capture karke reuse karta hai. Constraint (T extends { length: number }) batata hai ki type ke paas kam se kam kya hona hi chahiye. Rules: parameter khud use karo constraint ki jagah, kam parameters, har parameter kam se kam do jagah."],
["keyof, typeof aur indexed access (T[K]) ka kya kaam hai?","keyof T keys ka literal union deta hai. typeof (type position me) kisi value ka type uthata hai — ReturnType&lt;typeof fn&gt; iska mashhoor use hai. T[K] kisi property ka type lookup karta hai; typeof arr[number] array literal se element type nikaalne ka standard trick hai. Teeno milkar mapped types ki neev hain."],
["Conditional types aur infer samjhao.","Form: T extends U ? X : Y. Generics par ye union ke har member par distribute hota hai (rokna ho to [T] extends [U] lapeto). infer true branch me naya type variable declare karta hai — Flatten&lt;T&gt; = T extends Array&lt;infer Item&gt; ? Item : T. ReturnType, Parameters jaise utilities isi par bane hain; overloads par inference last signature leti hai."],
["Mapped types se Partial/Readonly khud kaise bane hain?","Partial&lt;T&gt; = { [K in keyof T]?: T[K] } — keyof par iterate karke har property optional. Readonly me readonly modifier judta hai. Modifiers ko -readonly / -? se hata bhi sakte ho, aur as ke saath keys remap kar sakte ho (getters banane wala pattern). Utility types ki poori family isi mechanism par khadi hai."],
["Template literal types kahan kaam aate hain?","String patterns ko type banana: event naam `${keyof T & string}Changed`, route/key formats, case transforms (Uppercase/Capitalize intrinsic types). Interpolation me unions cross-multiply hote hain — bade unions par combinations phatt sakte hain, wahan dhyaan do. Generic inference template ko tod kar key bhi nikaal sakti hai."],
["Enums use karun ya union of literals / const object?","Enums runtime objects hain — numeric par reverse mapping milti hai, string enums readable hain. Lekin ye TS-only syntax hai; modern codebases aksar \"a\" | \"b\" literal unions ya const obj as const + typeof pattern prefer karte hain taaki code pure JS ke aligned rahe. const enums isolatedModules se takrate hain — kai teams unhe ban karti hain."],
["strict mode kya-kya on karta hai?","strict ek saath poori family on karta hai: noImplicitAny, strictNullChecks, strictFunctionTypes, strictPropertyInitialization, noImplicitThis, strictBindCallApply, alwaysStrict, useUnknownInCatchVariables, strictBuiltinIteratorReturn. Naye projects me strict: true default hona chahiye; purane codebases me flags ek-ek karke on karke migrate karte hain."],
["strictNullChecks off ho to kya hota hai?","null aur undefined har type me assignable ho jate hain — missing-property aur find() ke undefined jaise bugs runtime tak chhup jate hain. Ise Tony Hoare ne 'billion dollar mistake' kaha tha. On karne par null/undefined ko unions me explicitly likhna aur use se pehle narrow karna padta hai."],
["as assertion aur non-null ! kitne safe hain?","Dono compile-time only hain — runtime par koi check nahi hota. Galat assertion chup-chaap galat value aage bhej deti hai. Assertion sirf overlapping types par allowed hai; bilkul alag types ke liye pehle unknown se guzarna padta hai (double assertion — code smell). Pakka yakeen ho tabhi use karo; warna narrowing likho."],
["Excess property checks kab lagte hain?","Sirf fresh object literals par — assign ya argument pass karte waqt unknown property error banti hai (colour/color wale typos yahi pakadte hain). Variable pehle bana kar pass karne par check nahi lagta (lekin zero-overlap par 'no properties in common' error aata hai). Workarounds: assertion, index signature — par pehle ye samjho ki zyadaatar ye errors asli bugs hote hain."],
["Declaration merging kya hai?","Same naam ki declarations ko compiler ek me jod deta hai. Interfaces merge hote hain (baad wali ko overload precedence), namespaces jud jate hain, class ke saath interface/namespace jod sakte ho — lekin class-class merge mana hai. Isi se module augmentation aur global augmentation (declare global) kaam karte hain."],
[".d.ts file kya hoti hai aur @types kahan se aata hai?",".d.ts sirf type declarations rakhti hai — JS library ke liye type contract. Library khud bundle kare to package.json ke types field se milti hai; warna community ke DefinitelyTyped repo se @types/<naam> package install hota hai. JSDoc wali JS se tsc khud .d.ts generate bhi kar sakta hai (allowJs + declaration + emitDeclarationOnly)."],
["import type kyun zaroori hai?","Type-only imports ko guarantee se elide karna Babel/swc/esbuild jaise single-file transpilers ke liye zaroori hai — warna wo runtime par exist na karne wale naam import karne ki koshish kar sakte hain. verbatimModuleSyntax on ho to bina type modifier wale imports hamesha emit hote hain, isliye type imports ko explicitly mark karna aur bhi zaroori ho jata hai."],
["Node project ke liye sahi module/moduleResolution kya hai?","Sirf node16, node18 ya nodenext — ye Node ke dual-format system (extension + package.json type se detection) ko sahi model karte hain. esnext/commonjs emitted JS same dikha sakte hain lekin checking galat hogi. Bundler app ke liye module: esnext + moduleResolution: bundler; library ke liye node18 strictest raasta hai."],
["esModuleInterop kya karta hai?","CJS/ESM interop ko transpiler ecosystem se align karta hai: __importDefault/__importStar helpers se default import __esModule dekh kar sahi cheez se link hota hai, aur namespace imports hamesha objects bante hain. CJS apps me hamesha on rakho; allowSyntheticDefaultImports akele (checking badle, emit na badle) unsafe hai."],
["tsconfig me include/exclude ka sabse bada gotcha kya hai?","exclude sirf include ki glob-khoj ko badalta hai — import, /// reference ya files se program me aayi file ko wo rok nahi sakta. Dusra gotcha: command line par files dene se tsconfig poori tarah ignore ho jata hai. Aur extends me references inherit nahi hota, baaki sab hota hai."],
["Project references aur tsc -b kyun?","Bade codebases ko chhote composite projects me baantne ke liye — har project apni .d.ts boundary deta hai, builds incremental aur tez hote hain, editor halka rehta hai. Plain tsc referenced projects ko build nahi karta; tsc -b orchestrator hai jo out-of-date projects ko dependency order me build karta hai aur effectively noEmitOnError jaisa behave karta hai."],
["Babel/Vite ke saath TS use karun to type checking kahan gayi?","Transpile-only tools (Babel, Vite, swc, esbuild) types strip karte hain, check nahi karte — galtiyaan seedha production ja sakti hain. Hamesha saath me tsc --noEmit chalao (CI/editor me), aur isolatedModules on rakho taaki per-file transpilation unsafe patterns (const enum references, type re-exports) pakde jayein."],
["readonly aur const me kya farak hai?","const binding ko reassign hone se rokta hai, value ko mutate hone se nahi. readonly property ko (type-checking ke dauran) re-write hone se rokta hai, lekin nested mutation (home.resident.age++) chalti hai aur compatibility check me readonly ignore hota hai. Sachi deep immutability TS me koi nahi deta — Readonly&lt;T&gt; bhi shallow hai."],
["Tuples kab use karun, arrays kab?","Jab length fixed ho aur har position ka type alag/maloom ho — return pairs, function arguments (rest parameters tuples hi hain), coordinates. Optional elements sirf end me, rest elements beech me bhi chal sakte hain. as const se readonly tuple banta hai jo mutable tuple ko assign nahi hota — ye gotcha kaiyon ko phansata hai."],
["Decorators — stage 2 aur stage 3 me kya farak hai?","Handbook page stage-2 (experimental, experimentalDecorators flag) document karta hai. TS 5.0 se stage-3 standard decorators supported hain — inka semantics alag hai (koi parameter decorators nahi, naya context object). Interview me ye batana strong point hai ki tumhe pata hai docs page purane experimental design par hai aur emitDecoratorMetadata/reflect-metadata usi duniya ke hain."],
["Classes me private (#) aur private keyword me farak?","private/protected sirf compile-time hain — runtime par property lookup/bracket notation se access ho jata hai (soft private). # fields hard private hain — compilation ke baad bhi private rehte hain (purane targets par WeakMap se). Asli runtime privacy chahiye to # ya closures/WeakMaps use karo."],
["satisfies operator kya karta hai? (JSDoc @satisfies bhi)","satisfies value ko ek type ke against check karta hai bina uska inferred type badle — literal/widened type wahi rehta hai jo inference ne diya tha, lekin galti pakdi jati hai. @type annotation type ko badal deti hai; satisfies sirf verify karta hai. JSDoc me bhi @satisfies wahi kaam karta hai."]
];

  var cf=e.target.closest("[data-cfg]");
  if(cf){ var c=cf.getAttribute("data-cfg"), out="";
    if(c==="bundler") out='{\n  "compilerOptions": {\n    "module": "esnext",\n    "moduleResolution": "bundler",\n    "esModuleInterop": true,\n    "noEmit": true,\n    "verbatimModuleSyntax": true,\n    "allowImportingTsExtensions": true\n  }\n}\n→ Bundler host hai; TS sirf check karta hai, emit bundler ka kaam.';
    if(c==="node") out='{\n  "compilerOptions": {\n    "module": "nodenext",\n    "verbatimModuleSyntax": true,\n    "strict": true\n  }\n}\n→ nodenext moduleResolution + esModuleInterop + target khud imply kar deta hai.\nESM chahiye to package.json me "type": "module" rakho.';
    if(c==="library") out='{\n  "compilerOptions": {\n    "module": "node18",\n    "target": "es2020",\n    "strict": true,\n    "verbatimModuleSyntax": true,\n    "declaration": true,\n    "sourceMap": true,\n    "declarationMap": true,\n    "rootDir": "src",\n    "outDir": "dist"\n  }\n}\n→ Strictest settings — library har consumer ke host par chalegi.';
    setOut("lab10out",out); document.querySelectorAll("#lab10 .chipbtn").forEach(function(x){x.classList.remove("sel");}); cf.classList.add("sel"); return;
  }
});
