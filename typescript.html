<title>TypeScript SPA — Poora TypeScript, Hinglish me</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#121316; --bg2:#0d0e11; --surface:#1b1b1f; --surface2:#292a2d; --border:#343538;
  --text:#e3e2e6; --muted:#c1cab0; --dim:#8b947d;
  --lime:#9ee939; --lime2:#84cc16; --lime-soft:#acf847; --blue:#7bd0ff; --blue2:#a1dbff;
  --danger:#ffb4ab;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Inter",system-ui,sans-serif;font-size:16px;line-height:1.65}
h1,h2,h3{font-family:"Plus Jakarta Sans","Inter",sans-serif;line-height:1.25;margin:0}
code,kbd{font-family:"JetBrains Mono",monospace}
a{color:var(--blue2)}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px}

/* ---------- Top bar (mobile) ---------- */
.topbar{display:none;position:sticky;top:0;z-index:60;background:var(--bg2);border-bottom:1px solid var(--border);padding:10px 14px;align-items:center;gap:12px}
.topbar .tb-title{font-family:"JetBrains Mono",monospace;font-size:14px;color:var(--lime);letter-spacing:.04em}
.menu-btn{background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:8px;min-width:44px;min-height:44px;font-size:20px;line-height:1}

/* ---------- Layout ---------- */
.layout{display:flex;align-items:flex-start}
.sidebar{width:308px;flex:0 0 308px;position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--bg2);border-right:1px solid var(--border);padding:20px 14px 32px}
.sidebar .brand{font-family:"JetBrains Mono",monospace;font-size:13px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase;padding:0 8px}
.sidebar .brand b{display:block;font-family:"Plus Jakarta Sans",sans-serif;font-size:22px;color:var(--text);letter-spacing:0;text-transform:none;margin-top:4px}
.sidebar .brand b span{color:var(--lime)}
.search-wrap{padding:12px 8px 4px}
.search-wrap input{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:11px 12px;font-size:15px;min-height:44px}
.search-wrap input::placeholder{color:var(--dim)}
.nav-group{margin-top:18px}
.nav-group h3{font-family:"JetBrains Mono",monospace;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);padding:0 8px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.nav-group h3 .gcount{color:var(--lime2);border:1px solid var(--border);border-radius:20px;padding:1px 8px;font-size:11px}
.nav-item{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:transparent;border:0;border-radius:8px;color:var(--text);padding:9px 8px;min-height:44px;font-size:14.5px;line-height:1.4}
.nav-item:hover{background:var(--surface)}
.nav-item.active{background:var(--surface2);box-shadow:inset 3px 0 0 var(--lime)}
.chip{font-family:"JetBrains Mono",monospace;font-size:11px;font-weight:600;color:#121f00;background:var(--lime);border-radius:5px;padding:2px 6px;margin-top:2px;white-space:nowrap}
.chip.ghost{background:var(--surface2);color:var(--lime);border:1px solid var(--border)}
.nav-item .nt{flex:1}
.progress-wrap{padding:14px 8px 0}
.progress-wrap .plabel{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--dim);letter-spacing:.08em;display:flex;justify-content:space-between}
.progress{height:8px;background:var(--surface2);border-radius:6px;margin-top:6px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--lime2);width:0%}

.main{flex:1;min-width:0;padding:34px 30px 70px}
.wrap{max-width:860px;margin:0 auto}
article.lesson{display:none}
article.lesson.show{display:block}
.crumb{font-family:"JetBrains Mono",monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--lime);margin-bottom:10px}
article.lesson h2{font-size:32px;font-weight:800;margin-bottom:8px}
.lede{color:var(--muted);font-size:16.5px;margin:0 0 22px}
.point{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin:0 0 12px}
.point p{margin:0}
.point b{color:var(--lime-soft)}
pre{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:16px;overflow-x:auto;margin:0 0 16px}
pre code{font-size:13.5px;line-height:1.6;color:#d8e6c3;white-space:pre}
.takeaway{background:#1f2b10;border:1px solid #416900;border-radius:10px;padding:14px 16px;margin:0 0 16px}
.takeaway .tk-label{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.12em;color:var(--lime);text-transform:uppercase;display:block;margin-bottom:4px}
.takeaway p{margin:0}
.source-box{background:var(--surface);border:1px dashed var(--dim);border-radius:10px;padding:12px 16px;margin:22px 0 8px;font-size:14px;word-break:break-all}
.source-box .s-label{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.12em;color:var(--blue);text-transform:uppercase;display:block;margin-bottom:2px}
.pager{display:flex;gap:12px;margin-top:26px;flex-wrap:wrap}
.pager button{flex:1;min-width:200px;min-height:52px;background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:12px 16px;text-align:left;font-size:14.5px}
.pager button:hover{border-color:var(--lime2)}
.pager button .dir{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--lime);letter-spacing:.1em;text-transform:uppercase;display:block}
.pager button:disabled{opacity:.35;cursor:default}
.done-btn{background:transparent;border:1px solid var(--lime2);color:var(--lime);border-radius:8px;min-height:44px;padding:10px 18px;font-size:14.5px;margin-top:14px}
.done-btn.is-done{background:var(--lime2);color:#121f00;font-weight:600}

/* ---------- Labs ---------- */
.lab{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;margin:0 0 20px}
.lab h3{font-size:20px;margin-bottom:6px}
.lab .lab-tag{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--lime);letter-spacing:.12em;text-transform:uppercase}
.lab p{color:var(--muted)}
.lab select,.lab input[type="text"]{background:var(--bg2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:15px;min-height:44px;font-family:"JetBrains Mono",monospace}
.lab textarea{width:100%;background:var(--bg2);color:#d8e6c3;border:1px solid var(--border);border-radius:8px;padding:12px;font-family:"JetBrains Mono",monospace;font-size:13.5px;line-height:1.6;min-height:110px}
.lab .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0}
.lab .go{background:var(--lime2);color:#121f00;border:0;border-radius:8px;min-height:44px;padding:10px 20px;font-weight:600;font-size:15px}
.lab .ghost-btn{background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:8px;min-height:44px;padding:10px 16px;font-size:14.5px}
.lab .out{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:14px 16px;font-family:"JetBrains Mono",monospace;font-size:14px;white-space:pre-wrap;word-break:break-word;min-height:52px}
.lab .out .ok{color:var(--lime)} .lab .out .err{color:var(--danger)} .lab .out .inf{color:var(--blue2)}
.chipbtn{background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:20px;min-height:40px;padding:8px 16px;font-size:14px;font-family:"JetBrains Mono",monospace}
.chipbtn.sel{background:var(--lime2);color:#121f00;border-color:var(--lime2);font-weight:600}

/* ---------- FAQ ---------- */
.faq-item{background:var(--surface);border:1px solid var(--border);border-radius:10px;margin:0 0 12px;overflow:hidden}
.faq-item summary{padding:16px;min-height:52px;cursor:pointer;font-weight:600;font-size:16px;list-style:none;display:flex;gap:10px;align-items:flex-start}
.faq-item summary::-webkit-details-marker{display:none}
.faq-item summary .qn{font-family:"JetBrains Mono",monospace;color:var(--lime);font-size:13px;margin-top:3px}
.faq-item .fa{padding:0 16px 16px 46px;color:var(--muted)}
.faq-item .fa p{margin:0 0 8px}
.faq-item .fa code{color:var(--lime-soft);font-size:.92em}

/* ---------- Sources / Trust ---------- */
.src-list{margin:0;padding:0;list-style:none}
.src-list li{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 14px;margin:0 0 8px;font-size:13.5px;word-break:break-all;display:flex;gap:10px;align-items:flex-start}
.src-list .chip{margin-top:1px}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th,td{border:1px solid var(--border);padding:10px 12px;text-align:left;vertical-align:top}
th{background:var(--surface2);font-family:"JetBrains Mono",monospace;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
td{background:var(--surface)}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:18px 0}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;text-align:center}
.stat .num{font-family:"JetBrains Mono",monospace;font-size:30px;font-weight:600;color:var(--lime);display:block}
.stat .lbl{font-size:13px;color:var(--muted)}
.check-result{font-family:"JetBrains Mono",monospace;font-size:16px;padding:16px;border-radius:10px;margin-top:14px;display:none}
.check-result.pass{display:block;background:#1f2b10;border:1px solid var(--lime2);color:var(--lime)}
.check-result.fail{display:block;background:#3a1512;border:1px solid var(--danger);color:var(--danger)}
.note-list li{margin-bottom:8px;color:var(--muted)}
.note-list li b{color:var(--text)}
footer.foot{color:var(--dim);font-size:13px;text-align:center;padding:26px 10px 0;font-family:"JetBrains Mono",monospace}

@media (max-width:900px){
  .topbar{display:flex}
  .sidebar{position:fixed;left:0;top:0;z-index:80;width:86vw;max-width:320px;transform:translateX(-105%);transition:transform .25s ease;display:none}
  .sidebar.open{display:block;transform:translateX(0)}
  .main{padding:22px 16px 60px}
  article.lesson h2{font-size:26px}
  .faq-item .fa{padding-left:16px}
  pre code{white-space:pre-wrap;overflow-wrap:anywhere}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.sidebar{transition:none}}
</style>

<script>
"use strict";
/* ================= DATA — 74 docs pages ================= */
var GROUPS=["Get Started","Handbook","Reference","Modules Reference","Tutorials","Declaration Files","JavaScript","Project Configuration","Docs Home","Setup"];
var S=[
{n:1,g:0,t:"TS for the New Programmer",u:"https://www.typescriptlang.org/docs/handbook/typescript-from-scratch.html",
p:["JavaScript chhoti browser scripting language se badi apps tak pahunch gayi, lekin uske quirks bhi saath aaye — <b><code>\"\" == 0</code> true hai</b>, aur galat property naam (<code>obj.heigth</code>) error ki jagah chup-chaap <code>NaN</code> de deta hai.",
"<b>Static checking</b> matlab code ko bina run kiye galti pakadna. <b>Static type checking</b> me galti values ke <i>kinds</i> (types) se judge hoti hai — TypeScript yahi karta hai: run se pehle, types ke basis par errors.",
"TypeScript <b>JavaScript ka typed superset</b> hai: saara JS syntax valid TS hai, TS sirf ye extra rules jodta hai ki kis type ki value kahan use ho sakti hai. <code>console.log(4 / [])</code> JS me <code>Infinity</code> dega, TS error dega.",
"<b>Runtime behavior kabhi nahi badalta</b> — TS check ke baad types ko <b>erase</b> kar deta hai; emitted JS bilkul waisa hi chalta hai. TS koi runtime library bhi nahi jodta.",
"Isiliye TS seekhne ke liye pehle JS aana zaroori hai — syntax aur runtime dono shared hain."],
c:"const obj = { width: 10, height: 15 };\n// Error: Property 'heigth' does not exist on type\n// '{ width: number; height: number; }'.\n// Did you mean 'height'?\nconst area = obj.width * obj.heigth;",
k:"TS = JS + static type checking. Types sirf compile time par hain; run time par sab erase ho jata hai."},
{n:2,g:0,t:"TypeScript for JS Programmers",u:"https://www.typescriptlang.org/docs/handbook/typescript-in-5-minutes.html",
p:["Jo JS code pehle se chal raha hai, wo TS code bhi hai — TS uske upar <b>type system ki extra layer</b> jodta hai aur unexpected behavior ko pehle hi highlight kar deta hai.",
"<b>Types by inference:</b> <code>let helloWorld = \"Hello World\"</code> likhte hi TS khud samajh jata hai ki type <code>string</code> hai. Common cases me extra syntax ki zaroorat hi nahi.",
"Object ka shape batane ke liye <b><code>interface</code></b> use hota hai. Galat property doge to error: <i>Object literal may only specify known properties</i>. Interfaces classes aur function parameters/returns par bhi lagte hain.",
"Primitives ke alawa TS jodta hai: <code>any</code> (sab allow), <code>unknown</code> (use se pehle khud declare karo kya hai), <code>never</code> (jo kabhi ho hi nahi sakta), <code>void</code> (kuch return nahi). Heuristic: pehle <code>interface</code> prefer karo, specific feature chahiye to <code>type</code>.",
"<b>Unions</b> se ek value kai types me se ek ho sakti hai — <code>\"open\" | \"closed\"</code> jaise literal unions bhi. <code>typeof</code> aur <code>Array.isArray</code> se union ko <b>narrow</b> karke use karte hain.",
"<b>Generics</b> = types ke andar variable: <code>Array&lt;string&gt;</code>, ya apna <code>Backpack&lt;Type&gt;</code> — galat type doge to compile time par error.",
"<b>Structural typing (duck typing):</b> TS naam nahi, <b>shape</b> dekhta hai. Jisme <code>x, y</code> hain wo <code>Point</code> hai — declare kiya ho ya na ho. Extra fields bhi chal jate hain."],
c:"interface User { name: string; id: number; }\nconst user: User = { name: \"Hayes\", id: 0 };\n\ntype WindowStates = \"open\" | \"closed\" | \"minimized\";\n\ninterface Backpack<Type> {\n  add: (obj: Type) => void;\n  get: () => Type;\n}\ndeclare const backpack: Backpack<string>;\nbackpack.add(23); // Error: number, string nahi hai",
k:"Inference, interface, union + narrowing, generics aur structural typing — ye paanch cheezein TS ki neev hain."},
{n:3,g:0,t:"TS for Java/C# Programmers",u:"https://www.typescriptlang.org/docs/handbook/typescript-in-5-minutes-oop.html",
p:["Java/C# walo ko TS se wahi fayde milte hain — better completion, jaldi errors, saaf communication — lekin JS ka model alag hai: <b>functions kahin bhi reh sakte hain</b>, data bina class ke freely pass hota hai. Singleton/static-class patterns TS me zaroori nahi.",
"<b>Nominal systems (Java/C#)</b> me har value ka ek exact type hota hai, types runtime par exist karte hain (<code>getClass()</code>), aur do same-shape classes bina inheritance ke ek dusre ki jagah nahi aa sakti.",
"<b>TS me types = sets.</b> Ek value ek saath kai sets ki member ho sakti hai. <code>string | number</code> bas do sets ka union hai — isiliye union/intersection TS me itne natural hain.",
"Types <b>erased aur structural</b> hain: jo object interface ki shape satisfy kare, wahi chalega — declared relationship ki zaroorat nahi. <code>Pointlike</code> runtime par exist hi nahi karta.",
"Consequences: <b>empty class <code>class Empty {}</code> sab kuch accept kar leti hai</b> (koi property hi nahi jo fail ho), aur same-shape wali <code>Car</code>/<code>Golfer</code> classes ek dusre me assign ho jati hain — ye bug nahi, structural system ka nature hai.",
"<b>Reflection nahi hai:</b> generic type info runtime par erase ho jati hai. <code>typeof (new Car())</code> sirf <code>\"object\"</code> dega, <code>Car</code> nahi."],
c:"class Empty {}\nfunction fn(arg: Empty) { return arg; }\nfn({ k: 10 }); // OK! Empty ke paas koi property nahi jo miss ho\n\nclass Car { drive() {} }\nclass Golfer { drive() {} }\nlet w: Car = new Golfer(); // Koi error nahi — shapes same hain",
k:"Nominal → structural, reified → erased, class → set: Java/C# walo ko ye teen switch samajhne hain."},
{n:4,g:0,t:"TS for Functional Programmers",u:"https://www.typescriptlang.org/docs/handbook/typescript-in-5-minutes-func.html",
p:["Haskell/ML walo ke liye: TS ke types postfix hain — <code>x: string</code> (C-style), aur type system JS code ko model karne ke liye bana hai: powerful, interesting, thoda messy.",
"Key types: <code>unknown</code> = top type, <code>never</code> = bottom type, tuples <code>[T, T]</code> fixed-length lekin mutable hain, aur <code>[T, T]</code>, <code>T[]</code> ka subtype hai. Boxed types (<code>Number</code>) primitive (<code>number</code>) se alag hain — primitives hi use karo.",
"<b><code>any</code> = gradual typing ka escape hatch:</b> checker band ho jata hai, aur <code>any</code> <b>contagious</b> hai — jahan jayega wahan checking khatm. <code>noImplicitAny</code> / <code>strict</code> on karke isko roko.",
"<b>Unions untagged hain</b> (Haskell <code>data</code> jaise nahi) — discriminate karne ke liye <code>typeof</code>, <code>Array.isArray</code> jaise runtime predicates chahiye. Naye code ke liye <b>discriminated unions</b> banao.",
"<b>Literal widening:</b> <code>let s = \"right\"</code> ka type <code>string</code> ban jata hai, isliye <code>\"left\" | \"right\"</code> wale parameter me fail hoga — annotation ya <code>as const</code> se fix karo.",
"<b>Contextual typing:</b> inference ulta bhi chalta hai — <code>map</code> ke callback ke parameter ka type array se infer ho jata hai, recursively bhi.",
"<code>const</code> reference ko immutable banata hai, referent ko nahi. Sachi immutability ke liye <code>readonly</code>, <code>Readonly&lt;T&gt;</code>, <code>readonly T[]</code> aur <code>as const</code>. Higher-kinded types (<code>T&lt;U&gt;</code>) TS me nahi hain."],
c:"let anys: any[] = [];\nanys.push(1); anys.push(\"oh no\"); // sab chalega\nlet sepsis = anys[0] + anys[1]; // sepsis bhi any — contagion!\n\ntype FString = string & { __compileTimeOnly: any };\n// ^ newtype jaisa trick: string me assign hoga, ulta nahi",
k:"any contagious hai, unions untagged hain, literals widen hote hain — FP walo ke liye ye teen gotchas sabse bade hain."},
{n:5,g:0,t:"TypeScript Tooling in 5 minutes",u:"https://www.typescriptlang.org/docs/handbook/typescript-tooling-in-5-minutes.html",
p:["Install: <code>npm install -g typescript</code> ya Visual Studio plugins se. Pehli file <code>greeter.ts</code> me plain JS bhi chalega — <code>.ts</code> extension hi kaafi hai.",
"<code>tsc greeter.ts</code> compile karke <code>greeter.js</code> banata hai. <b>Type annotation</b> contract record karta hai: <code>greeter(person: string)</code> ko array doge to compile time par <code>error TS2345</code>.",
"Yaad rakho: <b>errors emit ko nahi rokte</b> — galat code par bhi <code>greeter.js</code> ban jata hai (jab tak <code>noEmitOnError</code> na lagao). TS maanta hai ki tum JS se migrate kar rahe ho.",
"<b>Interfaces</b> shape describe karte hain — object ko bas wo shape rakhna hai, explicit <code>implements</code> zaroori nahi (structural compatibility).",
"<b>Classes</b> me constructor parameter par <code>public</code> lagana shorthand hai — usi naam ki property khud ban jati hai. Classes JS ke prototype model ka hi shorthand hain, emitted JS same rehta hai.",
"Editor tooling hi asli jaadu hai: hover par inferred types, completion lists, F12 go-to-definition, rename refactoring — sab type-checker se powered."],
c:"function greeter(person: string) {\n  return \"Hello, \" + person;\n}\nlet user = [0, 1, 2];\n// error TS2345: Argument of type 'number[]' is not\n// assignable to parameter of type 'string'.\ndocument.body.textContent = greeter(user);\n// Phir bhi greeter.js emit ho jayega!",
k:"tsc = check + emit. Errors ke bawjud emit hona migration-friendly design hai, bug nahi."},
{n:6,g:1,t:"The TypeScript Handbook",u:"https://www.typescriptlang.org/docs/handbook/intro.html",
p:["JS chhoti scripts se har size ki apps tak badh gaya, lekin code units ke beech relationships express karne ki taqat utni nahi badhi — isiliye bade JS codebases manage karna mushkil hota hai. Sabse common programmer errors asal me <b>type errors</b> hote hain.",
"TypeScript ka goal ek line me: <b>JavaScript programs ke liye static typechecker</b> — code run hone se pehle (static) types check karna.",
"Handbook ke do hisse hain: <b>(1) The Handbook</b> — everyday programmer ke liye comprehensive guide, upar se neeche padhne layak. <b>(2) Reference Files</b> — ek-ek concept ki gehri explanation, bina continuity ke.",
"Handbook khatm karke tum: common TS syntax/patterns padh aur samajh sakoge, important compiler options ka effect bata sakoge, aur zyadaatar cases me type system ka behavior sahi predict kar sakoge.",
"Non-goals bhi saaf hain: ye JS basics (functions, classes, closures) nahi sikhata, language spec nahi hai, aur webpack/React/Babel jaise tools ke saath interaction iske scope me nahi."],
c:"",
k:"Handbook = roz ke TS ki complete guide; Reference = ek concept, gehrai me. JS basics pehle se aani chahiye."},
{n:7,g:1,t:"The Basics",u:"https://www.typescriptlang.org/docs/handbook/2/basic-types.html",
p:["Ek <b>type</b> batata hai ki kaunsi values function ko pass ho sakti hain aur kaunsi crash karengi. JS me ye sirf run karke pata chalta hai (dynamic typing); TS pehle se predict karta hai (static typing).",
"<code>message()</code> jahan <code>message</code> ek string hai — TS run se pehle hi error dega: <i>This expression is not callable.</i>",
"<b>Non-exception failures:</b> JS missing property par throw nahi karta, <code>undefined</code> deta hai — TS phir bhi flag karta hai. Typos (<code>toLocaleLowercase</code>), uncalled functions (<code>Math.random &lt; 0.5</code>) aur unreachable logic bhi pakda jata hai.",
"Type-checker hi editor tooling ko power karta hai — completions, quick fixes, refactorings, find-all-references, sab isi par bane hain.",
"<code>tsc hello.ts</code>: error nahi to chup-chaap saaf, readable <code>hello.js</code> emit. Error ho to bhi emit (default) — <code>tsc --noEmitOnError</code> se roko.",
"<b>Erased types:</b> output me annotations gayab — runtime behavior par types ka zero asar. <b>Downleveling:</b> naya JS purane target (default ES5) me rewrite hota hai; <code>--target es2015</code> se template strings bache rehte hain.",
"<b>Strictness ek dial hai, switch nahi:</b> default lenient (migration ke liye), <code>\"strict\": true</code> se saare strict flags ek saath on. Do sabse bade: <code>noImplicitAny</code> aur <code>strictNullChecks</code> (null/undefined ki galti — 'billion dollar mistake')."],
c:"const message = \"hello!\";\nmessage();\n// Error: This expression is not callable.\n// Type 'String' has no call signatures.\n\nfunction greet(person: string, date: Date) { /* ... */ }\ngreet(\"Maddison\", Date()); // Error: Date() string deta hai\ngreet(\"Maddison\", new Date()); // OK",
k:"Static checking + erased types + strict dial — TS ka pura philosophy is ek page me hai."},
{n:8,g:1,t:"Everyday Types",u:"https://www.typescriptlang.org/docs/handbook/2/everyday-types.html",
p:["Primitives: <code>string</code>, <code>number</code> (int/float ka koi farak nahi), <code>boolean</code>. Capital wale <code>String/Number/Boolean</code> boxed types hain — hamesha lowercase use karo. Arrays: <code>number[]</code> ya <code>Array&lt;number&gt;</code> — dono same; <code>[number]</code> tuple hai, array nahi.",
"<code>any</code> saari checking band kar deta hai — kabhi-kabhi kaam ka, lekin khatarnak. <code>noImplicitAny</code> un jagahon ko flag karta hai jahan TS chup-chaap <code>any</code> maan leta.",
"Annotations hamesha cheez ke <b>baad</b> aate hain (<code>let myName: string</code>), aur zyadaatar inference se kaam chal jata hai — jitna sochoge usse kam annotations lagegi. Functions me parameter aur return annotations; async ke liye <code>Promise&lt;number&gt;</code>.",
"<b>Optional properties</b> (<code>last?: string</code>) padhne par <code>string | undefined</code> milta hai — use se pehle check zaroori. <b>Unions</b> (<code>number | string</code>) par sirf wahi operations chalengi jo HAR member par valid hon.",
"<b>Type alias vs interface:</b> interface hamesha extendable/re-openable hai (declaration merging), type re-open nahi hota. Interface <code>extends</code> se, type intersection (<code>&amp;</code>) se extend hota hai. Heuristic: <code>interface</code> jab tak <code>type</code> ki feature na chahiye.",
"<b>Type assertions</b> (<code>as</code>) compile time par hat jati hain — <b>koi runtime check nahi</b>. Galat assertion chup-chaap galat value dega. Sirf overlapping types par allowed hai.",
"<b>Literal types:</b> <code>let</code> widen karta hai (<code>string</code>), <code>const</code> literal rakhta hai. <code>\"left\" | \"right\" | \"center\"</code> jaise unions aur <code>as const</code> (poora object literal types me badal deta hai) roz ke kaam ke hain.",
"<code>strictNullChecks</code> on ho to <code>null</code>/<code>undefined</code> ko narrow karke hi use karo. <b>Non-null assertion <code>!</code></b> (<code>x!.toFixed()</code>) koi runtime check nahi karta — sirf pakka yakeen ho tabhi. <code>bigint</code> aur <code>symbol</code> kam-common primitives hain; enums runtime feature hain (Enums section dekho)."],
c:"function printCoord(pt: { x: number; y: number }) {}\nfunction printName(obj: { first: string; last?: string }) {\n  if (obj.last !== undefined) { console.log(obj.last); }\n}\ntype ID = number | string;\nconst req = { url: \"https://example.com\", method: \"GET\" } as const;\n// req.method ab \"GET\" literal hai, string nahi",
k:"any se bacho, interface pehle, as/! par runtime bharosa mat karo, aur as const literal widening ka ilaaj hai."},
{n:9,g:1,t:"Narrowing",u:"https://www.typescriptlang.org/docs/handbook/2/narrowing.html",
p:["<b>Narrowing</b> = control flow dekh kar declared type ko kisi point par zyada specific type me badalna. TS JS ke <code>if/else</code>, loops, truthiness aur assignments par type analysis overlay karta hai. Jo checks narrowing karte hain unhe <b>type guards</b> kehte hain.",
"<b><code>typeof</code> guards:</b> sirf <code>\"string\" \"number\" \"bigint\" \"boolean\" \"symbol\" \"undefined\" \"object\" \"function\"</code> return hote hain. Gotcha: <code>typeof null === \"object\"</code> — isliye <code>string | string[] | null</code> par object-check sirf <code>string[] | null</code> tak narrow karega.",
"<b>Truthiness:</b> falsy values hain <code>0, NaN, \"\", 0n, null, undefined</code>. Pitfall: poori body ko <code>if (strs)</code> me lapetne se empty-string case chup-chaap skip ho jata hai — TS complain nahi karega.",
"<b>Equality:</b> <code>===</code>/<code>switch</code> common type par narrow karte hain. <code>x == null</code> ek saath <code>null</code> AUR <code>undefined</code> dono hata deta hai.",
"<code>in</code> operator (<code>\"swim\" in animal</code>), <code>instanceof</code> (prototype chain) aur <b>assignments</b> (observed type badalta hai, lekin assignability hamesha declared type se check hoti hai) — sab narrowing karte hain.",
"<b>Type predicates:</b> apna guard banao — <code>function isFish(pet: Fish | Bird): pet is Fish</code>. <code>filter</code> ke saath <code>Fish[]</code> milta hai. Classes me <code>this is Type</code> bhi chalta hai.",
"<b>Discriminated unions:</b> har member me common property par alag literal (<code>kind: \"circle\"</code>) — check karte hi sahi member narrow. Ek hi interface me optional <code>radius?</code>/<code>sideLength?</code> rakhna bad encoding hai.",
"<b>Exhaustiveness:</b> sab possibilities khatm ho jayein to type <code>never</code> ban jata hai. <code>default: const _exhaustiveCheck: never = shape;</code> — naya union member judte hi error, taaki koi case miss na ho."],
c:"function padLeft(padding: number | string, input: string) {\n  if (typeof padding === \"number\") {\n    return \" \".repeat(padding) + input; // padding: number\n  }\n  return padding + input; // padding: string\n}\ninterface Circle { kind: \"circle\"; radius: number; }\ninterface Square { kind: \"square\"; sideLength: number; }\ntype Shape = Circle | Square;",
k:"typeof, truthiness, ==, in, instanceof, predicates, discriminated unions, never-check — narrowing ki poori toolkit yahi hai."},
{n:10,g:1,t:"More on Functions",u:"https://www.typescriptlang.org/docs/handbook/2/functions.html",
p:["<b>Function type expressions:</b> <code>(a: string) =&gt; void</code> — parameter ka NAAM zaroori hai; <code>(string) =&gt; void</code> ka matlab hai parameter named <code>string</code> of type <code>any</code>! Alias bana lo: <code>type GreetFunction = (a: string) =&gt; void</code>.",
"Functions me properties bhi ho sakti hain — <b>call signatures</b> object type me likhte hain (<code>:</code> se, <code>=&gt;</code> se nahi). <b>Construct signatures</b> (<code>new (s: string): T</code>) <code>Date</code> jaise callable+constructible values ke liye.",
"<b>Generic functions</b> input-output types ko jodte hain: <code>firstElement&lt;Type&gt;(arr: Type[]): Type | undefined</code> — call site par inference khud type nikaal leta hai. <b>Constraints</b> (<code>Type extends { length: number }</code>) batate hain ki type ke paas kam se kam kya hona chahiye.",
"Constraint wali common galti: function SAME type return karne ka vaada karta hai, sirf constraint match karne wala nahi — isliye <code>{ length: minimum }</code> return karna error hai.",
"<b>Achhe generics ke 3 rules:</b> (1) type parameter ko constraint ki jagah khud use karo (push down), (2) kam se kam type parameters, (3) har type parameter kam se kam do jagah appear ho — ek jagah wala parameter bekaar hai.",
"<b>Optional parameters</b> ka type <code>T | undefined</code> hota hai. Callback pitfall: callback type me optional parameter likhna matlab implementation use pass hi na kare — rule: jab tak bina us argument ke call karne ka iraada na ho, callback me optional mat likho.",
"<b>Overloads:</b> kai signatures + ek implementation (jo bahar se callable NAHI hoti). Jahan union parameter chal jaye wahan overloads se bacho — union argument kisi ek overload se match hi nahi karta.",
"<code>void</code> ≠ <code>undefined</code>; <code>unknown</code> = safe <code>any</code>; <code>never</code> = kabhi return na karne wala; global <code>Function</code> type se bacho. <b>Rest/spread pitfall:</b> <code>[8, 5]</code> <code>number[]</code> infer hota hai, spread ke liye tuple chahiye — <code>as const</code> fix hai.",
"<b><code>void</code> return quirk:</b> contextual <code>() =&gt; void</code> type wali function kuch bhi return kar sakti hai (value ignore hoti hai) — isiliye <code>forEach((el) =&gt; dst.push(el))</code> legal hai. Lekin khud declare ki hui <code>: void</code> function kuch return nahi kar sakti."],
c:"function firstElement<Type>(arr: Type[]): Type | undefined {\n  return arr[0];\n}\nfirstElement([\"a\", \"b\", \"c\"]); // string\nfunction longest<Type extends { length: number }>(a: Type, b: Type) {\n  return a.length >= b.length ? a : b;\n}\nconst args = [8, 5] as const;\nMath.atan2(...args); // as const se tuple — spread OK",
k:"Generics ke 3 rules, overloads-vs-union, aur void quirk — interview me yehi teen sabse zyada poochhe jate hain."},
{n:11,g:1,t:"Object Types",u:"https://www.typescriptlang.org/docs/handbook/2/objects.html",
p:["Object type teen tarike se banta hai: anonymous (<code>{ name: string }</code>), <code>interface</code>, ya <code>type</code> alias — teeno same shape describe karte hain. Property modifiers: type, optional (<code>?</code>), <code>readonly</code>.",
"<code>readonly</code> sirf top-level re-write rokta hai — <code>home.resident.age++</code> chalega, <code>home.resident = {...}</code> nahi. Aur compatibility check me TS <code>readonly</code> ko ignore karta hai.",
"<b>Index signatures:</b> <code>[index: number]: string</code>. Number aur string dono indexers hon to number wala string wale ka subtype hona chahiye (JS number keys ko string bana deta hai). String index signature HAR property ko usi type ka hone par majboor karta hai — alag types chahiye to union index type use karo.",
"<b>Excess property checks:</b> fresh object literals me unknown property = error (<code>colour</code> vs <code>color</code> typo yahi pakadta hai). Workarounds: type assertion, string index signature, ya pehle variable me assign karna. Zyadaatar ye errors asli bugs hote hain.",
"<code>interface</code> <code>extends</code> se aur <code>type</code> intersection (<code>&amp;</code>) se banta hai — farak conflict me dikhta hai: same-naam interfaces incompatible hon to error; intersections conflict ko <code>never</code> bana dete hain (compile hoga, use nahi hoga).",
"<b>Generic object types:</b> <code>interface Box&lt;Type&gt; { contents: Type }</code> — <code>NumberBox/StringBox</code> ki bheed ki jagah ek hi pattern. <code>Array</code>, <code>Map&lt;K,V&gt;</code>, <code>Set&lt;T&gt;</code>, <code>Promise&lt;T&gt;</code> sab isi par bane hain.",
"<b><code>ReadonlyArray</code>:</b> mutating methods gayab, constructor nahi, shorthand <code>readonly string[]</code>. Assignability one-way hai: <code>string[]</code> → <code>readonly string[]</code> OK, ulta error.",
"<b>Tuples:</b> <code>[string, number]</code> — fixed length, typed positions. Optional elements sirf end me, rest elements kahin bhi (positions fixed rehte hain). <code>as const</code> se <code>readonly [3, 4]</code> banta hai jo mutable tuple ko assign NAHI hota — common gotcha."],
c:"interface Box<Type> { contents: Type; }\nlet box: Box<string> = { contents: \"hello\" };\n\ntype StringNumberPair = [string, number];\ntype Either2dOr3d = [number, number, number?]; // length: 2 | 3\ntype StringBoolNum = [string, ...boolean[], number];\n\nfunction doSomething(pair: readonly [string, number]) {\n  const [inputString, hash] = pair; // destructuring OK\n}",
k:"Excess property checks, index signature rules, readonly ki shallowness, aur tuple/as-const gotcha — object types ka saar."},
{n:12,g:1,t:"Creating Types from Types",u:"https://www.typescriptlang.org/docs/handbook/2/types-from-types.html",
p:["TS ka type system types ko <b>dusre types ke terms me</b> express karne deta hai — types ke upar computation, bilkul values ki tarah.",
"Is section ke tools: <b>Generics</b> (parameters wale types), <b>Keyof</b>, <b>Typeof</b>, <b>Indexed Access Types</b> (<code>Type['a']</code>), <b>Conditional Types</b> (type system ke if-statements), <b>Mapped Types</b> (har property par map), <b>Template Literal Types</b> (string patterns se types).",
"Ye saare operators milkar complex transformations ko chhote, composable expressions me badal dete hote hain — aage ke 7 sections ek-ek operator ko gehrai se kholte hain."],
c:"// Ek jhalak — ye sab aage detail me hai:\ntype Keys = keyof Point;              // \"x\" | \"y\"\ntype XType = Point[\"x\"];              // number\ntype OnlyNums<T> = T extends number ? T : never;\ntype ReadonlyAll<T> = { readonly [K in keyof T]: T[K] };",
k:"Ye intro page hai — asli masala aage ke Generics se Template Literal Types tak ke 7 sections me hai."},
{n:13,g:1,t:"Generics",u:"https://www.typescriptlang.org/docs/handbook/2/generics.html",
p:["<b>Identity function</b> se samjho: <code>arg: number</code> bahut narrow hai, <code>arg: any</code> return type ki jaankari kho deta hai. Hal: <b>type variable</b> — <code>function identity&lt;Type&gt;(arg: Type): Type</code> input type ko capture karke return me reuse karta hai. Call par inference khud type nikaal leta hai.",
"Type variable ko 'koi bhi type' maan kar treat karo — <code>arg.length</code> error dega. Type ka hissa bana kar use karo: <code>loggingIdentity&lt;Type&gt;(arg: Type[])</code> me <code>.length</code> mil jayega.",
"<b>Generic types</b> kai roop lete hain: function type, call-signature object, interface par parameter (sab members ko visible) ya sirf call signature par. <b>Generic classes</b> sirf instance side par generic hoti hain — static members class type parameter use NAHI kar sakte. Generic enums/namespaces nahi hote.",
"<b>Constraints:</b> <code>Type extends Lengthwise</code> — ab <code>loggingIdentity(3)</code> error, <code>{ length: 10 }</code> OK. Type parameter dusre parameter ko bhi constrain kar sakta hai: <code>getProperty&lt;Type, Key extends keyof Type&gt;</code> — galat key par allowed keys ki list ke saath error.",
"<b>Factories:</b> class type ko generic me pass karna ho to constructor signature likho — <code>create&lt;Type&gt;(c: { new (): Type })</code>. Yahi pattern mixins ki neev hai.",
"<b>Generic parameter defaults</b> ke rules: default wala parameter optional; required, optional ke baad nahi aa sakta; default ko constraint satisfy karna hoga; inference fail ho to default use hota hai.",
"<b>Variance annotations</b> (<code>in T</code>, <code>out T</code>) advanced/rare hain — structural system me variance khud emerge hoti hai aur TS infer kar leta hai. Galat annotation par TS error deta hai; annotations structural comparison ko force nahi kar sakti."],
c:"function identity<Type>(arg: Type): Type { return arg; }\nlet output = identity(\"myString\"); // Type = string (inference)\n\ninterface Lengthwise { length: number; }\nfunction loggingIdentity<Type extends Lengthwise>(arg: Type): Type {\n  console.log(arg.length); return arg;\n}\nfunction getProperty<Type, Key extends keyof Type>(obj: Type, key: Key) {\n  return obj[key];\n}",
k:"Type variable = capture + reuse. Constraints, keyof-in-constraint aur factory pattern — generics ki teen seedhiyan."},
{n:14,g:1,t:"Keyof Type Operator",u:"https://www.typescriptlang.org/docs/handbook/2/keyof-types.html",
p:["<code>keyof</code> ek object type lekar uske keys ka <b>string/numeric literal union</b> deta hai: <code>keyof Point</code> → <code>\"x\" | \"y\"</code>.",
"Index signature ho to jawab badal jata hai: number index wale type ka <code>keyof</code> → <code>number</code>; string index wale ka → <code>string | number</code> — kyunki JS me object keys hamesha string me coerce hoti hain (<code>obj[0]</code> === <code>obj[\"0\"]</code>).",
"<code>keyof</code> sabse zyada kaam <b>mapped types</b> ke saath aata hai — wahan ye iteration ki list deta hai."],
c:"type Point = { x: number; y: number };\ntype P = keyof Point; // \"x\" | \"y\"\n\ntype Arrayish = { [n: number]: unknown };\ntype A = keyof Arrayish; // number\n\ntype Mapish = { [k: string]: boolean };\ntype M = keyof Mapish; // string | number",
k:"keyof = keys ka union. String index signature par number bhi judta hai — JS key coercion ki wajah se."},
{n:15,g:1,t:"Typeof Type Operator",u:"https://www.typescriptlang.org/docs/handbook/2/typeof-types.html",
p:["JS ka <code>typeof</code> expression me runtime type batata hai. TS <b>type position</b> me <code>typeof</code> deta hai — kisi variable/property ka type uthane ke liye: <code>let n: typeof s</code> → <code>string</code>.",
"Asli taqat combinations me hai: <code>ReturnType&lt;typeof f&gt;</code> kisi function ka return type nikaal leta hai — bina function ko dobara describe kiye.",
"Values aur types alag cheezein hain: <code>ReturnType&lt;f&gt;</code> error dega (<i>'f' refers to a value… Did you mean 'typeof f'?</i>) — pehle <code>typeof</code> se value ko type me badlo.",
"<b>Limitation:</b> <code>typeof</code> sirf identifiers (variable naam) ya unki properties par legal hai. <code>typeof msgbox(\"...\")</code> jaisi call-expression par syntax error — warna aisa code likha jata jo dikhta execute hota hua, par hota nahi."],
c:"function f() { return { x: 10, y: 3 }; }\ntype P = ReturnType<typeof f>; // { x: number; y: number }\n\nlet s = \"hello\";\nlet n: typeof s; // string",
k:"typeof type position me = value se type. ReturnType<typeof fn> sabse common real-world use hai."},
{n:16,g:1,t:"Indexed Access Types",u:"https://www.typescriptlang.org/docs/handbook/2/indexed-access-types.html",
p:["Kisi property ka type lookup karna ho to <code>Person[\"age\"]</code> → <code>number</code>. Index khud ek <b>type</b> hai — union, <code>keyof</code> ya koi bhi type chalega.",
"<code>Person[\"age\" | \"name\"]</code> → <code>string | number</code>; <code>Person[keyof Person]</code> → saare property types ka union. Missing property par error (<code>Person[\"alve\"]</code>).",
"Array ka element type nikaalna: index me <code>number</code> do. <code>typeof</code> ke saath ye array literals se types capture karta hai: <code>type Person = typeof MyArray[number]</code> — array badlo, type khud badal jayega.",
"Sirf TYPES index kar sakte hain — <code>const key = \"age\"; Person[key]</code> error dega. Type alias banao: <code>type key = \"age\"; Person[key]</code>."],
c:"const MyArray = [\n  { name: \"Alice\", age: 15 },\n  { name: \"Bob\", age: 23 },\n];\ntype Person = typeof MyArray[number]; // { name: string; age: number }\ntype Age = typeof MyArray[number][\"age\"]; // number",
k:"T[K] — type ko type se lookup. typeof arr[number] array se element type nikaalne ka standard trick hai."}
];
var S2=[
{n:17,g:1,t:"Conditional Types",u:"https://www.typescriptlang.org/docs/handbook/2/conditional-types.html",
p:["Form: <code>SomeType extends OtherType ? TrueType : FalseType</code> — left, right ko assignable ho to true branch, warna false. <code>Dog extends Animal ? number : string</code> → <code>number</code>.",
"Asli taqat generics ke saath aati hai: overloads ki badhti hui list ki jagah ek conditional generic — <code>NameOrId&lt;T&gt;</code> input type dekh kar label type chun leta hai.",
"True branch generic ko aur constrain karta hai (narrowing jaisa). Isi se <code>MessageOf&lt;T&gt;</code> pattern banta hai: <code>message</code> property ho to uska type, warna <code>never</code>. Aur <code>Flatten&lt;T&gt;</code> array ho to element type, warna type khud.",
"<b><code>infer</code></b> true branch me naya type variable declare karta hai: <code>Type extends Array&lt;infer Item&gt; ? Item : Type</code>. Isi se <code>ReturnType</code> jaise helpers bante hain. Overloaded functions par inference LAST signature use karti hai.",
"<b>Distributive conditional types:</b> generic par conditional union ke har member par alag-alag apply hota hai — <code>ToArray&lt;string | number&gt;</code> → <code>string[] | number[]</code>. Rokna ho to dono side tuple me lapeto: <code>[Type] extends [any]</code>."],
c:"type MessageOf<T> = T extends { message: unknown } ? T[\"message\"] : never;\ntype Flatten<Type> = Type extends Array<infer Item> ? Item : Type;\ntype ToArray<Type> = Type extends any ? Type[] : never;\ntype Res = ToArray<string | number>; // string[] | number[]",
k:"extends ? : + infer + distributivity — type-level programming ke teen pillars yahi hain."},
{n:18,g:1,t:"Mapped Types",u:"https://www.typescriptlang.org/docs/handbook/2/mapped-types.html",
p:["Mapped type ek type se dusra type banata hai — keys par iterate karke (index signature syntax par based): <code>{ [Property in keyof Type]: boolean }</code> har property ko <code>boolean</code> bana deta hai.",
"<b>Mapping modifiers:</b> <code>readonly</code> aur <code>?</code> ko <code>+</code>/<code>-</code> prefix se jodo ya hatao. <code>-readonly</code> readonly hatata hai, <code>-?</code> optionality hatakar sab required bana deta hai. Prefix na ho to <code>+</code> maana jata hai.",
"<b>Key remapping (<code>as</code>, TS 4.1+):</b> template literals ke saath naye keys banao — <code>Getters&lt;Person&gt;</code> → <code>{ getName: () =&gt; string; getAge: () =&gt; number }</code>. Kisi key ko <code>never</code> bana do to wo key filter out ho jati hai.",
"Mapped types sirf <code>string | number | symbol</code> keys par nahi — arbitrary unions par bhi map ho sakte hain (event-handler config pattern). Conditional types ke saath milkar per-property decisions bhi possible hain (jaise PII detection)."],
c:"type OptionsFlags<Type> = { [Property in keyof Type]: boolean };\ntype CreateMutable<Type> = { -readonly [Property in keyof Type]: Type[Property] };\ntype Concrete<Type> = { [Property in keyof Type]-?: Type[Property] };\ntype Getters<Type> = {\n  [Property in keyof Type as `get${Capitalize<string & Property>}`]: () => Type[Property];\n};",
k:"{ [K in keyof T]: … } + -readonly/-? + as-remapping — Partial, Readonly jaise saare helpers isi se bane hain."},
{n:19,g:1,t:"Template Literal Types",u:"https://www.typescriptlang.org/docs/handbook/2/template-literal-types.html",
p:["Template literal types string literal types par bante hain — JS template literal wala hi syntax, lekin type position me. Concrete literals jud jate hain: <code>`hello ${World}`</code> → <code>\"hello world\"</code>.",
"Interpolated position me <b>union ho to cross-multiplication</b> hota hai — har combination banta hai. Do positions par unions hon to combinations aur badh jate hain (12, 100, …). Bade unions ke liye ahead-of-time generation recommend hai.",
"Watched-object pattern: event naam <code>`${string &amp; keyof Type}Changed`</code> type ka ho to galat event naam (<code>\"firstName\"</code>) aur typos dono compile time par error.",
"Generic <code>on&lt;Key extends string &amp; keyof Type&gt;</code> ke saath TS string ko tod kar <code>Key</code> infer karta hai, phir <code>Type[Key]</code> se callback ka argument type khud nikaal leta hai — <b>inference strings ko deconstruct/reconstruct</b> kar sakti hai.",
"<b>Intrinsic string types</b> (compiler built-in, .d.ts me nahi): <code>Uppercase</code>, <code>Lowercase</code>, <code>Capitalize</code>, <code>Uncapitalize</code>. Ye locale-aware nahi hain — runtime string kaam ke liye JS functions hi use karo."],
c:"type EmailLocaleIDs = \"welcome_email\" | \"email_heading\";\ntype FooterLocaleIDs = \"footer_title\" | \"footer_sendoff\";\ntype AllLocaleIDs = `${EmailLocaleIDs | FooterLocaleIDs}_id`;\n// \"welcome_email_id\" | \"email_heading_id\" | \"footer_title_id\" | \"footer_sendoff_id\"\ntype ASCIICacheKey<Str extends string> = `ID-${Uppercase<Str>}`;",
k:"Unions ka cross-product + keyof ke saath inference — template literal types strings ko type-safe bana dete hain."},
{n:20,g:1,t:"Classes",u:"https://www.typescriptlang.org/docs/handbook/2/classes.html",
p:["Fields bina annotation ke implicit <code>any</code> hain. <b><code>strictPropertyInitialization</code></b> fields ko constructor me initialize karne par majboor karta hai — pakka ho ki value kahin aur se aayegi to definite assignment <code>name!: string</code> lagao. <code>readonly</code> fields sirf constructor me assign hote hain.",
"Constructors par type parameters nahi lagte (wo class par hote hain), return annotation bhi nahi. Derived constructor me <code>this</code> se pehle <code>super()</code> zaroori hai. Methods ko fields hamesha <code>this.</code> se access karne hote hain.",
"Getters/setters: sirf getter ho to property <code>readonly</code>; TS 4.3+ se get/set ke types alag ho sakte hain.",
"<b>Heritage:</b> <code>implements</code> sirf check karta hai — class ka type ya inference NAHI badalta, optional properties create bhi nahi karta. <code>extends</code> me derived class ko base ka subtype rehna hoga — optional parameter ko required banana contract tod deta hai.",
"<b><code>declare</code> fields</b> runtime effect ke bina inherited field ka sahi type re-declare karte hain (ES2022 field semantics me zaroori). <b>Initialization order:</b> base fields → base constructor → derived fields → derived constructor.",
"<b>Visibility:</b> <code>public</code> default; <code>protected</code> sirf class+subclasses (sibling class access nahi); <code>private</code> subclasses ko bhi nahi, lekin same class ke dusre instance ko hai. Ye sab <b>compile-time only</b> hain — JS <code>#</code> fields hi hard private hain.",
"<b>Statics</b> class par rehte hain, type parameters use nahi kar sakte (types erased hain — ek hi slot sab instantiations ke liye). Static blocks initialization code ko private access dete hain. 'Static class' TS me nahi hoti — plain object/function use karo.",
"<b><code>this</code> types</b> fluent chaining ko subclasses me sahi type dete hain; <code>this is Type</code> guards object ko narrow karte hain. <b>Parameter properties</b> (<code>constructor(public readonly x: number)</code>) field + assignment ek saath.",
"<b><code>abstract</code></b> classes instantiate nahi hotin; subclasses ko saare abstract members implement karne hote hain. Aur yaad rakho — classes bhi structural hain: identical classes interchangeable, aur <b>empty class sab ki supertype</b> hai — empty class mat likho!"],
c:"class Point {\n  x: number; y: number;\n  constructor(x = 0, y = 0) { this.x = x; this.y = y; }\n}\nclass Box<Type> {\n  contents: Type;\n  constructor(value: Type) { this.contents = value; }\n}\nclass Octopus {\n  readonly name: string;\n  readonly numberOfLegs: number = 8;\n  constructor(theName: string) { this.name = theName; }\n}",
k:"strictPropertyInitialization, implements≠type-change, soft-vs-hard private, this types — classes ke interview points yahi hain."},
{n:21,g:1,t:"Modules",u:"https://www.typescriptlang.org/docs/handbook/2/modules.html",
p:["Jis file me top-level <code>import</code>/<code>export</code> ho wo <b>module</b> hai — apna scope, bahar kuch visible nahi jab tak export na karo. Bina import/export wali file <b>script</b> hai — global scope. File ko zabardasti module banana ho to <code>export {};</code> likh do.",
"Module ke teen concerns: <b>syntax</b> (import/export), <b>module resolution</b> (naam → file), <b>output target</b> (emitted JS ki shape).",
"ES Modules hi standard hain: default export, named exports, rename (<code>import { pi as π }</code>), namespace import (<code>import * as math</code>), aur side-effect import (<code>import \"./maths.js\"</code>).",
"Types bhi same syntax se export hote hain. <b><code>import type</code></b> aur inline <code>type</code> imports (<code>import { createCatName, type Cat }</code>) Babel/swc jaise transpilers ko batate hain ki ye import surakshit tareeke se hataya ja sakta hai.",
"CommonJS: <code>module.exports</code> / <code>require</code>. <code>esModuleInterop</code> flag CJS aur ESM ke default-import semantics ke beech ki friction kam karta hai. TS-specific <code>import fs = require(\"fs\")</code> CJS output se 1:1 match karta hai.",
"<b>Resolution</b> ki do strategies: Classic (purani, sirf backwards-compat) aur Node (Node.js jaisi lookup + .ts/.d.ts checks). <code>target</code> JS features decide karta hai, <code>module</code> loader code ki shape.",
"<b>Namespaces</b> TS ka apna purana module format hai — deprecated nahi, DefinitelyTyped me ab bhi use hota hai, lekin naye code ke liye ES Modules hi recommended hain."],
c:"// maths.ts\nexport var pi = 3.14;\nexport default function helloWorld() { console.log(\"Hello, world!\"); }\n// main.ts\nimport helloWorld, { pi as π } from \"./maths.js\";\nimport type { Cat, Dog } from \"./animals.js\";\nimport { createCatName, type Cat as Cat2 } from \"./animals.js\";",
k:"Module vs script, import type ka maksad, aur target-vs-module ka farak — modules ka core yahi hai."},
{n:22,g:2,t:"Utility Types",u:"https://www.typescriptlang.org/docs/handbook/utility-types.html",
p:["TS ke global utility types common transformations ke shortcuts hain — sab mapped/conditional types se bane hain.",
"<code>Partial&lt;T&gt;</code> sab properties optional; <code>Required&lt;T&gt;</code> uska ulta; <code>Readonly&lt;T&gt;</code> sab readonly. <code>Record&lt;Keys, Type&gt;</code> fixed keys wala object type banata hai.",
"<code>Pick&lt;T, Keys&gt;</code> kuch properties chunta hai; <code>Omit&lt;T, Keys&gt;</code> unhe chhod kar baaki sab — dono ek dusre ke opposite.",
"Union helpers: <code>Exclude</code> members hatata hai, <code>Extract</code> members rakhta hai, <code>NonNullable</code> <code>null</code>/<code>undefined</code> nikaal deta hai.",
"Function helpers: <code>Parameters&lt;T&gt;</code> parameter tuple, <code>ReturnType&lt;T&gt;</code> return type, <code>ConstructorParameters</code> aur <code>InstanceType</code> classes ke liye. Overloads par hamesha LAST signature use hoti hai.",
"<code>Awaited&lt;T&gt;</code> Promises ko recursively unwrap karta hai (await jaisa). <code>NoInfer&lt;T&gt;</code> (5.4) kisi position ko inference se rokta hai. <code>ThisParameterType</code>/<code>OmitThisParameter</code>/<code>ThisType</code> <code>this</code> ko type karne ke tools hain."],
c:"interface Todo { title: string; description: string; completed: boolean; }\ntype TodoPreview = Pick<Todo, \"title\" | \"completed\">;\ntype TodoInfo = Omit<Todo, \"completed\">;\ntype T2 = Exclude<\"a\" | \"b\" | \"c\", \"a\">; // \"b\" | \"c\"\ntype T4 = Awaited<Promise<Promise<number>>>; // number",
k:"Partial/Pick/Omit/Record roz ke kaam ke; Exclude/Extract union surgery ke; Parameters/ReturnType meta-programming ke."},
{n:23,g:2,t:"Cheat Sheets",u:"https://www.typescriptlang.org/cheatsheets/",
p:["Cheat Sheets typescriptlang.org ki <b>downloadable syntax reference pages</b> hain — HTML pages nahi, images/PDFs hain.",
"Chaaron sheets: <b>Control Flow Analysis</b>, <b>Classes</b>, <b>Interfaces</b>, <b>Types</b> — roz ke TS code ke sabse common patterns ek-ek page par.",
"Saari sheets ek zip me milti hain: <a href=\"https://www.typescriptlang.org/assets/typescript-cheat-sheets.zip\">typescript-cheat-sheets.zip</a> — print karke desk par rakhne ke liye perfect quick reference."],
c:"",
k:"Cheat sheets padhne ki cheez nahi, download karke paas rakhne ki cheez hain — 4 topics: Control Flow, Classes, Interfaces, Types."},
{n:24,g:2,t:"Decorators",u:"https://www.typescriptlang.org/docs/handbook/decorators.html",
p:["<b>Note:</b> ye page <b>experimental stage-2 decorators</b> document karta hai. Stage-3 decorators TS 5.0 se supported hain. Stage-2 ke liye <code>experimentalDecorators</code> on karo.",
"Decorator = <code>@expression</code> — class/method/accessor/property/parameter par lagta hai; expression ek function return karta hai jo runtime par declaration ki jaankari ke saath call hota hai (meta-programming).",
"<b>Decorator factories</b> decorator ko customize karte hain (<code>@color(\"red\")</code>). <b>Composition</b> me factory expressions upar-se-neeche evaluate hote hain, lekin decorators neeche-se-upar call hote hain — function composition jaisa.",
"<b>Evaluation order:</b> instance members ke parameter→method/accessor/property decorators, phir static members, phir constructor parameters, phir class decorator.",
"<b>Class decorator</b> constructor ko observe/modify/replace kar sakta hai — lekin <b>type system ko naya member nahi dikhta</b>: runtime par jodi gayi <code>reportingURL</code> property type-check me error degi.",
"Method decorator ko (target, naam, PropertyDescriptor) milta hai — descriptor badal sakta hai (<code>@enumerable(false)</code>). Accessor par sirf PEHLE accessor par lagta hai. <b>Property aur parameter decorators sirf observe kar sakte hain</b> — return value ignore hoti hai; ye metadata record karne ke liye hain.",
"<code>reflect-metadata</code> + <code>emitDecoratorMetadata</code> se compiler <code>design:type</code> metadata emit karta hai — runtime par type info mil jati hai (experimental, bharosa karke production design mat karo)."],
c:"function sealed(constructor: Function) {\n  Object.seal(constructor);\n  Object.seal(constructor.prototype);\n}\n@sealed\nclass BugReport {\n  type = \"report\";\n  constructor(public title: string) {}\n}",
k:"Factory order ulta chalta hai, class decorator type nahi badalta, property decorators sirf dekh sakte hain — ye teen interview points hain."},
{n:25,g:2,t:"Declaration Merging",u:"https://www.typescriptlang.org/docs/handbook/declaration-merging.html",
p:["<b>Declaration merging:</b> same naam ki do+ declarations ko compiler ek definition me jod deta hai — TS ki unique feature, existing JS ke saath kaam karne me bahut kaam ki.",
"Har declaration teen groups me se kuch banata hai: <b>namespace</b>, <b>type</b>, <b>value</b>. Interface sirf type; class aur enum type+value; function sirf value.",
"<b>Interfaces merge</b> hote hain: members jud jate hain; non-function members same type ke hone chahiye warna error. Same-naam functions overloads ban jate hain — <b>baad wali interface ko zyada precedence</b> milti hai, aur single string-literal parameter wali specialized signatures sabse upar bubble ho jati hain.",
"<b>Namespaces merge</b> hote hain — exported members judte hain, lekin non-exported members sirf apni original declaration me visible rehte hain. Namespace ko us declaration ke BAAD aana hota hai jisse wo merge ho raha hai (inner classes, function par properties, enum par static functions — ye patterns yahi se aate hain).",
"<b>Classes merge nahi hotin</b> — dusri class ya variable ke saath bilkul mana hai (uske liye Mixins hain).",
"<b>Module augmentation:</b> <code>declare module \"./observable\" { interface Observable&lt;T&gt; { … } }</code> se kisi module ko patch kar sakte ho — nayi top-level declarations nahi bana sakte, sirf existing ko badha sakte ho; default exports augment nahi hote. <b>Global augmentation</b> (<code>declare global</code>) global scope ke liye wahi kaam karti hai."],
c:"interface Box { height: number; width: number; }\ninterface Box { scale: number; }\nlet box: Box = { height: 5, width: 6, scale: 10 }; // merged!\n\ndeclare global {\n  interface Array<T> { toObservable(): Observable<T>; }\n}",
k:"Interface merging + overload precedence + module/global augmentation — merging ka pura khel in teen me hai."},
{n:26,g:2,t:"Enums",u:"https://www.typescriptlang.org/docs/handbook/enums.html",
p:["Enums TS ki un ginichuni features me se hain jo <b>runtime par bhi exist</b> karti hain (type-level extension nahi). Named constants ka set — intent document karne aur distinct cases banane ke liye.",
"<b>Numeric enums</b> auto-increment karte hain (<code>Up = 1</code> ke baad Down=2, Left=3…). Initializer na ho to 0 se shuru. Jiska initializer computed ho, uske baad wale member ko initializer dena hi hoga.",
"<b>String enums</b> me har member ko string literal dena hota hai — auto-increment nahi, lekin runtime values readable hote hain (serialization/debugging asaan). Mixed (heterogeneous) enums allowed hain par avoid karo.",
"Members <b>constant</b> ya <b>computed</b> hote hain — constant expressions (literals, pehle ke constant members, arithmetic on constants) compile time par evaluate hote hain; <code>\"123\".length</code> jaisa computed hai. NaN/Infinity wale constant expressions error hain.",
"Sab members literal hon to enum members khud <b>types</b> ban jate hain aur enum ek <b>union</b> ki tarah behave karta hai — impossible comparisons (<code>x !== E.Foo || x !== E.Bar</code>) par 'no overlap' error milta hai.",
"<b>Reverse mapping</b> sirf numeric enums me: compiled JS <code>Enum[Enum[\"A\"] = 0] = \"A\"</code> banata hai — value se naam mil jata hai. String enums me reverse mapping NAHI hoti. Keys ka union chahiye to <code>keyof typeof LogLevel</code>.",
"<b><code>const</code> enums</b> compile time par poori tarah hat jate hain — members use-site par inline ho jate hain. Pitfalls: <code>isolatedModules</code> ke saath incompatible, ambient const enums ke version-mismatch bugs. Kai teams linter se const enums ban kar deti hain.",
"Modern alternative: <code>const obj = { Up: 0, … } as const</code> + <code>typeof</code> se type nikaalna — codebase pure JS ke aligned rehta hai; keemat: parameter type ke liye ek extra type line."],
c:"enum Direction { Up = 1, Down, Left, Right }\nenum LogLevel { ERROR, WARN, INFO, DEBUG }\ntype LogLevelStrings = keyof typeof LogLevel;\n// \"ERROR\" | \"WARN\" | \"INFO\" | \"DEBUG\"\nconst ODirection = { Up: 0, Down: 1 } as const;\ntype Direction2 = typeof ODirection[keyof typeof ODirection];",
k:"Numeric=reverse mapping + auto-increment, string=readable lekin no reverse, const enum=inlined par risky — objects-as-const modern raasta hai."},
{n:27,g:2,t:"Iterators and Generators",u:"https://www.typescriptlang.org/docs/handbook/iterators-and-generators.html",
p:["Jo object <code>Symbol.iterator</code> implement kare wo <b>iterable</b> hai. Built-ins me ye pehle se hai: <code>Array</code>, <code>Map</code>, <code>Set</code>, <code>String</code>, typed arrays.",
"<code>Iterable&lt;X&gt;</code> interface se generic helpers bante hain: <code>function toArray&lt;X&gt;(xs: Iterable&lt;X&gt;): X[] { return [...xs]; }</code>.",
"<b><code>for..of</code> VALUES deta hai, <code>for..in</code> KEYS deta hai</b> (indexes strings ke roop me). <code>for..in</code> kisi bhi object ki properties ghumta hai (object par jodi gayi <code>species</code> property bhi dikhegi); <code>for..of</code> sirf iterables par — Set par jodi property nahi dikhegi.",
"<b>Code generation:</b> ES5 target par <code>for..of</code> sirf Arrays par allowed hai — non-Array iterable par error, chahe wo <code>Symbol.iterator</code> implement kare; compiler simple index loop emit karta hai. ES2015+ target par native <code>for..of</code> emit hota hai.",
"<i>Cross-reference (JS/MDN se, is page se nahi):</i> generator functions <code>function*</code> se bante hain, <code>yield</code> se values dete hain, aur unka type <code>Generator&lt;T, TReturn, TNext&gt;</code> hota hai — ye JS language ka hissa hai."],
c:"let pets = new Set([\"Cat\", \"Dog\", \"Hamster\"]);\nfor (let pet of pets) { console.log(pet); } // values: Cat, Dog…\nfor (let pet in pets) { console.log(pet); } // keys/indexes\n\nfunction toArray<X>(xs: Iterable<X>): X[] { return [...xs]; }",
k:"for..of = values, for..in = keys. ES5 target ki array-only pabandi yaad rakho."},
{n:28,g:2,t:"JSX",u:"https://www.typescriptlang.org/docs/handbook/jsx.html",
p:["JSX XML-jaisi embeddable syntax hai jo valid JS me transform hoti hai. TS JSX ko embed, type-check aur compile — teeno support karta hai. Files <code>.tsx</code> rakho aur <code>jsx</code> option set karo.",
"<b>Modes:</b> <code>preserve</code> (JSX as-is, aage Babel jaisa step), <code>react</code> classic (<code>React.createElement</code>), <code>react-native</code>, <code>react-jsx</code> automatic (<code>_jsx(...)</code> calls), <code>react-jsxdev</code> (dev info ke saath). Factory <code>jsxFactory</code> se badal sakte ho.",
"<code>.tsx</code> me angle-bracket assertions (<code>&lt;Foo&gt;bar</code>) <b>mana</b> hain — JSX se takraav hota hai. Hamesha <code>as</code> use karo.",
"Elements do tarah ke: <b>intrinsic</b> (lowercase, <code>div</code> — string ban kar emit, attributes <code>JSX.IntrinsicElements</code> se check) aur <b>value-based</b> (uppercase components — function component pehle try hota hai, phir class component).",
"<b><code>JSX</code> namespace ki location mode par nirbhar hai:</b> classic modes me factory ke top identifier par (<code>React.JSX</code>, Preact ke liye <code>h.JSX</code>); automatic modes me <code>jsxImportSource/jsx-runtime</code> se export. Na mile to global <code>JSX</code> namespace fallback hai.",
"Attribute checking: required/optional props enforce hote hain, unknown props error — lekin invalid-identifier naam (<code>data-*</code>) exempt hain. <code>JSX.IntrinsicAttributes</code> framework props (React ka <code>key</code>) deta hai. Children bhi ek attribute ki tarah type hote hain (<code>JSX.ElementChildrenAttribute</code>).",
"Default JSX result type <code>any</code> hai; <code>JSX.Element</code> se customize karo. TS 5.1 se <code>JSX.ElementType</code> batata hai ki valid component kya count hoga — props hamesha component ke pehle argument se aate hain."],
c:"// tsconfig: \"jsx\": \"react-jsx\"\nconst x = bar as Foo; // .tsx me <Foo>bar mana hai\ninterface FooProps { name: string; age?: number; }\nfunction Foo(props: FooProps) { return <div>{props.name}</div>; }\nconst el = <Foo name=\"vai\" />; // age optional, name zaroori",
k:"jsx modes, as-vs-angle-bracket, intrinsic-vs-value-based, JSX namespace ki do jagah — JSX ke chaar interview pillars."},
{n:29,g:2,t:"Mixins",u:"https://www.typescriptlang.org/docs/handbook/mixins.html",
p:["Mixins = chhoti partial classes ko jod kar class banana — traditional OO hierarchy ka alternative (Scala traits jaisa pattern, JS me popular).",
"<b>Pattern:</b> generics + class expression. Ek <code>Constructor</code> type (<code>new (...args: any[]) =&gt; {}</code>) aur ek factory jo base ko extend karke nayi class return kare: <code>const EightBitSprite = Scale(Sprite)</code>. Mixin me <code>private</code>/<code>protected</code> properties NAHI rakh sakte — ES2020 <code>#</code> fields use karo.",
"<b>Constrained mixins:</b> <code>GConstructor&lt;T&gt;</code> se base ko constrain karo — <code>Jumpable</code> sirf un bases par lagega jinke paas <code>setPos</code> hai, aur mixin khud <code>this.setPos()</code> call kar sakta hai.",
"Purana alternative pattern: runtime aur type hierarchies alag bana kar declaration merging se jodna (<code>applyMixins</code>) — sync rakhna codebase ki zimmedari hai, compiler ki nahi.",
"<b>Limits:</b> decorator se mixin NAHI ban sakta (decorator ka type merge nahi hota — <code>player.shouldFreeze</code> error dega; manual type composition workaround hai). Aur class-expression pattern singletons banata hai, isliye static properties ko alag variable types par map nahi kar sakte."],
c:"type Constructor = new (...args: any[]) => {};\nfunction Scale<TBase extends Constructor>(Base: TBase) {\n  return class Scaling extends Base {\n    #scale = 1;\n    setScale(scale: number) { this.#scale = scale; }\n    get scale() { return this.#scale; }\n  };\n}",
k:"Mixin = generic factory returning class expression. Constrained base + # fields; decorators is kaam ke nahi."},
{n:30,g:2,t:"Namespaces",u:"https://www.typescriptlang.org/docs/handbook/namespaces.html",
p:["Terminology: TS 1.5 me 'internal modules' ka naam <b>namespaces</b> pada aur 'external modules' ka <b>modules</b>. <code>module X {}</code> purana syntax hai — <code>namespace X {}</code> use karo, 'module' shabd overload mat karo.",
"Namespaces code ko organize karte hain aur naam ke takraav (collisions) rokte hain — global namespace saaf rehta hai. Namespace ke andar <code>export</code> wale members hi bahar dikhte hain; bina export wale implementation details rehte hain.",
"Ek namespace kai files me faila ho sakta hai — files ke beech dependency <b>triple-slash reference tags</b> (<code>/// &lt;reference path=\"...\" /&gt;</code>) se declare hoti hai.",
"Compiled output load karne ke do tareeqe: <code>outFile</code> se ek concatenated file (order reference tags se), ya har .js ko sahi order me <code>&lt;script&gt;</code> tags se.",
"<b>Aliases:</b> <code>import polygons = Shapes.Polygons;</code> lamba naam chhota karta hai — ye <code>import x = require()</code> (module load) se alag hai. Alias values ke liye distinct reference hota hai.",
"Dusri JS libraries ke liye <b>ambient namespaces</b> .d.ts files me likhte hain — jaise script-tag se aane wale global <code>d3</code> ke liye <code>declare namespace D3 { … }</code>."],
c:"namespace Validation {\n  export interface StringValidator { isAcceptable(s: string): boolean; }\n  const lettersRegexp = /^[A-Za-z]+$/; // bahar nahi dikhega\n  export class LettersOnlyValidator implements StringValidator {\n    isAcceptable(s: string) { return lettersRegexp.test(s); }\n  }\n}\nlet v = new Validation.LettersOnlyValidator();",
k:"Namespace = global pollution ke bina organization. Aaj ke naye code me modules preferred hain, namespaces .d.ts duniya me zinda hain."},
{n:31,g:2,t:"Namespaces and Modules",u:"https://www.typescriptlang.org/docs/handbook/namespaces-and-modules.html",
p:["<b>Modules</b> code + declarations rakhte hain, module loader (CommonJS/ESM runtime) par chalte hain — behtar reuse, mazboot isolation, behtar tooling. Node.js apps me default yahi hai; ES2015 ke baad modules language ka native hissa hain — <b>naye projects ke liye modules hi recommended</b>.",
"<b>Namespaces</b> TS-specific hain — global namespace me named JS objects. Kai files me fail sakte hain, <code>outFile</code> se jud sakte hain. <code>&lt;script&gt;</code>-tag wali web apps me fit hain; badi apps me dependencies pehchanna mushkil ho jata hai.",
"<b>Pitfall 1:</b> module file ko <code>/// &lt;reference&gt;</code> se refer karna galat hai — modules ke liye <code>import</code> use karo. Reference tag ka kaam ambient module declaration wali .d.ts ko locate karna hai (jaise <code>node.d.ts</code>).",
"<b>Pitfall 2 — needless namespacing:</b> module ke andar <code>export namespace Shapes {}</code> lapetne se consumers ko <code>shapes.Shapes.Triangle()</code> likhna padta hai. File hi grouping hai — seedha <code>export class Triangle {}</code> likho.",
"<b>Trade-off:</b> module source files aur emitted JS files ka 1:1 sambandh hai — <code>outFile</code> concatenation <code>commonjs</code>/<code>umd</code> ke saath possible NAHI, sirf <code>amd</code>/<code>system</code> ke saath hai."],
c:"// Galat: export namespace Shapes { export class Triangle {} }\n// Sahi — file hi namespace hai:\nexport class Triangle { /* ... */ }\nexport class Square { /* ... */ }\n// consumer: import * as shapes from \"./shapes\"; new shapes.Triangle();",
k:"Naya project = modules. Reference≠import, aur module ke andar namespace lapetna sabse common bewakoofi hai."},
{n:32,g:2,t:"Symbols",u:"https://www.typescriptlang.org/docs/handbook/symbols.html",
p:["<code>symbol</code> (ES2015) ek primitive type hai — <code>Symbol()</code> ya <code>Symbol(\"key\")</code> se banta hai. Symbols <b>immutable aur UNIQUE</b> hain: <code>Symbol(\"key\") === Symbol(\"key\")</code> hamesha <code>false</code>.",
"Symbols object-property keys ban sakte hain (<code>{ [sym]: \"value\" }</code>) aur computed property declarations se class members bhi.",
"<b><code>unique symbol</code></b> <code>symbol</code> ka special subtype hai — sirf <code>Symbol()</code>/<code>Symbol.for()</code> ya explicit annotation se banta hai, sirf <code>const</code> declarations aur <code>readonly static</code> properties par allowed hai. Kisi specific unique symbol ko refer karna ho to <code>typeof</code> use karo. Do unique symbols kabhi assignable/comparable nahi hote.",
"<b>Well-known symbols</b> language ke internal behaviors ko represent karte hain: <code>Symbol.iterator</code> (for-of), <code>Symbol.hasInstance</code> (instanceof), <code>Symbol.asyncIterator</code>, <code>Symbol.toPrimitive</code>, <code>Symbol.toStringTag</code>, <code>Symbol.species</code>, <code>Symbol.match/replace/search/split</code> (String ke RegExp methods), <code>Symbol.isConcatSpreadable</code>, <code>Symbol.unscopables</code>."],
c:"const sym1 = Symbol(\"key\");\nconst sym2 = Symbol(\"key\");\nsym1 === sym2; // false — har Symbol unique hai\nconst sym3: unique symbol = Symbol();\nlet sym4: typeof sym3 = sym3; // specific symbol refer karna",
k:"Symbol = guaranteed-unique key. unique symbol sirf const/readonly-static par, typeof se refer hota hai."},
{n:33,g:2,t:"Triple-Slash Directives",u:"https://www.typescriptlang.org/docs/handbook/triple-slash-directives.html",
p:["Triple-slash directives single-line comments me single XML tag hote hain — compiler directives. <b>Sirf file ke sabse upar</b> valid hain (unse pehle sirf comments aa sakte hain); kisi statement ke baad ye aam comments ban jate hain.",
"<code>/// &lt;reference path=\"...\" /&gt;</code> files ke beech dependency declare karta hai aur <code>outFile</code> output ka order bhi tay karta hai. Preprocessing depth-first, dikhne ke order me hoti hai. TS 5.5 se directives output me tabhi emit hote hain jab <code>preserve=\"true\"</code> laga ho.",
"<code>/// &lt;reference types=\"...\" /&gt;</code> kisi PACKAGE par dependency hai (<code>/// &lt;reference types=\"node\" /&gt;</code> → <code>@types/node</code>) — declaration packages ke liye <code>import</code> jaisa. .ts files me iski jagah tsconfig ka <code>types</code> option prefer karo.",
"<code>/// &lt;reference lib=\"...\" /&gt;</code> built-in lib file explicitly include karta hai (naam <code>lib</code> option jaisa, bina <code>lib.</code> prefix ke) — .d.ts authors ke liye upyogi.",
"<code>no-default-lib=\"true\"</code> file ko default library mark karta hai (compiler default lib include nahi karega). <code>/// &lt;amd-module name=\"...\" /&gt;</code> AMD modules ko naam deta hai; <code>amd-dependency</code> DEPRECATED hai — <code>import \"moduleName\"</code> use karo."],
c:"/// <reference types=\"node\" />\n/// <reference lib=\"es2017.string\" />\n// ab \"foo\".padStart(4) available hai\n/// <reference path=\"./validation.ts\" />",
k:"path=files, types=packages, lib=built-ins — teeno reference directives ka kaam alag hai, jagah sirf file-top."},
{n:34,g:2,t:"Type Compatibility",u:"https://www.typescriptlang.org/docs/handbook/type-compatibility.html",
p:["TS me compatibility <b>sirf members</b> par based hai (structural subtyping) — nominal systems (C#/Java) se ulta. <code>class Dog { name: string }</code> bina <code>implements</code> ke <code>interface Pet { name: string }</code> ko assign ho jati hai. Dhyaan do: TS poori tarah 'sound' nahi hai — kuch unsound spots jaan-boojh kar rakhe gaye hain.",
"<b>Basic rule:</b> <code>x</code>, <code>y</code> se compatible hai agar <code>y</code> ke paas <code>x</code> ke kam se kam saare members hon. Extra properties chalti hain — lekin <b>fresh object literals par excess property check</b> lagta hai.",
"<b>Functions compare karna:</b> parameter NAAM mayne nahi rakhte, sirf types. Kam parameters wala function zyada wale ki jagah chal jata hai (extra args ignore — <code>forEach</code> callbacks isiliye kaam karte hain). Return type me source ko target ka subtype hona chahiye.",
"<b>Parameter bivariance:</b> assignment tab bhi succeed hota hai jab parameter type kisi bhi direction me assignable ho — unsound, lekin event-handler jaise common JS patterns isi se chalte hain. <code>strictFunctionTypes</code> isko strict bana deta hai.",
"Optional aur rest parameters compatibility me interchangeable maane jate hain. Overloads me target ki har signature ko source par match hona chahiye. Enums numbers se dono taraf compatible hain, lekin <b>alag enum types ke values aapas me incompatible</b> hain.",
"<b>Classes</b> me sirf instance members compare hote hain (statics/constructors nahi). Lekin <b>private/protected members compatibility tod dete hain</b> — target me private member ho to source ka private member USI class se aana chahiye.",
"<b>Generics</b> me type parameters sirf tab mayne rakhte hain jab kisi member ke type me consume hon — <code>Empty&lt;number&gt;</code> aur <code>Empty&lt;string&gt;</code> compatible hain, <code>NotEmpty</code> wale nahi. Unspecified type args <code>any</code> maane jate hain.",
"Assignability table ka saar: <code>any</code> dono taraf sab se (sirf <code>never</code> ko nahi); <code>unknown</code> sab accept karta hai par sirf <code>any</code> ko assign hota hai; <code>never</code> sab ko assign hota hai, use kuch assign nahi hota."],
c:"interface Pet { name: string; }\nclass Dog { name = \"Rex\"; owner = \"vai\"; }\nlet pet: Pet = new Dog(); // OK — extra 'owner' chalega\nlet dog2: Pet = { name: \"Lassie\", owner: \"x\" }; // Error: literal par excess check",
k:"Members hi sab kuch — par private members, literals aur bivariance is rule ke teen bade exception-hain."},
{n:35,g:2,t:"Type Inference",u:"https://www.typescriptlang.org/docs/handbook/type-inference.html",
p:["Jahan explicit annotation nahi, wahan TS type <b>infer</b> karta hai — variable initialization, member defaults, function returns par. <code>let x = 3</code> → <code>x: number</code>.",
"<b>Best common type:</b> kai expressions se inference ho to TS wo type chunne ki koshish karta hai jo sab candidates se compatible ho. <code>[0, 1, null]</code> → <code>(number | null)[]</code>.",
"Koi ek type sab ka supertype na ho to result <b>union</b> banta hai: <code>[new Rhino(), new Elephant(), new Snake()]</code> → <code>(Rhino | Elephant | Snake)[]</code>, <code>Animal[]</code> NAHI. <code>Animal[]</code> chahiye to khud annotate karo.",
"<b>Contextual typing</b> inference ki ulti disha hai — expression ka type uski LOCATION se aata hai. <code>window.onmousedown = function (mouseEvent) {…}</code> me <code>mouseEvent: MouseEvent</code> khud infer ho jata hai; galat property (<code>.kangaroo</code>) par error.",
"Contextual positions: function-call arguments, assignment ke RHS, type assertions, object/array literal members, return statements. Explicit annotation contextual type ko override kar deti hai. Contextual type best-common-type calculation me candidate bhi banta hai."],
c:"let zoo = [new Rhino(), new Elephant(), new Snake()];\n// (Rhino | Elephant | Snake)[] — Animal[] nahi!\nlet zoo2: Animal[] = [new Rhino(), new Elephant()]; // annotation se fix\nwindow.onmousedown = function (mouseEvent) {\n  console.log(mouseEvent.button); // OK — MouseEvent infer hua\n};",
k:"Best common type na mile to union; type location se bhi aata hai — inference dono dishaon me chalta hai."},
{n:36,g:2,t:"Variable Declaration",u:"https://www.typescriptlang.org/docs/handbook/variable-declarations.html",
p:["<b><code>var</code> function-scoped hai</b> — block ke bahar bhi dikhta hai, dobara declare ho sakta hai (inner loop ka <code>var i</code> bahar wale ko overwrite kar deta hai — classic <code>sumMatrix</code> bug). Sabse mashhoor quirk: <code>for (var i…)</code> + <code>setTimeout</code> <b>10 baar '10' print</b> karta hai — sab callbacks ek hi <code>i</code> share karte hain.",
"<b><code>let</code> block-scoped hai:</b> declaration se pehle use = error (<b>temporal dead zone</b>); re-declaration error; nested block me shadowing possible (par clarity ke liye avoid karo). Har loop iteration ko fresh binding milti hai — <code>setTimeout</code> wala example <code>0..9</code> print karta hai.",
"<b><code>const</code></b> rebinding rokta hai, value ko immutable NAHI banata — <code>kitty.name = \"Rory\"</code> chalega, <code>kitty = {…}</code> nahi. Principle of least privilege: jo reassign nahi karna, use <code>const</code> banao.",
"<b>Destructuring:</b> arrays (<code>[first, ...rest]</code>, holes, swap) aur objects (<code>{ a, b }</code>, <code>...passthrough</code>). Object renaming me colon type NAHI hai — <code>{ a: newName }</code> rename hai; type poore pattern ke baad aata hai. Bina declaration ke assignment par parentheses zaroori: <code>({ a, b } = obj);</code>",
"<b>Spread</b> destructuring ka ulta hai — shallow copy, baad wali properties pehle walon ko overwrite karti hain. Limits: sirf own enumerable properties (class instance spread karne se methods gayab), generic type parameters spread nahi hote.",
"<b><code>using</code> declarations</b> (Explicit Resource Management): <code>const</code> jaise, lekin block khatm hote hi <code>[Symbol.dispose]()</code> call hota hai — error aaye tab bhi cleanup pakka. <b><code>await using</code></b> async version hai (<code>Symbol.asyncDispose</code>), sirf async contexts/top-level modules me. <code>for..of</code> me har iteration ke end par disposal hota hai."],
c:"for (var i = 0; i < 3; i++) { setTimeout(() => console.log(\"var:\", i)); } // 3 3 3\nfor (let j = 0; j < 3; j++) { setTimeout(() => console.log(\"let:\", j)); } // 0 1 2\nlet [first, , third, ...rest] = [1, 2, 3, 4, 5];\nfunction f({ a = \"\", b = 0 } = {}) { /* defaults pattern */ }",
k:"var ki 10×10 wali gaddi, TDZ, const≠immutable, aur using se pakka cleanup — variable declarations ka pura sach."}
];
var S3=[
{n:37,g:3,t:"Introduction",u:"https://www.typescriptlang.org/docs/handbook/modules/introduction.html",
p:["Ye page Modules Reference section ka <b>roadmap</b> hai — chaar hisse: <b>Theory</b> (TS modules ko kaise dekhta hai), <b>Guides</b> (real-world kaam, khaaskar naye project ke compilation settings chunna), <b>Reference</b> (syntax/config ki detail), <b>Appendices</b> (complex topics gehrai me).",
"SPA me bhi wahi arc rakho: pehle theory samjho, phir options chuno, phir reference."],
c:"",
k:"Modules Reference ka naksha: theory → choosing options → reference → appendices."},
